<!-- style #13 Skeuomorphism -->
<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>底片盒 FilmBox</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  body{ font-family:'Noto Serif TC','EB Garamond',Georgia,serif; background:#3b2e22; color:#2c2016; }
  .serif{ font-family:'EB Garamond','Noto Serif TC',Georgia,serif; }
  .wood{
    background:
      repeating-linear-gradient(90deg, rgba(0,0,0,.04) 0px, rgba(0,0,0,.04) 2px, transparent 2px, transparent 6px),
      linear-gradient(180deg, #8a6a46, #6e4f30 60%, #5a3f26);
  }
  .leather{
    background: linear-gradient(160deg, #5c4330, #43301f 55%, #332413);
    box-shadow: inset 0 2px 6px rgba(255,255,255,.08), inset 0 -4px 10px rgba(0,0,0,.45);
  }
  .stitch{
    border: 1px dashed rgba(230,210,180,.35);
    margin: 8px;
  }
  .metal{
    background: linear-gradient(135deg, #e8e2d6, #b9b0a0 40%, #8c8375 60%, #d8d2c4);
    box-shadow: 0 1px 2px rgba(0,0,0,.4), inset 0 1px 1px rgba(255,255,255,.6);
  }
  .screw{
    background: radial-gradient(circle at 35% 35%, #ddd, #999 60%, #666);
    box-shadow: inset 0 1px 1px rgba(255,255,255,.6), 0 1px 2px rgba(0,0,0,.5);
  }
  .card-paper{
    background: #f3ead9;
    box-shadow: 0 10px 30px rgba(0,0,0,.45), inset 0 0 0 1px rgba(0,0,0,.06);
  }
  .dial{
    background: radial-gradient(circle at 40% 35%, #fff2, transparent 40%), conic-gradient(from 90deg, #4a3a2a, #6b543a, #4a3a2a);
    box-shadow: 0 6px 14px rgba(0,0,0,.5), inset 0 2px 4px rgba(255,255,255,.15);
  }
  .lens{
    background: radial-gradient(circle at 42% 38%, #c9d8e0, #6e8a9a 45%, #233038 75%, #0c1115);
    box-shadow: 0 0 0 6px #2a2118, 0 10px 24px rgba(0,0,0,.6), inset 0 0 20px rgba(0,0,0,.6);
  }
  .shutter-btn{
    background: radial-gradient(circle at 35% 30%, #e3bb6a, #b8862f 55%, #8a6322);
    box-shadow: 0 4px 8px rgba(0,0,0,.5), inset 0 1px 1px rgba(255,255,255,.5);
  }
  .shutter-btn:active{ transform: translateY(2px); box-shadow: 0 1px 2px rgba(0,0,0,.5), inset 0 1px 1px rgba(255,255,255,.4); }
</style>
</head>
<body class="min-h-screen">

  <header class="metal py-5 border-b-4 border-[#5a4f3f]">
    <div class="max-w-5xl mx-auto px-6 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-8 h-8 rounded-full screw"></div>
        <h1 class="serif text-2xl font-bold tracking-wide text-[#2c2016]">底片盒 <span class="text-base font-normal text-[#5a4f3f]">FilmBox</span></h1>
      </div>
      <nav class="hidden md:flex gap-6 serif text-[#4a3f30] text-sm tracking-wide">
        <a href="#" class="hover:text-[#8a6322]">相簿櫃</a>
        <a href="#" class="hover:text-[#8a6322]">沖洗配方</a>
        <a href="#" class="hover:text-[#8a6322]">器材架</a>
      </nav>
      <div class="w-8 h-8 rounded-full screw"></div>
    </div>
  </header>

  <section class="wood py-16">
    <div class="max-w-5xl mx-auto px-6 grid md:grid-cols-2 gap-10 items-center">
      <div class="text-[#f3ead9]">
        <p class="serif italic text-[#d8c9a8] mb-2">一台相機，一盒底片，一個下午。</p>
        <h2 class="serif text-4xl font-bold leading-snug mb-4">把每一次快門，<br>留成能摸到的回憶。</h2>
        <p class="text-[#d8c9a8] leading-relaxed mb-6">底片盒重現真實相機的轉盤、快門與皮革機身，掃描上傳後自動套上你選的沖洗配方，像親手沖出一卷底片。</p>
        <button class="shutter-btn text-[#3b2410] font-bold serif px-6 py-3 rounded-full shadow-lg">按下快門，開始使用</button>
      </div>

      <div class="leather rounded-2xl p-6">
        <div class="stitch rounded-xl p-6 flex flex-col items-center">
          <div class="lens w-36 h-36 rounded-full mb-6 relative">
            <div class="absolute inset-6 rounded-full border border-[#3a4850]/40"></div>
          </div>
          <div class="flex items-center gap-8 mb-6">
            <div class="dial w-16 h-16 rounded-full flex items-center justify-center text-[#f3ead9] serif text-xs">ISO</div>
            <div class="shutter-btn w-14 h-14 rounded-full"></div>
            <div class="dial w-16 h-16 rounded-full flex items-center justify-center text-[#f3ead9] serif text-xs">F/2.8</div>
          </div>
          <p class="serif text-[#d8c9a8] text-sm tracking-widest">NO. 00427 · KODACHROME</p>
        </div>
      </div>
    </div>
  </section>

  <section class="bg-[#f3ead9] py-16">
    <div class="max-w-5xl mx-auto px-6">
      <h3 class="serif text-2xl font-bold text-[#2c2016] mb-8 text-center">本週熱門沖洗配方</h3>
      <div class="grid md:grid-cols-3 gap-6">
        <div class="card-paper rounded-lg p-5">
          <div class="w-full h-32 rounded mb-4 bg-gradient-to-br from-[#e8caa0] to-[#b88a54]"></div>
          <h4 class="serif font-bold text-lg mb-1">金黃午後</h4>
          <p class="serif text-sm text-[#5a4f3f]">暖色調過曝，適合夕陽與老街。</p>
        </div>
        <div class="card-paper rounded-lg p-5">
          <div class="w-full h-32 rounded mb-4 bg-gradient-to-br from-[#9fb3a8] to-[#4f6358]"></div>
          <h4 class="serif font-bold text-lg mb-1">霧灰柯達</h4>
          <p class="serif text-sm text-[#5a4f3f]">低對比、顆粒感重，適合山景。</p>
        </div>
        <div class="card-paper rounded-lg p-5">
          <div class="w-full h-32 rounded mb-4 bg-gradient-to-br from-[#c98a8a] to-[#6e3a3a]"></div>
          <h4 class="serif font-bold text-lg mb-1">舊紅磚</h4>
          <p class="serif text-sm text-[#5a4f3f]">濃郁紅褐色，適合城市巷弄。</p>
        </div>
      </div>
    </div>
  </section>

  <footer class="metal py-6 border-t-4 border-[#5a4f3f]">
    <div class="max-w-5xl mx-auto px-6 text-center serif text-sm text-[#4a3f30]">
      底片盒 FilmBox © 2026 · 每一卷都值得被好好沖洗
    </div>
  </footer>

<script>
  document.querySelector('.shutter-btn.rounded-full.text-\\[\\#3b2410\\]')?.addEventListener('click', ()=>{});
  // 快門按鈕按壓回饋
  document.querySelectorAll('.shutter-btn').forEach(btn=>{
    btn.style.transition = 'transform .08s, box-shadow .08s';
  });
</script>
</body>
</html>

<!-- style #57 Gen Z Chaos -->
<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>亂丟 ChaosSwap｜二手衣物交換社群</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800;900&family=Space+Mono:wght@400;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  body{ font-family:'Space Mono','Noto Sans TC',monospace; background:#f5f0e6; color:#1a1a1a; overflow-x:hidden; }
  .display{ font-family:'Unbounded','Noto Sans TC',sans-serif; }
  .tilt1{ transform: rotate(-2deg); }
  .tilt2{ transform: rotate(1.5deg); }
  .sticker{ box-shadow: 4px 4px 0 #1a1a1a; border:3px solid #1a1a1a; }
  .dashed{ border: 3px dashed #1a1a1a; }
  .marquee-track{ display:flex; width:200%; animation: marquee 18s linear infinite; }
  @keyframes marquee{ from{ transform:translateX(0); } to{ transform:translateX(-50%); } }
  .wiggle:hover{ animation: wiggle .3s ease-in-out; }
  @keyframes wiggle{ 0%,100%{transform:rotate(0);} 50%{transform:rotate(-3deg);} }
  .tag-btn.active{ background:#1a1a1a; color:#fff; }
</style>
</head>
<body>

  <div class="bg-[#ff6b6b] border-b-3 border-black overflow-hidden py-2">
    <div class="marquee-track display font-extrabold text-sm whitespace-nowrap">
      <span class="px-4">🧦 不穿的衣服別丟掉</span><span class="px-4">👕 換一件也是一種時尚</span><span class="px-4">✨ 本週已有 1,204 件成功交換</span>
      <span class="px-4">🧦 不穿的衣服別丟掉</span><span class="px-4">👕 換一件也是一種時尚</span><span class="px-4">✨ 本週已有 1,204 件成功交換</span>
    </div>
  </div>

  <nav class="max-w-5xl mx-auto px-5 py-6 flex items-center justify-between">
    <div class="display font-extrabold text-2xl tilt1 inline-block">亂丟<span class="text-[#ff6b6b]">.</span></div>
    <button class="sticker bg-[#ffe66d] display font-bold text-sm px-4 py-2 tilt2">登入 / 註冊</button>
  </nav>

  <header class="max-w-5xl mx-auto px-5 pt-6 pb-16 relative">
    <h1 class="display font-black text-4xl md:text-6xl leading-[1.05] mb-6">
      你的舊外套<br>
      <span class="inline-block tilt1 bg-[#4ecdc4] px-2">是別人的</span><br>
      <span class="inline-block tilt2 bg-[#a388ee] text-white px-2">新寶藏</span>
    </h1>
    <p class="text-base max-w-md mb-7">上傳一件不穿的衣服，用點數換別人的好物。零廢棄，純粹好玩。</p>
    <button id="postBtn" class="sticker wiggle bg-[#1a1a1a] text-white display font-bold px-6 py-3 tilt1">+ 丟一件衣服上去</button>
  </header>

  <section class="max-w-5xl mx-auto px-5 pb-8">
    <div class="flex gap-2 flex-wrap mb-7">
      <button data-tag="全部" class="tag-btn active sticker display text-xs font-bold px-4 py-2 bg-white">全部</button>
      <button data-tag="外套" class="tag-btn sticker display text-xs font-bold px-4 py-2 bg-[#ffe66d]">外套</button>
      <button data-tag="鞋子" class="tag-btn sticker display text-xs font-bold px-4 py-2 bg-[#4ecdc4]">鞋子</button>
      <button data-tag="配件" class="tag-btn sticker display text-xs font-bold px-4 py-2 bg-[#ff6b6b]">配件</button>
      <button data-tag="洋裝" class="tag-btn sticker display text-xs font-bold px-4 py-2 bg-[#a388ee] text-white">洋裝</button>
    </div>

    <div id="itemGrid" class="grid grid-cols-2 md:grid-cols-4 gap-5"></div>
  </section>

  <section class="max-w-5xl mx-auto px-5 py-16">
    <div class="dashed bg-[#ffe66d] p-8 md:p-10 tilt2">
      <h2 class="display font-extrabold text-2xl mb-2 tilt1 inline-block bg-white px-2">丟上第一件衣服</h2>
      <p class="text-sm mb-5 mt-3">拍張照、取個標籤，馬上開始換物。</p>
      <div class="flex flex-col md:flex-row gap-3">
        <input id="itemName" placeholder="這件衣服叫什麼？例如：丹寧外套" class="flex-1 border-3 border-black px-4 py-3 bg-white outline-none text-sm">
        <select id="itemTag" class="border-3 border-black px-4 py-3 bg-white text-sm">
          <option>外套</option><option>鞋子</option><option>配件</option><option>洋裝</option>
        </select>
        <button id="submitBtn" class="sticker bg-[#1a1a1a] text-white display font-bold px-6 py-3">丟上去 🚀</button>
      </div>
      <p id="postMsg" class="mt-4 text-sm font-bold hidden">✅ 上架成功！已加入「全部」清單最前面</p>
    </div>
  </section>

  <footer class="text-center text-xs py-8 opacity-70">© 2026 亂丟 ChaosSwap · 讓舊衣服去新地方</footer>

<script>
  let items = [
    {name:'牛皮復古夾克', tag:'外套', color:'bg-[#ffe66d]'},
    {name:'白色帆布鞋', tag:'鞋子', color:'bg-[#4ecdc4]'},
    {name:'格紋貝雷帽', tag:'配件', color:'bg-[#ff6b6b]'},
    {name:'碎花小洋裝', tag:'洋裝', color:'bg-[#a388ee]'},
    {name:'工裝連身褲', tag:'外套', color:'bg-[#ffe66d]'},
    {name:'厚底樂福鞋', tag:'鞋子', color:'bg-[#4ecdc4]'},
    {name:'毛線圍巾', tag:'配件', color:'bg-[#ff6b6b]'},
    {name:'針織開衫洋裝', tag:'洋裝', color:'bg-[#a388ee]'},
  ];

  const grid = document.getElementById('itemGrid');
  const rotations = ['tilt1','tilt2',''];

  function render(filter){
    grid.innerHTML = '';
    items.filter(i => filter==='全部' || i.tag===filter).forEach((i, idx) => {
      const card = document.createElement('div');
      card.className = `sticker wiggle ${rotations[idx%3]} bg-white p-3`;
      card.innerHTML = `
        <div class="${i.color} border-3 border-black h-20 flex items-center justify-center display font-bold text-xs mb-2">${i.tag}</div>
        <p class="font-bold text-sm">${i.name}</p>
        <p class="text-xs opacity-60 mt-1">點數交換</p>`;
      grid.appendChild(card);
    });
  }
  render('全部');

  document.querySelectorAll('.tag-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      document.querySelectorAll('.tag-btn').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      render(btn.dataset.tag);
    });
  });

  document.getElementById('postBtn').addEventListener('click', ()=>{
    window.scrollTo({top: document.body.scrollHeight - 600, behavior:'smooth'});
  });

  document.getElementById('submitBtn').addEventListener('click', ()=>{
    const name = document.getElementById('itemName').value.trim();
    const tag = document.getElementById('itemTag').value;
    if(!name) return;
    items.unshift({name, tag, color: tag==='外套'?'bg-[#ffe66d]':tag==='鞋子'?'bg-[#4ecdc4]':tag==='配件'?'bg-[#ff6b6b]':'bg-[#a388ee]'});
    document.getElementById('itemName').value = '';
    document.getElementById('postMsg').classList.remove('hidden');
    const activeTag = document.querySelector('.tag-btn.active').dataset.tag;
    render(activeTag);
  });
</script>
</body>
</html>

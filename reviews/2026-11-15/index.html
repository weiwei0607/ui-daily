<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>韡寧的 UI 待審 · 2026-11-15</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  body{ font-family:'Noto Sans TC',sans-serif; background:#f4f3ef; }
  .frame-wrap{ position:relative; width:100%; padding-top:62.5%; overflow:hidden; background:#fff; }
  .frame-wrap iframe{
    position:absolute; top:0; left:0;
    width:200%; height:200%;
    transform: scale(.5); transform-origin: top left;
    border:0; pointer-events:none;
  }
  .heart-btn{ transition: transform .15s; }
  .heart-btn:active{ transform: scale(1.3); }
  .heart-btn.liked{ color:#ff1744; }
</style>
</head>
<body class="text-neutral-900">

  <header class="max-w-6xl mx-auto px-6 pt-10 pb-6">
    <h1 class="text-2xl md:text-3xl font-bold">韡寧的 UI 待審 · 2026-11-15</h1>
    <p class="text-neutral-500 mt-2 text-sm">今天生成了 6 種風格方向，喜歡的按 ❤️，我會學起來。</p>
  </header>

  <main class="max-w-6xl mx-auto px-6 pb-16">
    <div id="grid" class="grid grid-cols-1 md:grid-cols-2 gap-6"></div>
  </main>

  <footer class="text-center text-sm text-neutral-400 pb-10">© 2026 UI Daily</footer>

<script>
  const DATE = '2026-11-15';
  const cards = [
    {no:'01', file:'01-liquid-glass.html', name:'Liquid Glass'},
    {no:'02', file:'02-vibrant-block.html', name:'Vibrant Block'},
    {no:'03', file:'03-storytelling.html', name:'Storytelling'},
    {no:'04', file:'04-predictive-dashboard.html', name:'Predictive Dashboard'},
    {no:'05', file:'05-pixel-art.html', name:'Pixel Art / Retro Gaming'},
    {no:'06', file:'06-genz-chaos.html', name:'Gen Z Chaos'},
  ];

  const grid = document.getElementById('grid');
  cards.forEach(c => {
    const id = DATE + '_' + c.no;
    const card = document.createElement('div');
    card.className = 'bg-white rounded-2xl shadow-sm border border-neutral-200 overflow-hidden';
    card.innerHTML = `
      <div class="frame-wrap">
        <iframe src="${c.file}" loading="lazy"></iframe>
      </div>
      <div class="p-4 flex items-center justify-between">
        <div>
          <p class="font-bold">#${c.no} ${c.name}</p>
        </div>
        <div class="flex items-center gap-3">
          <a href="${c.file}" target="_blank" class="text-sm font-medium text-blue-600 hover:underline">開啟 ↗</a>
          <button class="heart-btn text-2xl" data-id="${id}">♡</button>
        </div>
      </div>`;
    grid.appendChild(card);
  });

  function setLiked(btn, liked){
    btn.textContent = liked ? '♥' : '♡';
    btn.classList.toggle('liked', liked);
  }

  document.querySelectorAll('.heart-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = btn.dataset.id;
      const liked = !btn.classList.contains('liked');
      setLiked(btn, liked);
      fetch('https://b-battle-580b5-default-rtdb.firebaseio.com/uigallery/' + id + '.json', {
        method: 'PUT',
        body: liked ? 'true' : 'null'
      }).catch(()=>{});
    });
  });

  fetch('https://b-battle-580b5-default-rtdb.firebaseio.com/uigallery.json')
    .then(r => r.json())
    .then(data => {
      if(!data) return;
      document.querySelectorAll('.heart-btn').forEach(btn => {
        if(data[btn.dataset.id] === true) setLiked(btn, true);
      });
    })
    .catch(()=>{});
</script>
</body>
</html>

<!-- style #09 Claymorphism -->
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>軟綿寵物日記 ClayPet</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Varela+Round&family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  *{ font-family:'Varela Round','Zen Maru Gothic',sans-serif; }
  body{ background: linear-gradient(160deg,#fdf2ea 0%, #fbe9e5 50%, #eef6ea 100%); color:#5b4a42; }
  .clay{
    background:#fdf1ec; border-radius:32px;
    box-shadow:
      8px 8px 18px rgba(200,150,130,.35),
      -8px -8px 18px rgba(255,255,255,.9);
  }
  .clay-in{
    background:#f6e6de; border-radius:24px;
    box-shadow: inset 5px 5px 10px rgba(200,150,130,.3), inset -5px -5px 10px rgba(255,255,255,.85);
  }
  .clay-btn{
    box-shadow: 6px 6px 14px rgba(200,150,130,.35), -6px -6px 14px rgba(255,255,255,.85);
    transition: all .15s ease;
  }
  .clay-btn:active{
    box-shadow: inset 4px 4px 10px rgba(200,150,130,.35), inset -4px -4px 10px rgba(255,255,255,.85);
    transform: scale(.97);
  }
  .mood-ball{
    width:64px; height:64px; border-radius:50%;
    display:flex; align-items:center; justify-content:center; font-size:28px;
    box-shadow: 6px 6px 14px rgba(200,150,130,.35), -6px -6px 14px rgba(255,255,255,.9);
    transition: all .25s cubic-bezier(.34,1.56,.64,1);
    cursor:pointer;
  }
  .mood-ball.selected{
    transform: scale(1.15) translateY(-4px);
    box-shadow: inset 4px 4px 10px rgba(200,150,130,.3), inset -4px -4px 10px rgba(255,255,255,.85), 0 8px 16px rgba(200,150,130,.25);
  }
  .toggle-clay{
    width:56px; height:30px; border-radius:16px;
    box-shadow: inset 4px 4px 8px rgba(200,150,130,.3), inset -4px -4px 8px rgba(255,255,255,.85);
    position:relative; cursor:pointer; transition: background .2s ease;
  }
  .toggle-clay .knob{
    position:absolute; top:3px; left:3px; width:24px; height:24px; border-radius:50%;
    background:#fdf1ec; box-shadow: 3px 3px 6px rgba(200,150,130,.4), -2px -2px 6px rgba(255,255,255,.9);
    transition: left .2s cubic-bezier(.34,1.56,.64,1);
  }
  .toggle-clay.on{ background:#d7ecd0; }
  .toggle-clay.on .knob{ left:29px; }
  .paw-icon{ filter: drop-shadow(2px 2px 3px rgba(200,150,130,.4)); }
</style>
</head>
<body class="min-h-screen">

<div class="max-w-md mx-auto px-5 pt-8 pb-16">

  <header class="flex items-center justify-between mb-6">
    <div>
      <p class="text-sm text-[#b98b78] font-bold">午安，豆漿的家長 🐾</p>
      <h1 class="text-2xl font-bold">軟綿寵物日記</h1>
    </div>
    <div class="clay w-14 h-14 flex items-center justify-center text-2xl">🐶</div>
  </header>

  <section class="clay p-6 mb-6 text-center">
    <p class="text-sm text-[#b98b78] font-bold mb-3">豆漿（柴犬・3 歲）今天的心情</p>
    <div class="flex justify-center gap-4 mb-2" id="moodRow">
      <div class="mood-ball" data-mood="慵懶">😴</div>
      <div class="mood-ball selected" data-mood="開心">😊</div>
      <div class="mood-ball" data-mood="活力滿滿">🤩</div>
      <div class="mood-ball" data-mood="有點鬧">😤</div>
    </div>
    <p class="text-sm text-[#b98b78] mt-2" id="moodLabel">目前狀態：開心</p>
  </section>

  <section class="clay p-6 mb-6">
    <h2 class="font-bold mb-4">今日照護清單</h2>
    <div class="space-y-3">
      <div class="clay-in flex items-center justify-between px-4 py-3">
        <span class="flex items-center gap-2">🍚 早餐 · 已餵食</span>
        <div class="toggle-clay on" data-i="1"><div class="knob"></div></div>
      </div>
      <div class="clay-in flex items-center justify-between px-4 py-3">
        <span class="flex items-center gap-2">🚶 散步 30 分鐘</span>
        <div class="toggle-clay on" data-i="2"><div class="knob"></div></div>
      </div>
      <div class="clay-in flex items-center justify-between px-4 py-3">
        <span class="flex items-center gap-2">🩹 關節保健品</span>
        <div class="toggle-clay" data-i="3"><div class="knob"></div></div>
      </div>
      <div class="clay-in flex items-center justify-between px-4 py-3">
        <span class="flex items-center gap-2">🛁 洗澡日</span>
        <div class="toggle-clay" data-i="4"><div class="knob"></div></div>
      </div>
    </div>
  </section>

  <section class="clay p-6 mb-6">
    <h2 class="font-bold mb-3">本週體重紀錄</h2>
    <div class="flex items-end gap-3 justify-between px-2">
      <div class="text-center"><div class="clay-in w-8 mx-auto" style="height:40px;"></div><p class="text-xs mt-1 text-[#b98b78]">一</p></div>
      <div class="text-center"><div class="clay-in w-8 mx-auto" style="height:46px;"></div><p class="text-xs mt-1 text-[#b98b78]">二</p></div>
      <div class="text-center"><div class="clay-in w-8 mx-auto" style="height:44px;"></div><p class="text-xs mt-1 text-[#b98b78]">三</p></div>
      <div class="text-center"><div class="clay-in w-8 mx-auto" style="height:50px;"></div><p class="text-xs mt-1 text-[#b98b78]">四</p></div>
      <div class="text-center"><div class="clay-in w-8 mx-auto" style="height:48px;"></div><p class="text-xs mt-1 text-[#b98b78]">五</p></div>
      <div class="text-center"><div class="clay-in w-8 mx-auto" style="height:52px;"></div><p class="text-xs mt-1 text-[#b98b78]">六</p></div>
      <div class="text-center"><div class="clay-in w-8 mx-auto" style="height:53px;"></div><p class="text-xs mt-1 text-[#b98b78]">日</p></div>
    </div>
    <p class="text-center text-sm text-[#b98b78] mt-3 font-bold">目前 12.4 kg，比上週 +0.2 kg</p>
  </section>

  <button id="vetBtn" class="clay-btn w-full bg-[#f0c9c0] text-[#7a4a3d] font-bold py-4 rounded-full">
    🩺 預約下次獸醫回診
  </button>
  <p class="text-center text-sm text-[#b98b78] mt-3 h-5" id="vetMsg"></p>
</div>

<script>
document.querySelectorAll('.mood-ball').forEach(ball=>{
  ball.addEventListener('click', ()=>{
    document.querySelectorAll('.mood-ball').forEach(b=>b.classList.remove('selected'));
    ball.classList.add('selected');
    document.getElementById('moodLabel').textContent = `目前狀態：${ball.dataset.mood}`;
  });
});

document.querySelectorAll('.toggle-clay').forEach(t=>{
  t.addEventListener('click', ()=> t.classList.toggle('on'));
});

document.getElementById('vetBtn').addEventListener('click', ()=>{
  document.getElementById('vetMsg').textContent = '已送出預約申請，診所將於 1 個工作日內回覆～';
});
</script>
</body>
</html>

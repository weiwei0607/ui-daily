<!-- style #16 Micro-interactions -->
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>打卡日常 DailyTick</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --brand:#3b82f6; --brand-dark:#2563eb; --good:#22c55e; --warn:#ef4444;
    --bg:#f8fafc; --card:#ffffff; --ink:#0f172a; --sub:#64748b;
  }
  *{font-family:'Plus Jakarta Sans','Noto Sans TC',sans-serif;}
  body{background:var(--bg); color:var(--ink);}
  .ripple{position:relative; overflow:hidden;}
  .ripple::after{
    content:''; position:absolute; border-radius:50%; background:rgba(255,255,255,.55);
    width:10px; height:10px; left:50%; top:50%; transform:translate(-50%,-50%) scale(0); opacity:0;
    pointer-events:none;
  }
  .ripple.animate::after{ animation: rippleAnim .6s ease-out; }
  @keyframes rippleAnim{
    0%{ transform:translate(-50%,-50%) scale(0); opacity:.6; }
    100%{ transform:translate(-50%,-50%) scale(22); opacity:0; }
  }
  .checkbox{
    width:28px; height:28px; border-radius:10px; border:2px solid #cbd5e1;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    transition: all .25s cubic-bezier(.34,1.56,.64,1);
  }
  .checkbox.done{
    background:var(--good); border-color:var(--good);
    transform: scale(1.12);
  }
  .checkbox.done svg{ animation: popIn .35s ease; }
  @keyframes popIn{ from{ transform:scale(0) rotate(-20deg); opacity:0;} to{ transform:scale(1) rotate(0); opacity:1;} }
  .card-row{ transition: background .2s ease, transform .15s ease; }
  .card-row:hover{ background:#f1f5f9; transform: translateX(2px); }
  .heart{ transition: transform .3s cubic-bezier(.34,1.56,.64,1), color .2s ease; }
  .heart.liked{ color:#ef4444; transform: scale(1.3); }
  .heart.liked.bump{ animation: heartBump .45s ease; }
  @keyframes heartBump{ 0%{transform:scale(1);} 40%{transform:scale(1.5);} 100%{transform:scale(1.3);} }
  .btn-primary{ transition: transform .15s ease, box-shadow .2s ease; }
  .btn-primary:active{ transform: scale(.96); }
  .btn-primary:hover{ box-shadow:0 10px 24px -8px rgba(59,130,246,.55); }
  .progress-ring circle{ transition: stroke-dashoffset 1s cubic-bezier(.22,.9,.34,1); }
  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px);
    opacity:0; transition: all .35s cubic-bezier(.2,.9,.3,1); pointer-events:none;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
  .confetti{ position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; overflow:hidden; z-index:60; }
  .confetti span{ position:absolute; top:-10px; border-radius:2px; opacity:.9; }
  @keyframes fall{ to{ transform: translateY(110vh) rotate(540deg); opacity:0; } }
  .tab{ transition: color .2s ease, border-color .2s ease; }
  .fadein{ animation: fadeIn .5s ease both; }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }
</style>
</head>
<body class="min-h-screen">

<div class="max-w-md mx-auto px-5 pt-8 pb-24">
  <header class="flex items-center justify-between mb-6 fadein">
    <div>
      <p class="text-sm text-slate-400 font-medium">早安，芝芝 👋</p>
      <h1 class="text-2xl font-extrabold tracking-tight">打卡日常 <span class="text-blue-500">DailyTick</span></h1>
    </div>
    <div class="relative">
      <svg class="progress-ring" width="56" height="56" viewBox="0 0 56 56">
        <circle cx="28" cy="28" r="24" fill="none" stroke="#e2e8f0" stroke-width="6"/>
        <circle id="ringProgress" cx="28" cy="28" r="24" fill="none" stroke="#3b82f6" stroke-width="6"
          stroke-dasharray="150.8" stroke-dashoffset="150.8" stroke-linecap="round" transform="rotate(-90 28 28)"/>
      </svg>
      <div class="absolute inset-0 flex items-center justify-center text-xs font-bold" id="ringLabel">0/4</div>
    </div>
  </header>

  <section class="bg-white rounded-3xl p-5 mb-6 shadow-sm border border-slate-100 fadein" style="animation-delay:.05s">
    <div class="flex items-center justify-between mb-1">
      <span class="text-sm font-semibold text-slate-500">連續打卡</span>
      <span class="text-sm font-semibold text-blue-500">目標 30 天</span>
    </div>
    <div class="flex items-end gap-2">
      <span class="text-4xl font-extrabold text-blue-600" id="streakCount">0</span>
      <span class="text-slate-400 mb-1">天連續不中斷</span>
    </div>
    <div class="mt-3 h-2 rounded-full bg-slate-100 overflow-hidden">
      <div id="streakBar" class="h-full bg-gradient-to-r from-blue-400 to-blue-600 rounded-full" style="width:0%; transition: width 1s cubic-bezier(.22,.9,.34,1);"></div>
    </div>
  </section>

  <h2 class="text-sm font-bold text-slate-500 mb-3 fadein" style="animation-delay:.1s">今天的習慣</h2>

  <div id="habitList" class="space-y-2 mb-8"></div>

  <section class="bg-white rounded-3xl p-5 shadow-sm border border-slate-100 fadein" style="animation-delay:.2s">
    <h3 class="text-sm font-bold text-slate-500 mb-3">今日心情打卡</h3>
    <div class="flex justify-between">
      <button class="mood-btn text-3xl transition-transform duration-200 hover:scale-125" data-mood="😞">😞</button>
      <button class="mood-btn text-3xl transition-transform duration-200 hover:scale-125" data-mood="😐">😐</button>
      <button class="mood-btn text-3xl transition-transform duration-200 hover:scale-125" data-mood="🙂">🙂</button>
      <button class="mood-btn text-3xl transition-transform duration-200 hover:scale-125" data-mood="😄">😄</button>
      <button class="mood-btn text-3xl transition-transform duration-200 hover:scale-125" data-mood="🤩">🤩</button>
    </div>
    <p id="moodResult" class="text-center text-sm text-slate-400 mt-3 h-5"></p>
  </section>

  <button id="addBtn" class="btn-primary ripple w-full mt-6 bg-blue-500 text-white font-bold py-4 rounded-2xl shadow-lg shadow-blue-200">
    ＋ 新增今日習慣
  </button>
</div>

<div class="toast bg-slate-900 text-white text-sm font-medium px-5 py-3 rounded-full shadow-xl" id="toast">已更新習慣紀錄</div>

<script>
const habits = [
  { name: '喝滿 2000ml 水', icon: '💧', done:false },
  { name: '睡前伸展 10 分鐘', icon: '🧘', done:false },
  { name: '閱讀 15 分鐘', icon: '📖', done:false },
  { name: '不熬夜前收起手機', icon: '📵', done:false },
];

const listEl = document.getElementById('habitList');
function render(){
  listEl.innerHTML = habits.map((h,i)=>`
    <div class="card-row flex items-center gap-4 bg-white rounded-2xl p-4 shadow-sm border border-slate-100">
      <div class="checkbox ${h.done?'done':''}" data-i="${i}">
        ${h.done ? '<svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M4 12l6 6L20 6" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>' : ''}
      </div>
      <div class="flex-1">
        <p class="font-semibold ${h.done?'text-slate-400 line-through':''}">${h.icon} ${h.name}</p>
      </div>
      <button class="heart text-xl text-slate-300" data-heart="${i}">❤</button>
    </div>
  `).join('');
  updateProgress();
}

function updateProgress(){
  const doneCount = habits.filter(h=>h.done).length;
  document.getElementById('ringLabel').textContent = `${doneCount}/${habits.length}`;
  const circumference = 150.8;
  const offset = circumference - (circumference * (doneCount/habits.length));
  document.getElementById('ringProgress').style.strokeDashoffset = offset;
}

listEl.addEventListener('click', (e)=>{
  const box = e.target.closest('.checkbox');
  const heart = e.target.closest('[data-heart]');
  if(box){
    const i = box.dataset.i;
    habits[i].done = !habits[i].done;
    render();
    if(habits[i].done){
      showToast('太棒了，已完成「' + habits[i].name + '」！');
      if(habits.every(h=>h.done)) launchConfetti();
    }
  }
  if(heart){
    heart.classList.toggle('liked');
    heart.classList.add('bump');
    setTimeout(()=>heart.classList.remove('bump'), 450);
  }
});

document.getElementById('addBtn').addEventListener('click', (e)=>{
  const btn = e.currentTarget;
  btn.classList.add('animate');
  setTimeout(()=>btn.classList.remove('animate'), 600);
  showToast('之後可以在這裡新增自訂習慣～');
});

document.querySelectorAll('.mood-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.mood-btn').forEach(b=>b.classList.remove('scale-150'));
    btn.classList.add('scale-150');
    document.getElementById('moodResult').textContent = `已記錄今天的心情：${btn.dataset.mood}`;
  });
});

let toastTimer;
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 2200);
}

function launchConfetti(){
  const colors = ['#3b82f6','#22c55e','#f59e0b','#ef4444','#a855f7'];
  const wrap = document.createElement('div');
  wrap.className = 'confetti';
  for(let i=0;i<60;i++){
    const s = document.createElement('span');
    const size = 6 + Math.random()*6;
    s.style.width = size+'px';
    s.style.height = size*1.6+'px';
    s.style.left = Math.random()*100+'%';
    s.style.background = colors[Math.floor(Math.random()*colors.length)];
    s.style.animation = `fall ${2+Math.random()*1.5}s ease-in forwards`;
    s.style.animationDelay = (Math.random()*.3)+'s';
    wrap.appendChild(s);
  }
  document.body.appendChild(wrap);
  setTimeout(()=>wrap.remove(), 3800);
  showToast('🎉 今天全部打卡完成，連續紀錄 +1！');
}

// animate streak on load
window.addEventListener('load', ()=>{
  render();
  let n = 0;
  const target = 12;
  const iv = setInterval(()=>{
    n++;
    document.getElementById('streakCount').textContent = n;
    document.getElementById('streakBar').style.width = (n/30*100)+'%';
    if(n>=target) clearInterval(iv);
  }, 60);
});
</script>
</body>
</html>

<!-- style #47 Exaggerated Minimalism -->
<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>境 MARGIN Studio · 建築設計作品集</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@400;500;700&family=Noto+Sans+TC:wght@400;500;900&display=swap" rel="stylesheet">
<style>
  body{ font-family:'Space Grotesk','Noto Sans TC',sans-serif; background:#fff; color:#0a0a0a; }
  .giant{ font-family:'Bebas Neue','Noto Sans TC',sans-serif; letter-spacing:0.01em; line-height:0.9; }
</style>
</head>
<body class="overflow-x-hidden">

  <header class="px-6 md:px-10 pt-8 flex items-center justify-between">
    <span class="font-bold text-lg">境 MARGIN</span>
    <nav class="hidden md:flex gap-8 text-sm font-medium">
      <a href="#work">作品</a>
      <a href="#about">關於</a>
      <a href="#contact">聯繫</a>
    </nav>
  </header>

  <main class="px-6 md:px-10">

    <section class="pt-10 pb-16 border-b border-black">
      <h1 class="giant text-[18vw] md:text-[13vw] font-normal">留白<br>就是設計</h1>
    </section>

    <section id="work" class="py-16 border-b border-black grid md:grid-cols-12 gap-6">
      <p class="md:col-span-3 text-sm font-semibold">精選作品 / 2021–2026</p>
      <div class="md:col-span-9 space-y-10">
        <div class="flex items-end justify-between border-b border-black pb-6">
          <h2 class="giant text-5xl md:text-7xl">靜宅</h2>
          <span class="text-sm font-medium">台中 · 住宅 · 2026</span>
        </div>
        <div class="flex items-end justify-between border-b border-black pb-6">
          <h2 class="giant text-5xl md:text-7xl">光廊美術館</h2>
          <span class="text-sm font-medium">台南 · 公共建築 · 2025</span>
        </div>
        <div class="flex items-end justify-between border-b border-black pb-6">
          <h2 class="giant text-5xl md:text-7xl">無隔間辦公室</h2>
          <span class="text-sm font-medium">台北 · 商業空間 · 2024</span>
        </div>
      </div>
    </section>

    <section id="about" class="py-16 border-b border-black grid md:grid-cols-12 gap-6">
      <p class="md:col-span-3 text-sm font-semibold">關於我們</p>
      <p class="md:col-span-6 text-2xl md:text-3xl leading-snug">
        境 MARGIN 是一間六人的建築事務所。我們相信空間最珍貴的不是加了什麼，
        而是留下了多少呼吸的餘地。
      </p>
    </section>

    <section id="contact" class="py-24">
      <h2 class="giant text-[16vw] md:text-[11vw] text-center">聯繫我們</h2>
      <p class="text-center text-sm font-medium mt-6">hello@margin-studio.tw　．　台北市大安區</p>
    </section>

  </main>

  <footer class="px-6 md:px-10 py-6 border-t border-black text-xs font-medium flex justify-between">
    <span>© 2026 境 MARGIN Studio</span>
    <span>一個大聲的留白，勝過十個裝飾</span>
  </footer>

</body>
</html>

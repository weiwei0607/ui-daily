<!-- style #32 Drill-Down Dashboard -->
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>零售巡店雷達 StoreRadar</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  body{font-family:'Public Sans','Noto Sans TC',sans-serif; background:#f4f6f9; color:#1c2531;}
  .mono{font-family:'JetBrains Mono',monospace;}
  .card{background:#fff; border:1px solid #e4e8ee; border-radius:14px;}
  .crumb{cursor:pointer;}
  .crumb:hover{ text-decoration:underline; }
  .row-hover:hover{ background:#f0f4ff; cursor:pointer; }
  .bar-fill{ transition: width .5s ease; }
  .up{color:#16a34a;} .down{color:#dc2626;}
  .level-hidden{ display:none; }
</style>
</head>
<body>

  <div class="flex min-h-screen">
    <!-- Sidebar -->
    <aside class="w-56 shrink-0 bg-[#111827] text-gray-300 hidden md:flex flex-col">
      <div class="px-5 py-5 text-white font-bold text-lg">StoreRadar</div>
      <nav class="flex-1 px-3 space-y-1 text-sm">
        <a class="block px-3 py-2 rounded-lg bg-[#1f2937] text-white">門市營運總覽</a>
        <a class="block px-3 py-2 rounded-lg hover:bg-[#1f2937]">商品銷售分析</a>
        <a class="block px-3 py-2 rounded-lg hover:bg-[#1f2937]">庫存與補貨</a>
        <a class="block px-3 py-2 rounded-lg hover:bg-[#1f2937]">會員與回購</a>
        <a class="block px-3 py-2 rounded-lg hover:bg-[#1f2937]">異常警示</a>
      </nav>
      <div class="px-5 py-4 text-xs text-gray-500 border-t border-[#1f2937]">帳號：區域督導・林詠珊</div>
    </aside>

    <main class="flex-1 p-6">
      <!-- Breadcrumb -->
      <div class="flex items-center gap-2 text-sm text-gray-500 mb-4 mono">
        <span class="crumb" onclick="goLevel(0)">全台門市</span>
        <span id="crumb-sep-1" class="hidden">›</span>
        <span id="crumb-region" class="crumb hidden" onclick="goLevel(1)"></span>
        <span id="crumb-sep-2" class="hidden">›</span>
        <span id="crumb-store" class="hidden"></span>
      </div>

      <div class="flex items-center justify-between mb-6">
        <h1 class="text-xl font-bold" id="page-title">全台門市營運總覽</h1>
        <div class="text-xs text-gray-500 mono" id="clock"></div>
      </div>

      <!-- KPI row -->
      <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
        <div class="card p-4">
          <p class="text-xs text-gray-500">今日總營收</p>
          <p class="text-2xl font-bold mono mt-1">NT$ 4,382,900</p>
          <p class="text-xs up mt-1">▲ 6.2% 較昨日</p>
        </div>
        <div class="card p-4">
          <p class="text-xs text-gray-500">來客數</p>
          <p class="text-2xl font-bold mono mt-1">18,204</p>
          <p class="text-xs up mt-1">▲ 3.1% 較昨日</p>
        </div>
        <div class="card p-4">
          <p class="text-xs text-gray-500">客單價</p>
          <p class="text-2xl font-bold mono mt-1">NT$ 241</p>
          <p class="text-xs down mt-1">▼ 1.4% 較昨日</p>
        </div>
        <div class="card p-4">
          <p class="text-xs text-gray-500">異常門市</p>
          <p class="text-2xl font-bold mono mt-1 text-red-600">3 家</p>
          <p class="text-xs text-gray-500 mt-1">需要巡查</p>
        </div>
      </div>

      <!-- LEVEL 0: Regions -->
      <div id="level-0" class="card p-5">
        <p class="text-sm font-semibold mb-3">依區域檢視（點擊下鑽至門市）</p>
        <table class="w-full text-sm">
          <thead class="text-xs text-gray-500 border-b">
            <tr><th class="text-left py-2">區域</th><th class="text-left py-2">門市數</th><th class="text-left py-2">營收占比</th><th class="text-right py-2">今日營收</th></tr>
          </thead>
          <tbody id="region-body"></tbody>
        </table>
      </div>

      <!-- LEVEL 1: Stores in region -->
      <div id="level-1" class="card p-5 level-hidden">
        <p class="text-sm font-semibold mb-3">依門市檢視（點擊下鑽至商品類別）</p>
        <table class="w-full text-sm">
          <thead class="text-xs text-gray-500 border-b">
            <tr><th class="text-left py-2">門市</th><th class="text-left py-2">今日來客</th><th class="text-left py-2">達成率</th><th class="text-right py-2">今日營收</th></tr>
          </thead>
          <tbody id="store-body"></tbody>
        </table>
      </div>

      <!-- LEVEL 2: Category breakdown in store -->
      <div id="level-2" class="card p-5 level-hidden">
        <p class="text-sm font-semibold mb-3">商品類別營收占比</p>
        <div id="category-body" class="space-y-3"></div>
      </div>

    </main>
  </div>

<script>
  const data = {
    "北區": {stores:24, share:34, revenue:1490200, storeList:{
      "台北信義店": {guests:1204, target:96, revenue:412300, cats:[["生鮮食品",38],["日用百貨",27],["飲料酒類",19],["熟食便當",16]]},
      "台北南京店": {guests:980, target:88, revenue:301500, cats:[["生鮮食品",33],["日用百貨",30],["飲料酒類",22],["熟食便當",15]]},
      "新北板橋店": {guests:1420, target:104, revenue:398700, cats:[["生鮮食品",41],["日用百貨",24],["飲料酒類",18],["熟食便當",17]]},
    }},
    "中區": {stores:18, share:26, revenue:1139500, storeList:{
      "台中西屯店": {guests:1102, target:91, revenue:355200, cats:[["生鮮食品",36],["日用百貨",29],["飲料酒類",20],["熟食便當",15]]},
      "彰化員林店": {guests:764, target:78, revenue:210300, cats:[["生鮮食品",30],["日用百貨",32],["飲料酒類",21],["熟食便當",17]]},
    }},
    "南區": {stores:20, share:29, revenue:1270800, storeList:{
      "高雄左營店": {guests:1330, target:110, revenue:445600, cats:[["生鮮食品",40],["日用百貨",26],["飲料酒類",18],["熟食便當",16]]},
      "台南永康店": {guests:990, target:82, revenue:298400, cats:[["生鮮食品",34],["日用百貨",28],["飲料酒類",22],["熟食便當",16]]},
    }},
    "東區": {stores:6, share:11, revenue:482400, storeList:{
      "花蓮市區店": {guests:520, target:74, revenue:172100, cats:[["生鮮食品",29],["日用百貨",31],["飲料酒類",23],["熟食便當",17]]},
    }},
  };

  const regionBody = document.getElementById('region-body');
  Object.entries(data).forEach(([name, d])=>{
    const tr = document.createElement('tr');
    tr.className = 'row-hover border-b';
    tr.innerHTML = `
      <td class="py-3 font-medium">${name}</td>
      <td class="py-3 mono">${d.stores}</td>
      <td class="py-3">
        <div class="w-28 h-2 bg-gray-100 rounded-full overflow-hidden inline-block align-middle mr-2">
          <div class="bar-fill h-full bg-blue-500" style="width:${d.share}%"></div>
        </div>
        <span class="mono text-xs">${d.share}%</span>
      </td>
      <td class="py-3 text-right mono">NT$ ${d.revenue.toLocaleString()}</td>
    `;
    tr.onclick = ()=> drillRegion(name);
    regionBody.appendChild(tr);
  });

  function drillRegion(name){
    document.getElementById('level-0').classList.add('level-hidden');
    document.getElementById('level-1').classList.remove('level-hidden');
    document.getElementById('level-2').classList.add('level-hidden');
    document.getElementById('page-title').textContent = name + ' 門市營運';
    document.getElementById('crumb-region').textContent = name;
    document.getElementById('crumb-region').classList.remove('hidden');
    document.getElementById('crumb-sep-1').classList.remove('hidden');
    document.getElementById('crumb-store').classList.add('hidden');
    document.getElementById('crumb-sep-2').classList.add('hidden');

    const storeBody = document.getElementById('store-body');
    storeBody.innerHTML = '';
    Object.entries(data[name].storeList).forEach(([sname, s])=>{
      const tr = document.createElement('tr');
      tr.className = 'row-hover border-b';
      const targetClass = s.target >= 100 ? 'up' : 'down';
      tr.innerHTML = `
        <td class="py-3 font-medium">${sname}</td>
        <td class="py-3 mono">${s.guests.toLocaleString()}</td>
        <td class="py-3 mono ${targetClass}">${s.target}%</td>
        <td class="py-3 text-right mono">NT$ ${s.revenue.toLocaleString()}</td>
      `;
      tr.onclick = ()=> drillStore(name, sname);
      storeBody.appendChild(tr);
    });
  }

  function drillStore(region, sname){
    document.getElementById('level-1').classList.add('level-hidden');
    document.getElementById('level-2').classList.remove('level-hidden');
    document.getElementById('page-title').textContent = sname + ' 商品類別分析';
    document.getElementById('crumb-store').textContent = sname;
    document.getElementById('crumb-store').classList.remove('hidden');
    document.getElementById('crumb-sep-2').classList.remove('hidden');

    const catBody = document.getElementById('category-body');
    catBody.innerHTML = '';
    data[region].storeList[sname].cats.forEach(([cat, pct])=>{
      const row = document.createElement('div');
      row.innerHTML = `
        <div class="flex justify-between text-sm mb-1"><span>${cat}</span><span class="mono">${pct}%</span></div>
        <div class="w-full h-2.5 bg-gray-100 rounded-full overflow-hidden">
          <div class="bar-fill h-full bg-indigo-500" style="width:0%" data-w="${pct}"></div>
        </div>
      `;
      catBody.appendChild(row);
    });
    requestAnimationFrame(()=>{
      catBody.querySelectorAll('.bar-fill').forEach(b=> b.style.width = b.dataset.w + '%');
    });
  }

  function goLevel(n){
    document.getElementById('level-0').classList.toggle('level-hidden', n!==0);
    document.getElementById('level-1').classList.add('level-hidden');
    document.getElementById('level-2').classList.add('level-hidden');
    if(n===0){
      document.getElementById('page-title').textContent = '全台門市營運總覽';
      document.getElementById('crumb-region').classList.add('hidden');
      document.getElementById('crumb-sep-1').classList.add('hidden');
      document.getElementById('crumb-store').classList.add('hidden');
      document.getElementById('crumb-sep-2').classList.add('hidden');
    }
  }

  function updateClock(){
    document.getElementById('clock').textContent = new Date().toLocaleString('zh-TW', {hour12:false});
  }
  updateClock();
  setInterval(updateClock, 1000);
</script>

</body>
</html>

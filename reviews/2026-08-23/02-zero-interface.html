<!-- style #02 Zero Interface -->
<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>留白 · 一次只想一件事</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Noto+Serif+TC:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  body{
    background:#fafaf7;
    color:#2a2a26;
    font-family:'Noto Serif TC','Fraunces',serif;
  }
  .font-display{ font-family:'Fraunces','Noto Serif TC',serif; }
  .fade-in{ animation: fade 1.1s ease both; }
  @keyframes fade{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }
  .hairline{ border-color:#e4e2da; }
  .note-line:focus{ outline:none; border-bottom-color:#2a2a26; }
</style>
</head>
<body class="min-h-screen">

<div class="max-w-2xl mx-auto px-6 py-24">

  <p class="fade-in text-xs tracking-[0.3em] text-[#8a8778] mb-16 text-center" style="animation-delay:.05s">留白　2026 年 8 月 23 日</p>

  <h1 class="fade-in font-display text-[2.4rem] leading-tight text-center mb-3" style="animation-delay:.15s">今天，只需要記下<br>一件真正重要的事</h1>
  <p class="fade-in text-center text-sm text-[#8a8778] mb-20" style="animation-delay:.25s">沒有清單、沒有標籤、沒有提醒。寫完，就先放下。</p>

  <div class="fade-in mb-24" style="animation-delay:.35s">
    <input type="text" placeholder="現在，什麼事最重要？"
      class="note-line w-full text-center font-display text-xl bg-transparent border-b hairline pb-4 placeholder:text-[#c4c1b4] transition-colors">
  </div>

  <div class="fade-in flex justify-center gap-10 mb-28 text-xs text-[#8a8778]" style="animation-delay:.45s">
    <button class="hover:text-[#2a2a26] transition-colors">寫完了</button>
    <button class="hover:text-[#2a2a26] transition-colors">明天再想</button>
  </div>

  <div class="fade-in border-t hairline pt-10" style="animation-delay:.6s">
    <p class="text-xs text-[#c4c1b4] text-center mb-8">過去七天，你留下的</p>
    <ul class="space-y-6 font-display text-[#4d4b44] text-center">
      <li class="text-lg">回信給老師，把提案講清楚</li>
      <li class="text-lg opacity-70">陪媽媽去醫院回診</li>
      <li class="text-lg opacity-50">把陽台的花搬進屋內</li>
    </ul>
  </div>

  <p class="fade-in text-center text-[11px] text-[#c4c1b4] mt-28" style="animation-delay:.8s">留白，不是空無，是留給重要的事。</p>

</div>

</body>
</html>

<!-- style #05 Drill-Down Dashboard -->
<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鑽點 · 銷售下鑽分析</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  body{ background:#0f1115; color:#e6e7eb; font-family:'Noto Sans TC','Albert Sans',sans-serif; }
  .font-display{ font-family:'Albert Sans','Noto Sans TC',sans-serif; }
  .mono{ font-family:'IBM Plex Mono',monospace; }
  .panel{ background:#171a21; border:1px solid #262a34; border-radius:14px; }
  .crumb{ color:#6b7280; }
  .crumb.active{ color:#e6e7eb; }
</style>
</head>
<body class="min-h-screen">

<div class="flex">

  <aside class="hidden md:flex w-56 flex-col gap-1 p-5 border-r border-[#262a34] min-h-screen">
    <div class="flex items-center gap-2 mb-8">
      <div class="w-7 h-7 rounded bg-[#5b8cff] flex items-center justify-center text-xs font-bold">鑽</div>
      <span class="font-display font-bold">鑽點</span>
    </div>
    <a class="font-display text-sm px-3 py-2 rounded-lg bg-[#20242e] text-white">銷售下鑽</a>
    <a class="font-display text-sm px-3 py-2 rounded-lg text-[#8b8f9a]">通路總覽</a>
    <a class="font-display text-sm px-3 py-2 rounded-lg text-[#8b8f9a]">商品分析</a>
    <a class="font-display text-sm px-3 py-2 rounded-lg text-[#8b8f9a]">客群輪廓</a>
    <a class="font-display text-sm px-3 py-2 rounded-lg text-[#8b8f9a]">警示設定</a>
  </aside>

  <main class="flex-1 p-6 md:p-8">

    <div class="flex items-center justify-between mb-6">
      <div class="flex items-center gap-2 text-sm font-display crumb">
        <span class="active">全台</span><span>›</span><span class="active">北區</span><span>›</span><span class="active">台北市</span><span>›</span><span class="text-[#5b8cff]">信義門市</span>
      </div>
      <div class="flex items-center gap-3">
        <select class="mono text-xs bg-[#171a21] border border-[#262a34] rounded-lg px-3 py-2">
          <option>近 7 天</option><option>近 30 天</option>
        </select>
        <div class="w-8 h-8 rounded-full bg-[#20242e]"></div>
      </div>
    </div>

    <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
      <div class="panel p-5">
        <p class="text-xs text-[#8b8f9a] font-display mb-2">今日營收</p>
        <p class="mono text-2xl font-semibold">NT$ 284,510</p>
        <p class="text-xs text-[#4ade80] mono mt-1">▲ 8.2%</p>
      </div>
      <div class="panel p-5">
        <p class="text-xs text-[#8b8f9a] font-display mb-2">訂單數</p>
        <p class="mono text-2xl font-semibold">1,204</p>
        <p class="text-xs text-[#4ade80] mono mt-1">▲ 3.1%</p>
      </div>
      <div class="panel p-5">
        <p class="text-xs text-[#8b8f9a] font-display mb-2">客單價</p>
        <p class="mono text-2xl font-semibold">NT$ 236</p>
        <p class="text-xs text-[#f87171] mono mt-1">▼ 1.4%</p>
      </div>
      <div class="panel p-5">
        <p class="text-xs text-[#8b8f9a] font-display mb-2">退貨率</p>
        <p class="mono text-2xl font-semibold">1.8%</p>
        <p class="text-xs text-[#8b8f9a] mono mt-1">持平</p>
      </div>
    </div>

    <div class="grid md:grid-cols-3 gap-4">

      <div class="panel p-5 md:col-span-2">
        <div class="flex items-center justify-between mb-4">
          <p class="font-display font-semibold text-sm">信義門市 · 品類貢獻（點擊下鑽）</p>
          <span class="text-xs text-[#8b8f9a] mono">單位：NT$ 千元</span>
        </div>
        <div class="space-y-3">
          <div class="flex items-center gap-3 cursor-pointer group">
            <span class="text-xs font-display w-16 text-[#8b8f9a] group-hover:text-white">飲品</span>
            <div class="flex-1 bg-[#20242e] rounded-full h-3 overflow-hidden"><div class="h-full bg-[#5b8cff] rounded-full" style="width:82%"></div></div>
            <span class="mono text-xs w-16 text-right">128.4</span>
          </div>
          <div class="flex items-center gap-3 cursor-pointer group">
            <span class="text-xs font-display w-16 text-[#8b8f9a] group-hover:text-white">輕食</span>
            <div class="flex-1 bg-[#20242e] rounded-full h-3 overflow-hidden"><div class="h-full bg-[#5b8cff] rounded-full" style="width:56%"></div></div>
            <span class="mono text-xs w-16 text-right">76.2</span>
          </div>
          <div class="flex items-center gap-3 cursor-pointer group">
            <span class="text-xs font-display w-16 text-[#8b8f9a] group-hover:text-white">甜點</span>
            <div class="flex-1 bg-[#20242e] rounded-full h-3 overflow-hidden"><div class="h-full bg-[#5b8cff] rounded-full" style="width:34%"></div></div>
            <span class="mono text-xs w-16 text-right">41.7</span>
          </div>
          <div class="flex items-center gap-3 cursor-pointer group">
            <span class="text-xs font-display w-16 text-[#8b8f9a] group-hover:text-white">周邊</span>
            <div class="flex-1 bg-[#20242e] rounded-full h-3 overflow-hidden"><div class="h-full bg-[#5b8cff] rounded-full" style="width:12%"></div></div>
            <span class="mono text-xs w-16 text-right">14.9</span>
          </div>
        </div>
      </div>

      <div class="panel p-5">
        <p class="font-display font-semibold text-sm mb-4">飲品類 · 品項下鑽</p>
        <div class="space-y-2 mono text-xs">
          <div class="flex justify-between py-2 border-b border-[#262a34]"><span>經典美式</span><span>NT$ 42.1k</span></div>
          <div class="flex justify-between py-2 border-b border-[#262a34]"><span>厚岩鹽拿鐵</span><span>NT$ 38.6k</span></div>
          <div class="flex justify-between py-2 border-b border-[#262a34]"><span>冷萃烏龍</span><span>NT$ 27.3k</span></div>
          <div class="flex justify-between py-2"><span>手沖精品</span><span>NT$ 20.4k</span></div>
        </div>
        <p class="text-xs text-[#8b8f9a] font-display mt-4">再點擊品項可下鑽至門市時段分佈</p>
      </div>

    </div>

  </main>
</div>

</body>
</html>

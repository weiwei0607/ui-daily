<!-- style #04 Memphis Revival -->
<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>怪奇盒 · 潮流盲盒</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Righteous&family=Poppins:wght@400;600;700&family=Noto+Sans+TC:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  body{ background:#fef6e4; color:#1d1a2e; font-family:'Noto Sans TC','Poppins',sans-serif; overflow-x:hidden; }
  .font-display{ font-family:'Righteous','Noto Sans TC',sans-serif; }
  .dot-bg{
    background-image: radial-gradient(#1d1a2e 2px, transparent 2px);
    background-size: 18px 18px;
    opacity: .12;
  }
  .zigzag{
    clip-path: polygon(0% 0%,10% 100%,20% 0%,30% 100%,40% 0%,50% 100%,60% 0%,70% 100%,80% 0%,90% 100%,100% 0%,100% 100%,0% 100%);
  }
  .wiggle{ animation: wiggle 3.5s ease-in-out infinite; }
  @keyframes wiggle{ 0%,100%{transform:rotate(-4deg)} 50%{transform:rotate(4deg)} }
  .float{ animation: float 4s ease-in-out infinite; }
  @keyframes float{ 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }
  .card-shadow{ box-shadow: 8px 8px 0 #1d1a2e; }
</style>
</head>
<body class="min-h-screen relative">

<div class="dot-bg absolute inset-0 pointer-events-none"></div>

<header class="relative z-10 flex items-center justify-between px-6 md:px-12 py-6">
  <div class="flex items-center gap-2">
    <div class="w-10 h-10 rounded-full bg-[#ff5e5b] border-4 border-[#1d1a2e] float"></div>
    <span class="font-display text-xl">怪奇盒</span>
  </div>
  <nav class="hidden md:flex gap-8 font-semibold text-sm">
    <a href="#">新品</a><a href="#">系列</a><a href="#">交換牆</a><a href="#">關於</a>
  </nav>
  <button class="font-display bg-[#1d1a2e] text-[#fef6e4] px-5 py-2 rounded-full border-4 border-[#1d1a2e] card-shadow text-sm">購物車 (2)</button>
</header>

<section class="relative z-10 px-6 md:px-12 pt-10 pb-20 max-w-6xl mx-auto">
  <div class="grid md:grid-cols-2 gap-10 items-center">
    <div>
      <div class="inline-block bg-[#ffd23f] border-4 border-[#1d1a2e] px-4 py-1 -rotate-2 font-display text-sm mb-6">本週新品上架</div>
      <h1 class="font-display text-4xl md:text-6xl leading-tight mb-6">拆到什麼，<br><span class="text-[#ff5e5b]">全靠運氣！</span></h1>
      <p class="text-sm md:text-base mb-8 max-w-sm">每盒隨機出貨，共 12 款角色，內含 1 款隱藏版，機率 1/144。收藏派、交換派都愛。</p>
      <div class="flex gap-4">
        <button class="font-display bg-[#7c5cff] text-white px-8 py-4 rounded-full border-4 border-[#1d1a2e] card-shadow">立即抽一盒</button>
        <button class="font-display bg-white px-8 py-4 rounded-full border-4 border-[#1d1a2e]">看隱藏款</button>
      </div>
    </div>
    <div class="relative flex justify-center">
      <div class="absolute w-64 h-64 bg-[#a3e8dc] rounded-full -z-10 blur-sm"></div>
      <div class="w-56 h-56 bg-[#ff5e5b] border-4 border-[#1d1a2e] rounded-3xl card-shadow flex items-center justify-center wiggle">
        <span class="text-7xl">👾</span>
      </div>
      <div class="absolute -top-4 -right-4 w-16 h-16 bg-[#ffd23f] border-4 border-[#1d1a2e] rounded-full flex items-center justify-center font-display text-xs text-center">HOT</div>
    </div>
  </div>
</section>

<div class="h-6 bg-[#1d1a2e] zigzag"></div>

<section class="relative z-10 px-6 md:px-12 py-16 max-w-6xl mx-auto">
  <h2 class="font-display text-2xl md:text-3xl mb-10 text-center">本季系列</h2>
  <div class="grid grid-cols-2 md:grid-cols-4 gap-6">
    <div class="bg-white border-4 border-[#1d1a2e] rounded-2xl p-5 card-shadow text-center">
      <div class="text-5xl mb-3">🛸</div>
      <p class="font-display text-sm mb-1">星際迷航</p>
      <p class="text-xs text-[#1d1a2e]/60">NT$ 380</p>
    </div>
    <div class="bg-[#a3e8dc] border-4 border-[#1d1a2e] rounded-2xl p-5 card-shadow text-center">
      <div class="text-5xl mb-3">🐸</div>
      <p class="font-display text-sm mb-1">呱呱星人</p>
      <p class="text-xs text-[#1d1a2e]/60">NT$ 380</p>
    </div>
    <div class="bg-[#ffd23f] border-4 border-[#1d1a2e] rounded-2xl p-5 card-shadow text-center">
      <div class="text-5xl mb-3">🍩</div>
      <p class="font-display text-sm mb-1">甜點特工隊</p>
      <p class="text-xs text-[#1d1a2e]/60">NT$ 420</p>
    </div>
    <div class="bg-[#ff5e5b] border-4 border-[#1d1a2e] rounded-2xl p-5 card-shadow text-center text-white">
      <div class="text-5xl mb-3">🦑</div>
      <p class="font-display text-sm mb-1">深海怪客</p>
      <p class="text-xs text-white/70">NT$ 420</p>
    </div>
  </div>
</section>

</body>
</html>

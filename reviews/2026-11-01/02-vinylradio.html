<!-- style #13 Skeuomorphism -->
<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>黑膠電台 VinylRadio</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Josefin+Slab:wght@400;500;600;700&family=Karla:wght@400;500;700&family=Noto+Serif+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{font-family:'Noto Serif TC','Karla',serif;}
  .font-display{font-family:'Josefin Slab','Noto Serif TC',serif;}
  body{
    background:#3b2a1d;
    background-image:
      repeating-linear-gradient(90deg, rgba(0,0,0,.08) 0px, rgba(0,0,0,.08) 1px, transparent 1px, transparent 6px),
      linear-gradient(180deg,#4a3524,#2c1f15);
    color:#f3e4cf;
  }
  .wood-panel{
    background:
      repeating-linear-gradient(100deg, rgba(0,0,0,.06) 0px, rgba(0,0,0,.1) 2px, transparent 3px, transparent 14px),
      linear-gradient(160deg,#6b4a2e,#4a3320 60%,#3a2719);
    border:3px solid #2a1c10;
    box-shadow: 0 10px 30px rgba(0,0,0,.5), inset 0 2px 4px rgba(255,255,255,.08), inset 0 -4px 8px rgba(0,0,0,.4);
  }
  .brushed-metal{
    background:linear-gradient(180deg,#d8d2c4,#a9a295 50%,#847d70);
    box-shadow: inset 0 1px 2px rgba(255,255,255,.6), inset 0 -2px 3px rgba(0,0,0,.3), 0 3px 6px rgba(0,0,0,.4);
  }
  .leather{
    background: radial-gradient(circle at 30% 20%, #5c2a22, #3a1712 70%);
    box-shadow: inset 0 2px 10px rgba(0,0,0,.6), inset 0 -2px 4px rgba(255,255,255,.05);
  }
  .vinyl{
    background: repeating-radial-gradient(circle at center, #111 0px, #111 2px, #1d1d1d 3px, #111 4px);
    box-shadow: 0 0 0 6px #050505, 0 10px 30px rgba(0,0,0,.6);
  }
  .vinyl-label{
    background: radial-gradient(circle, #c9972f, #8a5f1a 80%);
    box-shadow: inset 0 2px 6px rgba(255,255,255,.3), inset 0 -2px 6px rgba(0,0,0,.4);
  }
  .spin{animation:spin 3.2s linear infinite;}
  @keyframes spin{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}
  .knob{
    background:radial-gradient(circle at 35% 30%, #efe4cf, #b8a77e 60%, #8c7a52);
    box-shadow: 0 4px 8px rgba(0,0,0,.5), inset 0 2px 3px rgba(255,255,255,.5);
  }
  .knob-notch{
    position:absolute; top:3px; left:50%; width:3px; height:40%;
    background:#3a2c14; transform-origin:bottom center; transform:translateX(-50%);
  }
  .brass{color:#d4af6a;}
  .screw{
    width:8px;height:8px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #e8dcc0, #8c7a52);
    box-shadow: inset 0 1px 1px rgba(255,255,255,.6), 0 1px 2px rgba(0,0,0,.6);
  }
  .glass-dial{
    background: linear-gradient(180deg, rgba(255,250,230,.95), rgba(230,220,195,.9));
    box-shadow: inset 0 2px 4px rgba(0,0,0,.2), 0 2px 6px rgba(0,0,0,.4);
  }
  .needle{
    position:absolute; bottom:50%; left:50%; width:2px; height:34px;
    background:#b4332c; transform-origin:bottom center; transform:translateX(-50%) rotate(-35deg);
    transition: transform 1.5s ease;
  }
</style>
</head>
<body class="min-h-screen py-10 px-4">

<div class="max-w-5xl mx-auto">

  <header class="text-center mb-10">
    <p class="brass text-xs tracking-[0.3em] mb-2">A N A L O G · R A D I O</p>
    <h1 class="font-display text-4xl md:text-5xl font-bold text-[#f3e4cf]">黑膠電台 VinylRadio</h1>
    <p class="mt-3 text-[#d9c3a3] max-w-md mx-auto">一台只播類比聲音的線上電台，木殼、黃銅旋鈕，連唱盤都會真的轉。</p>
  </header>

  <div class="wood-panel rounded-2xl p-6 md:p-10 relative">
    <div class="absolute top-4 left-4 screw"></div>
    <div class="absolute top-4 right-4 screw"></div>
    <div class="absolute bottom-4 left-4 screw"></div>
    <div class="absolute bottom-4 right-4 screw"></div>

    <div class="grid md:grid-cols-2 gap-10 items-center">

      <!-- 唱盤 -->
      <div class="leather rounded-xl p-8 flex items-center justify-center">
        <div class="relative w-56 h-56">
          <div id="vinylDisc" class="vinyl w-56 h-56 rounded-full flex items-center justify-center">
            <div class="vinyl-label w-20 h-20 rounded-full flex items-center justify-center">
              <span class="font-display text-[10px] text-[#3a2410] font-bold text-center leading-tight">VINYL<br>RADIO</span>
            </div>
          </div>
        </div>
      </div>

      <!-- 控制面板 -->
      <div class="space-y-7">
        <div>
          <p class="brass text-xs tracking-widest mb-2">頻道調頻</p>
          <div class="glass-dial rounded-lg p-4 relative h-20 overflow-hidden">
            <div class="absolute inset-0 flex items-center px-4 text-[#5a4a2e] text-xs font-bold justify-between">
              <span>88</span><span>96</span><span>104</span><span>112</span><span>FM</span>
            </div>
            <div class="needle"></div>
          </div>
          <p class="text-center mt-2 text-sm text-[#e8d3ad]" id="stationName">FM 96.3 · 深夜爵士</p>
        </div>

        <div class="flex items-center justify-around">
          <div class="text-center">
            <button id="volKnob" class="knob w-16 h-16 rounded-full relative mx-auto block cursor-pointer" title="點擊調整音量">
              <div class="knob-notch" id="volNotch"></div>
            </button>
            <p class="text-xs mt-2 text-[#d9c3a3]">音量 <span id="volLabel" class="brass">60%</span></p>
          </div>
          <div class="text-center">
            <button id="toneKnob" class="knob w-16 h-16 rounded-full relative mx-auto block cursor-pointer" title="點擊切換頻道">
              <div class="knob-notch" id="toneNotch"></div>
            </button>
            <p class="text-xs mt-2 text-[#d9c3a3]">頻道 <span class="brass">旋轉切換</span></p>
          </div>
        </div>

        <button id="playBtn" class="brushed-metal w-full rounded-lg py-3 font-display font-semibold text-[#3a2c14] tracking-wide hover:brightness-95 transition">
          ▶ 開始播放
        </button>
      </div>

    </div>
  </div>

  <p class="text-center text-xs text-[#a98f68] mt-6">所有旋鈕、唱盤皆可實際操作 · 本頁純前端模擬，無真實電台訊號</p>
</div>

<script>
  const stations = ['FM 96.3 · 深夜爵士','FM 91.5 · 懷舊金曲','FM 103.8 · 黑膠電影配樂','FM 89.1 · 深夜電台劇場'];
  let stationIdx = 0;
  let volume = 60;
  let playing = false;

  const disc = document.getElementById('vinylDisc');
  const playBtn = document.getElementById('playBtn');
  const stationName = document.getElementById('stationName');
  const toneNotch = document.getElementById('toneNotch');
  const volNotch = document.getElementById('volNotch');
  const volLabel = document.getElementById('volLabel');

  playBtn.addEventListener('click', () => {
    playing = !playing;
    if (playing) {
      disc.classList.add('spin');
      playBtn.textContent = '⏸ 暫停播放';
    } else {
      disc.classList.remove('spin');
      playBtn.textContent = '▶ 開始播放';
    }
  });

  document.getElementById('toneKnob').addEventListener('click', () => {
    stationIdx = (stationIdx + 1) % stations.length;
    stationName.textContent = stations[stationIdx];
    toneNotch.style.transform = `translateX(-50%) rotate(${stationIdx * 90}deg)`;
  });

  document.getElementById('volKnob').addEventListener('click', () => {
    volume = volume + 20;
    if (volume > 100) volume = 0;
    volLabel.textContent = volume + '%';
    volNotch.style.transform = `translateX(-50%) rotate(${(volume/100)*270 - 135}deg)`;
  });
</script>
</body>
</html>

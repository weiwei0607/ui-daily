<!-- style #34 Predictive Dashboard -->
<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>安庫 SafeStock · 補貨預測後台</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@500;700;900&family=JetBrains+Mono:wght@400;600;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  body{ font-family:'Red Hat Display','Noto Sans TC',sans-serif; background:#0f172a; color:#e2e8f0; }
  .mono{ font-family:'JetBrains Mono', monospace; }
  .card{ background:#1e293b; border:1px solid #334155; }
  .actual-line{ stroke:#3b82f6; stroke-width:3; fill:none; }
  .predict-line{ stroke:#a855f7; stroke-width:3; stroke-dasharray:6 5; fill:none; }
  .pulse-dot{ animation: pulse 2s infinite; }
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:.3;} }
  .risk-row:hover{ background:#273449; }
</style>
</head>
<body class="min-h-screen">

<div class="max-w-6xl mx-auto px-6 py-8">

  <header class="flex items-center justify-between mb-8">
    <div>
      <h1 class="text-2xl font-black">安庫 <span class="mono text-sm text-slate-400">SafeStock</span></h1>
      <p class="text-sm text-slate-400 mt-1">北區物流中心 · 補貨需求預測</p>
    </div>
    <div class="flex items-center gap-3">
      <select id="daysSelect" class="card rounded-lg px-3 py-2 text-sm mono text-slate-200">
        <option value="7">未來 7 天</option>
        <option value="14" selected>未來 14 天</option>
        <option value="30">未來 30 天</option>
      </select>
      <span class="flex items-center gap-2 text-xs text-slate-400">
        <span class="w-2 h-2 rounded-full bg-emerald-400 pulse-dot"></span> 模型即時更新中
      </span>
    </div>
  </header>

  <section class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
    <div class="card rounded-xl p-5">
      <p class="text-xs text-slate-400 mb-1">預測準確率</p>
      <p class="text-3xl font-black mono text-emerald-400">91.4%</p>
    </div>
    <div class="card rounded-xl p-5">
      <p class="text-xs text-slate-400 mb-1">高風險 SKU</p>
      <p class="text-3xl font-black mono text-rose-400">23</p>
    </div>
    <div class="card rounded-xl p-5">
      <p class="text-xs text-slate-400 mb-1">建議補貨單</p>
      <p class="text-3xl font-black mono text-purple-400">47</p>
    </div>
    <div class="card rounded-xl p-5">
      <p class="text-xs text-slate-400 mb-1">缺貨風險金額</p>
      <p class="text-3xl font-black mono">NT$ <span id="riskAmount">186,400</span></p>
    </div>
  </section>

  <section class="card rounded-xl p-6 mb-8">
    <div class="flex items-center justify-between mb-4">
      <h2 class="font-bold">整體出貨量：實際值 vs 預測區間</h2>
      <div class="flex gap-4 text-xs">
        <span class="flex items-center gap-1"><span class="w-4 h-0.5 bg-blue-500 inline-block"></span> 實際值</span>
        <span class="flex items-center gap-1"><span class="w-4 h-0.5 bg-purple-500 inline-block" style="background-image:repeating-linear-gradient(to right, #a855f7 0 4px, transparent 4px 7px);"></span> 預測值</span>
      </div>
    </div>
    <svg viewBox="0 0 600 200" class="w-full h-48" id="chartSvg">
      <line x1="300" y1="10" x2="300" y2="190" stroke="#475569" stroke-dasharray="2 4"/>
      <text x="305" y="20" fill="#94a3b8" font-size="10" class="mono">今天</text>
      <polyline class="actual-line" id="actualLine" points=""/>
      <polyline class="predict-line" id="predictLine" points=""/>
    </svg>
  </section>

  <section class="card rounded-xl p-6">
    <h2 class="font-bold mb-4">高風險 SKU 補貨建議</h2>
    <table class="w-full text-sm">
      <thead class="text-slate-400 text-xs border-b border-slate-700">
        <tr>
          <th class="text-left py-2">商品編號</th>
          <th class="text-left py-2">品名</th>
          <th class="text-right py-2">目前庫存</th>
          <th class="text-right py-2">預測需求</th>
          <th class="text-right py-2">缺貨風險</th>
          <th class="text-right py-2">建議補貨量</th>
        </tr>
      </thead>
      <tbody id="skuTable"></tbody>
    </table>
  </section>

</div>

<script>
const SKUS = [
  {id:'SK-1042', name:'無糖豆漿 950ml', stock:120, demand:410, risk:'高', order:320},
  {id:'SK-2210', name:'冷凍水餃 600g', stock:88, demand:260, risk:'高', order:200},
  {id:'SK-0931', name:'有機雞蛋 10入', stock:45, demand:300, risk:'高', order:280},
  {id:'SK-3387', name:'手工餅乾禮盒', stock:210, demand:180, risk:'中', order:0},
  {id:'SK-1755', name:'即溶咖啡 20入', stock:60, demand:150, risk:'中', order:100},
];

const tbody = document.getElementById('skuTable');
function renderTable(days){
  const factor = days/14;
  tbody.innerHTML = '';
  SKUS.forEach(s => {
    const demand = Math.round(s.demand * factor);
    const order = Math.round(s.order * factor);
    const riskColor = s.risk === '高' ? 'text-rose-400' : 'text-amber-400';
    const tr = document.createElement('tr');
    tr.className = 'risk-row border-b border-slate-800';
    tr.innerHTML = `
      <td class="py-3 mono text-slate-400">${s.id}</td>
      <td class="py-3 font-semibold">${s.name}</td>
      <td class="py-3 text-right mono">${s.stock}</td>
      <td class="py-3 text-right mono">${demand}</td>
      <td class="py-3 text-right font-bold ${riskColor}">${s.risk}</td>
      <td class="py-3 text-right mono font-bold ${order > 0 ? 'text-purple-400' : 'text-slate-500'}">${order > 0 ? order : '—'}</td>
    `;
    tbody.appendChild(tr);
  });
}

function renderChart(days){
  const points = 12;
  const actualPts = [];
  const predictPts = [];
  let v = 100;
  for(let i=0;i<points;i++){
    v += (Math.random()-0.3)*18;
    const x = 20 + i*(280/(points-1));
    if(i <= points*0.4){
      actualPts.push(`${x.toFixed(1)},${(190-v).toFixed(1)}`);
    } else if(i === Math.ceil(points*0.4)) {
      actualPts.push(`${x.toFixed(1)},${(190-v).toFixed(1)}`);
      predictPts.push(`${x.toFixed(1)},${(190-v).toFixed(1)}`);
    } else {
      predictPts.push(`${x.toFixed(1)},${(190-v - days*0.6).toFixed(1)}`);
    }
  }
  document.getElementById('actualLine').setAttribute('points', actualPts.join(' '));
  document.getElementById('predictLine').setAttribute('points', predictPts.join(' '));
}

document.getElementById('daysSelect').addEventListener('change', (e) => {
  const days = Number(e.target.value);
  renderTable(days);
  renderChart(days);
  document.getElementById('riskAmount').textContent = Math.round(186400 * (days/14)).toLocaleString();
});

renderTable(14);
renderChart(14);
</script>

</body>
</html>

<!-- style #37 Sales Intelligence Dashboard -->
<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>戰績通 QuotaWin · 業務戰情室</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&family=JetBrains+Mono:wght@400;600;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  body{ font-family:'Plus Jakarta Sans','Noto Sans TC',sans-serif; background:#f8fafc; color:#0f172a; }
  .mono{ font-family:'JetBrains Mono', monospace; }
  .card{ background:#fff; border:1px solid #e2e8f0; }
  .bar-fill{ transition: width .6s ease; }
  .medal{ width:26px; height:26px; border-radius:999px; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:12px; color:#fff; }
</style>
</head>
<body class="min-h-screen">

<div class="max-w-6xl mx-auto px-6 py-8">

  <header class="flex items-center justify-between mb-8">
    <div>
      <h1 class="text-2xl font-extrabold">戰績通 <span class="mono text-sm text-slate-400">QuotaWin</span></h1>
      <p class="text-sm text-slate-500 mt-1">2026 年第四季 · 業務團隊即時戰情</p>
    </div>
    <div class="flex gap-2">
      <button data-range="week" class="rangeBtn px-4 py-2 rounded-lg text-sm font-bold bg-slate-900 text-white">本週</button>
      <button data-range="quarter" class="rangeBtn px-4 py-2 rounded-lg text-sm font-bold bg-white border text-slate-500">本季</button>
    </div>
  </header>

  <section class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
    <div class="card rounded-xl p-5">
      <p class="text-xs text-slate-400 mb-1">季度目標達成率</p>
      <p class="text-3xl font-black mono text-indigo-600" id="quotaPct">78%</p>
      <div class="w-full bg-slate-100 rounded-full h-2 mt-2">
        <div class="bar-fill bg-indigo-600 h-2 rounded-full" style="width:78%"></div>
      </div>
    </div>
    <div class="card rounded-xl p-5">
      <p class="text-xs text-slate-400 mb-1">本期新增業績</p>
      <p class="text-3xl font-black mono">NT$ 4.2M</p>
      <p class="text-xs text-emerald-500 font-bold mt-2">↑ 較上期 +12%</p>
    </div>
    <div class="card rounded-xl p-5">
      <p class="text-xs text-slate-400 mb-1">成交中商機</p>
      <p class="text-3xl font-black mono">63</p>
      <p class="text-xs text-slate-400 mt-2">總值 NT$ 9.8M</p>
    </div>
    <div class="card rounded-xl p-5">
      <p class="text-xs text-slate-400 mb-1">平均成交週期</p>
      <p class="text-3xl font-black mono">18<span class="text-base">天</span></p>
      <p class="text-xs text-rose-500 font-bold mt-2">↑ 較上期 +2 天</p>
    </div>
  </section>

  <div class="grid md:grid-cols-3 gap-6">

    <section class="card rounded-xl p-6 md:col-span-2">
      <h2 class="font-bold mb-4">銷售管線階段分布</h2>
      <div class="space-y-4" id="pipelineStages"></div>
    </section>

    <section class="card rounded-xl p-6">
      <h2 class="font-bold mb-4">本季排行榜</h2>
      <div class="space-y-3" id="leaderboard"></div>
    </section>

  </div>

</div>

<script>
const STAGES = [
  {name:'初步接觸', count:142, value:12.4, color:'bg-slate-400'},
  {name:'需求確認', count:81, value:8.1, color:'bg-sky-500'},
  {name:'提案報價', count:46, value:6.3, color:'bg-indigo-500'},
  {name:'合約洽談', count:22, value:4.5, color:'bg-violet-600'},
  {name:'已成交', count:19, value:4.2, color:'bg-emerald-500'},
];

const LEADERS = [
  {name:'林雅婷', amount:1820000, pct:132},
  {name:'陳柏宇', amount:1540000, pct:118},
  {name:'黃思涵', amount:1120000, pct:96},
  {name:'王建誠', amount:980000, pct:84},
  {name:'許家瑋', amount:760000, pct:71},
];

const pipelineBox = document.getElementById('pipelineStages');
const maxCount = Math.max(...STAGES.map(s=>s.count));
STAGES.forEach(s => {
  const row = document.createElement('div');
  row.innerHTML = `
    <div class="flex justify-between text-sm mb-1">
      <span class="font-semibold">${s.name}</span>
      <span class="mono text-slate-400">${s.count} 筆 · NT$ ${s.value}M</span>
    </div>
    <div class="w-full bg-slate-100 rounded-full h-3">
      <div class="bar-fill ${s.color} h-3 rounded-full" style="width:${(s.count/maxCount*100).toFixed(0)}%"></div>
    </div>
  `;
  pipelineBox.appendChild(row);
});

const medalColors = ['#f59e0b','#94a3b8','#b45309'];
const board = document.getElementById('leaderboard');
LEADERS.forEach((l, i) => {
  const row = document.createElement('div');
  row.className = 'flex items-center gap-3';
  row.innerHTML = `
    <div class="medal" style="background:${medalColors[i] || '#cbd5e1'}">${i+1}</div>
    <div class="flex-1">
      <p class="font-semibold text-sm">${l.name}</p>
      <p class="text-xs text-slate-400 mono">NT$ ${(l.amount/1000).toFixed(0)}K</p>
    </div>
    <span class="text-sm font-bold ${l.pct >= 100 ? 'text-emerald-500' : 'text-slate-400'}">${l.pct}%</span>
  `;
  board.appendChild(row);
});

document.querySelectorAll('.rangeBtn').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('.rangeBtn').forEach(b => {
      b.classList.remove('bg-slate-900','text-white');
      b.classList.add('bg-white','border','text-slate-500');
    });
    btn.classList.add('bg-slate-900','text-white');
    btn.classList.remove('bg-white','border','text-slate-500');
    const isWeek = btn.dataset.range === 'week';
    document.getElementById('quotaPct').textContent = isWeek ? '78%' : '91%';
    document.querySelector('.bar-fill.bg-indigo-600').style.width = isWeek ? '78%' : '91%';
  };
});
</script>

</body>
</html>

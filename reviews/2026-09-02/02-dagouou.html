<!-- style #16 Micro-interactions -->
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>打勾勾｜每天完成一件小事</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  body{ font-family:'Hanken Grotesk','Noto Sans TC',sans-serif; background:#f7f8fb; }
  .task-row{ transition: all .25s cubic-bezier(.34,1.56,.64,1); }
  .task-row.done{ background:#eefcf3; }
  .task-row:active{ transform: scale(.98); }
  .check-circle{
    width:28px; height:28px; border-radius:9999px; border:2px solid #d3d7e0;
    display:flex; align-items:center; justify-content:center;
    transition: all .3s cubic-bezier(.34,1.56,.64,1);
    cursor:pointer; flex-shrink:0;
  }
  .check-circle.checked{ background:#22c55e; border-color:#22c55e; transform: scale(1.15); }
  .check-circle svg{ opacity:0; transform: scale(.5); transition: all .2s ease .05s; }
  .check-circle.checked svg{ opacity:1; transform: scale(1); }
  .task-text.done{ text-decoration: line-through; color:#9aa1b1; }
  .ripple-btn{ position:relative; overflow:hidden; }
  .ripple{
    position:absolute; border-radius:9999px; background:rgba(255,255,255,.6);
    transform: scale(0); animation: ripple-anim .6s ease-out forwards;
    pointer-events:none;
  }
  @keyframes ripple-anim{ to{ transform:scale(4); opacity:0; } }
  .streak-flame{ animation: flicker 1.6s ease-in-out infinite; }
  @keyframes flicker{
    0%,100%{ transform: scale(1) rotate(-2deg); }
    50%{ transform: scale(1.08) rotate(2deg); }
  }
  .confetti{ position:fixed; pointer-events:none; z-index:50; }
  .progress-bar-fill{ transition: width .6s cubic-bezier(.22,1,.36,1); }
  .card-hover{ transition: transform .2s ease, box-shadow .2s ease; }
  .card-hover:hover{ transform: translateY(-3px); box-shadow: 0 12px 24px -8px rgba(34,197,94,.25); }
  .pop-in{ animation: pop-in .35s cubic-bezier(.34,1.56,.64,1) both; }
  @keyframes pop-in{ from{ opacity:0; transform: translateY(8px) scale(.96);} to{ opacity:1; transform: translateY(0) scale(1);} }
</style>
</head>
<body class="min-h-screen text-[#1c2033]">

  <div class="max-w-md mx-auto px-5 py-8">
    <header class="flex items-center justify-between mb-8">
      <div>
        <p class="text-sm text-[#8890a3]">早安，佳穎</p>
        <h1 class="text-2xl font-extrabold">今天也打勾勾 ✓</h1>
      </div>
      <div class="w-11 h-11 rounded-full bg-[#22c55e]/15 flex items-center justify-center text-xl font-bold text-[#16a34a]">佳</div>
    </header>

    <div class="bg-white rounded-3xl p-6 mb-6 card-hover shadow-sm">
      <div class="flex items-center justify-between mb-3">
        <span class="text-sm font-semibold text-[#4b5265]">今日進度</span>
        <span id="progress-label" class="text-sm font-bold text-[#16a34a]">2 / 5</span>
      </div>
      <div class="w-full h-3 bg-[#eef0f5] rounded-full overflow-hidden">
        <div id="progress-fill" class="progress-bar-fill h-full bg-gradient-to-r from-[#4ade80] to-[#16a34a] rounded-full" style="width:40%"></div>
      </div>
      <div class="flex items-center gap-2 mt-4">
        <span class="streak-flame text-lg">🔥</span>
        <span class="text-sm text-[#8890a3]">連續打卡 <b class="text-[#1c2033]">12</b> 天，別中斷囉</span>
      </div>
    </div>

    <div class="space-y-3 mb-8" id="task-list">
      <div class="task-row done bg-white rounded-2xl p-4 flex items-center gap-4 shadow-sm pop-in" data-task>
        <div class="check-circle checked" onclick="toggleTask(this)">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M4 12l6 6L20 6" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <div class="flex-1">
          <p class="task-text done font-semibold">喝水 2000ml</p>
          <p class="text-xs text-[#9aa1b1]">已完成，太棒了</p>
        </div>
        <span class="text-lg">💧</span>
      </div>

      <div class="task-row done bg-white rounded-2xl p-4 flex items-center gap-4 shadow-sm pop-in" style="animation-delay:.05s" data-task>
        <div class="check-circle checked" onclick="toggleTask(this)">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M4 12l6 6L20 6" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <div class="flex-1">
          <p class="task-text done font-semibold">早上拉伸 10 分鐘</p>
          <p class="text-xs text-[#9aa1b1]">已完成，太棒了</p>
        </div>
        <span class="text-lg">🧘</span>
      </div>

      <div class="task-row bg-white rounded-2xl p-4 flex items-center gap-4 shadow-sm pop-in" style="animation-delay:.1s" data-task>
        <div class="check-circle" onclick="toggleTask(this)"></div>
        <div class="flex-1">
          <p class="task-text font-semibold">讀書 20 頁</p>
          <p class="text-xs text-[#9aa1b1]">點一下就完成</p>
        </div>
        <span class="text-lg">📖</span>
      </div>

      <div class="task-row bg-white rounded-2xl p-4 flex items-center gap-4 shadow-sm pop-in" style="animation-delay:.15s" data-task>
        <div class="check-circle" onclick="toggleTask(this)"></div>
        <div class="flex-1">
          <p class="task-text font-semibold">晚上不滑手機到半夜</p>
          <p class="text-xs text-[#9aa1b1]">點一下就完成</p>
        </div>
        <span class="text-lg">📵</span>
      </div>

      <div class="task-row bg-white rounded-2xl p-4 flex items-center gap-4 shadow-sm pop-in" style="animation-delay:.2s" data-task>
        <div class="check-circle" onclick="toggleTask(this)"></div>
        <div class="flex-1">
          <p class="task-text font-semibold">整理今日待辦清單</p>
          <p class="text-xs text-[#9aa1b1]">點一下就完成</p>
        </div>
        <span class="text-lg">📝</span>
      </div>
    </div>

    <button class="ripple-btn w-full bg-[#16a34a] text-white font-bold py-4 rounded-2xl shadow-lg shadow-[#16a34a]/25 hover:brightness-105 active:scale-95 transition" onclick="addRipple(event)">
      ＋ 新增今日任務
    </button>
  </div>

<script>
  let done = 2, total = 5;
  function updateProgress(){
    document.getElementById('progress-label').textContent = done + ' / ' + total;
    document.getElementById('progress-fill').style.width = (done/total*100) + '%';
  }
  function toggleTask(circle){
    const row = circle.closest('[data-task]');
    const text = row.querySelector('.task-text');
    const isChecked = circle.classList.contains('checked');
    if(isChecked){
      circle.classList.remove('checked');
      circle.innerHTML = '';
      text.classList.remove('done');
      row.classList.remove('done');
      row.querySelector('.text-xs').textContent = '點一下就完成';
      done--;
    } else {
      circle.classList.add('checked');
      circle.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M4 12l6 6L20 6" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>';
      text.classList.add('done');
      row.classList.add('done');
      row.querySelector('.text-xs').textContent = '已完成，太棒了';
      done++;
      burstConfetti(circle);
    }
    updateProgress();
  }
  function addRipple(e){
    const btn = e.currentTarget;
    const rect = btn.getBoundingClientRect();
    const ripple = document.createElement('span');
    const size = Math.max(rect.width, rect.height);
    ripple.className = 'ripple';
    ripple.style.width = ripple.style.height = size + 'px';
    ripple.style.left = (e.clientX - rect.left - size/2) + 'px';
    ripple.style.top = (e.clientY - rect.top - size/2) + 'px';
    btn.appendChild(ripple);
    setTimeout(()=>ripple.remove(), 650);
  }
  function burstConfetti(el){
    const rect = el.getBoundingClientRect();
    const colors = ['#22c55e','#4ade80','#facc15','#f472b6','#60a5fa'];
    for(let i=0;i<10;i++){
      const p = document.createElement('div');
      p.className = 'confetti';
      p.style.left = (rect.left + rect.width/2) + 'px';
      p.style.top = (rect.top + rect.height/2) + 'px';
      p.style.width = p.style.height = (4 + Math.random()*4) + 'px';
      p.style.background = colors[i % colors.length];
      p.style.borderRadius = '50%';
      const angle = Math.random() * Math.PI * 2;
      const dist = 30 + Math.random()*40;
      const dx = Math.cos(angle) * dist;
      const dy = Math.sin(angle) * dist;
      document.body.appendChild(p);
      p.animate([
        { transform: 'translate(0,0)', opacity: 1 },
        { transform: `translate(${dx}px, ${dy}px)`, opacity: 0 }
      ], { duration: 500, easing: 'ease-out' }).onfinish = () => p.remove();
    }
  }
</script>
</body>
</html>

<!-- style #57 Gen Z Chaos -->
<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>亂賣 CHAOS MART｜潮流貼紙電商</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://api.fontshare.com/v2/css?f[]=clash-display@600,700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  body{font-family:'Noto Sans TC','Space Mono',monospace;background:#4ecdc4;}
  .font-display{font-family:'Clash Display','Noto Sans TC',sans-serif;}
  .mono{font-family:'Space Mono',monospace;}
  .tilt-1{transform:rotate(-3deg);}
  .tilt-2{transform:rotate(2deg);}
  .tilt-3{transform:rotate(-1.5deg);}
  .sticker-card{border:4px solid #111;box-shadow:8px 8px 0 #111;transition:transform .15s;}
  .sticker-card:hover{transform:translate(-4px,-4px) rotate(0deg) !important;box-shadow:12px 12px 0 #111;}
  .dashed{border:3px dashed #111;}
  .marquee{white-space:nowrap;animation:scroll 12s linear infinite;}
  @keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}
  .wiggle{animation:wiggle 3s ease-in-out infinite;}
  @keyframes wiggle{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
</style>
</head>
<body class="text-slate-900">

<div class="bg-[#ffe66d] border-b-4 border-black py-2 overflow-hidden">
  <div class="marquee font-black text-sm">
    ✂️ 全站滿$500免運　★　新品每週三上架　★　貼紙不會退流行　★　✂️ 全站滿$500免運　★　新品每週三上架　★　貼紙不會退流行　★
  </div>
</div>

<header class="max-w-6xl mx-auto px-6 py-6 flex items-center justify-between">
  <h1 class="font-display text-3xl font-bold tilt-1 inline-block bg-white px-4 py-2 border-4 border-black">亂賣 CHAOS MART</h1>
  <button class="mono font-bold bg-[#ff6b6b] border-4 border-black px-4 py-2 tilt-2 hover:tilt-1">🛒 購物車 (3)</button>
</header>

<section class="max-w-6xl mx-auto px-6 py-10 text-center relative">
  <div class="absolute left-4 top-4 text-5xl wiggle hidden md:block">✦</div>
  <div class="absolute right-8 top-16 text-5xl wiggle hidden md:block" style="animation-delay:1s">★</div>
  <h2 class="font-display text-6xl md:text-7xl font-bold mb-4 leading-none">
    <span class="inline-block tilt-1 bg-[#ff6b6b] px-3 border-4 border-black">貼紙</span>
    <span class="inline-block tilt-2">就是要</span>
    <span class="inline-block tilt-1 bg-[#a388ee] px-3 border-4 border-black text-white">亂貼</span>
  </h2>
  <p class="mono font-bold text-lg mb-8 bg-white inline-block px-4 py-2 border-3 dashed tilt-2">貼滿筆電、水壺、房間牆壁　沒有規則　只有態度</p>
</section>

<section class="max-w-6xl mx-auto px-6 pb-16 grid grid-cols-2 md:grid-cols-4 gap-8">

  <div class="sticker-card tilt-1 bg-white p-4 rounded-2xl">
    <div class="aspect-square rounded-xl bg-gradient-to-br from-pink-300 to-yellow-200 mb-3 flex items-center justify-center text-6xl">🐸</div>
    <p class="font-display font-bold">亂青蛙</p>
    <p class="mono text-sm">$60</p>
    <button class="add-btn mono w-full mt-2 bg-[#4ecdc4] border-3 border-black py-1.5 font-bold text-sm">加入購物車</button>
  </div>

  <div class="sticker-card tilt-2 bg-white p-4 rounded-2xl">
    <div class="aspect-square rounded-xl bg-gradient-to-br from-purple-300 to-blue-200 mb-3 flex items-center justify-center text-6xl">👾</div>
    <p class="font-display font-bold">故障怪獸</p>
    <p class="mono text-sm">$75</p>
    <button class="add-btn mono w-full mt-2 bg-[#4ecdc4] border-3 border-black py-1.5 font-bold text-sm">加入購物車</button>
  </div>

  <div class="sticker-card tilt-3 bg-white p-4 rounded-2xl">
    <div class="aspect-square rounded-xl bg-gradient-to-br from-yellow-200 to-red-200 mb-3 flex items-center justify-center text-6xl">🔥</div>
    <p class="font-display font-bold">火燒眉毛</p>
    <p class="mono text-sm">$50</p>
    <button class="add-btn mono w-full mt-2 bg-[#4ecdc4] border-3 border-black py-1.5 font-bold text-sm">加入購物車</button>
  </div>

  <div class="sticker-card tilt-1 bg-white p-4 rounded-2xl">
    <div class="aspect-square rounded-xl bg-gradient-to-br from-teal-200 to-green-200 mb-3 flex items-center justify-center text-6xl">👽</div>
    <p class="font-display font-bold">外星鄰居</p>
    <p class="mono text-sm">$65</p>
    <button class="add-btn mono w-full mt-2 bg-[#4ecdc4] border-3 border-black py-1.5 font-bold text-sm">加入購物車</button>
  </div>

</section>

<section class="max-w-6xl mx-auto px-6 pb-16">
  <div class="dashed bg-white p-8 tilt-2 text-center">
    <p class="font-display text-2xl font-bold mb-3">訂閱亂賣電報</p>
    <p class="mono text-sm mb-4">每週三第一手拿到新貼紙　偶爾也會亂寄優惠碼</p>
    <div class="flex gap-2 max-w-sm mx-auto">
      <input type="email" placeholder="你的信箱" class="flex-1 border-3 border-black px-3 py-2 mono text-sm">
      <button class="mono font-bold bg-[#ffe66d] border-3 border-black px-5">送出</button>
    </div>
  </div>
</section>

<footer class="border-t-4 border-black bg-white py-6 text-center mono text-sm">亂賣 CHAOS MART © 2026・退貨政策：不接受，因為貼紙已經貼上去了</footer>

<script>
  document.querySelectorAll('.add-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      btn.textContent = '已加入！🎉';
      btn.classList.add('bg-[#ffe66d]');
      setTimeout(()=>{btn.textContent='加入購物車'; btn.classList.remove('bg-[#ffe66d]');}, 1200);
    });
  });
</script>
</body>
</html>

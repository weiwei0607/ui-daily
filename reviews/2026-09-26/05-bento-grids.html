<!-- style #53 Bento Grids -->
<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>拼塊 TileBoard｜個人生產力首頁</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  body{font-family:'Noto Sans TC','Outfit',sans-serif;background:#f7f7f5;}
  .font-head{font-family:'Outfit','Noto Sans TC',sans-serif;}
  .tile{border-radius:24px;transition:transform .2s;}
  .tile:hover{transform:translateY(-3px);}
</style>
</head>
<body class="text-slate-800">

<div class="max-w-6xl mx-auto px-6 py-10">
  <header class="flex items-center justify-between mb-8">
    <div>
      <h1 class="font-head text-3xl font-bold">早安，蔚寧 👋</h1>
      <p class="text-slate-500">2026年9月26日・星期六，今天有 4 件事等你完成</p>
    </div>
    <div class="w-12 h-12 rounded-full bg-gradient-to-br from-orange-300 to-pink-300"></div>
  </header>

  <div class="grid grid-cols-4 md:grid-cols-6 gap-4 auto-rows-[110px]">

    <div class="tile col-span-4 md:col-span-3 row-span-2 bg-slate-900 text-white p-6 flex flex-col justify-between">
      <div class="flex justify-between items-start">
        <span class="text-sm text-slate-400">今日待辦</span>
        <span class="text-xs bg-white/10 px-2 py-1 rounded-full">2/4 完成</span>
      </div>
      <ul class="space-y-2 text-sm">
        <li class="flex items-center gap-2"><input type="checkbox" checked class="w-4 h-4 rounded accent-emerald-500"><span class="line-through text-slate-400">寄出季報草稿</span></li>
        <li class="flex items-center gap-2"><input type="checkbox" checked class="w-4 h-4 rounded accent-emerald-500"><span class="line-through text-slate-400">回覆客戶信件</span></li>
        <li class="flex items-center gap-2"><input type="checkbox" class="w-4 h-4 rounded accent-emerald-500 todo-check"><span>準備週會簡報</span></li>
        <li class="flex items-center gap-2"><input type="checkbox" class="w-4 h-4 rounded accent-emerald-500 todo-check"><span>訂機票（12月出差）</span></li>
      </ul>
    </div>

    <div class="tile col-span-2 md:col-span-3 row-span-1 bg-orange-200 p-5 flex flex-col justify-center">
      <p class="text-xs text-orange-800 mb-1">今日專注時數</p>
      <p class="font-head text-3xl font-bold text-orange-900">3.5 小時</p>
    </div>

    <div class="tile col-span-2 md:col-span-3 row-span-1 bg-white border border-slate-200 p-5 flex items-center gap-4">
      <svg viewBox="0 0 36 36" class="w-14 h-14">
        <circle cx="18" cy="18" r="15.9" fill="none" stroke="#e2e8f0" stroke-width="3.5"/>
        <circle cx="18" cy="18" r="15.9" fill="none" stroke="#0ea5e9" stroke-width="3.5" stroke-dasharray="72 100" stroke-linecap="round"/>
      </svg>
      <div>
        <p class="text-xs text-slate-400">本週目標</p>
        <p class="font-head font-bold text-lg">72% 達成</p>
      </div>
    </div>

    <div class="tile col-span-2 md:col-span-2 row-span-1 bg-emerald-100 p-5 flex flex-col justify-center">
      <p class="text-xs text-emerald-800 mb-1">今日步數</p>
      <p class="font-head text-2xl font-bold text-emerald-900">6,842</p>
    </div>

    <div class="tile col-span-2 md:col-span-2 row-span-1 bg-white border border-slate-200 p-5">
      <p class="text-xs text-slate-400 mb-2">下一個行程</p>
      <p class="font-head font-bold">14:00 週會</p>
      <p class="text-xs text-slate-400">會議室 B・3 位參與者</p>
    </div>

    <div class="tile col-span-2 md:col-span-2 row-span-1 bg-indigo-100 p-5 flex flex-col justify-center">
      <p class="text-xs text-indigo-800 mb-1">未讀訊息</p>
      <p class="font-head text-2xl font-bold text-indigo-900">7 則</p>
    </div>

    <div class="tile col-span-4 md:col-span-4 row-span-1 bg-white border border-slate-200 p-5">
      <p class="text-xs text-slate-400 mb-3">本週習慣打卡</p>
      <div class="flex gap-2">
        <div class="flex-1 h-8 rounded-lg bg-emerald-400"></div>
        <div class="flex-1 h-8 rounded-lg bg-emerald-400"></div>
        <div class="flex-1 h-8 rounded-lg bg-emerald-400"></div>
        <div class="flex-1 h-8 rounded-lg bg-slate-200"></div>
        <div class="flex-1 h-8 rounded-lg bg-emerald-400"></div>
        <div class="flex-1 h-8 rounded-lg bg-slate-200"></div>
        <div class="flex-1 h-8 rounded-lg bg-slate-200"></div>
      </div>
    </div>

    <div class="tile col-span-2 md:col-span-2 row-span-1 bg-rose-100 p-5 flex flex-col justify-center">
      <p class="text-xs text-rose-800 mb-1">本月支出</p>
      <p class="font-head text-2xl font-bold text-rose-900">NT$18,240</p>
    </div>

  </div>
</div>

<script>
  document.querySelectorAll('.todo-check').forEach(cb=>{
    cb.addEventListener('change', ()=>{
      const span = cb.nextElementSibling;
      span.classList.toggle('line-through');
      span.classList.toggle('text-slate-400');
    });
  });
</script>
</body>
</html>

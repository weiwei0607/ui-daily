<!DOCTYPE html>
<!-- style #53 Bento Grids -->
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>格展 GridShow · 攝影作品集整理工具</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  body{font-family:'Manrope','Noto Sans TC',sans-serif;background:#f4f4f2;color:#1c1c1a;}
  .bento{
    border-radius:22px;
    background:#fff;
    border:1px solid #e7e7e2;
  }
  .filter-pill.active{background:#1c1c1a;color:#fff;}
</style>
</head>
<body class="px-5 py-8 max-w-6xl mx-auto">

  <header class="flex flex-wrap items-center justify-between gap-4 mb-7">
    <div>
      <h1 class="text-2xl font-extrabold">格展 <span class="text-[#8a8a82] font-medium">GridShow</span></h1>
      <p class="text-sm text-[#8a8a82]">把散落的拍攝整理成一面牆</p>
    </div>
    <div class="flex gap-2 text-sm" id="filter-bar">
      <button class="filter-pill active px-4 py-1.5 rounded-full border border-[#1c1c1a]" data-f="all">全部</button>
      <button class="filter-pill px-4 py-1.5 rounded-full border border-[#1c1c1a]" data-f="street">街拍</button>
      <button class="filter-pill px-4 py-1.5 rounded-full border border-[#1c1c1a]" data-f="portrait">人像</button>
      <button class="filter-pill px-4 py-1.5 rounded-full border border-[#1c1c1a]" data-f="landscape">風景</button>
    </div>
  </header>

  <section class="grid grid-cols-4 md:grid-cols-6 gap-4 auto-rows-[110px]">

    <div class="bento col-span-4 md:col-span-3 row-span-2 p-6 flex flex-col justify-between" data-f="street">
      <div>
        <p class="text-xs text-[#8a8a82] mb-1">本月精選</p>
        <p class="text-xl font-bold">台北車站・雨夜人影</p>
      </div>
      <div class="h-28 rounded-2xl bg-gradient-to-br from-[#2b2b2b] to-[#5a5a5a] flex items-center justify-center text-5xl">🌆</div>
    </div>

    <div class="bento col-span-2 md:col-span-3 row-span-1 p-5 flex items-center justify-between" data-f="all">
      <div>
        <p class="text-xs text-[#8a8a82]">累積作品數</p>
        <p class="text-3xl font-extrabold" id="count-total">0</p>
      </div>
      <span class="text-3xl">🖼️</span>
    </div>

    <div class="bento col-span-2 md:col-span-3 row-span-1 p-5 flex items-center justify-between" data-f="all">
      <div>
        <p class="text-xs text-[#8a8a82]">本週新增</p>
        <p class="text-3xl font-extrabold text-[#2f7a4f]">+18</p>
      </div>
      <span class="text-3xl">📈</span>
    </div>

    <div class="bento col-span-2 md:col-span-2 row-span-2 p-5" data-f="portrait">
      <div class="h-20 rounded-2xl bg-gradient-to-br from-[#e8c9a3] to-[#c99a6b] flex items-center justify-center text-4xl mb-3">🧑‍🎨</div>
      <p class="font-bold">人像系列：市場裡的人</p>
      <p class="text-xs text-[#8a8a82]">24 張</p>
    </div>

    <div class="bento col-span-2 md:col-span-2 row-span-2 p-5" data-f="landscape">
      <div class="h-20 rounded-2xl bg-gradient-to-br from-[#9cc3d5] to-[#4f86a3] flex items-center justify-center text-4xl mb-3">⛰️</div>
      <p class="font-bold">風景系列：合歡山日出</p>
      <p class="text-xs text-[#8a8a82]">31 張</p>
    </div>

    <div class="bento col-span-2 md:col-span-2 row-span-2 p-5" data-f="street">
      <div class="h-20 rounded-2xl bg-gradient-to-br from-[#d3b8e0] to-[#9c6fb0] flex items-center justify-center text-4xl mb-3">🚦</div>
      <p class="font-bold">街拍系列：深夜便利商店</p>
      <p class="text-xs text-[#8a8a82]">17 張</p>
    </div>

    <div class="bento col-span-4 md:col-span-6 row-span-1 p-5 flex items-center justify-between" data-f="all">
      <p class="font-semibold text-sm">雲端備份狀態</p>
      <div class="flex-1 mx-6 h-2.5 rounded-full bg-[#eceae4] overflow-hidden">
        <div class="h-full bg-[#1c1c1a] rounded-full" style="width:76%"></div>
      </div>
      <p class="text-sm text-[#8a8a82]">76%</p>
    </div>

  </section>

  <footer class="text-center text-xs text-[#a3a39b] pt-8">格展 GridShow © 2026 · 整理，是為了下一次按下快門</footer>

<script>
  let n = 0;
  const target = 482;
  const el = document.getElementById('count-total');
  const iv = setInterval(()=>{
    n += Math.ceil((target-n)/8) || 1;
    if(n>=target){ n=target; clearInterval(iv); }
    el.textContent = n;
  }, 40);

  const pills = document.querySelectorAll('.filter-pill');
  const cards = document.querySelectorAll('[data-f]');
  pills.forEach(p=>{
    p.addEventListener('click', ()=>{
      pills.forEach(x=>x.classList.remove('active'));
      p.classList.add('active');
      const f = p.dataset.f;
      cards.forEach(c=>{
        c.style.display = (f==='all' || c.dataset.f===f || c.dataset.f==='all') ? '' : 'none';
      });
    });
  });
</script>
</body>
</html>

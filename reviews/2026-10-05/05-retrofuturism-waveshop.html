<!DOCTYPE html>
<!-- style #11 Retro-Futurism -->
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>電波本舖 WaveShop · 復古電台直播</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  body{font-family:'Noto Sans TC',sans-serif;background:#1a1a2e;color:#f1f1f8;}
  .display{font-family:'Orbitron',sans-serif;}
  .neon-pink{color:#ff006e; text-shadow:0 0 6px #ff006e, 0 0 16px #ff006e80;}
  .neon-cyan{color:#00ffff; text-shadow:0 0 6px #00ffff, 0 0 16px #00ffff80;}
  .grid-floor{
    background: linear-gradient(transparent 0%, #1a1a2e 90%),
      repeating-linear-gradient(90deg, #ff006e22 0 1px, transparent 1px 40px),
      repeating-linear-gradient(0deg, #00ffff22 0 1px, transparent 1px 20px);
    transform: perspective(300px) rotateX(55deg);
    height:160px;
  }
  .scanline{
    background: repeating-linear-gradient(0deg, rgba(255,255,255,0.03) 0 2px, transparent 2px 4px);
  }
  .card{
    background:#16213e;
    border:1px solid #00ffff44;
    border-radius:4px;
  }
  .card:hover{ border-color:#ff006e; box-shadow:0 0 18px #ff006e44; }
  @keyframes scan{ 0%{top:0%} 100%{top:100%} }
  .vu-bar{ animation: vu 0.9s ease-in-out infinite alternate; }
  @keyframes vu{ 0%{height:20%} 100%{height:90%} }
</style>
</head>
<body class="relative overflow-x-hidden">
<div class="scanline absolute inset-0 pointer-events-none z-10"></div>

<header class="px-6 py-6 text-center relative z-20">
  <h1 class="display text-4xl md:text-5xl neon-pink mb-2">電波本舖</h1>
  <p class="display text-sm neon-cyan tracking-widest">W A V E S H O P · 1986 復古頻率再現</p>
</header>

<div class="grid-floor relative z-0 -mt-4"></div>

<main class="max-w-4xl mx-auto px-6 pb-14 relative z-20 -mt-10">

  <section class="card p-6 mb-8">
    <div class="flex items-center justify-between mb-4">
      <p class="display text-xs neon-cyan">NOW PLAYING</p>
      <div class="flex gap-1 items-end h-6">
        <span class="vu-bar w-1.5 bg-[#ff006e]" style="animation-delay:0s"></span>
        <span class="vu-bar w-1.5 bg-[#00ffff]" style="animation-delay:.2s"></span>
        <span class="vu-bar w-1.5 bg-[#ff006e]" style="animation-delay:.1s"></span>
        <span class="vu-bar w-1.5 bg-[#00ffff]" style="animation-delay:.3s"></span>
      </div>
    </div>
    <h2 class="display text-2xl mb-1">FM 88.6 深夜迷幻頻道</h2>
    <p class="text-sm text-[#a9a9c7] mb-4">主持人：電波貓 ・ 正在播放第 342 集《霓虹午夜》</p>
    <div class="h-2 bg-[#0f0f23] rounded-full overflow-hidden mb-2">
      <div id="playbar" class="h-full bg-gradient-to-r from-[#ff006e] to-[#00ffff]" style="width:34%"></div>
    </div>
    <div class="flex justify-between text-xs text-[#a9a9c7] mono">
      <span>18:42</span><span>54:10</span>
    </div>
    <button id="play-btn" class="display mt-4 w-full py-3 border border-[#00ffff] neon-cyan hover:bg-[#00ffff] hover:text-[#1a1a2e] transition-colors">▶ 繼續收聽</button>
  </section>

  <section class="mb-8">
    <h2 class="display text-lg neon-pink mb-4">熱門頻率</h2>
    <div class="grid md:grid-cols-3 gap-4">
      <div class="card p-4 tune-card" data-freq="91.2">
        <p class="display neon-cyan text-xl mb-1">91.2</p>
        <p class="text-sm">合成器之夜</p>
      </div>
      <div class="card p-4 tune-card" data-freq="104.5">
        <p class="display neon-cyan text-xl mb-1">104.5</p>
        <p class="text-sm">霓虹賽車電台</p>
      </div>
      <div class="card p-4 tune-card" data-freq="76.8">
        <p class="display neon-cyan text-xl mb-1">76.8</p>
        <p class="text-sm">末日迪斯可</p>
      </div>
    </div>
  </section>

  <section class="card p-6">
    <h2 class="display text-lg neon-pink mb-3">正在調頻</h2>
    <p class="text-sm text-[#a9a9c7] mb-3">點擊上方頻率即時切換台</p>
    <p class="display text-3xl neon-cyan" id="freq-display">88.6</p>
  </section>
</main>

<footer class="text-center text-xs text-[#6b6b8f] py-6 relative z-20">電波本舖 WAVESHOP © 2026 · 復古未來主義廣播實驗室</footer>

<script>
  document.getElementById('play-btn').addEventListener('click', function(){
    const playing = this.textContent.includes('繼續');
    this.textContent = playing ? '⏸ 暫停播放' : '▶ 繼續收聽';
  });
  document.querySelectorAll('.tune-card').forEach(card=>{
    card.addEventListener('click', ()=>{
      document.getElementById('freq-display').textContent = card.dataset.freq;
    });
  });
  let w = 34;
  setInterval(()=>{
    w = (w + 0.5) % 100;
    document.getElementById('playbar').style.width = w+'%';
  }, 1000);
</script>
</body>
</html>

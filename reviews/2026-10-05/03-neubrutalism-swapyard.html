<!DOCTYPE html>
<!-- style #38 Neubrutalism -->
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>換物所 SWAPYARD · 二手玩具交換市集</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@500;700&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  body{font-family:'Space Grotesk','Noto Sans TC',sans-serif;background:#fdf6ec;color:#111;}
  .display{font-family:'Archivo Black','Noto Sans TC',sans-serif;}
  .brutal{
    border:3px solid #111;
    box-shadow:8px 8px 0 #111;
  }
  .brutal-sm{
    border:3px solid #111;
    box-shadow:5px 5px 0 #111;
  }
  .brutal-btn{transition: transform .1s ease, box-shadow .1s ease;}
  .brutal-btn:active{transform: translate(5px,5px); box-shadow:0 0 0 #111;}
  .tilt{transform: rotate(-1.2deg);}
  .tilt2{transform: rotate(1deg);}
</style>
</head>
<body class="px-5 py-8 max-w-5xl mx-auto">

  <header class="flex flex-wrap items-center justify-between gap-4 mb-10 brutal bg-[#ffe156] p-5 tilt">
    <h1 class="display text-4xl md:text-5xl">換物所</h1>
    <p class="font-bold text-lg">SWAPYARD · 玩具不是垃圾，是別人的寶貝</p>
  </header>

  <section class="grid md:grid-cols-3 gap-6 mb-10">
    <div class="brutal bg-[#ff6b6b] p-6 tilt2">
      <p class="display text-3xl text-white mb-1">2,847</p>
      <p class="font-bold text-white">本月成功交換件數</p>
    </div>
    <div class="brutal bg-[#4ecdc4] p-6">
      <p class="display text-3xl mb-1">612</p>
      <p class="font-bold">正在等待配對的玩具</p>
    </div>
    <div class="brutal bg-[#a388ee] p-6 tilt2 text-white">
      <p class="display text-3xl mb-1">98%</p>
      <p class="font-bold">用戶回報「比買新的更划算」</p>
    </div>
  </section>

  <section class="mb-10">
    <h2 class="display text-2xl mb-4 inline-block bg-[#111] text-white px-3 py-1 tilt">熱門交換中</h2>
    <div class="grid md:grid-cols-4 gap-5" id="toy-grid">
      <div class="brutal-sm bg-white p-4" data-toy="樂高太空梭">
        <div class="h-24 bg-[#ffe156] brutal-sm flex items-center justify-center text-3xl mb-3">🚀</div>
        <p class="font-bold">樂高太空梭 428 片</p>
        <p class="text-sm text-[#555] mb-3">想換：變形金剛系列</p>
        <button class="swap-btn brutal-sm brutal-btn w-full bg-[#4ecdc4] font-bold py-2">提出交換</button>
      </div>
      <div class="brutal-sm bg-white p-4" data-toy="絨毛恐龍">
        <div class="h-24 bg-[#ff6b6b] brutal-sm flex items-center justify-center text-3xl mb-3">🦖</div>
        <p class="font-bold">絨毛恐龍 55cm</p>
        <p class="text-sm text-[#555] mb-3">想換：絨毛動物系列</p>
        <button class="swap-btn brutal-sm brutal-btn w-full bg-[#4ecdc4] font-bold py-2">提出交換</button>
      </div>
      <div class="brutal-sm bg-white p-4" data-toy="軌道賽車套組">
        <div class="h-24 bg-[#a388ee] brutal-sm flex items-center justify-center text-3xl mb-3">🏎️</div>
        <p class="font-bold">軌道賽車套組</p>
        <p class="text-sm text-[#555] mb-3">想換：積木類玩具</p>
        <button class="swap-btn brutal-sm brutal-btn w-full bg-[#4ecdc4] font-bold py-2">提出交換</button>
      </div>
      <div class="brutal-sm bg-white p-4" data-toy="桌遊：卡坦島">
        <div class="h-24 bg-[#ffe156] brutal-sm flex items-center justify-center text-3xl mb-3">🎲</div>
        <p class="font-bold">桌遊：卡坦島</p>
        <p class="text-sm text-[#555] mb-3">想換：策略類桌遊</p>
        <button class="swap-btn brutal-sm brutal-btn w-full bg-[#4ecdc4] font-bold py-2">提出交換</button>
      </div>
    </div>
  </section>

  <section class="brutal bg-[#111] text-white p-6 mb-10 tilt2">
    <h2 class="display text-2xl mb-4">三步驟開始交換</h2>
    <div class="grid md:grid-cols-3 gap-4 text-sm font-bold">
      <div class="bg-[#ffe156] text-[#111] brutal-sm p-4">① 拍照上架你的玩具</div>
      <div class="bg-[#4ecdc4] text-[#111] brutal-sm p-4">② 配對想要的交換對象</div>
      <div class="bg-[#ff6b6b] text-white brutal-sm p-4">③ 約面交或寄送完成交換</div>
    </div>
  </section>

  <footer class="text-center font-bold py-4">換物所 SWAPYARD © 2026 · 讓每個玩具都有下一個主人</footer>

<script>
  document.querySelectorAll('.swap-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      if(btn.disabled) return;
      btn.disabled = true;
      btn.textContent = '已送出交換請求 ✓';
      btn.classList.remove('bg-[#4ecdc4]');
      btn.classList.add('bg-[#ffe156]');
    });
  });
</script>
</body>
</html>

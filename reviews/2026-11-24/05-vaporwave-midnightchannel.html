<!-- style #45 Vaporwave -->
<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>深夜頻道 Midnight Channel · 線上復古電子音樂會</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
  body{
    font-family:'VT323', monospace;
    background: linear-gradient(180deg, #1a0b3d 0%, #3a1468 35%, #ff6ec7 70%, #ffb199 100%);
    color:#fdf3ff;
    overflow-x:hidden;
    min-height:100vh;
    position:relative;
  }
  .pixel{ font-family:'Press Start 2P', monospace; }
  .sun{
    position:absolute; left:50%; top:16%; width:220px; height:220px; border-radius:50%;
    background: repeating-linear-gradient(0deg, #ff2fa0 0 8px, #ffd23f 8px 16px);
    transform: translateX(-50%);
    box-shadow: 0 0 80px #ff2fa0;
    z-index:1;
  }
  .grid-floor{
    position:absolute; bottom:0; left:0; width:100%; height:45%;
    background-image:
      linear-gradient(90deg, rgba(0,255,255,.5) 1px, transparent 1px),
      linear-gradient(0deg, rgba(0,255,255,.5) 1px, transparent 1px);
    background-size: 60px 40px;
    transform: perspective(300px) rotateX(60deg);
    transform-origin: bottom;
    z-index:1;
  }
  .scanlines{
    position:fixed; inset:0; pointer-events:none; z-index:40;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,.12) 0px, rgba(0,0,0,.12) 1px, transparent 2px, transparent 4px);
  }
  .glitch{
    text-shadow: 3px 0 #00fff0, -3px 0 #ff2fa0;
    animation: glitchShift 3s infinite;
  }
  @keyframes glitchShift{
    0%,92%,100%{ text-shadow:3px 0 #00fff0,-3px 0 #ff2fa0; transform:translate(0,0); }
    93%{ text-shadow:-5px 0 #00fff0, 5px 0 #ff2fa0; transform:translate(2px,-1px); }
    95%{ text-shadow:5px 2px #00fff0, -5px -2px #ff2fa0; transform:translate(-2px,1px); }
  }
  .chrome{
    background: linear-gradient(145deg,#fff,#b0b4c4 25%,#5a5f72 50%,#fff 75%,#8a8fa3);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .card{
    background: rgba(26,11,61,.55);
    border:2px solid #00fff0;
    box-shadow: 0 0 20px rgba(0,255,240,.35), inset 0 0 20px rgba(255,46,160,.15);
    backdrop-filter: blur(4px);
  }
  .ticket-btn{ border:2px solid #ff2fa0; transition:.15s; }
  .ticket-btn.active{ background:#ff2fa0; box-shadow:0 0 18px #ff2fa0; }
  marquee-track{ display:block; }
</style>
</head>
<body class="relative">
<div class="scanlines"></div>
<div class="sun"></div>
<div class="grid-floor"></div>

<div class="relative z-10 max-w-3xl mx-auto px-6 pt-10 pb-20">

  <header class="text-center mb-10">
    <p class="pixel text-[10px] tracking-widest text-cyan-200">01:23 AM • ミッドナイト放送中 • ライブ</p>
    <h1 class="glitch chrome pixel text-2xl md:text-4xl leading-relaxed mt-4">深夜頻道</h1>
    <p class="text-2xl mt-1">MIDNIGHT CHANNEL</p>
    <p class="mt-3 text-lg opacity-90">一場只在凌晨播送的合成器音樂會・線上直播門票開賣中</p>
  </header>

  <!-- 倒數計時 -->
  <div class="card rounded-xl p-5 mb-8 text-center">
    <p class="pixel text-[10px] text-pink-200 mb-3">距離開播還有</p>
    <div id="countdown" class="flex justify-center gap-4 text-3xl pixel text-cyan-200"></div>
  </div>

  <!-- 票種選擇 -->
  <div class="card rounded-xl p-6 mb-8">
    <p class="pixel text-[11px] mb-4 text-pink-200">選擇票種 ▼ SELECT TICKET</p>
    <div class="grid grid-cols-3 gap-3 mb-5">
      <button class="ticket-btn active rounded-lg py-3 text-center" data-price="399" data-name="早鳥票" onclick="selectTicket(this)">
        <p class="pixel text-[10px]">早鳥票</p><p class="text-xl mt-1">$399</p>
      </button>
      <button class="ticket-btn rounded-lg py-3 text-center" data-price="599" data-name="一般票" onclick="selectTicket(this)">
        <p class="pixel text-[10px]">一般票</p><p class="text-xl mt-1">$599</p>
      </button>
      <button class="ticket-btn rounded-lg py-3 text-center" data-price="1299" data-name="VIP 票" onclick="selectTicket(this)">
        <p class="pixel text-[10px]">VIP 票</p><p class="text-xl mt-1">$1299</p>
      </button>
    </div>
    <div class="flex items-center justify-between text-lg mb-4">
      <span>數量</span>
      <div class="flex items-center gap-4">
        <button onclick="changeQty(-1)" class="ticket-btn w-8 h-8 rounded">−</button>
        <span id="qty" class="pixel text-cyan-200">1</span>
        <button onclick="changeQty(1)" class="ticket-btn w-8 h-8 rounded">＋</button>
      </div>
    </div>
    <div class="flex items-center justify-between pixel text-[12px] text-cyan-200 border-t border-cyan-400/40 pt-4">
      <span>總計 TOTAL</span>
      <span id="total">$399</span>
    </div>
    <button onclick="buyTicket()" class="pixel w-full mt-5 py-3 rounded-lg text-[11px]" style="background:#00fff0;color:#1a0b3d;">立即購票 →</button>
    <p id="buyMsg" class="hidden text-center mt-3 text-pink-200">已加入訂單，頻道會在開播前傳送連結給你 📼</p>
  </div>

  <!-- 播放清單 -->
  <div class="card rounded-xl p-6">
    <p class="pixel text-[11px] mb-4 text-pink-200">本場播放清單 PLAYLIST</p>
    <ul class="space-y-2 text-lg">
      <li class="flex justify-between border-b border-cyan-400/20 pb-2"><span>01. サクラの亡霊</span><span class="opacity-60">04:12</span></li>
      <li class="flex justify-between border-b border-cyan-400/20 pb-2"><span>02. Neon 便利店</span><span class="opacity-60">03:48</span></li>
      <li class="flex justify-between border-b border-cyan-400/20 pb-2"><span>03. 永夜高速公路</span><span class="opacity-60">05:03</span></li>
      <li class="flex justify-between"><span>04. 再見、昭和</span><span class="opacity-60">06:21</span></li>
    </ul>
  </div>

  <p class="text-center pixel text-[9px] mt-10 opacity-60">© 2026 MIDNIGHT CHANNEL ・放送終了まであと少し</p>
</div>

<script>
  let price = 399, qty = 1, name = '早鳥票';

  function selectTicket(btn){
    document.querySelectorAll('.ticket-btn.active').forEach(b=>{ if(b.dataset.price) b.classList.remove('active'); });
    btn.classList.add('active');
    price = Number(btn.dataset.price);
    name = btn.dataset.name;
    updateTotal();
  }
  function changeQty(d){
    qty = Math.max(1, Math.min(10, qty + d));
    document.getElementById('qty').textContent = qty;
    updateTotal();
  }
  function updateTotal(){
    document.getElementById('total').textContent = '$' + (price*qty).toLocaleString();
  }
  function buyTicket(){
    document.getElementById('buyMsg').classList.remove('hidden');
  }

  // 倒數計時：設定目標為下一個週五凌晨一點
  function nextFriday1am(){
    const now = new Date();
    const d = new Date(now);
    d.setHours(1,0,0,0);
    const day = d.getDay();
    let diff = (5 - day + 7) % 7;
    if(diff===0 && now.getHours()>=1) diff = 7;
    d.setDate(d.getDate()+diff);
    return d;
  }
  const target = nextFriday1am();
  function renderCountdown(){
    const now = new Date();
    let diff = Math.max(0, target - now);
    const days = Math.floor(diff/86400000); diff -= days*86400000;
    const hrs = Math.floor(diff/3600000); diff -= hrs*3600000;
    const mins = Math.floor(diff/60000); diff -= mins*60000;
    const secs = Math.floor(diff/1000);
    document.getElementById('countdown').innerHTML = `
      <div><div>${String(days).padStart(2,'0')}</div><div class="text-[9px] opacity-60 pixel">天</div></div>
      <div><div>${String(hrs).padStart(2,'0')}</div><div class="text-[9px] opacity-60 pixel">時</div></div>
      <div><div>${String(mins).padStart(2,'0')}</div><div class="text-[9px] opacity-60 pixel">分</div></div>
      <div><div>${String(secs).padStart(2,'0')}</div><div class="text-[9px] opacity-60 pixel">秒</div></div>
    `;
  }
  renderCountdown();
  setInterval(renderCountdown, 1000);
</script>

</body>
</html>

<!-- style #03 Glassmorphism -->
<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>光合作息 · 智慧睡眠儀表板</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --glass-bg: rgba(255,255,255,0.28);
    --glass-border: rgba(255,255,255,0.45);
  }
  body{
    font-family:'Quicksand',sans-serif;
    background: linear-gradient(135deg,#667eea 0%, #764ba2 45%, #f093fb 100%);
    min-height:100vh;
  }
  .font-title{ font-family:'Baloo 2', sans-serif; }
  .glass{
    background: var(--glass-bg);
    backdrop-filter: blur(20px) saturate(160%);
    -webkit-backdrop-filter: blur(20px) saturate(160%);
    border: 1px solid var(--glass-border);
    box-shadow: 0 8px 32px rgba(31,38,135,0.25);
  }
  .glass-strong{
    background: rgba(255,255,255,0.4);
    backdrop-filter: blur(24px) saturate(180%);
    -webkit-backdrop-filter: blur(24px) saturate(180%);
    border: 1px solid rgba(255,255,255,0.55);
  }
  .blob{
    position:absolute; border-radius:9999px; filter:blur(60px); opacity:.55; z-index:0;
  }
  .ring-progress{
    transform: rotate(-90deg);
  }
</style>
</head>
<body class="relative overflow-x-hidden text-slate-800">
  <div class="blob w-72 h-72 bg-pink-300 top-[-4rem] left-[-3rem]"></div>
  <div class="blob w-96 h-96 bg-indigo-300 bottom-[-6rem] right-[-4rem]"></div>
  <div class="blob w-60 h-60 bg-purple-200 top-1/3 right-1/4"></div>

  <div class="relative z-10 max-w-6xl mx-auto px-6 py-10">
    <header class="flex items-center justify-between mb-10">
      <div class="flex items-center gap-3">
        <div class="w-11 h-11 rounded-2xl glass-strong flex items-center justify-center text-xl">🌙</div>
        <div>
          <h1 class="font-title text-xl font-bold">光合作息</h1>
          <p class="text-xs text-slate-600">你的睡眠與晨光夥伴</p>
        </div>
      </div>
      <nav class="hidden md:flex items-center gap-2 glass rounded-full px-2 py-1.5">
        <a class="px-4 py-1.5 rounded-full glass-strong font-semibold text-sm" href="#">今日</a>
        <a class="px-4 py-1.5 rounded-full text-sm text-slate-700 hover:bg-white/30" href="#">趨勢</a>
        <a class="px-4 py-1.5 rounded-full text-sm text-slate-700 hover:bg-white/30" href="#">呼吸練習</a>
      </nav>
      <div class="w-10 h-10 rounded-full glass-strong flex items-center justify-center font-title font-bold">阿</div>
    </header>

    <section class="grid md:grid-cols-3 gap-6 mb-6">
      <div class="glass rounded-3xl p-6 md:col-span-2">
        <p class="text-sm text-slate-600 mb-1">昨夜睡眠品質</p>
        <div class="flex items-end gap-4">
          <h2 class="font-title text-5xl font-extrabold">87<span class="text-2xl align-top">分</span></h2>
          <span class="mb-2 text-sm font-semibold px-3 py-1 rounded-full glass-strong text-emerald-700">比平均高 12%</span>
        </div>
        <p class="text-sm text-slate-600 mt-2">23:42 入睡 → 07:05 起床，共 7 小時 23 分</p>
        <div class="mt-6 grid grid-cols-4 gap-3">
          <div class="glass-strong rounded-2xl p-3 text-center">
            <p class="text-xs text-slate-600">深眠</p>
            <p class="font-title font-bold text-lg">2.1h</p>
          </div>
          <div class="glass-strong rounded-2xl p-3 text-center">
            <p class="text-xs text-slate-600">淺眠</p>
            <p class="font-title font-bold text-lg">3.8h</p>
          </div>
          <div class="glass-strong rounded-2xl p-3 text-center">
            <p class="text-xs text-slate-600">快速動眼</p>
            <p class="font-title font-bold text-lg">1.4h</p>
          </div>
          <div class="glass-strong rounded-2xl p-3 text-center">
            <p class="text-xs text-slate-600">清醒</p>
            <p class="font-title font-bold text-lg">6m</p>
          </div>
        </div>
      </div>

      <div class="glass rounded-3xl p-6 flex flex-col items-center justify-center">
        <p class="text-sm text-slate-600 mb-3">晨光喚醒進度</p>
        <svg class="ring-progress" width="140" height="140" viewBox="0 0 140 140">
          <circle cx="70" cy="70" r="58" stroke="rgba(255,255,255,0.4)" stroke-width="14" fill="none"/>
          <circle cx="70" cy="70" r="58" stroke="#fff" stroke-width="14" fill="none"
            stroke-dasharray="364" stroke-dashoffset="95" stroke-linecap="round"/>
        </svg>
        <p class="font-title font-bold text-lg -mt-24">74%</p>
        <p class="text-xs text-slate-600 mt-24">再過 12 分鐘進入喚醒時段</p>
      </div>
    </section>

    <section class="grid md:grid-cols-3 gap-6">
      <div class="glass rounded-3xl p-6">
        <h3 class="font-title font-bold text-lg mb-3">今晚建議</h3>
        <ul class="space-y-3 text-sm">
          <li class="flex items-start gap-2"><span>🕯️</span><span>22:30 起調暗室內燈光至暖黃 20%</span></li>
          <li class="flex items-start gap-2"><span>🌬️</span><span>睡前做 4-7-8 呼吸練習，共 3 輪</span></li>
          <li class="flex items-start gap-2"><span>📵</span><span>手機於 23:00 自動切換勿擾模式</span></li>
        </ul>
      </div>
      <div class="glass rounded-3xl p-6">
        <h3 class="font-title font-bold text-lg mb-3">七日趨勢</h3>
        <div class="flex items-end gap-2 h-28">
          <div class="flex-1 rounded-t-xl glass-strong" style="height:60%"></div>
          <div class="flex-1 rounded-t-xl glass-strong" style="height:75%"></div>
          <div class="flex-1 rounded-t-xl glass-strong" style="height:45%"></div>
          <div class="flex-1 rounded-t-xl glass-strong" style="height:82%"></div>
          <div class="flex-1 rounded-t-xl glass-strong" style="height:70%"></div>
          <div class="flex-1 rounded-t-xl glass-strong" style="height:90%"></div>
          <div class="flex-1 rounded-t-xl bg-white/70" style="height:87%"></div>
        </div>
        <div class="flex justify-between text-xs text-slate-600 mt-2">
          <span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span>
        </div>
      </div>
      <div class="glass rounded-3xl p-6">
        <h3 class="font-title font-bold text-lg mb-3">呼吸練習</h3>
        <p class="text-sm text-slate-600 mb-4">跟著圓圈的擴張與收縮調整呼吸節奏</p>
        <div class="flex justify-center">
          <button class="w-24 h-24 rounded-full glass-strong font-title font-bold text-sm hover:scale-105 transition-transform">開始</button>
        </div>
      </div>
    </section>
  </div>
</body>
</html>

<!-- style #45 Vaporwave -->
<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>電幻俱樂部 · 虛擬演唱會售票</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  body{
    font-family:'VT323','Noto Sans TC',monospace;
    font-size:20px;
    background: linear-gradient(180deg,#1a1a2e 0%, #2d1b4e 45%, #ff71ce 100%);
    color:#f5f0ff;
    overflow-x:hidden;
  }
  .font-title{ font-family:'Press Start 2P','Noto Sans TC',sans-serif; }
  .neon-pink{ color:#ff71ce; text-shadow: 0 0 8px #ff71ce, 0 0 20px #ff71ce88; }
  .neon-cyan{ color:#01cdfe; text-shadow: 0 0 8px #01cdfe, 0 0 20px #01cdfe88; }
  .chrome{
    background: linear-gradient(180deg,#fff 0%, #c0c0c0 30%, #808080 55%, #fff 100%);
    -webkit-background-clip: text; background-clip:text; color:transparent;
  }
  .grid-floor{
    position:relative; height:260px; overflow:hidden;
    background: linear-gradient(180deg, transparent 0%, #ff71ce22 100%);
  }
  .grid-lines{
    position:absolute; inset:0;
    background-image:
      linear-gradient(#01cdfe55 1px, transparent 1px),
      linear-gradient(90deg, #01cdfe55 1px, transparent 1px);
    background-size: 50px 50px;
    transform: perspective(300px) rotateX(60deg);
    transform-origin: bottom;
    animation: scroll 3s linear infinite;
  }
  @keyframes scroll{ from{background-position:0 0;} to{background-position:0 50px;} }
  .sun{
    position:absolute; left:50%; top:20px; transform:translateX(-50%);
    width:180px; height:180px; border-radius:9999px;
    background: linear-gradient(180deg,#ffe66d, #ff71ce);
    box-shadow: 0 0 60px #ff71cebb;
  }
  .scanline{
    position:fixed; inset:0; pointer-events:none; z-index:50;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,0.15) 0px, rgba(0,0,0,0.15) 1px, transparent 1px, transparent 3px);
  }
  .card{
    background: rgba(26,26,46,0.6);
    border:1px solid #01cdfe66;
  }
</style>
</head>
<body>
  <div class="scanline"></div>

  <header class="text-center pt-10 pb-4 relative">
    <p class="font-title text-[10px] neon-cyan mb-4 tracking-widest">現正販售 · ON SALE NOW</p>
    <h1 class="font-title text-2xl md:text-4xl neon-pink mb-3 leading-relaxed">電幻俱樂部</h1>
    <p class="text-2xl chrome font-bold">ＮＥＯＮ　ＤＲＥＡＭ　ＴＯＵＲ　'２６</p>
  </header>

  <div class="grid-floor">
    <div class="sun"></div>
    <div class="grid-lines"></div>
  </div>

  <main class="max-w-3xl mx-auto px-5 -mt-6 relative z-10 pb-16">

    <section class="card rounded-lg p-6 mb-6 text-center">
      <p class="text-2xl mb-1">虛擬歌姬 <span class="neon-pink font-bold">雪羽</span> 全息演唱會</p>
      <p class="text-lg text-[#c9c3e0]">2026.11.14（六）19:30 · 台北國際會議中心</p>
    </section>

    <section class="grid md:grid-cols-3 gap-4 mb-8">
      <div class="card rounded-lg p-5 text-center">
        <p class="font-title text-[9px] neon-cyan mb-3">STANDARD</p>
        <p class="text-3xl font-bold chrome mb-1">$1,880</p>
        <p class="text-base text-[#c9c3e0]">一般站席</p>
      </div>
      <div class="card rounded-lg p-5 text-center border-2 border-[#ff71ce]">
        <p class="font-title text-[9px] neon-pink mb-3">VIP・全息互動</p>
        <p class="text-3xl font-bold chrome mb-1">$3,880</p>
        <p class="text-base text-[#c9c3e0]">近距離全息投影區</p>
      </div>
      <div class="card rounded-lg p-5 text-center">
        <p class="font-title text-[9px] neon-cyan mb-3">DIGITAL</p>
        <p class="text-3xl font-bold chrome mb-1">$680</p>
        <p class="text-base text-[#c9c3e0]">線上直播票</p>
      </div>
    </section>

    <section class="card rounded-lg p-6 mb-8">
      <p class="font-title text-[10px] neon-cyan mb-4">倒數計時 · COUNTDOWN</p>
      <div class="grid grid-cols-4 gap-3 text-center">
        <div><p class="text-4xl chrome font-bold">58</p><p class="text-sm text-[#c9c3e0]">天</p></div>
        <div><p class="text-4xl chrome font-bold">14</p><p class="text-sm text-[#c9c3e0]">時</p></div>
        <div><p class="text-4xl chrome font-bold">32</p><p class="text-sm text-[#c9c3e0]">分</p></div>
        <div><p class="text-4xl chrome font-bold">09</p><p class="text-sm text-[#c9c3e0]">秒</p></div>
      </div>
    </section>

    <button class="w-full font-title text-xs py-4 rounded-lg neon-pink border-2 border-[#ff71ce] hover:bg-[#ff71ce22] transition-colors">
      立即前往購票 ▸▸▸
    </button>

    <p class="text-center text-sm text-[#8b85a8] mt-6">▲ 每人限購 4 張，票券採實名制入場 ▲</p>
  </main>
</body>
</html>

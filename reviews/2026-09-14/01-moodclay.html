<!-- style #09 Claymorphism -->
<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>心情黏土 MoodClay</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg1:#fdf6f0; --bg2:#fbeee6;
    --pink:#fdbcb4; --blue:#add8e6; --green:#c3f0ca; --yellow:#ffe8b3;
    --ink:#5c4a42;
  }
  *{font-family:'Baloo 2','M PLUS Rounded 1c',sans-serif;}
  body{
    background: linear-gradient(160deg,var(--bg1),var(--bg2));
    color:var(--ink);
    min-height:100vh;
  }
  .clay{
    border-radius: 32px;
    background: #fff8f3;
    box-shadow:
      8px 8px 16px rgba(214,180,160,0.45),
      -8px -8px 16px rgba(255,255,255,0.9);
  }
  .clay-pressed{
    box-shadow:
      inset 6px 6px 12px rgba(214,180,160,0.5),
      inset -6px -6px 12px rgba(255,255,255,0.85);
  }
  .clay-btn{
    transition: all .15s ease;
  }
  .clay-btn:active{
    box-shadow:
      inset 4px 4px 10px rgba(214,180,160,0.5),
      inset -4px -4px 10px rgba(255,255,255,0.85);
    transform: translateY(2px);
  }
  .mood-ball{
    border-radius:9999px;
    box-shadow:
      6px 6px 14px rgba(214,180,160,0.4),
      -6px -6px 14px rgba(255,255,255,0.9);
    transition: all .2s ease;
  }
  .mood-ball.selected{
    box-shadow:
      inset 5px 5px 10px rgba(0,0,0,0.12),
      inset -5px -5px 10px rgba(255,255,255,0.6);
    transform: scale(1.08);
  }
  .blob{
    position:absolute; border-radius:50%; filter:blur(2px); opacity:.6;
    animation: float 8s ease-in-out infinite;
  }
  @keyframes float{ 0%,100%{transform:translateY(0)} 50%{transform:translateY(-14px)} }
</style>
</head>
<body class="relative overflow-x-hidden">

  <div class="blob w-24 h-24 bg-[var(--pink)] top-10 left-6" style="animation-delay:0s"></div>
  <div class="blob w-16 h-16 bg-[var(--blue)] top-40 right-10" style="animation-delay:1.5s"></div>
  <div class="blob w-20 h-20 bg-[var(--yellow)] bottom-24 left-16" style="animation-delay:3s"></div>

  <header class="max-w-4xl mx-auto px-6 pt-10 pb-4 flex items-center justify-between relative z-10">
    <div class="flex items-center gap-3">
      <div class="w-12 h-12 clay flex items-center justify-center text-2xl">🧸</div>
      <span class="text-2xl font-extrabold">心情黏土 <span class="text-base font-medium opacity-60">MoodClay</span></span>
    </div>
    <button class="clay clay-btn px-5 py-2 font-bold text-sm">我的紀錄</button>
  </header>

  <main class="max-w-4xl mx-auto px-6 pb-20 relative z-10">

    <section class="clay p-8 md:p-10 mt-6 text-center">
      <p class="text-sm font-bold opacity-60 mb-2">2026 年 9 月 14 日・星期一</p>
      <h1 class="text-3xl md:text-4xl font-extrabold mb-2">今天，心情是什麼形狀？</h1>
      <p class="opacity-70 mb-8">捏一捏、選一選，把感覺留下來，30 秒就好。</p>

      <div class="grid grid-cols-3 md:grid-cols-6 gap-4 max-w-xl mx-auto" id="moodRow">
        <button data-mood="開心" class="mood-btn flex flex-col items-center gap-2">
          <span class="mood-ball w-16 h-16 md:w-20 md:h-20 flex items-center justify-center text-3xl" style="background:var(--yellow)">😄</span>
          <span class="text-xs font-bold">開心</span>
        </button>
        <button data-mood="平靜" class="mood-btn flex flex-col items-center gap-2">
          <span class="mood-ball w-16 h-16 md:w-20 md:h-20 flex items-center justify-center text-3xl" style="background:var(--blue)">😌</span>
          <span class="text-xs font-bold">平靜</span>
        </button>
        <button data-mood="疲憊" class="mood-btn flex flex-col items-center gap-2">
          <span class="mood-ball w-16 h-16 md:w-20 md:h-20 flex items-center justify-center text-3xl" style="background:var(--green)">😪</span>
          <span class="text-xs font-bold">疲憊</span>
        </button>
        <button data-mood="煩躁" class="mood-btn flex flex-col items-center gap-2">
          <span class="mood-ball w-16 h-16 md:w-20 md:h-20 flex items-center justify-center text-3xl" style="background:var(--pink)">😤</span>
          <span class="text-xs font-bold">煩躁</span>
        </button>
        <button data-mood="難過" class="mood-btn flex flex-col items-center gap-2">
          <span class="mood-ball w-16 h-16 md:w-20 md:h-20 flex items-center justify-center text-3xl" style="background:#dcd6f7">😢</span>
          <span class="text-xs font-bold">難過</span>
        </button>
        <button data-mood="興奮" class="mood-btn flex flex-col items-center gap-2">
          <span class="mood-ball w-16 h-16 md:w-20 md:h-20 flex items-center justify-center text-3xl" style="background:#ffd6e8">🤩</span>
          <span class="text-xs font-bold">興奮</span>
        </button>
      </div>

      <div class="mt-8">
        <textarea id="moodNote" rows="2" placeholder="想多寫一點嗎？（選填）" class="clay clay-pressed w-full max-w-lg mx-auto p-4 text-sm outline-none resize-none placeholder:opacity-50"></textarea>
      </div>

      <button id="saveBtn" class="clay clay-btn mt-6 px-8 py-3 font-extrabold text-lg" style="background:var(--pink)">
        捏好了，收進罐子裡 🫙
      </button>
      <p id="savedTip" class="mt-3 text-sm font-bold opacity-0 transition-opacity" style="color:#c97b6d">已經收好囉，明天見～</p>
    </section>

    <section class="grid md:grid-cols-3 gap-5 mt-8">
      <div class="clay p-6">
        <p class="text-sm opacity-60 mb-1">本週最常見</p>
        <p class="text-2xl font-extrabold flex items-center gap-2">😌 平靜</p>
        <p class="text-xs opacity-50 mt-1">出現了 4 天</p>
      </div>
      <div class="clay p-6">
        <p class="text-sm opacity-60 mb-1">連續紀錄</p>
        <p class="text-2xl font-extrabold">12 天</p>
        <p class="text-xs opacity-50 mt-1">比上週多 3 天</p>
      </div>
      <div class="clay p-6">
        <p class="text-sm opacity-60 mb-1">罐子裡的心情</p>
        <p class="text-2xl font-extrabold">86 顆</p>
        <p class="text-xs opacity-50 mt-1">從 6 月開始收集</p>
      </div>
    </section>

    <section class="clay p-8 mt-8">
      <h2 class="text-xl font-extrabold mb-5">最近的心情罐</h2>
      <div class="space-y-4">
        <div class="flex items-center gap-4">
          <span class="mood-ball w-12 h-12 flex items-center justify-center text-xl shrink-0" style="background:var(--blue)">😌</span>
          <div class="flex-1">
            <p class="font-bold text-sm">9/13（日）・平靜</p>
            <p class="text-xs opacity-60">在陽台喝了杯茶，什麼都沒想，感覺很好。</p>
          </div>
        </div>
        <div class="flex items-center gap-4">
          <span class="mood-ball w-12 h-12 flex items-center justify-center text-xl shrink-0" style="background:var(--yellow)">😄</span>
          <div class="flex-1">
            <p class="font-bold text-sm">9/12（六）・開心</p>
            <p class="text-xs opacity-60">跟朋友吃了很久沒吃的火鍋。</p>
          </div>
        </div>
        <div class="flex items-center gap-4">
          <span class="mood-ball w-12 h-12 flex items-center justify-center text-xl shrink-0" style="background:var(--pink)">😤</span>
          <div class="flex-1">
            <p class="font-bold text-sm">9/11（五）・煩躁</p>
            <p class="text-xs opacity-60">會議一直延遲，有點累積不耐煩。</p>
          </div>
        </div>
      </div>
    </section>

  </main>

<script>
  const buttons = document.querySelectorAll('.mood-btn');
  buttons.forEach(btn=>{
    btn.addEventListener('click',()=>{
      buttons.forEach(b=>b.querySelector('.mood-ball').classList.remove('selected'));
      btn.querySelector('.mood-ball').classList.add('selected');
    });
  });
  document.getElementById('saveBtn').addEventListener('click',()=>{
    const tip = document.getElementById('savedTip');
    tip.style.opacity = 1;
    setTimeout(()=>{ tip.style.opacity = 0; }, 2200);
  });
</script>
</body>
</html>

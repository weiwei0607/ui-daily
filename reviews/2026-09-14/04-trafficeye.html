<!-- style #31 Real-Time Monitoring -->
<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>路況眼 TrafficEye</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Roboto+Mono:wght@400;500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#0b1220; --panel:#111a2e; --line:#1e2a44; --amber:#ffb703; --green:#22d3a8; --red:#ff4d5e; }
  body{ background:var(--bg); color:#dfe6f3; font-family:'Rajdhani','Noto Sans TC',sans-serif; }
  .mono{ font-family:'Roboto Mono',monospace; }
  .panel{ background:var(--panel); border:1px solid var(--line); border-radius:10px; }
  .kicker{ letter-spacing:.12em; text-transform:uppercase; font-size:.7rem; color:#7e8db0; }
  .dot{ display:inline-block; width:8px; height:8px; border-radius:50%; }
  .blink{ animation: blink 1.2s ease-in-out infinite; }
  @keyframes blink{ 0%,100%{opacity:1} 50%{opacity:.25} }
  table td, table th{ border-bottom:1px solid var(--line); }
  .status-ok{ color: var(--green); }
  .status-warn{ color: var(--amber); }
  .status-bad{ color: var(--red); }
  ::-webkit-scrollbar{height:6px;width:6px} ::-webkit-scrollbar-thumb{background:#233052;border-radius:6px}
</style>
</head>
<body class="min-h-screen">

  <header class="border-b border-[var(--line)] px-6 py-4 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <span class="text-xl">🚦</span>
      <span class="font-bold text-lg tracking-wide">路況眼 <span class="text-[var(--green)]">TrafficEye</span></span>
      <span class="kicker ml-4 hidden md:inline">城市交通號誌即時監控中心</span>
    </div>
    <div class="flex items-center gap-4 mono text-sm">
      <span class="flex items-center gap-2"><span class="dot bg-[var(--green)] blink"></span>系統正常</span>
      <span id="clock" class="text-[#9fb0d1]">--:--:--</span>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-6 py-6">

    <section class="grid grid-cols-2 md:grid-cols-5 gap-4 mb-6">
      <div class="panel p-4">
        <p class="kicker mb-2">監控路口</p>
        <p class="text-2xl font-bold mono">248</p>
      </div>
      <div class="panel p-4">
        <p class="kicker mb-2">平均車速</p>
        <p class="text-2xl font-bold mono" id="avgSpeed">31.4 <span class="text-sm text-[#7e8db0]">km/h</span></p>
      </div>
      <div class="panel p-4">
        <p class="kicker mb-2">壅塞路段</p>
        <p class="text-2xl font-bold mono status-warn" id="jamCount">7</p>
      </div>
      <div class="panel p-4">
        <p class="kicker mb-2">號誌異常</p>
        <p class="text-2xl font-bold mono status-bad">2</p>
      </div>
      <div class="panel p-4 col-span-2 md:col-span-1">
        <p class="kicker mb-2">今日事故通報</p>
        <p class="text-2xl font-bold mono">5</p>
      </div>
    </section>

    <section class="grid lg:grid-cols-3 gap-5">

      <div class="panel p-5 lg:col-span-2">
        <div class="flex items-center justify-between mb-4">
          <h2 class="font-bold">主要幹道即時車流</h2>
          <span class="kicker">每 3 秒更新一次</span>
        </div>
        <svg viewBox="0 0 600 180" class="w-full h-44" id="flowChart">
          <line x1="0" y1="45" x2="600" y2="45" stroke="#1e2a44" stroke-width="1"/>
          <line x1="0" y1="90" x2="600" y2="90" stroke="#1e2a44" stroke-width="1"/>
          <line x1="0" y1="135" x2="600" y2="135" stroke="#1e2a44" stroke-width="1"/>
          <polyline id="flowLine" fill="none" stroke="#22d3a8" stroke-width="2" points=""/>
        </svg>
        <div class="flex justify-between text-xs mono text-[#7e8db0] mt-1">
          <span>-10 分</span><span>-5 分</span><span>現在</span>
        </div>
      </div>

      <div class="panel p-5">
        <div class="flex items-center justify-between mb-4">
          <h2 class="font-bold">即時警報日誌</h2>
          <span class="dot bg-[var(--red)] blink"></span>
        </div>
        <div id="logList" class="space-y-3 text-sm mono max-h-48 overflow-y-auto pr-1"></div>
      </div>

    </section>

    <section class="panel p-5 mt-5 overflow-x-auto">
      <div class="flex items-center justify-between mb-4">
        <h2 class="font-bold">路口號誌狀態</h2>
        <span class="kicker">依壅塞程度排序</span>
      </div>
      <table class="w-full text-sm mono">
        <thead class="text-left kicker">
          <tr><th class="py-2">路口</th><th>號誌狀態</th><th>平均車速</th><th>等候車輛</th><th>狀態</th></tr>
        </thead>
        <tbody id="tableBody">
        </tbody>
      </table>
    </section>

  </main>

<script>
  function tick(){
    const now = new Date();
    document.getElementById('clock').textContent = now.toLocaleTimeString('zh-TW',{hour12:false});
  }
  tick(); setInterval(tick,1000);

  // 折線圖：即時車流模擬
  const points = Array.from({length:30}, ()=> 60 + Math.random()*80);
  const flowLine = document.getElementById('flowLine');
  function renderFlow(){
    const step = 600/(points.length-1);
    const str = points.map((v,i)=> `${(i*step).toFixed(1)},${(180-v).toFixed(1)}`).join(' ');
    flowLine.setAttribute('points', str);
  }
  renderFlow();
  setInterval(()=>{
    points.shift();
    const last = points[points.length-1];
    let next = last + (Math.random()*24-12);
    next = Math.max(30, Math.min(150, next));
    points.push(next);
    renderFlow();
    document.getElementById('avgSpeed').innerHTML = (18 + (next/150)*24).toFixed(1) + ' <span class="text-sm text-[#7e8db0]">km/h</span>';
  }, 3000);

  // 即時警報日誌
  const alerts = [
    '中山路 × 民權路 號誌延遲 4 秒',
    '仁愛圓環 車流量超過警戒值',
    '建國高架南向 匝道回堵',
    '和平東路口 偵測器離線，切換手動排程',
    '重慶北路 事故通報，已派員處理',
    '信義快速道路 車速回穩至正常區間'
  ];
  const logList = document.getElementById('logList');
  function addLog(){
    const now = new Date().toLocaleTimeString('zh-TW',{hour12:false});
    const msg = alerts[Math.floor(Math.random()*alerts.length)];
    const div = document.createElement('div');
    div.className = 'border-l-2 pl-3';
    div.style.borderColor = '#ffb703';
    div.innerHTML = `<span class="text-[#7e8db0]">${now}</span><br><span class="text-[#dfe6f3]">${msg}</span>`;
    logList.prepend(div);
    while(logList.children.length > 6) logList.removeChild(logList.lastChild);
  }
  addLog();
  setInterval(addLog, 4500);

  // 路口號誌狀態表
  const rows = [
    ['忠孝東路 × 敦化南路','綠燈通行 42s','18.2 km/h','34 輛','bad'],
    ['中山北路 × 民生東路','綠燈通行 38s','24.6 km/h','21 輛','warn'],
    ['建國高架 南向匝道','黃燈警示','21.0 km/h','29 輛','warn'],
    ['和平東路 × 復興南路','綠燈通行 40s','33.8 km/h','12 輛','ok'],
    ['信義路 × 松仁路','綠燈通行 36s','41.2 km/h','8 輛','ok'],
  ];
  const statusMap = { ok:['正常','status-ok'], warn:['壅塞中','status-warn'], bad:['嚴重回堵','status-bad'] };
  const tbody = document.getElementById('tableBody');
  rows.forEach(r=>{
    const [label,cls] = statusMap[r[4]];
    const tr = document.createElement('tr');
    tr.innerHTML = `<td class="py-2 font-medium">${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td><td class="${cls} font-bold">${label}</td>`;
    tbody.appendChild(tr);
  });
</script>
</body>
</html>

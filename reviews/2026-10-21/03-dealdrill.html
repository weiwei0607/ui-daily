<!-- style #32 Drill-Down Dashboard -->
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鑫鑫電商 BI — 營運下鑽分析後台</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700&family=JetBrains+Mono:wght@500;600&family=Noto+Sans+TC:wght@500;700&display=swap" rel="stylesheet">
<style>
  body{ font-family:'Plus Jakarta Sans','Noto Sans TC',sans-serif; background:#f4f5f7; color:#1a1d29; }
  .mono{ font-family:'JetBrains Mono',monospace; }
  .card{ background:#fff; border:1px solid #e4e6ec; border-radius:12px; }
  .up{ color:#10b981; } .down{ color:#ef4444; }
  .crumb{ cursor:pointer; }
  .crumb:hover{ text-decoration:underline; }
  .level{ display:none; }
  .level.active{ display:block; }
  tr:hover{ background:#f8f9fb; }
</style>
</head>
<body>

  <div class="flex min-h-screen">
    <!-- 側邊 -->
    <aside class="w-56 bg-white border-r border-gray-200 hidden md:flex flex-col p-5">
      <p class="font-bold text-lg mb-8">鑫鑫 <span class="mono text-xs text-gray-400">BI</span></p>
      <nav class="flex flex-col gap-1 text-sm font-semibold text-gray-500">
        <a class="px-3 py-2 rounded-lg bg-gray-100 text-gray-900">營運總覽</a>
        <a class="px-3 py-2 rounded-lg hover:bg-gray-50">訂單管理</a>
        <a class="px-3 py-2 rounded-lg hover:bg-gray-50">商品庫存</a>
        <a class="px-3 py-2 rounded-lg hover:bg-gray-50">會員經營</a>
        <a class="px-3 py-2 rounded-lg hover:bg-gray-50">財務報表</a>
      </nav>
      <div class="mt-auto card p-4">
        <p class="text-xs text-gray-500">資料更新時間</p>
        <p class="mono text-sm font-semibold mt-1">2026-10-21 09:00</p>
      </div>
    </aside>

    <!-- 主區 -->
    <main class="flex-1 p-5 md:p-8">
      <header class="flex items-center justify-between mb-6">
        <div>
          <h1 class="text-xl font-bold">營運下鑽分析</h1>
          <!-- 麵包屑 -->
          <div id="breadcrumb" class="text-sm text-gray-500 mt-1 font-medium"></div>
        </div>
        <button id="backBtn" class="hidden card px-4 py-2 text-sm font-semibold hover:bg-gray-50">← 上一層</button>
      </header>

      <!-- KPI -->
      <section class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
        <div class="card p-4">
          <p class="text-xs text-gray-500 font-semibold">今日營收</p>
          <p class="mono text-2xl font-bold mt-1">NT$ 1,842,600</p>
          <p class="text-xs up mt-1 font-semibold">▲ 8.4% 較昨日</p>
        </div>
        <div class="card p-4">
          <p class="text-xs text-gray-500 font-semibold">訂單數</p>
          <p class="mono text-2xl font-bold mt-1">3,214</p>
          <p class="text-xs up mt-1 font-semibold">▲ 3.1% 較昨日</p>
        </div>
        <div class="card p-4">
          <p class="text-xs text-gray-500 font-semibold">客單價</p>
          <p class="mono text-2xl font-bold mt-1">NT$ 573</p>
          <p class="text-xs down mt-1 font-semibold">▼ 1.2% 較昨日</p>
        </div>
        <div class="card p-4">
          <p class="text-xs text-gray-500 font-semibold">退貨率</p>
          <p class="mono text-2xl font-bold mt-1">2.4%</p>
          <p class="text-xs up mt-1 font-semibold">▲ 0.3pt 較昨日</p>
        </div>
      </section>

      <!-- 下鑽層級 1：分店 -->
      <section id="level-0" class="level active card p-5">
        <h2 class="font-bold mb-4">各分店營收（點列可下鑽至商品分類）</h2>
        <table class="w-full text-sm">
          <thead class="text-gray-500 font-semibold text-left border-b border-gray-100">
            <tr><th class="py-2">分店</th><th>營收</th><th>訂單數</th><th>較昨日</th><th></th></tr>
          </thead>
          <tbody id="storeBody" class="divide-y divide-gray-50"></tbody>
        </table>
      </section>

      <!-- 下鑽層級 2：商品分類 -->
      <section id="level-1" class="level card p-5">
        <h2 class="font-bold mb-4">商品分類營收（點列可下鑽至單品）</h2>
        <table class="w-full text-sm">
          <thead class="text-gray-500 font-semibold text-left border-b border-gray-100">
            <tr><th class="py-2">分類</th><th>營收</th><th>銷量</th><th>毛利率</th><th></th></tr>
          </thead>
          <tbody id="catBody" class="divide-y divide-gray-50"></tbody>
        </table>
      </section>

      <!-- 下鑽層級 3：單品 -->
      <section id="level-2" class="level card p-5">
        <h2 class="font-bold mb-4">單品明細</h2>
        <table class="w-full text-sm">
          <thead class="text-gray-500 font-semibold text-left border-b border-gray-100">
            <tr><th class="py-2">商品</th><th>營收</th><th>銷量</th><th>庫存</th></tr>
          </thead>
          <tbody id="itemBody" class="divide-y divide-gray-50"></tbody>
        </table>
      </section>
    </main>
  </div>

<script>
  const stores = [
    { name:'台北信義店', revenue:612400, orders:1120, trend:'▲ 5.2%', up:true },
    { name:'台中西屯店', revenue:430800, orders:842, trend:'▲ 2.1%', up:true },
    { name:'高雄左營店', revenue:398200, orders:790, trend:'▼ 0.8%', up:false },
    { name:'線上官網', revenue:401200, orders:462, trend:'▲ 11.4%', up:true },
  ];
  const categories = {
    '台北信義店': [
      { name:'女裝上衣', revenue:182400, qty:960, margin:'42%' },
      { name:'配件飾品', revenue:120300, qty:1280, margin:'55%' },
      { name:'男裝外套', revenue:309700, qty:410, margin:'38%' },
    ],
    '台中西屯店': [
      { name:'女裝上衣', revenue:140200, qty:720, margin:'40%' },
      { name:'鞋類', revenue:168900, qty:390, margin:'33%' },
      { name:'配件飾品', revenue:121700, qty:980, margin:'53%' },
    ],
    '高雄左營店': [
      { name:'男裝外套', revenue:155600, qty:260, margin:'37%' },
      { name:'女裝上衣', revenue:131400, qty:610, margin:'41%' },
      { name:'鞋類', revenue:111200, qty:280, margin:'32%' },
    ],
    '線上官網': [
      { name:'配件飾品', revenue:188200, qty:1890, margin:'57%' },
      { name:'女裝上衣', revenue:120400, qty:520, margin:'39%' },
      { name:'男裝外套', revenue:92600, qty:150, margin:'36%' },
    ],
  };
  const items = {
    '女裝上衣': [
      { name:'麻花針織上衣 — 燕麥色', revenue:68200, qty:340, stock:52 },
      { name:'排釦雪紡襯衫 — 奶白', revenue:54100, qty:210, stock:18 },
      { name:'寬鬆落肩T — 炭灰', revenue:48900, qty:412, stock:96 },
    ],
    '配件飾品': [
      { name:'珍珠項鍊 — 復古金', revenue:72300, qty:610, stock:140 },
      { name:'帆布托特包 — 卡其', revenue:58200, qty:220, stock:33 },
    ],
    '男裝外套': [
      { name:'防風連帽外套 — 軍綠', revenue:120400, qty:180, stock:24 },
      { name:'羊毛大衣 — 深藍', revenue:98700, qty:95, stock:9 },
    ],
    '鞋類': [
      { name:'厚底帆布鞋 — 米白', revenue:89200, qty:260, stock:41 },
      { name:'皮革樂福鞋 — 黑', revenue:76400, qty:110, stock:15 },
    ],
  };

  const breadcrumbEl = document.getElementById('breadcrumb');
  const backBtn = document.getElementById('backBtn');
  let path = []; // ['店名', '分類']

  function fmt(n){ return 'NT$ ' + n.toLocaleString('en-US'); }

  function renderBreadcrumb(){
    const parts = ['全部分店', ...path];
    breadcrumbEl.innerHTML = parts.map((p, i) => {
      const isLast = i === parts.length - 1;
      return `<span class="crumb ${isLast ? 'text-gray-900 font-bold' : ''}" data-idx="${i}">${p}</span>` + (isLast ? '' : ' <span class="text-gray-300">/</span> ');
    }).join('');
    breadcrumbEl.querySelectorAll('.crumb').forEach(el => {
      el.addEventListener('click', () => {
        const idx = parseInt(el.dataset.idx);
        path = path.slice(0, idx);
        showLevel();
      });
    });
    backBtn.classList.toggle('hidden', path.length === 0);
  }

  function showLevel(){
    document.querySelectorAll('.level').forEach(el => el.classList.remove('active'));
    renderBreadcrumb();
    if(path.length === 0){
      document.getElementById('level-0').classList.add('active');
      renderStores();
    } else if(path.length === 1){
      document.getElementById('level-1').classList.add('active');
      renderCategories(path[0]);
    } else {
      document.getElementById('level-2').classList.add('active');
      renderItems(path[1]);
    }
  }

  function renderStores(){
    const body = document.getElementById('storeBody');
    body.innerHTML = stores.map(s => `
      <tr class="cursor-pointer" data-name="${s.name}">
        <td class="py-3 font-semibold">${s.name}</td>
        <td class="mono">${fmt(s.revenue)}</td>
        <td class="mono">${s.orders.toLocaleString()}</td>
        <td class="mono font-semibold ${s.up ? 'up' : 'down'}">${s.trend}</td>
        <td class="text-gray-400">往下鑽 →</td>
      </tr>`).join('');
    body.querySelectorAll('tr').forEach(tr => tr.addEventListener('click', () => {
      path = [tr.dataset.name]; showLevel();
    }));
  }

  function renderCategories(storeName){
    const body = document.getElementById('catBody');
    const data = categories[storeName] || [];
    body.innerHTML = data.map(c => `
      <tr class="cursor-pointer" data-name="${c.name}">
        <td class="py-3 font-semibold">${c.name}</td>
        <td class="mono">${fmt(c.revenue)}</td>
        <td class="mono">${c.qty.toLocaleString()}</td>
        <td class="mono">${c.margin}</td>
        <td class="text-gray-400">往下鑽 →</td>
      </tr>`).join('');
    body.querySelectorAll('tr').forEach(tr => tr.addEventListener('click', () => {
      path = [storeName, tr.dataset.name]; showLevel();
    }));
  }

  function renderItems(catName){
    const body = document.getElementById('itemBody');
    const data = items[catName] || [];
    body.innerHTML = data.map(it => `
      <tr>
        <td class="py-3 font-semibold">${it.name}</td>
        <td class="mono">${fmt(it.revenue)}</td>
        <td class="mono">${it.qty.toLocaleString()}</td>
        <td class="mono ${it.stock < 20 ? 'down font-semibold' : ''}">${it.stock}</td>
      </tr>`).join('');
  }

  backBtn.addEventListener('click', () => { path = path.slice(0, -1); showLevel(); });

  showLevel();
</script>
</body>
</html>

<!-- style #36 Financial Dashboard -->
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>財略 WealthTrack · 投資組合儀表板</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  body{ font-family:'IBM Plex Sans','Noto Sans TC',sans-serif; background:#0f172a; color:#e2e8f0; }
  .mono{ font-family:'JetBrains Mono', monospace; }
  .card{ background:#1b2436; border:1px solid #2a3450; border-radius:14px; }
  .up{ color:#10b981; }
  .down{ color:#ef4444; }
  .sidebar-link{ border-radius:8px; }
  .sidebar-link.active{ background:#273150; color:#fff; }
  table{ border-collapse:collapse; width:100%; }
  th{ text-align:left; color:#8b96b5; font-weight:500; font-size:.75rem; text-transform:uppercase; letter-spacing:.05em; padding:.5rem .75rem; }
  td{ padding:.6rem .75rem; border-top:1px solid #2a3450; font-size:.9rem; }
  .bar-bg{ background:#273150; border-radius:4px; overflow:hidden; height:6px; }
  .bar-fill{ height:100%; border-radius:4px; }
</style>
</head>
<body class="min-h-screen flex">

<aside class="w-56 shrink-0 hidden md:flex flex-col gap-1 p-4 border-r border-[#2a3450]">
  <h1 class="text-lg font-bold mb-6 px-2">財略 <span class="mono text-sm text-slate-400">WealthTrack</span></h1>
  <a class="sidebar-link active px-3 py-2 text-sm">投資組合總覽</a>
  <a class="sidebar-link px-3 py-2 text-sm text-slate-400">持股明細</a>
  <a class="sidebar-link px-3 py-2 text-sm text-slate-400">現金流紀錄</a>
  <a class="sidebar-link px-3 py-2 text-sm text-slate-400">報稅文件</a>
  <a class="sidebar-link px-3 py-2 text-sm text-slate-400">帳戶設定</a>
</aside>

<main class="flex-1 p-6 md:p-8">
  <div class="flex items-center justify-between mb-6">
    <div>
      <h2 class="text-2xl font-bold">投資組合總覽</h2>
      <p class="text-sm text-slate-400">最後更新：<span id="update-time" class="mono"></span></p>
    </div>
    <select id="range-select" class="bg-[#1b2436] border border-[#2a3450] rounded-lg px-3 py-2 text-sm">
      <option value="1W">近一週</option>
      <option value="1M" selected>近一個月</option>
      <option value="3M">近三個月</option>
      <option value="1Y">近一年</option>
    </select>
  </div>

  <div class="grid md:grid-cols-4 gap-4 mb-6" id="kpi-grid"></div>

  <div class="grid md:grid-cols-3 gap-4 mb-6">
    <div class="card p-5 md:col-span-2">
      <div class="flex items-center justify-between mb-3">
        <h3 class="font-semibold">資產淨值走勢</h3>
        <span id="range-label" class="mono text-xs text-slate-400">近一個月</span>
      </div>
      <svg id="trend-svg" viewBox="0 0 600 220" class="w-full h-56"></svg>
    </div>
    <div class="card p-5">
      <h3 class="font-semibold mb-3">資產配置</h3>
      <div id="allocation" class="space-y-3"></div>
    </div>
  </div>

  <div class="card p-5">
    <div class="flex items-center justify-between mb-3">
      <h3 class="font-semibold">持股明細</h3>
      <input id="holding-filter" placeholder="搜尋股票代號或名稱" class="bg-[#0f172a] border border-[#2a3450] rounded-lg px-3 py-1.5 text-sm w-56">
    </div>
    <table>
      <thead>
        <tr><th>代號</th><th>名稱</th><th>持股</th><th class="text-right">現價</th><th class="text-right">市值</th><th class="text-right">損益</th></tr>
      </thead>
      <tbody id="holdings-body"></tbody>
    </table>
  </div>
</main>

<script>
const holdings = [
  {code:'2330', name:'台積電', shares:120, price:1105, cost:980},
  {code:'2454', name:'聯發科', shares:60, price:1320, cost:1180},
  {code:'0050', name:'元大台灣50', shares:300, price:188, cost:172},
  {code:'006208', name:'富邦台50', shares:500, price:91, cost:95},
  {code:'AAPL', name:'蘋果公司', shares:40, price:268, cost:210},
  {code:'VOO', name:'Vanguard S&P500', shares:25, price:612, cost:540},
];

function fmt(n){ return n.toLocaleString('zh-TW'); }

const kpis = [
  {label:'總資產淨值', value:'NT$ 8,426,300', delta:'+3.2%', up:true},
  {label:'本月損益', value:'NT$ 261,400', delta:'+3.2%', up:true},
  {label:'累積損益', value:'NT$ 1,082,900', delta:'+14.7%', up:true},
  {label:'現金可投資額', value:'NT$ 312,800', delta:'-1.1%', up:false},
];
const kpiGrid = document.getElementById('kpi-grid');
kpis.forEach(k=>{
  const el = document.createElement('div');
  el.className = 'card p-5';
  el.innerHTML = `
    <p class="text-xs text-slate-400 mb-1">${k.label}</p>
    <p class="mono text-xl font-semibold mb-1">${k.value}</p>
    <p class="mono text-sm ${k.up?'up':'down'}">${k.delta} ${k.up?'▲':'▼'}</p>
  `;
  kpiGrid.appendChild(el);
});

const allocation = [
  {name:'台股個股', pct:38, color:'#10b981'},
  {name:'台股 ETF', pct:27, color:'#3b82f6'},
  {name:'美股', pct:22, color:'#a855f7'},
  {name:'現金', pct:13, color:'#f59e0b'},
];
const allocEl = document.getElementById('allocation');
allocation.forEach(a=>{
  const el = document.createElement('div');
  el.innerHTML = `
    <div class="flex justify-between text-sm mb-1"><span>${a.name}</span><span class="mono">${a.pct}%</span></div>
    <div class="bar-bg"><div class="bar-fill" style="width:${a.pct}%; background:${a.color}"></div></div>
  `;
  allocEl.appendChild(el);
});

function renderHoldings(filter=''){
  const body = document.getElementById('holdings-body');
  body.innerHTML = '';
  holdings
    .filter(h => (h.code+h.name).toLowerCase().includes(filter.toLowerCase()))
    .forEach(h=>{
      const marketValue = h.shares * h.price;
      const pl = (h.price - h.cost) * h.shares;
      const plPct = ((h.price - h.cost) / h.cost * 100).toFixed(1);
      const isUp = pl >= 0;
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td class="mono">${h.code}</td>
        <td>${h.name}</td>
        <td class="mono">${fmt(h.shares)}</td>
        <td class="mono text-right">${fmt(h.price)}</td>
        <td class="mono text-right">${fmt(marketValue)}</td>
        <td class="mono text-right ${isUp?'up':'down'}">${isUp?'+':''}${fmt(pl)} (${plPct}%)</td>
      `;
      body.appendChild(tr);
    });
}
renderHoldings();
document.getElementById('holding-filter').addEventListener('input', (e)=>renderHoldings(e.target.value));

function randomSeries(points, start){
  const arr = [start];
  for(let i=1;i<points;i++){
    arr.push(Math.max(50, arr[i-1] + (Math.random()-0.42) * 8));
  }
  return arr;
}
function drawTrend(points){
  const svg = document.getElementById('trend-svg');
  const w = 600, h = 220, pad = 10;
  const min = Math.min(...points), max = Math.max(...points);
  const stepX = (w - pad*2) / (points.length - 1);
  const scaleY = v => h - pad - ((v - min) / (max - min || 1)) * (h - pad*2);
  const pathD = points.map((v,i)=> `${i===0?'M':'L'} ${pad + i*stepX} ${scaleY(v).toFixed(1)}`).join(' ');
  const areaD = pathD + ` L ${pad + (points.length-1)*stepX} ${h-pad} L ${pad} ${h-pad} Z`;
  svg.innerHTML = `
    <defs>
      <linearGradient id="g1" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#10b981" stop-opacity="0.35"/>
        <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
      </linearGradient>
    </defs>
    <path d="${areaD}" fill="url(#g1)"></path>
    <path d="${pathD}" fill="none" stroke="#10b981" stroke-width="2.5"></path>
  `;
}
const ranges = {'1W':8,'1M':30,'3M':60,'1Y':120};
const rangeLabels = {'1W':'近一週','1M':'近一個月','3M':'近三個月','1Y':'近一年'};
function updateRange(key){
  drawTrend(randomSeries(ranges[key], 100));
  document.getElementById('range-label').textContent = rangeLabels[key];
}
updateRange('1M');
document.getElementById('range-select').addEventListener('change', e=>updateRange(e.target.value));

function renderTime(){
  document.getElementById('update-time').textContent = new Date().toLocaleString('zh-TW', {hour12:false});
}
renderTime();
setInterval(renderTime, 1000);
</script>
</body>
</html>

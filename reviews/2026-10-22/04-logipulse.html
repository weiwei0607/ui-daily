<!-- style #30 Executive Summary Dashboard -->
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>運籌總覽 LogiPulse｜物流營運儀表板</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  body{ font-family:'Outfit','Noto Sans TC',sans-serif; background:#f4f5f7; color:#17191c; }
  .mono{ font-family:'JetBrains Mono',monospace; }
  .kpi{ transition:box-shadow .2s, transform .2s; }
  .kpi:hover{ box-shadow:0 10px 28px -12px rgba(23,25,28,.18); transform:translateY(-2px); }
  .bar{ transition:width 1s ease-out; }
</style>
</head>
<body class="min-h-screen">

<div class="max-w-6xl mx-auto px-6 py-10">

  <div class="flex items-center justify-between mb-10">
    <div>
      <h1 class="text-2xl font-bold">運籌總覽</h1>
      <p class="text-sm text-slate-500 mt-1">LogiPulse ‧ 全台配送網絡 ‧ 2026 年 10 月 22 日</p>
    </div>
    <div class="text-right">
      <p class="text-xs text-slate-400">本月目標達成率</p>
      <p class="mono text-xl font-bold text-emerald-600">92.4%</p>
    </div>
  </div>

  <div class="grid grid-cols-2 md:grid-cols-4 gap-5 mb-10">
    <div class="kpi bg-white rounded-2xl p-6">
      <p class="text-xs text-slate-400 mb-3">今日配送量</p>
      <p class="mono text-3xl font-bold">48,210</p>
      <p class="text-xs text-emerald-600 mt-2">↑ 6.2% 較昨日</p>
    </div>
    <div class="kpi bg-white rounded-2xl p-6">
      <p class="text-xs text-slate-400 mb-3">準時送達率</p>
      <p class="mono text-3xl font-bold">98.1<span class="text-lg text-slate-400">%</span></p>
      <p class="text-xs text-emerald-600 mt-2">↑ 0.4pt</p>
    </div>
    <div class="kpi bg-white rounded-2xl p-6">
      <p class="text-xs text-slate-400 mb-3">每單平均成本</p>
      <p class="mono text-3xl font-bold">NT$42</p>
      <p class="text-xs text-rose-500 mt-2">↑ NT$1.8 較上月</p>
    </div>
    <div class="kpi bg-white rounded-2xl p-6">
      <p class="text-xs text-slate-400 mb-3">車隊可用率</p>
      <p class="mono text-3xl font-bold">87<span class="text-lg text-slate-400">%</span></p>
      <p class="text-xs text-slate-400 mt-2">持平</p>
    </div>
  </div>

  <div class="grid md:grid-cols-3 gap-5">
    <div class="md:col-span-2 bg-white rounded-2xl p-7">
      <h2 class="font-semibold mb-6">區域達成率</h2>
      <div class="space-y-4">
        <div>
          <div class="flex justify-between text-sm mb-1.5"><span>北部樞紐</span><span class="mono text-slate-500">96%</span></div>
          <div class="h-2 bg-slate-100 rounded-full overflow-hidden"><div class="bar h-full bg-slate-900 rounded-full" style="width:96%"></div></div>
        </div>
        <div>
          <div class="flex justify-between text-sm mb-1.5"><span>中部樞紐</span><span class="mono text-slate-500">89%</span></div>
          <div class="h-2 bg-slate-100 rounded-full overflow-hidden"><div class="bar h-full bg-slate-900 rounded-full" style="width:89%"></div></div>
        </div>
        <div>
          <div class="flex justify-between text-sm mb-1.5"><span>南部樞紐</span><span class="mono text-slate-500">91%</span></div>
          <div class="h-2 bg-slate-100 rounded-full overflow-hidden"><div class="bar h-full bg-slate-900 rounded-full" style="width:91%"></div></div>
        </div>
        <div>
          <div class="flex justify-between text-sm mb-1.5"><span>東部樞紐</span><span class="mono text-rose-500">76%</span></div>
          <div class="h-2 bg-slate-100 rounded-full overflow-hidden"><div class="bar h-full bg-rose-500 rounded-full" style="width:76%"></div></div>
        </div>
      </div>
    </div>

    <div class="bg-white rounded-2xl p-7">
      <h2 class="font-semibold mb-6">本週待決事項</h2>
      <ul class="space-y-4 text-sm">
        <li class="flex gap-3">
          <span class="w-1.5 h-1.5 rounded-full bg-rose-500 mt-1.5 flex-shrink-0"></span>
          <span>東部樞紐連續 3 天未達標，建議增派 2 輛車</span>
        </li>
        <li class="flex gap-3">
          <span class="w-1.5 h-1.5 rounded-full bg-amber-500 mt-1.5 flex-shrink-0"></span>
          <span>燃油成本上漲，每單成本已超出預算 4%</span>
        </li>
        <li class="flex gap-3">
          <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 mt-1.5 flex-shrink-0"></span>
          <span>北部樞紐連續 12 天達標，可作為標準流程範本</span>
        </li>
      </ul>
    </div>
  </div>

</div>

</body>
</html>

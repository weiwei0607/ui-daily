<!-- style #47 Exaggerated Minimalism -->
<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>巨字 MONO · 攝影作品集</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  body{background:#fff;color:#0a0a0a;font-family:'Noto Sans TC',sans-serif;}
  .display{font-family:'Archivo Black','Noto Sans TC',sans-serif;}
  .hair{border-color:#0a0a0a;}
</style>
</head>
<body class="min-h-screen">

  <header class="flex items-center justify-between px-8 py-6 border-b hair">
    <span class="display text-sm">巨字</span>
    <nav class="hidden sm:flex gap-8 text-xs tracking-widest uppercase">
      <a href="#">作品</a><a href="#">關於</a><a href="#">聯絡</a>
    </nav>
    <span class="text-xs tracking-widest">01 / 06</span>
  </header>

  <section class="px-6 sm:px-8 py-16 border-b hair">
    <h1 class="display leading-[0.85] tracking-tight" style="font-size:clamp(3.2rem,13vw,10rem)">
      看見<br>光的<br>重量
    </h1>
    <div class="mt-10 flex flex-col sm:flex-row sm:items-end sm:justify-between gap-6">
      <p class="max-w-md text-sm leading-relaxed text-[#4a4a4a]">攝影師 陳映辰，長期拍攝城市邊界與人的孤獨感。作品收錄於本次個展《巨字》，即日起於台北展出。</p>
      <button class="display text-xs border-2 hair px-6 py-4 hover:bg-black hover:text-white transition-colors">看展覽 →</button>
    </div>
  </section>

  <section class="grid grid-cols-2 md:grid-cols-3 border-b hair">
    <div class="aspect-[4/5] border-r border-b hair bg-[#e5e5e5] bg-cover bg-center" style="background-image:linear-gradient(135deg,#d8d8d8,#f2f2f2)"></div>
    <div class="aspect-[4/5] border-r border-b hair bg-[#111] bg-cover bg-center" style="background-image:linear-gradient(135deg,#0a0a0a,#3a3a3a)"></div>
    <div class="aspect-[4/5] border-b hair bg-cover bg-center" style="background-image:linear-gradient(135deg,#cfcfcf,#8f8f8f)"></div>
    <div class="aspect-[4/5] border-r hair bg-cover bg-center" style="background-image:linear-gradient(135deg,#1a1a1a,#4a4a4a)"></div>
    <div class="aspect-[4/5] border-r hair bg-cover bg-center" style="background-image:linear-gradient(135deg,#eaeaea,#c2c2c2)"></div>
    <div class="aspect-[4/5] bg-cover bg-center" style="background-image:linear-gradient(135deg,#050505,#2a2a2a)"></div>
  </section>

  <section class="px-6 sm:px-8 py-14 border-b hair grid md:grid-cols-2 gap-10">
    <p class="display leading-[0.9]" style="font-size:clamp(2.4rem,8vw,5.5rem)">2019<br>—2026</p>
    <div class="flex flex-col justify-end">
      <p class="text-sm leading-relaxed text-[#4a4a4a] mb-4">七年間走過十一座城市，用黑白底片記下每一次光線落下的角度。這系列作品不談構圖技巧，只談一件事：你有多久沒有停下來看光了。</p>
      <p class="text-xs tracking-widest uppercase">128 幅作品 · 11 座城市 · 7 年</p>
    </div>
  </section>

  <footer class="px-6 sm:px-8 py-10 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
    <p class="display text-xs">巨字 MONO</p>
    <p class="text-xs text-[#4a4a4a]">taipei@monoworks.tw · © 2026</p>
  </footer>

</body>
</html>

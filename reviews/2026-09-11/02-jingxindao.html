<!-- style #02 Neumorphism -->
<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>靜心島 · 每日正念</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&family=Quicksand:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --base:#e6e4e0;
    --text:#5b5952;
    --text-soft:#918f87;
    --accent:#c9a27a;
  }
  body{
    background:var(--base);
    color:var(--text);
    font-family:'Quicksand','Zen Maru Gothic','Noto Sans TC',sans-serif;
  }
  .heading{font-family:'Zen Maru Gothic','Noto Sans TC',sans-serif;}
  .neu-out{
    background:var(--base);
    border-radius:28px;
    box-shadow: 9px 9px 18px #c9c7c2, -9px -9px 18px #ffffff;
  }
  .neu-in{
    background:var(--base);
    border-radius:24px;
    box-shadow: inset 7px 7px 14px #c9c7c2, inset -7px -7px 14px #ffffff;
  }
  .neu-btn{
    background:var(--base);
    border-radius:999px;
    box-shadow: 6px 6px 12px #c9c7c2, -6px -6px 12px #ffffff;
    transition: box-shadow .15s ease, transform .15s ease;
  }
  .neu-btn:active{
    box-shadow: inset 5px 5px 10px #c9c7c2, inset -5px -5px 10px #ffffff;
    transform: translateY(1px);
  }
  .ring{
    background: conic-gradient(var(--accent) 0deg 252deg, #d8d5cf 252deg 360deg);
    border-radius:999px;
  }
  .ring-inner{
    background:var(--base);
    border-radius:999px;
    box-shadow: inset 5px 5px 10px #c9c7c2, inset -5px -5px 10px #ffffff;
  }
</style>
</head>
<body class="min-h-screen">

  <div class="max-w-md mx-auto px-6 py-8">

    <header class="flex items-center justify-between mb-8">
      <div>
        <p class="heading text-xl font-bold text-[--text]">靜心島</p>
        <p class="text-xs text-[--text-soft]">早安，今天也慢慢來</p>
      </div>
      <div class="neu-out w-12 h-12 flex items-center justify-center">
        <span class="text-lg">🌿</span>
      </div>
    </header>

    <section class="neu-out p-7 mb-6 flex flex-col items-center">
      <div class="relative w-40 h-40 ring flex items-center justify-center mb-5">
        <div class="ring-inner w-32 h-32 flex flex-col items-center justify-center">
          <span class="heading text-3xl font-bold text-[--text]">70%</span>
          <span class="text-[11px] text-[--text-soft] mt-1">今日目標</span>
        </div>
      </div>
      <p class="heading text-base font-medium mb-1">深呼吸練習</p>
      <p class="text-xs text-[--text-soft] mb-5">已完成 14 分鐘，剩 6 分鐘</p>
      <button class="neu-btn px-8 py-3 heading text-sm font-medium text-[--text]">繼續練習</button>
    </section>

    <section class="grid grid-cols-3 gap-4 mb-6">
      <div class="neu-out p-4 flex flex-col items-center">
        <div class="neu-in w-11 h-11 flex items-center justify-center mb-2 text-lg">🌙</div>
        <p class="text-[11px] text-[--text-soft]">睡眠</p>
        <p class="heading text-sm font-bold">7.2h</p>
      </div>
      <div class="neu-out p-4 flex flex-col items-center">
        <div class="neu-in w-11 h-11 flex items-center justify-center mb-2 text-lg">💧</div>
        <p class="text-[11px] text-[--text-soft]">心率</p>
        <p class="heading text-sm font-bold">62</p>
      </div>
      <div class="neu-out p-4 flex flex-col items-center">
        <div class="neu-in w-11 h-11 flex items-center justify-center mb-2 text-lg">🔥</div>
        <p class="text-[11px] text-[--text-soft]">連續天數</p>
        <p class="heading text-sm font-bold">18</p>
      </div>
    </section>

    <section class="neu-out p-6 mb-6">
      <p class="heading text-sm font-bold mb-4">今日推薦</p>
      <div class="space-y-3">
        <div class="neu-in p-4 flex items-center justify-between">
          <div>
            <p class="text-sm font-medium">睡前放鬆音景</p>
            <p class="text-[11px] text-[--text-soft] mt-0.5">12 分鐘 · 雨聲</p>
          </div>
          <div class="neu-btn w-9 h-9 flex items-center justify-center text-sm">▶</div>
        </div>
        <div class="neu-in p-4 flex items-center justify-between">
          <div>
            <p class="text-sm font-medium">工作前的三分鐘</p>
            <p class="text-[11px] text-[--text-soft] mt-0.5">3 分鐘 · 引導呼吸</p>
          </div>
          <div class="neu-btn w-9 h-9 flex items-center justify-center text-sm">▶</div>
        </div>
      </div>
    </section>

    <nav class="neu-out p-3 flex justify-between">
      <button class="neu-btn flex-1 mx-1 py-2.5 text-[--accent] text-lg">🏠</button>
      <button class="w-14 mx-1 py-2.5 text-center text-lg text-[--text-soft]">📅</button>
      <button class="w-14 mx-1 py-2.5 text-center text-lg text-[--text-soft]">📊</button>
      <button class="w-14 mx-1 py-2.5 text-center text-lg text-[--text-soft]">⚙️</button>
    </nav>

  </div>

</body>
</html>

<!-- style #37 Sales Intelligence Dashboard -->
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>戰情室 War Room｜業務銷售儀表板</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Roboto+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  body{font-family:'Manrope',sans-serif; background:#0f1420; color:#e6e9f0;}
  .mono{font-family:'Roboto Mono', monospace;}
  .card{background:#161d2e; border:1px solid #232c42;}
  .up{color:#34d399;}
  .down{color:#f87171;}
  .progress-track{background:#232c42;}
</style>
</head>
<body class="min-h-screen">

  <div class="max-w-7xl mx-auto px-6 py-6">
    <div class="flex items-center justify-between mb-8">
      <div>
        <h1 class="text-2xl font-extrabold">戰情室 <span class="mono text-sm font-normal text-slate-400">War Room</span></h1>
        <p class="text-sm text-slate-400 mt-1">2026 年第三季 ・ 業務團隊即時戰況</p>
      </div>
      <div class="flex items-center gap-3">
        <span class="mono text-xs px-3 py-1.5 rounded-full" style="background:#1a2b22; color:#34d399;">● 資料同步中</span>
        <button class="px-4 py-2 rounded-lg text-sm font-semibold" style="background:#3b5bfd;">匯出報表</button>
      </div>
    </div>

    <div class="grid md:grid-cols-4 gap-5 mb-8">
      <div class="card rounded-2xl p-6">
        <p class="text-xs text-slate-400 mb-2">本季業績達成</p>
        <p class="mono text-3xl font-bold">NT$ 8,420萬</p>
        <p class="text-xs mt-3 up">▲ 12.4% 較上季</p>
      </div>
      <div class="card rounded-2xl p-6">
        <p class="text-xs text-slate-400 mb-2">目標達成率</p>
        <p class="mono text-3xl font-bold">84<span class="text-lg">%</span></p>
        <div class="w-full h-2 progress-track rounded-full mt-4 overflow-hidden">
          <div class="h-full rounded-full" style="width:84%; background:#3b5bfd;"></div>
        </div>
      </div>
      <div class="card rounded-2xl p-6">
        <p class="text-xs text-slate-400 mb-2">進行中商機</p>
        <p class="mono text-3xl font-bold">126</p>
        <p class="text-xs mt-3 down">▼ 3 筆本週延遲</p>
      </div>
      <div class="card rounded-2xl p-6">
        <p class="text-xs text-slate-400 mb-2">平均成交週期</p>
        <p class="mono text-3xl font-bold">38<span class="text-lg">天</span></p>
        <p class="text-xs mt-3 up">▲ 縮短 5 天</p>
      </div>
    </div>

    <div class="grid md:grid-cols-3 gap-5 mb-8">
      <div class="card rounded-2xl p-6 md:col-span-2">
        <div class="flex items-center justify-between mb-5">
          <h2 class="font-bold">銷售管線階段分佈</h2>
          <span class="mono text-xs text-slate-400">單位：件數</span>
        </div>
        <div class="space-y-4" id="pipeline"></div>
      </div>
      <div class="card rounded-2xl p-6">
        <h2 class="font-bold mb-5">業務排行榜</h2>
        <div class="space-y-4" id="leaderboard"></div>
      </div>
    </div>

    <div class="card rounded-2xl p-6">
      <div class="flex items-center justify-between mb-5">
        <h2 class="font-bold">近 12 週業績走勢</h2>
        <span class="mono text-xs text-slate-400">NT$ 萬元</span>
      </div>
      <svg id="trendChart" viewBox="0 0 600 160" class="w-full h-40"></svg>
    </div>
  </div>

<script>
  const pipelineData = [
    {stage:'初步接觸', count:52, color:'#64748b'},
    {stage:'需求確認', count:38, color:'#3b5bfd'},
    {stage:'提案報價', count:21, color:'#a855f7'},
    {stage:'合約談判', count:11, color:'#f59e0b'},
    {stage:'已成交', count:4, color:'#34d399'},
  ];
  const maxCount = Math.max(...pipelineData.map(d => d.count));
  const pipelineEl = document.getElementById('pipeline');
  pipelineData.forEach(d => {
    const row = document.createElement('div');
    row.innerHTML = `
      <div class="flex items-center justify-between text-sm mb-1.5">
        <span>${d.stage}</span>
        <span class="mono">${d.count}</span>
      </div>
      <div class="w-full h-2.5 progress-track rounded-full overflow-hidden">
        <div class="h-full rounded-full" style="width:${(d.count/maxCount*100).toFixed(0)}%; background:${d.color};"></div>
      </div>`;
    pipelineEl.appendChild(row);
  });

  const reps = [
    {name:'林靜怡', amount:1420, rank:1},
    {name:'王振宇', amount:1180, rank:2},
    {name:'陳美如', amount:960, rank:3},
    {name:'張家豪', amount:720, rank:4},
  ];
  const leaderboardEl = document.getElementById('leaderboard');
  reps.forEach(r => {
    const row = document.createElement('div');
    row.className = 'flex items-center justify-between';
    row.innerHTML = `
      <div class="flex items-center gap-3">
        <span class="mono text-xs w-5 text-slate-400">#${r.rank}</span>
        <span class="text-sm">${r.name}</span>
      </div>
      <span class="mono text-sm font-semibold">NT$${r.amount}萬</span>`;
    leaderboardEl.appendChild(row);
  });

  const weeks = Array.from({length:12}, (_, i) => 480 + Math.round(Math.sin(i/2)*60 + i*14 + Math.random()*30));
  const svg = document.getElementById('trendChart');
  const w = 600, h = 160, pad = 10;
  const max = Math.max(...weeks), min = Math.min(...weeks);
  const pts = weeks.map((v,i) => {
    const x = pad + (i/(weeks.length-1)) * (w - pad*2);
    const y = h - pad - ((v-min)/(max-min)) * (h - pad*2);
    return [x,y];
  });
  const path = pts.map((p,i) => (i===0?'M':'L')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  const area = path + ` L${pts[pts.length-1][0]},${h} L${pts[0][0]},${h} Z`;
  svg.innerHTML = `
    <defs>
      <linearGradient id="grad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#3b5bfd" stop-opacity="0.35"/>
        <stop offset="100%" stop-color="#3b5bfd" stop-opacity="0"/>
      </linearGradient>
    </defs>
    <path d="${area}" fill="url(#grad)" />
    <path d="${path}" fill="none" stroke="#3b5bfd" stroke-width="2.5" />
    ${pts.map(p => `<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="#3b5bfd" />`).join('')}
  `;
</script>
</body>
</html>

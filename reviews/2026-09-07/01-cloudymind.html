<!-- style #09 Claymorphism -->
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>棉花糖 CloudyMind｜靜心冥想 App</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --clay-bg: #fdf6f0;
    --clay-pink: #fdbcb4;
    --clay-blue: #add8e6;
    --clay-green: #b7f0c4;
    --clay-purple: #d9c2f0;
    --clay-text: #5b4a45;
  }
  *{font-family:'Quicksand',sans-serif;}
  h1,h2,h3,.display{font-family:'Baloo 2',sans-serif;}
  body{background:var(--clay-bg); color: var(--clay-text);}
  .clay{
    border-radius: 32px;
    background: linear-gradient(145deg, #ffffff, #f3ece6);
    box-shadow: 8px 8px 20px rgba(180,150,130,0.25), -8px -8px 20px rgba(255,255,255,0.9);
  }
  .clay-pressed{
    box-shadow: inset 6px 6px 14px rgba(180,150,130,0.25), inset -6px -6px 14px rgba(255,255,255,0.9);
  }
  .clay-btn{
    border-radius: 999px;
    box-shadow: 6px 6px 14px rgba(180,150,130,0.3), -6px -6px 14px rgba(255,255,255,0.95);
    transition: all .15s ease;
  }
  .clay-btn:active{
    box-shadow: inset 4px 4px 10px rgba(180,150,130,0.3), inset -4px -4px 10px rgba(255,255,255,0.9);
    transform: scale(0.97);
  }
  .blob{
    border-radius: 42% 58% 63% 37% / 41% 44% 56% 59%;
  }
  @keyframes float{
    0%,100%{transform: translateY(0px) rotate(0deg);}
    50%{transform: translateY(-14px) rotate(3deg);}
  }
  .floaty{animation: float 6s ease-in-out infinite;}
  .floaty-slow{animation: float 8s ease-in-out infinite; animation-delay: -3s;}
</style>
</head>
<body class="min-h-screen overflow-x-hidden">

  <div class="fixed -top-20 -left-20 w-64 h-64 blob floaty" style="background:var(--clay-blue); opacity:.55; filter:blur(2px);"></div>
  <div class="fixed top-40 -right-24 w-72 h-72 blob floaty-slow" style="background:var(--clay-pink); opacity:.5; filter:blur(2px);"></div>
  <div class="fixed bottom-0 left-1/3 w-56 h-56 blob floaty" style="background:var(--clay-green); opacity:.5; filter:blur(2px);"></div>

  <nav class="relative z-10 max-w-6xl mx-auto flex items-center justify-between px-6 py-6">
    <div class="flex items-center gap-2">
      <div class="w-11 h-11 clay flex items-center justify-center text-xl">☁️</div>
      <span class="display text-2xl font-bold" style="color:#8a6a5f;">棉花糖</span>
    </div>
    <div class="clay-btn px-6 py-2.5 text-sm font-semibold cursor-pointer" style="background:var(--clay-purple);">
      免費開始
    </div>
  </nav>

  <header class="relative z-10 max-w-5xl mx-auto px-6 pt-10 pb-16 text-center">
    <div class="clay inline-block px-5 py-2 mb-6 text-sm font-semibold" style="color:#8a6a5f;">🌙 每天 10 分鐘，找回柔軟的自己</div>
    <h1 class="display text-5xl md:text-6xl font-extrabold leading-tight mb-6" style="color:#6b544c;">
      把緊繃的一天<br/>
      <span style="color:#e08a95;">輕輕地</span>放下
    </h1>
    <p class="text-lg max-w-xl mx-auto mb-10" style="color:#8a7269;">
      棉花糖用溫柔的引導冥想、呼吸練習與睡前故事，陪你把混亂的思緒揉軟，慢慢睡著。
    </p>
    <div class="flex items-center justify-center gap-4 flex-wrap">
      <button class="clay-btn px-8 py-4 text-base font-bold" style="background:var(--clay-pink); color:#6b3b3b;">開始 7 天免費體驗</button>
      <button class="clay-btn px-8 py-4 text-base font-bold" style="background:#ffffff; color:#8a6a5f;">▶ 聽聽看範例</button>
    </div>
  </header>

  <section class="relative z-10 max-w-6xl mx-auto px-6 pb-20">
    <div class="grid md:grid-cols-3 gap-6">
      <div class="clay p-8">
        <div class="w-16 h-16 clay-pressed rounded-full flex items-center justify-center text-3xl mb-5" style="background:var(--clay-blue);">🫧</div>
        <h3 class="display text-xl font-bold mb-2" style="color:#6b544c;">呼吸練習</h3>
        <p class="text-sm" style="color:#8a7269;">跟著會膨脹縮小的雲朵動畫，練習 4-7-8 呼吸法，兩分鐘就能感覺到心跳慢下來。</p>
      </div>
      <div class="clay p-8">
        <div class="w-16 h-16 clay-pressed rounded-full flex items-center justify-center text-3xl mb-5" style="background:var(--clay-green);">🌿</div>
        <h3 class="display text-xl font-bold mb-2" style="color:#6b544c;">情緒紀錄</h3>
        <p class="text-sm" style="color:#8a7269;">每天用一個表情記錄心情，累積成溫柔的曲線，看見自己這個月的起伏。</p>
      </div>
      <div class="clay p-8">
        <div class="w-16 h-16 clay-pressed rounded-full flex items-center justify-center text-3xl mb-5" style="background:var(--clay-purple);">🌙</div>
        <h3 class="display text-xl font-bold mb-2" style="color:#6b544c;">睡前故事</h3>
        <p class="text-sm" style="color:#8a7269;">溫柔嗓音陪你聽完一段森林散步的故事，故事還沒講完，你已經睡著了。</p>
      </div>
    </div>
  </section>

  <section class="relative z-10 max-w-4xl mx-auto px-6 pb-20">
    <div class="clay p-10 md:p-14">
      <h2 class="display text-3xl font-bold text-center mb-10" style="color:#6b544c;">今天，先從呼吸開始</h2>
      <div class="flex flex-col items-center gap-8">
        <div id="breathCircle" class="w-40 h-40 rounded-full flex items-center justify-center text-white font-bold text-lg transition-transform duration-[4000ms] ease-in-out" style="background:linear-gradient(145deg,#f6a6b2,#e08a95); box-shadow:0 10px 30px rgba(224,138,149,0.4);">
          <span id="breathLabel">吸氣</span>
        </div>
        <div class="flex gap-4">
          <button id="startBreath" class="clay-btn px-8 py-3 font-bold" style="background:var(--clay-pink); color:#6b3b3b;">開始練習</button>
          <button id="resetBreath" class="clay-btn px-8 py-3 font-bold" style="background:#ffffff; color:#8a6a5f;">重設</button>
        </div>
        <p class="text-sm" style="color:#a68f85;">圓圈放大時吸氣，縮小時吐氣，跟著節奏 3 次就好。</p>
      </div>
    </div>
  </section>

  <footer class="relative z-10 text-center pb-10 text-sm" style="color:#a68f85;">
    © 2026 棉花糖 CloudyMind ・ 溫柔對待每一個晚上
  </footer>

<script>
  const circle = document.getElementById('breathCircle');
  const label = document.getElementById('breathLabel');
  let breathing = false;
  let phase = 0;
  let timer = null;

  function step(){
    if(!breathing) return;
    if(phase % 2 === 0){
      circle.style.transform = 'scale(1.3)';
      label.textContent = '吸氣';
    } else {
      circle.style.transform = 'scale(0.85)';
      label.textContent = '吐氣';
    }
    phase++;
    timer = setTimeout(step, 4000);
  }

  document.getElementById('startBreath').addEventListener('click', () => {
    if(breathing) return;
    breathing = true;
    phase = 0;
    step();
  });

  document.getElementById('resetBreath').addEventListener('click', () => {
    breathing = false;
    clearTimeout(timer);
    circle.style.transform = 'scale(1)';
    label.textContent = '吸氣';
  });
</script>
</body>
</html>

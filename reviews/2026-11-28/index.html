<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>韡寧的 UI 待審 · 2026-11-28</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#f4f5f7; --ink:#15171c; --sub:#6b7280; --accent:#3b6df0; }
  *{ box-sizing:border-box; }
  body{ font-family:'Manrope','Noto Sans TC',sans-serif; background:var(--bg); color:var(--ink); }
  .card{ background:#fff; border-radius:18px; box-shadow:0 1px 2px rgba(15,23,42,.04), 0 10px 24px -10px rgba(15,23,42,.08); overflow:hidden; }
  .preview-wrap{ position:relative; width:100%; height:220px; overflow:hidden; background:#eceef2; }
  .preview-wrap iframe{
    width:200%; height:200%; border:0; transform:scale(.5); transform-origin:top left;
    position:absolute; top:0; left:0;
  }
  .heart-btn{ transition:transform .2s cubic-bezier(.34,1.56,.64,1), color .2s ease; font-size:1.4rem; line-height:1; }
  .heart-btn.liked{ color:#ef4444; transform:scale(1.25); }
  .open-link{ color:var(--accent); font-weight:700; }
</style>
</head>
<body>

<div class="max-w-5xl mx-auto px-5 py-8 md:py-12">
  <header class="mb-8">
    <h1 class="font-extrabold text-2xl md:text-3xl mb-1">韡寧的 UI 待審 · 2026-11-28</h1>
    <p class="text-sm text-[var(--sub)]">共 6 個風格・喜歡的按 ❤️，我會學起來</p>
  </header>

  <div class="grid grid-cols-1 md:grid-cols-2 gap-6" id="grid">

    <div class="card" data-nn="01">
      <div class="preview-wrap"><iframe src="01-micro-interactions.html" loading="lazy"></iframe></div>
      <div class="p-4 flex items-center justify-between">
        <div>
          <div class="font-bold text-sm">#16 Micro-interactions</div>
          <div class="text-xs text-[var(--sub)]">輕觸 TapHome・智慧居家控制</div>
        </div>
        <div class="flex items-center gap-3">
          <a class="open-link text-sm" href="01-micro-interactions.html" target="_blank">開啟 ↗</a>
          <button class="heart-btn" onclick="toggleLike(this,'01')">♡</button>
        </div>
      </div>
    </div>

    <div class="card" data-nn="02">
      <div class="preview-wrap"><iframe src="02-gen-z-chaos.html" loading="lazy"></iframe></div>
      <div class="p-4 flex items-center justify-between">
        <div>
          <div class="font-bold text-sm">#57 Gen Z Chaos</div>
          <div class="text-xs text-[var(--sub)]">拼圖衣櫃・二手古著接力市集</div>
        </div>
        <div class="flex items-center gap-3">
          <a class="open-link text-sm" href="02-gen-z-chaos.html" target="_blank">開啟 ↗</a>
          <button class="heart-btn" onclick="toggleLike(this,'02')">♡</button>
        </div>
      </div>
    </div>

    <div class="card" data-nn="03">
      <div class="preview-wrap"><iframe src="03-accessible-ethical.html" loading="lazy"></iframe></div>
      <div class="p-4 flex items-center justify-between">
        <div>
          <div class="font-bold text-sm">#08 Accessible / Ethical</div>
          <div class="text-xs text-[var(--sub)]">安心到訪・社區長者關懷訪視</div>
        </div>
        <div class="flex items-center gap-3">
          <a class="open-link text-sm" href="03-accessible-ethical.html" target="_blank">開啟 ↗</a>
          <button class="heart-btn" onclick="toggleLike(this,'03')">♡</button>
        </div>
      </div>
    </div>

    <div class="card" data-nn="04">
      <div class="preview-wrap"><iframe src="04-executive-dashboard.html" loading="lazy"></iframe></div>
      <div class="p-4 flex items-center justify-between">
        <div>
          <div class="font-bold text-sm">#30 Executive Summary Dashboard</div>
          <div class="text-xs text-[var(--sub)]">手搖通・連鎖飲品營運戰情室</div>
        </div>
        <div class="flex items-center gap-3">
          <a class="open-link text-sm" href="04-executive-dashboard.html" target="_blank">開啟 ↗</a>
          <button class="heart-btn" onclick="toggleLike(this,'04')">♡</button>
        </div>
      </div>
    </div>

    <div class="card" data-nn="05">
      <div class="preview-wrap"><iframe src="05-ai-native.html" loading="lazy"></iframe></div>
      <div class="p-4 flex items-center justify-between">
        <div>
          <div class="font-bold text-sm">#43 AI-Native</div>
          <div class="text-xs text-[var(--sub)]">會記 MeetNote AI・會議紀要助理</div>
        </div>
        <div class="flex items-center gap-3">
          <a class="open-link text-sm" href="05-ai-native.html" target="_blank">開啟 ↗</a>
          <button class="heart-btn" onclick="toggleLike(this,'05')">♡</button>
        </div>
      </div>
    </div>

    <div class="card" data-nn="06">
      <div class="preview-wrap"><iframe src="06-hero-centric.html" loading="lazy"></iframe></div>
      <div class="p-4 flex items-center justify-between">
        <div>
          <div class="font-bold text-sm">#20 Hero-Centric</div>
          <div class="text-xs text-[var(--sub)]">匠鍵所・機械鍵盤新品發表</div>
        </div>
        <div class="flex items-center gap-3">
          <a class="open-link text-sm" href="06-hero-centric.html" target="_blank">開啟 ↗</a>
          <button class="heart-btn" onclick="toggleLike(this,'06')">♡</button>
        </div>
      </div>
    </div>

  </div>
</div>

<script>
  const DATE = '2026-11-28';
  function toggleLike(btn, nn){
    const liked = !btn.classList.contains('liked');
    btn.classList.toggle('liked', liked);
    btn.textContent = liked ? '♥' : '♡';
    fetch(`https://b-battle-580b5-default-rtdb.firebaseio.com/uigallery/${DATE}_${nn}.json`, {
      method: 'PUT',
      body: liked ? 'true' : 'null',
    }).catch(()=>{});
  }
  fetch('https://b-battle-580b5-default-rtdb.firebaseio.com/uigallery.json')
    .then(r=>r.json())
    .then(data=>{
      if(!data) return;
      document.querySelectorAll('.card').forEach(card=>{
        const nn = card.dataset.nn;
        if(data[`${DATE}_${nn}`] === true){
          const btn = card.querySelector('.heart-btn');
          btn.classList.add('liked');
          btn.textContent = '♥';
        }
      });
    })
    .catch(()=>{});
</script>

</body>
</html>

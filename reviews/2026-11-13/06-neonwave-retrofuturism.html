<!-- style #11 Retro-Futurism -->
<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>霓虹電波 NEON WAVE FEST · 復古電子音樂祭</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Press+Start+2P&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  body{ font-family:'Orbitron','Noto Sans TC',sans-serif; background:#1a1a2e; color:#eafcff; overflow-x:hidden; }
  .px-font{ font-family:'Press Start 2P',cursive; }
  .neon-cyan{ color:#00ffff; text-shadow: 0 0 6px #00ffff, 0 0 16px #00ffff; }
  .neon-pink{ color:#ff006e; text-shadow: 0 0 6px #ff006e, 0 0 16px #ff006e; }
  .scanlines::before{
    content:''; position:absolute; inset:0; pointer-events:none;
    background: repeating-linear-gradient(0deg, rgba(255,255,255,.04) 0px, rgba(255,255,255,.04) 1px, transparent 2px, transparent 4px);
  }
  .horizon{
    background: linear-gradient(to top, #ff006e 0%, #ff006e 2%, #1a1a2e 60%);
    position:relative; overflow:hidden; height:260px; border-top:2px solid #00ffff;
  }
  .grid-floor{
    position:absolute; left:50%; bottom:0; width:200%; height:100%;
    background-image: linear-gradient(90deg, rgba(0,255,255,.5) 1px, transparent 1px), linear-gradient(0deg, rgba(0,255,255,.5) 1px, transparent 1px);
    background-size: 60px 40px;
    transform: translateX(-50%) perspective(220px) rotateX(55deg);
    animation: floor-move 1.6s linear infinite;
  }
  @keyframes floor-move { from{ background-position: 0 0; } to{ background-position: 0 40px; } }
  .sun{ position:absolute; bottom:40%; left:50%; width:140px; height:140px; border-radius:50%; transform:translateX(-50%);
    background: repeating-linear-gradient(to bottom, #ffee00, #ffee00 6px, transparent 6px, transparent 11px), radial-gradient(circle,#ffee00,#ff6b00);
  }
  .btn-neon{ border:2px solid #00ffff; box-shadow: 0 0 10px #00ffff, inset 0 0 10px rgba(0,255,255,.2); transition: all .2s ease; }
  .btn-neon:hover{ background:#00ffff; color:#1a1a2e; box-shadow: 0 0 22px #00ffff; }
  .tick{ position:absolute; width:16px; height:16px; border-color:#00ffff; }
</style>
</head>
<body class="px-5 md:px-10 py-8">

<div class="max-w-4xl mx-auto">

  <header class="flex items-center justify-between mb-8">
    <p class="px-font text-[10px] neon-cyan">NEON WAVE FEST</p>
    <p class="px-font text-[10px] neon-pink">2027.01.17-18</p>
  </header>

  <section class="relative scanlines horizon rounded-xl mb-10">
    <div class="sun"></div>
    <div class="grid-floor"></div>
    <div class="absolute inset-0 flex flex-col items-center justify-center text-center px-4">
      <h1 class="px-font text-2xl md:text-4xl neon-cyan mb-4 leading-relaxed">霓虹電波</h1>
      <p class="neon-pink text-sm md:text-base font-bold mb-2">NEON WAVE FEST · 台北港未來碼頭</p>
      <p class="text-xs md:text-sm text-cyan-100/80">合成器 · 復古電子 · 一整夜的 80s 未來感</p>
    </div>
  </section>

  <section class="grid md:grid-cols-4 gap-3 mb-10">
    <div class="border border-cyan-400/40 rounded-lg p-4 text-center">
      <p class="px-font text-xl neon-cyan" id="cdDay">--</p>
      <p class="text-[10px] text-cyan-200/60 mt-1">天</p>
    </div>
    <div class="border border-cyan-400/40 rounded-lg p-4 text-center">
      <p class="px-font text-xl neon-cyan" id="cdHour">--</p>
      <p class="text-[10px] text-cyan-200/60 mt-1">時</p>
    </div>
    <div class="border border-cyan-400/40 rounded-lg p-4 text-center">
      <p class="px-font text-xl neon-cyan" id="cdMin">--</p>
      <p class="text-[10px] text-cyan-200/60 mt-1">分</p>
    </div>
    <div class="border border-cyan-400/40 rounded-lg p-4 text-center">
      <p class="px-font text-xl neon-cyan" id="cdSec">--</p>
      <p class="text-[10px] text-cyan-200/60 mt-1">秒</p>
    </div>
  </section>

  <section class="mb-10">
    <p class="px-font text-[11px] neon-pink mb-4">// 選擇票種 TICKET TIERS</p>
    <div class="grid md:grid-cols-3 gap-4" id="ticketGrid">
      <div class="ticket-card relative border-2 border-cyan-400/50 rounded-lg p-5 cursor-pointer" onclick="pick(this,'單日票','NT$ 1,680')">
        <span class="tick absolute -top-1 -left-1 border-t-2 border-l-2"></span>
        <span class="tick absolute -bottom-1 -right-1 border-b-2 border-r-2"></span>
        <p class="font-bold mb-1">單日票</p>
        <p class="neon-cyan text-xl font-black mb-2">NT$ 1,680</p>
        <p class="text-xs text-cyan-100/70">任選一天入場</p>
      </div>
      <div class="ticket-card relative border-2 border-pink-400/60 rounded-lg p-5 cursor-pointer" onclick="pick(this,'兩日套票','NT$ 2,880')">
        <span class="tick absolute -top-1 -left-1 border-t-2 border-l-2" style="border-color:#ff006e"></span>
        <span class="tick absolute -bottom-1 -right-1 border-b-2 border-r-2" style="border-color:#ff006e"></span>
        <p class="font-bold mb-1">兩日套票</p>
        <p class="neon-pink text-xl font-black mb-2">NT$ 2,880</p>
        <p class="text-xs text-cyan-100/70">含限定周邊徽章一枚</p>
      </div>
      <div class="ticket-card relative border-2 border-yellow-300/60 rounded-lg p-5 cursor-pointer" onclick="pick(this,'VIP 前台區','NT$ 5,200')">
        <span class="tick absolute -top-1 -left-1 border-t-2 border-l-2" style="border-color:#ffee00"></span>
        <span class="tick absolute -bottom-1 -right-1 border-b-2 border-r-2" style="border-color:#ffee00"></span>
        <p class="font-bold mb-1">VIP 前台區</p>
        <p class="text-xl font-black mb-2" style="color:#ffee00; text-shadow:0 0 8px #ffee00;">NT$ 5,200</p>
        <p class="text-xs text-cyan-100/70">舞台正前方 + 專屬入場通道</p>
      </div>
    </div>
  </section>

  <section class="text-center">
    <p class="text-sm mb-3" id="pickedLabel">尚未選擇票種</p>
    <button class="btn-neon px-font text-[11px] px-8 py-4 rounded" onclick="checkout()">進入購票</button>
  </section>

</div>

<script>
const target = new Date('2027-01-17T19:00:00+08:00').getTime();
function tick(){
  const now = Date.now();
  let diff = Math.max(0, target - now);
  const day = Math.floor(diff/86400000); diff -= day*86400000;
  const hr = Math.floor(diff/3600000); diff -= hr*3600000;
  const min = Math.floor(diff/60000); diff -= min*60000;
  const sec = Math.floor(diff/1000);
  document.getElementById('cdDay').textContent = String(day).padStart(2,'0');
  document.getElementById('cdHour').textContent = String(hr).padStart(2,'0');
  document.getElementById('cdMin').textContent = String(min).padStart(2,'0');
  document.getElementById('cdSec').textContent = String(sec).padStart(2,'0');
}
tick();
setInterval(tick, 1000);

let picked = null;
function pick(card, name, price){
  document.querySelectorAll('.ticket-card').forEach(c=>c.style.background='transparent');
  card.style.background = 'rgba(0,255,255,.08)';
  picked = name + ' ' + price;
  document.getElementById('pickedLabel').textContent = '已選擇：' + picked;
}
function checkout(){
  if(!picked){
    document.getElementById('pickedLabel').textContent = '請先選擇一種票種 ↑';
    return;
  }
  document.getElementById('pickedLabel').textContent = picked + ' — 即將前往付款頁面 ⚡';
}
</script>

</body>
</html>

<!-- style #02 Neumorphism -->
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鮮凍盒 FreshBox · 冰箱食材到期提醒</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Varela+Round&family=Kosugi+Maru&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
  :root{ --bg:#e8e8e8; }
  body{ background:var(--bg); font-family:'Kosugi Maru','Varela Round',sans-serif; }
  .font-display{ font-family:'Varela Round','Kosugi Maru',sans-serif; }
  .neu-raised{
    background:var(--bg);
    border-radius:24px;
    box-shadow: 8px 8px 16px rgba(163,163,163,0.6), -8px -8px 16px rgba(255,255,255,0.8);
  }
  .neu-pressed{
    background:var(--bg);
    border-radius:20px;
    box-shadow: inset 6px 6px 12px rgba(163,163,163,0.6), inset -6px -6px 12px rgba(255,255,255,0.8);
  }
  .neu-btn{
    background:var(--bg);
    border-radius:16px;
    box-shadow: 5px 5px 10px rgba(163,163,163,0.55), -5px -5px 10px rgba(255,255,255,0.85);
    transition: all .15s ease;
  }
  .neu-btn:active{
    box-shadow: inset 4px 4px 8px rgba(163,163,163,0.6), inset -4px -4px 8px rgba(255,255,255,0.8);
  }
  .toggle-track{
    width:52px; height:28px; border-radius:999px;
    background:var(--bg);
    box-shadow: inset 4px 4px 8px rgba(163,163,163,0.6), inset -4px -4px 8px rgba(255,255,255,0.8);
    position:relative; cursor:pointer; transition:.2s;
  }
  .toggle-thumb{
    position:absolute; top:3px; left:3px; width:22px; height:22px; border-radius:50%;
    background:var(--bg);
    box-shadow: 3px 3px 6px rgba(163,163,163,0.6), -3px -3px 6px rgba(255,255,255,0.85);
    transition: left .2s ease;
  }
  .toggle-track.on .toggle-thumb{ left:27px; }
  .toggle-track.on{ box-shadow: inset 2px 2px 5px rgba(120,170,140,0.5), inset -2px -2px 5px rgba(255,255,255,0.8); }
  .fresh-icon{ width:52px; height:52px; border-radius:16px; display:flex; align-items:center; justify-content:center; font-size:24px; }
</style>
</head>
<body class="min-h-screen text-[#4a4a4a]">

  <div class="max-w-md mx-auto px-5 py-8">

    <header class="flex items-center justify-between mb-8">
      <div>
        <h1 class="font-display text-2xl text-[#4a4a4a]">鮮凍盒</h1>
        <p class="text-sm text-[#8a8a8a] mt-0.5">FreshBox · 讓冰箱不再藏驚喜</p>
      </div>
      <div class="neu-raised w-14 h-14 flex items-center justify-center text-2xl">🧊</div>
    </header>

    <section class="neu-raised p-6 mb-6">
      <p class="text-sm text-[#8a8a8a] mb-1">今天即將到期</p>
      <p class="font-display text-4xl text-[#e07a5f]" id="expiringCount">3</p>
      <p class="text-xs text-[#9a9a9a] mt-2">再撐一下，別讓食材偷偷過期了</p>
    </section>

    <section class="flex items-center justify-between mb-5 px-1">
      <h2 class="font-display text-lg">我的食材</h2>
      <button id="addBtn" class="neu-btn px-4 py-2 text-sm font-display text-[#5a8a6f]">＋ 新增食材</button>
    </section>

    <div id="foodList" class="space-y-4"></div>

    <section class="neu-raised p-5 mt-8">
      <div class="flex items-center justify-between">
        <div>
          <p class="font-display text-base">到期提醒推播</p>
          <p class="text-xs text-[#9a9a9a] mt-1">提前一天溫柔提醒你</p>
        </div>
        <div class="toggle-track on" id="notifyToggle" onclick="this.classList.toggle('on')">
          <div class="toggle-thumb"></div>
        </div>
      </div>
    </section>

    <footer class="text-center text-xs text-[#aaaaaa] mt-10">鮮凍盒 FreshBox · 讓每一口都吃在最好的時候</footer>
  </div>

<script>
const foods = [
  {icon:'🥬', name:'有機青江菜', days:1, color:'#e07a5f', status:'快過期'},
  {icon:'🥚', name:'紅殼雞蛋 一盒', days:2, color:'#e9a23b', status:'快過期'},
  {icon:'🧀', name:'切片切達起司', days:4, color:'#6b9080', status:'尚新鮮'},
  {icon:'🥛', name:'低脂鮮奶', days:1, color:'#e07a5f', status:'快過期'},
  {icon:'🍓', name:'進口草莓', days:6, color:'#6b9080', status:'尚新鮮'},
];

function render(){
  const list = document.getElementById('foodList');
  list.innerHTML = '';
  let expiring = 0;
  foods.forEach((f, idx) => {
    if (f.days <= 2) expiring++;
    const card = document.createElement('div');
    card.className = 'neu-raised p-4 flex items-center gap-4';
    card.innerHTML = `
      <div class="fresh-icon neu-pressed">${f.icon}</div>
      <div class="flex-1">
        <p class="font-display text-[15px]">${f.name}</p>
        <p class="text-xs mt-1" style="color:${f.color}">${f.status} · 剩 ${f.days} 天</p>
      </div>
      <button data-idx="${idx}" class="eatBtn neu-btn w-10 h-10 flex items-center justify-center text-sm text-[#5a8a6f]">✓</button>
    `;
    list.appendChild(card);
  });
  document.getElementById('expiringCount').textContent = expiring;

  document.querySelectorAll('.eatBtn').forEach(btn => {
    btn.addEventListener('click', () => {
      const i = Number(btn.dataset.idx);
      foods.splice(i, 1);
      render();
    });
  });
}
render();

document.getElementById('addBtn').addEventListener('click', () => {
  foods.unshift({icon:'🥦', name:'新鮮花椰菜', days:5, color:'#6b9080', status:'尚新鮮'});
  render();
});
</script>
</body>
</html>

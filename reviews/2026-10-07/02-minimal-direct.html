<!-- style #23 Minimal & Direct -->
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>語記 VoiceNote · 說話即成文字</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;500;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body{ font-family:'Noto Sans TC','Albert Sans',sans-serif; background:#f6f4ef; }
  .font-display{ font-family:'Albert Sans','Noto Sans TC',sans-serif; }
  .noise{
    position:fixed; inset:0; pointer-events:none; opacity:.35; mix-blend-mode:multiply;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='0.4'/></svg>");
  }
  .cta{ background:#1a1a1a; color:#f6f4ef; }
  .cta:hover{ background:#000; }
</style>
</head>
<body class="relative text-[#1a1a1a]">
<div class="noise"></div>

<div class="max-w-3xl mx-auto px-6 py-16 min-h-screen flex flex-col justify-between">

  <nav class="flex items-center justify-between mb-20">
    <span class="font-display font-900 text-lg tracking-tight">語記 VoiceNote</span>
    <a href="#cta" class="text-sm text-[#1a1a1a]/60 hover:text-[#1a1a1a]">立即試用 →</a>
  </nav>

  <main class="text-center">
    <p class="text-xs tracking-[0.3em] text-[#1a1a1a]/50 mb-6 font-display">一句話，一個決定</p>
    <h1 class="font-display font-900 text-[13vw] md:text-7xl leading-[0.95] mb-8">
      說出想法<br>它自己變文字
    </h1>
    <p class="text-base md:text-lg text-[#1a1a1a]/70 max-w-md mx-auto mb-10 leading-relaxed">
      會議中隨口一句、靈感來的那一秒，語記都幫你即時轉成可編輯的逐字稿。不用打字，不用等。
    </p>

    <div id="demoBox" class="max-w-md mx-auto bg-white border border-[#1a1a1a]/10 rounded-xl p-6 mb-10 text-left shadow-sm">
      <div class="flex items-center gap-3 mb-4">
        <button id="micBtn" class="w-11 h-11 rounded-full bg-[#1a1a1a] text-[#f6f4ef] flex items-center justify-center text-lg">🎙️</button>
        <p class="text-sm text-[#1a1a1a]/60" id="micLabel">按下開始錄音</p>
      </div>
      <p id="transcript" class="text-sm leading-relaxed text-[#1a1a1a]/80 min-h-[3em]">轉出來的文字會出現在這裡⋯</p>
    </div>

    <a id="cta" href="#" class="cta inline-block px-8 py-4 rounded-full font-display font-700 text-sm tracking-wide">
      免費開始使用語記
    </a>
    <p class="text-xs text-[#1a1a1a]/40 mt-4">不需要信用卡 · 隨時可取消</p>
  </main>

  <footer class="text-center text-xs text-[#1a1a1a]/40 mt-20">語記 VoiceNote © 2026</footer>
</div>

<script>
const lines = [
  '好，那我們下週三下午兩點，約在公司三樓會議室對一下進度。',
  '這個功能的優先順序要往前調，客戶那邊催得比較急。',
  '幫我記一下，週五前要把提案的簡報寄給設計部確認。'
];
let typing = false;

document.getElementById('micBtn').addEventListener('click', () => {
  if (typing) return;
  typing = true;
  const label = document.getElementById('micLabel');
  const box = document.getElementById('transcript');
  label.textContent = '錄音中⋯語記正在聆聽';
  box.textContent = '';
  const line = lines[Math.floor(Math.random() * lines.length)];
  let i = 0;
  const timer = setInterval(() => {
    box.textContent = line.slice(0, i) + '｜';
    i++;
    if (i > line.length) {
      clearInterval(timer);
      box.textContent = line;
      label.textContent = '完成，按下再試一次';
      typing = false;
    }
  }, 45);
});
</script>
</body>
</html>

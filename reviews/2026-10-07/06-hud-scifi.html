<!-- style #51 HUD / Sci-Fi -->
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鷹眼艦隊 HawkFleet · 無人機機隊監控中樞</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body{ font-family:'Share Tech Mono','Noto Sans TC',monospace; background:#050a08; color:#8fffe0; overflow-x:hidden; }
  .font-display{ font-family:'Orbitron','Noto Sans TC',sans-serif; }
  .hud-panel{
    position:relative; background: rgba(7,24,20,0.6); border:1px solid rgba(79,255,214,0.35);
    box-shadow: 0 0 18px rgba(79,255,214,0.08) inset;
  }
  .hud-panel::before, .hud-panel::after{
    content:''; position:absolute; width:14px; height:14px; border:2px solid #4fffd6;
  }
  .hud-panel::before{ top:-2px; left:-2px; border-right:none; border-bottom:none; }
  .hud-panel::after{ bottom:-2px; right:-2px; border-left:none; border-top:none; }
  .glow{ text-shadow: 0 0 8px rgba(79,255,214,0.75), 0 0 18px rgba(79,255,214,0.4); }
  .scan{ position:relative; overflow:hidden; }
  .scan::after{
    content:''; position:absolute; left:0; right:0; top:0; height:2px; background:rgba(79,255,214,0.8);
    box-shadow:0 0 10px rgba(79,255,214,0.8);
    animation: scanmove 3.2s linear infinite;
  }
  @keyframes scanmove{ 0%{ top:0; } 100%{ top:100%; } }
  .ring-bg{ stroke: rgba(79,255,214,0.15); }
  .ring-fg{ stroke:#4fffd6; stroke-linecap:round; transition: stroke-dashoffset 1s ease; }
  .drone-dot{ width:8px; height:8px; border-radius:50%; background:#4fffd6; box-shadow:0 0 8px #4fffd6; }
</style>
</head>
<body class="min-h-screen px-4 md:px-8 py-6">

<div class="max-w-6xl mx-auto">
  <header class="flex flex-wrap items-center justify-between gap-3 mb-6 pb-4 border-b border-[#4fffd6]/20">
    <h1 class="font-display glow text-xl md:text-2xl tracking-widest">鷹眼艦隊 <span class="text-sm align-middle opacity-60">HawkFleet CTRL</span></h1>
    <div class="flex items-center gap-4 text-xs">
      <span class="flex items-center gap-1"><span class="drone-dot animate-pulse"></span>系統連線正常</span>
      <span id="clock" class="font-display">00:00:00</span>
    </div>
  </header>

  <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
    <div class="hud-panel p-4">
      <p class="text-xs opacity-60 mb-1">在線機隊</p>
      <p class="font-display glow text-3xl">18<span class="text-sm opacity-50">/20</span></p>
    </div>
    <div class="hud-panel p-4">
      <p class="text-xs opacity-60 mb-1">平均電量</p>
      <p class="font-display glow text-3xl" id="batteryVal">76%</p>
    </div>
    <div class="hud-panel p-4">
      <p class="text-xs opacity-60 mb-1">巡航範圍</p>
      <p class="font-display glow text-3xl">42<span class="text-sm opacity-50">km²</span></p>
    </div>
    <div class="hud-panel p-4">
      <p class="text-xs opacity-60 mb-1">異常警報</p>
      <p class="font-display glow text-3xl text-[#ff6b6b]" id="alertVal">2</p>
    </div>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
    <div class="hud-panel scan p-5 md:col-span-2">
      <p class="font-display text-sm mb-4 tracking-widest opacity-80">即時空域掃描</p>
      <div class="relative h-64 md:h-72">
        <svg viewBox="0 0 200 200" class="absolute inset-0 w-full h-full opacity-50">
          <circle cx="100" cy="100" r="90" fill="none" stroke="#4fffd6" stroke-opacity="0.15"/>
          <circle cx="100" cy="100" r="60" fill="none" stroke="#4fffd6" stroke-opacity="0.15"/>
          <circle cx="100" cy="100" r="30" fill="none" stroke="#4fffd6" stroke-opacity="0.15"/>
          <line x1="0" y1="100" x2="200" y2="100" stroke="#4fffd6" stroke-opacity="0.1"/>
          <line x1="100" y1="0" x2="100" y2="200" stroke="#4fffd6" stroke-opacity="0.1"/>
        </svg>
        <div id="dronesLayer" class="absolute inset-0"></div>
      </div>
    </div>

    <div class="hud-panel p-5 flex flex-col items-center justify-center">
      <p class="font-display text-sm mb-4 tracking-widest opacity-80">任務完成率</p>
      <svg viewBox="0 0 120 120" width="150" height="150">
        <circle cx="60" cy="60" r="50" fill="none" stroke-width="10" class="ring-bg"/>
        <circle id="progressRing" cx="60" cy="60" r="50" fill="none" stroke-width="10" class="ring-fg"
          stroke-dasharray="314" stroke-dashoffset="314" transform="rotate(-90 60 60)"/>
        <text x="60" y="65" text-anchor="middle" fill="#8fffe0" font-size="22" font-family="Orbitron" id="progressText">0%</text>
      </svg>
      <p class="text-xs opacity-50 mt-3">本週 86 趟巡航任務</p>
    </div>
  </div>

  <div class="hud-panel p-5 mt-4">
    <p class="font-display text-sm mb-3 tracking-widest opacity-80">機隊狀態日誌</p>
    <div id="logList" class="space-y-2 text-xs max-h-40 overflow-y-auto"></div>
  </div>
</div>

<script>
function clock(){
  document.getElementById('clock').textContent = new Date().toLocaleTimeString('zh-TW', {hour12:false});
}
clock(); setInterval(clock, 1000);

const ring = document.getElementById('progressRing');
const text = document.getElementById('progressText');
let pct = 0;
const target = 86;
const anim = setInterval(() => {
  pct += 2;
  if (pct >= target) { pct = target; clearInterval(anim); }
  ring.setAttribute('stroke-dashoffset', 314 - (314 * pct / 100));
  text.textContent = pct + '%';
}, 30);

const layer = document.getElementById('dronesLayer');
const drones = [];
for (let i = 0; i < 6; i++) {
  const d = document.createElement('div');
  d.className = 'drone-dot absolute';
  layer.appendChild(d);
  drones.push(d);
}
function moveDrones(){
  drones.forEach(d => {
    d.style.left = (10 + Math.random() * 80) + '%';
    d.style.top = (10 + Math.random() * 80) + '%';
  });
}
moveDrones();
setInterval(moveDrones, 1800);

const logs = [
  '機號 HK-07 已返航，電量 88%',
  '偵測到 HK-12 訊號延遲，正在重新連線',
  '區域 C 巡航任務已完成，回傳影像 142 張',
  '機號 HK-03 電量低於 20%，建議召回',
  '新任務已派發給 HK-15、HK-09',
];
const logList = document.getElementById('logList');
function pushLog(){
  const row = document.createElement('div');
  const time = new Date().toLocaleTimeString('zh-TW', {hour12:false});
  row.className = 'flex gap-2 opacity-90';
  row.innerHTML = `<span class="opacity-40">[${time}]</span><span>${logs[Math.floor(Math.random()*logs.length)]}</span>`;
  logList.prepend(row);
  while (logList.children.length > 6) logList.removeChild(logList.lastChild);
}
pushLog();
setInterval(pushLog, 4000);

setInterval(() => {
  const b = 60 + Math.floor(Math.random() * 30);
  document.getElementById('batteryVal').textContent = b + '%';
  document.getElementById('alertVal').textContent = Math.floor(Math.random() * 4);
}, 5000);
</script>
</body>
</html>

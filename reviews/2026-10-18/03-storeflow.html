<!-- style #29 Heatmap & Density -->
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>店流通 StoreFlow · 門店人流與銷售熱力後台</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  body{ font-family:'Plus Jakarta Sans', sans-serif; background:#0f1b2e; color:#e2e8f0; }
  .mono{ font-family:'JetBrains Mono', monospace; }
  .card{ background:#162638; border:1px solid #223449; border-radius:14px; }
  .heat-cell{ aspect-ratio:1/1; border-radius:4px; }
  .pill{ border-radius:999px; }
  .scrollbar-thin::-webkit-scrollbar{ height:6px; }
  .scrollbar-thin::-webkit-scrollbar-thumb{ background:#2a4259; border-radius:3px; }
</style>
</head>
<body class="min-h-screen">

<div class="max-w-7xl mx-auto px-6 py-6">

  <div class="flex flex-wrap items-center justify-between gap-4 mb-6">
    <div>
      <h1 class="text-xl font-bold text-white">店流通 <span class="text-slate-400 font-normal">· 門店人流與銷售分析</span></h1>
      <p class="text-xs text-slate-500 mt-1 mono">更新時間 2026-10-18 09:42</p>
    </div>
    <div class="flex items-center gap-3">
      <select class="bg-[#162638] border border-[#223449] text-sm text-slate-200 rounded-lg px-3 py-2">
        <option>全門店（18 間）</option>
        <option>信義旗艦店</option>
        <option>西門町店</option>
        <option>台中大魯閣店</option>
      </select>
      <select class="bg-[#162638] border border-[#223449] text-sm text-slate-200 rounded-lg px-3 py-2">
        <option>近 7 天</option>
        <option>近 30 天</option>
        <option>本月</option>
      </select>
    </div>
  </div>

  <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
    <div class="card p-5">
      <p class="text-xs text-slate-400 mb-2">今日來客數</p>
      <p class="mono text-3xl font-bold text-white">4,286</p>
      <p class="text-xs text-emerald-400 mt-2 mono">▲ 12.4%　較上週同日</p>
    </div>
    <div class="card p-5">
      <p class="text-xs text-slate-400 mb-2">平均客單價</p>
      <p class="mono text-3xl font-bold text-white">NT$ 612</p>
      <p class="text-xs text-emerald-400 mt-2 mono">▲ 3.1%　較上週同日</p>
    </div>
    <div class="card p-5">
      <p class="text-xs text-slate-400 mb-2">轉換率</p>
      <p class="mono text-3xl font-bold text-white">38.7%</p>
      <p class="text-xs text-rose-400 mt-2 mono">▼ 1.8%　較上週同日</p>
    </div>
    <div class="card p-5">
      <p class="text-xs text-slate-400 mb-2">尖峰時段人流</p>
      <p class="mono text-3xl font-bold text-white">712 人</p>
      <p class="text-xs text-slate-400 mt-2 mono">14:00–15:00</p>
    </div>
  </div>

  <div class="card p-6 mb-6">
    <div class="flex items-center justify-between mb-5">
      <h2 class="font-semibold text-white">一週人流熱力圖 <span class="text-slate-400 text-sm font-normal">· 信義旗艦店</span></h2>
      <div class="flex items-center gap-2 text-xs text-slate-400">
        <span>低</span>
        <span class="inline-flex gap-1">
          <span class="w-4 h-4 rounded" style="background:#1e293b"></span>
          <span class="w-4 h-4 rounded" style="background:#1e4976"></span>
          <span class="w-4 h-4 rounded" style="background:#1d6fa5"></span>
          <span class="w-4 h-4 rounded" style="background:#2a9fd8"></span>
          <span class="w-4 h-4 rounded" style="background:#38bdf8"></span>
        </span>
        <span>高</span>
      </div>
    </div>
    <div class="overflow-x-auto scrollbar-thin">
      <div class="min-w-[900px]">
        <div class="grid grid-cols-[60px_repeat(24,1fr)] gap-1 mb-1">
          <div></div>
          <div class="text-[10px] mono text-slate-500 text-center" id="hourLabels"></div>
        </div>
        <div id="heatmapGrid"></div>
      </div>
    </div>
  </div>

  <div class="card p-6">
    <h2 class="font-semibold text-white mb-4">門店銷售排行榜</h2>
    <div class="overflow-x-auto scrollbar-thin">
      <table class="w-full text-sm">
        <thead>
          <tr class="text-left text-slate-400 border-b border-[#223449]">
            <th class="py-3 font-normal">排名</th>
            <th class="py-3 font-normal">門店</th>
            <th class="py-3 font-normal text-right mono">今日來客</th>
            <th class="py-3 font-normal text-right mono">今日營收</th>
            <th class="py-3 font-normal text-right mono">轉換率</th>
            <th class="py-3 font-normal text-right">趨勢</th>
          </tr>
        </thead>
        <tbody class="mono text-slate-200" id="rankBody"></tbody>
      </table>
    </div>
  </div>

</div>

<script>
  const hourLabels = document.getElementById('hourLabels');
  const hours = Array.from({length:24}, (_,i)=> (i).toString().padStart(2,'0'));
  document.querySelector('#hourLabels').parentElement.innerHTML =
    '<div></div>' + hours.map(h=>`<div class="text-[10px] mono text-slate-500 text-center">${h}</div>`).join('');

  const days = ['一','二','三','四','五','六','日'];
  const colors = ['#1e293b','#1e4976','#1d6fa5','#2a9fd8','#38bdf8'];
  function heat(day, hour){
    let base = Math.sin((hour-14)/5) * 0.5 + 0.5;
    if(hour < 10 || hour > 21) base *= 0.15;
    if(day >= 5) base *= 1.3;
    base += Math.random()*0.15;
    return Math.max(0, Math.min(1, base));
  }
  const grid = document.getElementById('heatmapGrid');
  grid.innerHTML = days.map((d, di) => {
    const cells = Array.from({length:24}, (_,hi) => {
      const v = heat(di, hi);
      const idx = Math.min(colors.length-1, Math.floor(v*colors.length));
      return `<div class="heat-cell" style="background:${colors[idx]}" title="週${d} ${hi}:00"></div>`;
    }).join('');
    return `<div class="grid grid-cols-[60px_repeat(24,1fr)] gap-1 mb-1">
      <div class="text-xs text-slate-400 flex items-center">週${d}</div>${cells}</div>`;
  }).join('');

  const stores = [
    {name:'信義旗艦店', visit:4286, rev:2621832, conv:38.7, trend:'▲'},
    {name:'西門町店', visit:3952, rev:2114400, conv:35.2, trend:'▲'},
    {name:'台中大魯閣店', visit:3410, rev:1876200, conv:33.9, trend:'▼'},
    {name:'高雄夢時代店', visit:2988, rev:1542900, conv:31.4, trend:'▲'},
    {name:'新竹巨城店', visit:2714, rev:1398600, conv:29.8, trend:'▼'},
  ];
  document.getElementById('rankBody').innerHTML = stores.map((s,i)=>`
    <tr class="border-b border-[#1c2c40]">
      <td class="py-3">${i+1}</td>
      <td class="py-3 text-slate-100" style="font-family:'Plus Jakarta Sans',sans-serif">${s.name}</td>
      <td class="py-3 text-right">${s.visit.toLocaleString()}</td>
      <td class="py-3 text-right">NT$ ${s.rev.toLocaleString()}</td>
      <td class="py-3 text-right">${s.conv}%</td>
      <td class="py-3 text-right ${s.trend==='▲' ? 'text-emerald-400' : 'text-rose-400'}">${s.trend}</td>
    </tr>
  `).join('');
</script>

</body>
</html>

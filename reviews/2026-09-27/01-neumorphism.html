<!-- style #02 Neumorphism -->
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>軟控 SoftTouch · 智慧家居控制面板</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=M+PLUS+Rounded+1c:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{ --base:#e6e7ec; --shadow-dark:#b8b9c4; --shadow-light:#ffffff; --accent:#7c83fd; }
  *{ box-sizing:border-box; }
  body{
    background:var(--base);
    font-family:'M PLUS Rounded 1c','Baloo 2',sans-serif;
    color:#3a3d4d;
    min-height:100vh;
  }
  .font-display{ font-family:'Baloo 2','M PLUS Rounded 1c',sans-serif; }
  .neu-raised{
    background:var(--base);
    border-radius:28px;
    box-shadow: 10px 10px 24px var(--shadow-dark), -10px -10px 24px var(--shadow-light);
  }
  .neu-inset{
    background:var(--base);
    border-radius:24px;
    box-shadow: inset 8px 8px 18px var(--shadow-dark), inset -8px -8px 18px var(--shadow-light);
  }
  .neu-btn{
    background:var(--base);
    border-radius:20px;
    box-shadow: 6px 6px 14px var(--shadow-dark), -6px -6px 14px var(--shadow-light);
    transition: box-shadow .15s ease, transform .15s ease;
  }
  .neu-btn:active, .neu-btn.is-active{
    box-shadow: inset 5px 5px 10px var(--shadow-dark), inset -5px -5px 10px var(--shadow-light);
    transform: scale(0.98);
  }
  .neu-toggle{
    width:56px; height:30px; border-radius:16px;
    background:var(--base);
    box-shadow: inset 5px 5px 10px var(--shadow-dark), inset -5px -5px 10px var(--shadow-light);
    position:relative; cursor:pointer;
  }
  .neu-toggle .knob{
    position:absolute; top:3px; left:3px; width:24px; height:24px; border-radius:50%;
    background:var(--base);
    box-shadow: 4px 4px 8px var(--shadow-dark), -4px -4px 8px var(--shadow-light);
    transition: left .2s ease, background .2s ease;
  }
  .neu-toggle.on{ }
  .neu-toggle.on .knob{ left:29px; background:var(--accent); box-shadow: 4px 4px 8px var(--shadow-dark), -2px -2px 6px rgba(255,255,255,.6); }
  .dial-ring{
    stroke-linecap:round;
    transition: stroke-dashoffset .4s ease;
  }
  input[type=range].neu-range{
    -webkit-appearance:none; width:100%; height:10px; border-radius:8px;
    background:var(--base);
    box-shadow: inset 4px 4px 8px var(--shadow-dark), inset -4px -4px 8px var(--shadow-light);
  }
  input[type=range].neu-range::-webkit-slider-thumb{
    -webkit-appearance:none; width:26px; height:26px; border-radius:50%;
    background:var(--accent);
    box-shadow: 3px 3px 8px var(--shadow-dark), -2px -2px 6px var(--shadow-light);
    cursor:pointer;
  }
</style>
</head>
<body class="px-4 py-8 md:py-14">
  <div class="max-w-5xl mx-auto">

    <header class="flex items-center justify-between mb-10">
      <div>
        <h1 class="font-display text-3xl md:text-4xl font-700 text-[#3a3d4d]">軟控 <span class="text-[#7c83fd]">SoftTouch</span></h1>
        <p class="text-sm md:text-base mt-1 text-[#6b6e80]">溫柔對待每一個開關</p>
      </div>
      <div class="neu-btn w-14 h-14 flex items-center justify-center text-2xl select-none">🏠</div>
    </header>

    <!-- 溫度旋鈕 + 狀態卡 -->
    <section class="grid md:grid-cols-3 gap-6 mb-8">
      <div class="neu-raised p-8 flex flex-col items-center justify-center md:col-span-1">
        <p class="text-sm text-[#6b6e80] mb-4">客廳溫度</p>
        <div class="relative w-40 h-40">
          <svg viewBox="0 0 140 140" class="w-full h-full -rotate-90">
            <circle cx="70" cy="70" r="58" fill="none" stroke="var(--shadow-dark)" stroke-width="12" opacity="0.5"/>
            <circle id="tempRing" class="dial-ring" cx="70" cy="70" r="58" fill="none" stroke="#7c83fd" stroke-width="12"
              stroke-dasharray="364" stroke-dashoffset="145"/>
          </svg>
          <div class="absolute inset-0 flex flex-col items-center justify-center">
            <span id="tempVal" class="font-display text-4xl font-700">24</span>
            <span class="text-xs text-[#6b6e80]">°C</span>
          </div>
        </div>
        <div class="flex gap-4 mt-6">
          <button onclick="changeTemp(-1)" class="neu-btn w-12 h-12 text-xl font-display">－</button>
          <button onclick="changeTemp(1)" class="neu-btn w-12 h-12 text-xl font-display">＋</button>
        </div>
      </div>

      <div class="neu-raised p-8 md:col-span-2">
        <p class="text-sm text-[#6b6e80] mb-5">今日用電概況</p>
        <div class="grid grid-cols-3 gap-4 mb-6">
          <div class="neu-inset p-4 text-center">
            <p class="font-display text-2xl font-700 text-[#7c83fd]">4.2</p>
            <p class="text-xs text-[#6b6e80] mt-1">度電</p>
          </div>
          <div class="neu-inset p-4 text-center">
            <p class="font-display text-2xl font-700 text-[#6cc79a]">－12%</p>
            <p class="text-xs text-[#6b6e80] mt-1">較昨日</p>
          </div>
          <div class="neu-inset p-4 text-center">
            <p class="font-display text-2xl font-700 text-[#f0a868]">6</p>
            <p class="text-xs text-[#6b6e80] mt-1">裝置在線</p>
          </div>
        </div>
        <div class="flex items-end gap-2 h-20">
          <div class="w-full rounded-t-lg bg-[#c7cad6]" style="height:40%"></div>
          <div class="w-full rounded-t-lg bg-[#c7cad6]" style="height:65%"></div>
          <div class="w-full rounded-t-lg bg-[#c7cad6]" style="height:50%"></div>
          <div class="w-full rounded-t-lg bg-[#7c83fd]" style="height:85%"></div>
          <div class="w-full rounded-t-lg bg-[#c7cad6]" style="height:55%"></div>
          <div class="w-full rounded-t-lg bg-[#c7cad6]" style="height:30%"></div>
          <div class="w-full rounded-t-lg bg-[#c7cad6]" style="height:45%"></div>
        </div>
        <div class="flex justify-between text-xs text-[#9498a8] mt-2 font-display">
          <span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span>
        </div>
      </div>
    </section>

    <!-- 房間切換 + 裝置開關 -->
    <section class="neu-raised p-6 md:p-8">
      <div class="flex gap-3 mb-6 overflow-x-auto pb-1" id="roomTabs">
        <button class="neu-btn is-active room-tab px-5 py-2 font-display text-sm" data-room="客廳">客廳</button>
        <button class="neu-btn room-tab px-5 py-2 font-display text-sm" data-room="臥室">臥室</button>
        <button class="neu-btn room-tab px-5 py-2 font-display text-sm" data-room="廚房">廚房</button>
        <button class="neu-btn room-tab px-5 py-2 font-display text-sm" data-room="書房">書房</button>
      </div>

      <div class="grid md:grid-cols-2 gap-4">
        <div class="neu-inset p-5 flex items-center justify-between">
          <div class="flex items-center gap-3">
            <span class="text-2xl">💡</span>
            <div>
              <p class="font-display font-600">主燈</p>
              <p class="text-xs text-[#6b6e80]">暖白 · 80% 亮度</p>
            </div>
          </div>
          <div class="neu-toggle on" onclick="this.classList.toggle('on')"><div class="knob"></div></div>
        </div>
        <div class="neu-inset p-5 flex items-center justify-between">
          <div class="flex items-center gap-3">
            <span class="text-2xl">🌬️</span>
            <div>
              <p class="font-display font-600">循環風扇</p>
              <p class="text-xs text-[#6b6e80]">中速運轉</p>
            </div>
          </div>
          <div class="neu-toggle" onclick="this.classList.toggle('on')"><div class="knob"></div></div>
        </div>
        <div class="neu-inset p-5">
          <div class="flex items-center justify-between mb-3">
            <div class="flex items-center gap-3">
              <span class="text-2xl">🔊</span>
              <p class="font-display font-600">環境音量</p>
            </div>
            <span id="volLabel" class="text-sm text-[#6b6e80] font-display">35%</span>
          </div>
          <input type="range" class="neu-range" min="0" max="100" value="35" oninput="document.getElementById('volLabel').textContent=this.value+'%'">
        </div>
        <div class="neu-inset p-5 flex items-center justify-between">
          <div class="flex items-center gap-3">
            <span class="text-2xl">🔒</span>
            <div>
              <p class="font-display font-600">玄關門鎖</p>
              <p class="text-xs text-[#6b6e80]">已上鎖 · 22:03</p>
            </div>
          </div>
          <div class="neu-toggle on" onclick="this.classList.toggle('on')"><div class="knob"></div></div>
        </div>
      </div>
    </section>

    <footer class="text-center text-xs text-[#9498a8] mt-10">軟控 SoftTouch · 讓每個按鍵都有溫度</footer>
  </div>

<script>
  let temp = 24;
  const ring = document.getElementById('tempRing');
  const val = document.getElementById('tempVal');
  const circumference = 364;
  function renderTemp(){
    val.textContent = temp;
    const pct = Math.max(0, Math.min(1, (temp-16)/(30-16)));
    ring.style.strokeDashoffset = circumference * (1-pct);
  }
  function changeTemp(d){
    temp = Math.max(16, Math.min(30, temp+d));
    renderTemp();
  }
  renderTemp();

  document.querySelectorAll('.room-tab').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      document.querySelectorAll('.room-tab').forEach(b=>b.classList.remove('is-active'));
      btn.classList.add('is-active');
    });
  });
</script>
</body>
</html>

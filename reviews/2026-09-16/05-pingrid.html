<!-- style #39 Bento Box -->
<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>拼格 PinGrid</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  body{ background:#f2f0ea; color:#22221f; font-family:'Noto Sans TC','Plus Jakarta Sans',sans-serif; }
  .ui{ font-family:'Plus Jakarta Sans','Noto Sans TC',sans-serif; }
  .cell{ background:#fff; border-radius:20px; border:1px solid #e8e5db; }
</style>
</head>
<body>

<header class="max-w-5xl mx-auto px-6 pt-10 flex items-center justify-between">
  <div>
    <p class="ui font-800 text-xl">拼格 <span class="text-[#8a7ee8]">PinGrid</span></p>
    <p class="text-xs text-[#8a8578] mt-1">2026 年 9 月 16 日 · 星期三</p>
  </div>
  <div class="w-10 h-10 rounded-full bg-[#8a7ee8] flex items-center justify-center text-white ui font-700 text-sm">韡</div>
</header>

<main class="max-w-5xl mx-auto px-6 py-8">
  <div class="grid grid-cols-4 md:grid-cols-6 gap-4 auto-rows-[110px]">

    <div class="cell col-span-4 md:col-span-3 row-span-2 p-6 flex flex-col justify-between">
      <div>
        <p class="ui text-xs text-[#8a8578]">今日待辦</p>
        <p class="ui font-700 text-lg mt-1">4 項任務，2 項已完成</p>
      </div>
      <ul class="space-y-2 mt-3">
        <li class="flex items-center gap-2 text-sm ui"><span class="w-4 h-4 rounded-full bg-[#8a7ee8]"></span><span class="line-through text-[#a8a496]">確認季度提案簡報</span></li>
        <li class="flex items-center gap-2 text-sm ui"><span class="w-4 h-4 rounded-full bg-[#8a7ee8]"></span><span class="line-through text-[#a8a496]">回覆客戶合約信件</span></li>
        <li class="flex items-center gap-2 text-sm ui"><span class="w-4 h-4 rounded-full border-2 border-[#d8d4c6]"></span><span>整理下週會議資料</span></li>
        <li class="flex items-center gap-2 text-sm ui"><span class="w-4 h-4 rounded-full border-2 border-[#d8d4c6]"></span><span>健身房 · 18:30</span></li>
      </ul>
    </div>

    <div class="cell col-span-2 row-span-2 p-6 flex flex-col items-center justify-center">
      <svg width="92" height="92" viewBox="0 0 92 92">
        <circle cx="46" cy="46" r="38" fill="none" stroke="#eeece4" stroke-width="10"/>
        <circle cx="46" cy="46" r="38" fill="none" stroke="#8a7ee8" stroke-width="10" stroke-linecap="round"
          stroke-dasharray="238.7" stroke-dashoffset="52" transform="rotate(-90 46 46)"/>
      </svg>
      <p class="ui font-800 text-lg mt-2">連續 18 天</p>
      <p class="text-xs text-[#8a8578]">晨間書寫習慣</p>
    </div>

    <div class="cell col-span-2 row-span-1 p-5">
      <p class="ui text-xs text-[#8a8578]">本週專注時數</p>
      <p class="ui font-800 text-2xl mt-1">14.5<span class="text-sm text-[#8a8578]"> 小時</span></p>
    </div>

    <div class="cell col-span-2 row-span-1 p-5 bg-[#eef0ea]">
      <p class="ui text-xs text-[#6c7a5c]">今日心情</p>
      <p class="ui font-700 text-lg mt-1">🌤️ 平穩、有點期待</p>
    </div>

    <div class="cell col-span-4 md:col-span-2 row-span-2 p-6">
      <p class="ui text-xs text-[#8a8578] mb-3">即將到來</p>
      <div class="space-y-3">
        <div class="flex justify-between text-sm ui"><span class="text-[#8a7ee8] font-600">10:00</span><span>產品週會</span></div>
        <div class="flex justify-between text-sm ui"><span class="text-[#8a7ee8] font-600">14:30</span><span>與設計團隊對稿</span></div>
        <div class="flex justify-between text-sm ui"><span class="text-[#8a7ee8] font-600">18:30</span><span>健身房</span></div>
      </div>
    </div>

    <div class="cell col-span-2 row-span-1 p-5">
      <p class="ui text-xs text-[#8a8578]">最近筆記</p>
      <p class="ui text-sm mt-2">「色塊島的兒童配色邏輯可以借用到新版引導流程」</p>
    </div>

    <div class="cell col-span-2 row-span-1 p-5 flex flex-col justify-center">
      <p class="ui text-xs text-[#8a8578]">本月閱讀</p>
      <p class="ui font-800 text-2xl mt-1">3<span class="text-sm text-[#8a8578]"> / 5 本</span></p>
    </div>

    <div class="cell col-span-4 md:col-span-6 row-span-1 p-5 flex items-center justify-between bg-[#2b2a27]">
      <p class="ui text-white text-sm">把想法拼進格子裡，一天就有形狀了。</p>
      <button class="ui text-xs bg-white text-[#2b2a27] px-4 py-2 rounded-full font-700">新增一格 +</button>
    </div>

  </div>
</main>

<footer class="text-center text-xs text-[#a8a496] pb-10 ui">PinGrid © 2026</footer>

</body>
</html>

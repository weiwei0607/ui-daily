<!-- style #40 Y2K Revival -->
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>電子寵 e-Pet ｜ Y2K 數位寵物養成</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Chakra+Petch:ital,wght@0,300;0,400;0,500;0,600;0,700;1,500&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
  :root{
    --magenta:#ff00ff;
    --cyan:#00ffff;
    --yellow:#ffff00;
    --chrome-1:#eceef2;
    --chrome-2:#9aa0ab;
    --chrome-3:#4b4e57;
    --bg-deep:#0a0118;
    --bg-deep-2:#180a2e;
    --card-bg:rgba(20, 8, 36, 0.72);
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    min-height:100%;
    font-family:'Chakra Petch','Noto Sans TC',sans-serif;
    background:var(--bg-deep);
    color:#f2f2f8;
    overflow-x:hidden;
  }
  body{
    position:relative;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:28px 14px;
    background:
      radial-gradient(circle at 20% 10%, rgba(255,0,255,0.18), transparent 45%),
      radial-gradient(circle at 85% 15%, rgba(0,255,255,0.16), transparent 45%),
      radial-gradient(circle at 50% 100%, rgba(255,255,0,0.08), transparent 55%),
      linear-gradient(160deg, var(--bg-deep) 0%, var(--bg-deep-2) 55%, #05010c 100%);
  }

  /* ---------- 千禧網格背景 ---------- */
  .grid-floor{
    position:fixed;
    left:0; right:0; bottom:0;
    height:55vh;
    perspective:280px;
    overflow:hidden;
    z-index:0;
    pointer-events:none;
    mask-image:linear-gradient(to top, rgba(0,0,0,0.85), transparent);
  }
  .grid-floor::before{
    content:"";
    position:absolute;
    left:-50%; right:-50%; top:0; bottom:-100%;
    background-image:
      repeating-linear-gradient(to right, rgba(0,255,255,0.45) 0 2px, transparent 2px 64px),
      repeating-linear-gradient(to bottom, rgba(255,0,255,0.35) 0 2px, transparent 2px 64px);
    transform:rotateX(72deg);
    animation:gridMove 6s linear infinite;
  }
  @keyframes gridMove{ from{background-position:0 0, 0 0;} to{background-position:0 0, 0 64px;} }

  /* ---------- 星芒裝飾 ---------- */
  .sparkle{
    position:fixed;
    width:18px; height:18px;
    z-index:1;
    pointer-events:none;
    background:
      linear-gradient(to right, transparent 45%, currentColor 45%, currentColor 55%, transparent 55%),
      linear-gradient(to bottom, transparent 45%, currentColor 45%, currentColor 55%, transparent 55%);
    opacity:.85;
    animation:twinkle 2.4s ease-in-out infinite;
  }
  .sparkle::before{
    content:"";
    position:absolute; inset:0;
    background:
      linear-gradient(45deg, transparent 47%, currentColor 47%, currentColor 53%, transparent 53%),
      linear-gradient(-45deg, transparent 47%, currentColor 47%, currentColor 53%, transparent 53%);
    opacity:.55;
  }
  @keyframes twinkle{
    0%,100%{ transform:scale(0.6) rotate(0deg); opacity:.35; }
    50%{ transform:scale(1.25) rotate(25deg); opacity:1; }
  }
  .s1{ top:8%; left:9%;  color:var(--magenta); animation-delay:.1s; }
  .s2{ top:14%; right:12%; color:var(--cyan);   animation-delay:.5s; width:26px; height:26px;}
  .s3{ top:62%; left:5%;  color:var(--yellow);  animation-delay:1s; width:14px; height:14px;}
  .s4{ top:78%; right:8%; color:var(--magenta); animation-delay:1.4s; width:22px; height:22px;}
  .s5{ top:40%; right:4%; color:var(--cyan);    animation-delay:.8s; width:12px; height:12px;}

  /* ---------- 鉻合金金屬漸層文字 ---------- */
  .chrome-text{
    font-family:'Audiowide','Chakra Petch',sans-serif;
    background:linear-gradient(105deg,
      #7d7f88 0%, #ffffff 18%, #b9bcc6 32%,
      #45474f 48%, #ffffff 62%, #9a9da7 78%, #eef0f5 100%);
    background-size:220% 100%;
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    -webkit-text-fill-color:transparent;
    animation:chromeShine 4.5s linear infinite;
    filter:drop-shadow(0 2px 6px rgba(0,0,0,0.6));
  }
  @keyframes chromeShine{
    0%{ background-position:0% 50%; }
    100%{ background-position:220% 50%; }
  }

  .neon-cyan{
    color:#aefcff;
    text-shadow:
      0 0 4px #00ffff,
      0 0 10px #00ffff,
      0 0 22px rgba(0,255,255,0.8),
      0 0 40px rgba(0,255,255,0.5);
  }
  .neon-magenta{
    color:#ffd6ff;
    text-shadow:
      0 0 4px #ff00ff,
      0 0 10px #ff00ff,
      0 0 22px rgba(255,0,255,0.8);
  }

  /* ---------- 霓虹發光卡片 ---------- */
  .y2k-card{
    position:relative;
    z-index:2;
    width:100%;
    max-width:420px;
    border-radius:28px;
    background:var(--card-bg);
    backdrop-filter:blur(6px);
    border:1px solid rgba(255,255,255,0.18);
    box-shadow:
      0 0 0 1px rgba(255,255,255,0.08) inset,
      0 0 25px rgba(255,0,255,0.35),
      0 0 55px rgba(0,255,255,0.25),
      0 20px 60px rgba(0,0,0,0.55);
    padding:22px 20px 26px;
    overflow:hidden;
  }
  .y2k-card::before{
    content:"";
    position:absolute;
    inset:-2px;
    border-radius:30px;
    padding:2px;
    background:linear-gradient(120deg, var(--magenta), var(--cyan), var(--yellow), var(--magenta));
    background-size:300% 300%;
    -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;
    mask-composite:exclude;
    opacity:.55;
    animation:borderSpin 7s linear infinite;
    pointer-events:none;
  }
  @keyframes borderSpin{
    0%{ background-position:0% 50%; }
    100%{ background-position:300% 50%; }
  }

  /* ---------- 螢幕區（養成畫面）---------- */
  .pet-screen{
    position:relative;
    border-radius:20px;
    background:
      radial-gradient(circle at 50% 20%, rgba(0,255,255,0.12), transparent 60%),
      linear-gradient(180deg, #0c0320 0%, #140a2a 100%);
    border:2px solid rgba(154,160,171,0.55);
    box-shadow:inset 0 0 25px rgba(0,255,255,0.15), inset 0 0 50px rgba(255,0,255,0.08);
    padding:26px 16px 18px;
    display:flex;
    flex-direction:column;
    align-items:center;
    min-height:260px;
  }
  .pet-screen::after{
    content:"";
    position:absolute; inset:0;
    background:repeating-linear-gradient(to bottom, rgba(255,255,255,0.025) 0 2px, transparent 2px 4px);
    border-radius:20px;
    pointer-events:none;
  }

  .pet-idle-wrap{
    animation:idleBounce 1.7s ease-in-out infinite;
    position:relative;
  }
  @keyframes idleBounce{
    0%,100%{ transform:translateY(0); }
    50%{ transform:translateY(-9px); }
  }

  .pet-body{
    position:relative;
    width:120px;
    height:120px;
    background:
      radial-gradient(circle at 32% 28%, #ffffff 0%, #ff8dfa 18%, var(--magenta) 46%, #8a00c2 78%, #3a0a52 100%);
    clip-path:polygon(
      50% 0%, 75% 0%, 75% 6%, 87% 6%, 87% 12%, 94% 12%, 94% 25%,
      100% 25%, 100% 75%, 94% 75%, 94% 88%, 87% 88%, 87% 94%,
      75% 94%, 75% 100%, 25% 100%, 25% 94%, 13% 94%, 13% 88%,
      6% 88%, 6% 75%, 0% 75%, 0% 25%, 6% 25%, 6% 12%,
      13% 12%, 13% 6%, 25% 6%, 25% 0%
    );
    box-shadow:0 0 18px rgba(255,0,255,0.65), 0 0 40px rgba(0,255,255,0.3), 0 10px 20px rgba(0,0,0,0.5);
    transition:filter .2s ease;
  }
  .pet-body.pet-jump{
    animation:bigJump .55s ease-out;
  }
  @keyframes bigJump{
    0%{ transform:translateY(0) scale(1,1); }
    30%{ transform:translateY(-26px) scale(1.08,0.9); }
    60%{ transform:translateY(0) scale(0.92,1.1); }
    100%{ transform:translateY(0) scale(1,1); }
  }
  .pet-eye{
    position:absolute;
    width:11px; height:14px;
    background:#1a0a22;
    border-radius:2px;
    top:46px;
    box-shadow:inset -2px -2px 0 rgba(255,255,255,0.15);
  }
  .pet-eye::after{
    content:"";
    position:absolute;
    width:4px; height:4px;
    background:#fff;
    top:2px; left:1px;
    border-radius:1px;
  }
  .pet-eye.left{ left:34px; }
  .pet-eye.right{ right:34px; }
  .pet-mouth{
    position:absolute;
    width:22px; height:7px;
    left:50%;
    top:72px;
    transform:translateX(-50%);
    background:#1a0a22;
    border-radius:0 0 10px 10px;
  }
  .pet-antenna{
    position:absolute;
    top:-20px;
    left:50%;
    transform:translateX(-50%);
    width:3px;
    height:20px;
    background:linear-gradient(to bottom, var(--chrome-1), var(--chrome-3));
  }
  .pet-antenna::after{
    content:"";
    position:absolute;
    top:-9px; left:50%;
    transform:translateX(-50%);
    width:11px; height:11px;
    border-radius:50%;
    background:var(--yellow);
    box-shadow:0 0 8px var(--yellow), 0 0 16px rgba(255,255,0,0.8);
    animation:blinkTip 1.3s ease-in-out infinite;
  }
  @keyframes blinkTip{
    0%,100%{ opacity:1; }
    50%{ opacity:.35; }
  }

  .heart-layer{
    position:absolute;
    inset:0;
    pointer-events:none;
    overflow:visible;
  }
  .heart{
    position:absolute;
    bottom:60%;
    left:50%;
    font-size:20px;
    color:#ff4fe0;
    text-shadow:0 0 6px #ff00ff, 0 0 12px #ff00ff;
    animation:heartRise 1.1s ease-out forwards;
  }
  @keyframes heartRise{
    0%{ transform:translate(-50%,0) scale(0.6); opacity:1; }
    70%{ opacity:1; }
    100%{ transform:translate(var(--drift,0px),-90px) scale(1.15); opacity:0; }
  }

  .pet-shadow{
    width:70px; height:14px;
    border-radius:50%;
    background:radial-gradient(ellipse at center, rgba(0,255,255,0.45), transparent 75%);
    margin-top:6px;
    filter:blur(1px);
  }

  .speech-bubble{
    margin-top:14px;
    min-height:20px;
    font-size:12.5px;
    letter-spacing:.02em;
    color:#d9f7ff;
    text-align:center;
    padding:0 10px;
  }

  /* ---------- 狀態條 ---------- */
  .stat-row{ margin-bottom:12px; }
  .stat-label{
    display:flex;
    justify-content:space-between;
    font-size:12px;
    font-family:'Chakra Petch',sans-serif;
    letter-spacing:.04em;
    margin-bottom:4px;
    color:#e4e6f5;
  }
  .stat-label b{ font-weight:600; }
  .stat-track{
    position:relative;
    height:14px;
    border-radius:7px;
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.22);
    overflow:hidden;
    box-shadow:inset 0 2px 4px rgba(0,0,0,0.5);
  }
  .stat-fill{
    height:100%;
    border-radius:7px;
    transition:width .6s cubic-bezier(.34,1.56,.64,1);
    position:relative;
  }
  .fill-hunger{ background:linear-gradient(90deg,#ff00ff,#ff7af0,#00ffff); box-shadow:0 0 10px rgba(255,0,255,0.8); }
  .fill-happy{  background:linear-gradient(90deg,#ffff00,#ff9df5,#ff00ff); box-shadow:0 0 10px rgba(255,255,0,0.8); }
  .fill-clean{  background:linear-gradient(90deg,#00ffff,#e9fdff,#00c8ff); box-shadow:0 0 10px rgba(0,255,255,0.8); }
  .stat-fill.pulse{ animation:fillPulse .5s ease; }
  @keyframes fillPulse{
    0%{ filter:brightness(1); }
    40%{ filter:brightness(1.9) saturate(1.4); }
    100%{ filter:brightness(1); }
  }

  /* ---------- 按鈕 ---------- */
  .btn-y2k{
    font-family:'Chakra Petch',sans-serif;
    font-weight:600;
    letter-spacing:.06em;
    font-size:13px;
    color:#1a0a2a;
    padding:10px 6px;
    border-radius:12px;
    border:1px solid rgba(255,255,255,0.5);
    background:linear-gradient(145deg, var(--chrome-1), var(--chrome-2) 45%, var(--chrome-3) 100%);
    box-shadow:0 4px 0 rgba(0,0,0,0.35), 0 0 14px rgba(255,255,255,0.25);
    transition:transform .12s ease, box-shadow .12s ease;
    cursor:pointer;
  }
  .btn-y2k span{ display:block; font-size:16px; margin-bottom:2px; }
  .btn-y2k:active{
    transform:translateY(3px);
    box-shadow:0 1px 0 rgba(0,0,0,0.35);
  }
  .btn-feed{ background:linear-gradient(145deg,#fff3c2, var(--yellow) 50%, #b8a500); }
  .btn-play{ background:linear-gradient(145deg,#ffd6ff, var(--magenta) 55%, #820082); color:#fff; }
  .btn-bath{ background:linear-gradient(145deg,#d6ffff, var(--cyan) 55%, #007d82); color:#042426; }

  .mood-chip{
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-size:11px;
    letter-spacing:.08em;
    padding:4px 10px;
    border-radius:999px;
    border:1px solid rgba(255,255,255,0.3);
    background:rgba(255,255,255,0.06);
  }
  .mood-dot{
    width:7px; height:7px;
    border-radius:50%;
    background:var(--cyan);
    box-shadow:0 0 6px var(--cyan);
  }
</style>
</head>
<body>

  <div class="grid-floor"></div>
  <div class="sparkle s1"></div>
  <div class="sparkle s2"></div>
  <div class="sparkle s3"></div>
  <div class="sparkle s4"></div>
  <div class="sparkle s5"></div>

  <main class="y2k-card">
    <!-- 頂部標題 -->
    <div class="text-center mb-4 relative z-10">
      <h1 class="chrome-text text-4xl sm:text-5xl tracking-wider">電子寵 e-Pet</h1>
      <p class="neon-cyan mt-1 text-xs sm:text-sm font-semibold" style="font-family:'Chakra Petch',sans-serif; letter-spacing:.25em;">
        Y2K DIGITAL PET SYSTEM
      </p>
      <p class="text-[11px] mt-2 text-white/60">1999 復古電子雞魂 × 千禧螢幕養成計畫</p>
    </div>

    <!-- 養成畫面 -->
    <section class="pet-screen relative z-10">
      <div class="pet-idle-wrap" id="petIdleWrap">
        <div class="pet-body" id="petBody">
          <div class="pet-antenna"></div>
          <div class="pet-eye left"></div>
          <div class="pet-eye right"></div>
          <div class="pet-mouth"></div>
          <div class="heart-layer" id="heartLayer"></div>
        </div>
      </div>
      <div class="pet-shadow"></div>
      <div class="speech-bubble" id="speechBubble">嗨，我是你的電子寵！快來照顧我吧 ♡</div>

      <div class="mt-3">
        <span class="mood-chip"><span class="mood-dot" id="moodDot"></span><span id="moodText">狀態穩定</span></span>
      </div>
    </section>

    <!-- 狀態條 -->
    <section class="mt-5 relative z-10">
      <div class="stat-row">
        <div class="stat-label"><b>飽食度</b><span id="val-hunger">60</span></div>
        <div class="stat-track"><div class="stat-fill fill-hunger" id="bar-hunger" style="width:60%"></div></div>
      </div>
      <div class="stat-row">
        <div class="stat-label"><b>快樂度</b><span id="val-happy">70</span></div>
        <div class="stat-track"><div class="stat-fill fill-happy" id="bar-happy" style="width:70%"></div></div>
      </div>
      <div class="stat-row">
        <div class="stat-label"><b>清潔度</b><span id="val-clean">55</span></div>
        <div class="stat-track"><div class="stat-fill fill-clean" id="bar-clean" style="width:55%"></div></div>
      </div>
    </section>

    <!-- 互動按鈕 -->
    <section class="grid grid-cols-3 gap-3 mt-5 relative z-10">
      <button class="btn-y2k btn-feed" id="btnFeed"><span>🍖</span>餵食</button>
      <button class="btn-y2k btn-play" id="btnPlay"><span>🎮</span>玩耍</button>
      <button class="btn-y2k btn-bath" id="btnBath"><span>🛁</span>洗澡</button>
    </section>

    <p class="text-center text-[10px] text-white/40 mt-4 relative z-10">記得定時照顧，狀態會隨時間慢慢下降喔</p>
  </main>

<script>
  const state = { hunger: 60, happy: 70, clean: 55 };

  const els = {
    hunger: document.getElementById('bar-hunger'),
    happy:  document.getElementById('bar-happy'),
    clean:  document.getElementById('bar-clean'),
    vHunger: document.getElementById('val-hunger'),
    vHappy:  document.getElementById('val-happy'),
    vClean:  document.getElementById('val-clean'),
    petBody: document.getElementById('petBody'),
    heartLayer: document.getElementById('heartLayer'),
    speech: document.getElementById('speechBubble'),
    moodText: document.getElementById('moodText'),
    moodDot: document.getElementById('moodDot')
  };

  function clamp(v){ return Math.max(0, Math.min(100, Math.round(v))); }

  function render(){
    els.hunger.style.width = state.hunger + '%';
    els.happy.style.width  = state.happy  + '%';
    els.clean.style.width  = state.clean  + '%';
    els.vHunger.textContent = state.hunger;
    els.vHappy.textContent  = state.happy;
    els.vClean.textContent  = state.clean;
    updateMood();
  }

  function pulse(barEl){
    barEl.classList.remove('pulse');
    void barEl.offsetWidth; // 重新觸發動畫
    barEl.classList.add('pulse');
    setTimeout(() => barEl.classList.remove('pulse'), 520);
  }

  function jumpPet(){
    els.petBody.classList.remove('pet-jump');
    void els.petBody.offsetWidth;
    els.petBody.classList.add('pet-jump');
    setTimeout(() => els.petBody.classList.remove('pet-jump'), 560);
  }

  function spawnHearts(count){
    for (let i = 0; i < count; i++){
      const h = document.createElement('div');
      h.className = 'heart';
      h.textContent = '♥';
      const drift = (Math.random() * 60 - 30).toFixed(0) + 'px';
      h.style.setProperty('--drift', drift);
      h.style.left = (46 + Math.random() * 10) + '%';
      h.style.animationDelay = (i * 0.12) + 's';
      els.heartLayer.appendChild(h);
      setTimeout(() => h.remove(), 1300 + i * 120);
    }
  }

  function say(text){
    els.speech.style.opacity = 0;
    setTimeout(() => {
      els.speech.textContent = text;
      els.speech.style.opacity = 1;
    }, 150);
  }

  function updateMood(){
    const avg = (state.hunger + state.happy + state.clean) / 3;
    let text = '狀態穩定';
    let color = '#00ffff';
    if (avg >= 80){ text = '狀態極佳'; color = '#ffff00'; }
    else if (avg >= 55){ text = '狀態穩定'; color = '#00ffff'; }
    else if (avg >= 30){ text = '有點需要照顧'; color = '#ff00ff'; }
    else { text = '快不行了，快照顧我！'; color = '#ff3b3b'; }
    els.moodText.textContent = text;
    els.moodDot.style.background = color;
    els.moodDot.style.boxShadow = '0 0 6px ' + color;
  }

  function feed(){
    state.hunger = clamp(state.hunger + 22);
    state.happy  = clamp(state.happy + 5);
    render();
    pulse(els.hunger);
    jumpPet();
    spawnHearts(2);
    say('大口大口吃，肚子好滿足的樣子！');
  }

  function play(){
    state.happy  = clamp(state.happy + 20);
    state.hunger = clamp(state.hunger - 6);
    state.clean  = clamp(state.clean - 6);
    render();
    pulse(els.happy);
    jumpPet();
    spawnHearts(3);
    say('陪牠玩了一輪，開心地跳來跳去！');
  }

  function bath(){
    state.clean = clamp(state.clean + 25);
    state.happy = clamp(state.happy + 4);
    render();
    pulse(els.clean);
    jumpPet();
    spawnHearts(1);
    say('洗得乾乾淨淨，全身閃閃發亮！');
  }

  document.getElementById('btnFeed').addEventListener('click', feed);
  document.getElementById('btnPlay').addEventListener('click', play);
  document.getElementById('btnBath').addEventListener('click', bath);

  // 隨時間緩慢下降，模擬真實養成節奏
  setInterval(() => {
    state.hunger = clamp(state.hunger - 1);
    state.happy  = clamp(state.happy - 1);
    state.clean  = clamp(state.clean - 1);
    render();
  }, 20000);

  render();
</script>
</body>
</html>

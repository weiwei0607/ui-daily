<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>韡寧的 UI 待審 · 2026-09-23</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  body{font-family:'Noto Sans TC',sans-serif;background:#f4f3f0;color:#1a1a1a;}
  .frame-wrap{
    position:relative; width:100%; padding-top:62.5%;
    overflow:hidden; border-radius:12px; background:#e8e6e0;
    border:1px solid #ddd;
  }
  .frame-wrap iframe{
    position:absolute; top:0; left:0;
    width:200%; height:200%;
    transform:scale(.5); transform-origin:top left;
    border:0; pointer-events:none;
  }
  .card{background:#fff; border:1px solid #e5e3de; border-radius:16px; box-shadow:0 1px 3px rgba(0,0,0,.05);}
  .heart-btn{transition:transform .15s ease;}
  .heart-btn:active{transform:scale(1.3);}
  .heart-btn.liked{filter:none;}
</style>
</head>
<body class="min-h-screen">

  <header class="max-w-5xl mx-auto px-6 pt-10 pb-6">
    <h1 class="text-2xl md:text-3xl font-black mb-2">韡寧的 UI 待審 · 2026-09-23</h1>
    <p class="text-gray-500 text-sm">本輪 6 個風格方向，點卡片右上角 ❤️ 表示喜歡，我會記起來下次多做這種。</p>
  </header>

  <main class="max-w-5xl mx-auto px-6 pb-20 grid grid-cols-1 md:grid-cols-2 gap-6" id="grid"></main>

  <footer class="text-center text-gray-400 text-sm pb-10">
    © 2026 UI Daily
  </footer>

<script>
  const DATE = "2026-09-23";
  const items = [
    { id:"01", file:"01-zero-interface.html", name:"Zero Interface", sub:"留白 Blank" },
    { id:"02", file:"02-neubrutalism.html", name:"Neubrutalism", sub:"重拍 Backbeat" },
    { id:"03", file:"03-parallax-storytelling.html", name:"Parallax Storytelling", sub:"南街茶號" },
    { id:"04", file:"04-predictive-dashboard.html", name:"Predictive Dashboard", sub:"先知 Prescient" },
    { id:"05", file:"05-flat-design.html", name:"Flat Design 2.0", sub:"小步 LittleStep" },
    { id:"06", file:"06-hud-scifi.html", name:"HUD / Sci-Fi", sub:"深空站 DeepStation" },
  ];

  const grid = document.getElementById('grid');
  const FIREBASE_BASE = "https://b-battle-580b5-default-rtdb.firebaseio.com/uigallery";

  function keyFor(id){ return DATE + "_" + id; }

  function render(likedMap){
    grid.innerHTML = '';
    items.forEach(item=>{
      const key = keyFor(item.id);
      const liked = !!likedMap[key];
      const card = document.createElement('div');
      card.className = 'card p-4';
      card.innerHTML = `
        <div class="frame-wrap mb-3">
          <iframe src="${item.file}" loading="lazy"></iframe>
        </div>
        <div class="flex items-center justify-between">
          <div>
            <p class="font-bold text-sm">#${item.id} ${item.name}</p>
            <p class="text-gray-500 text-xs mt-0.5">${item.sub}</p>
          </div>
          <div class="flex items-center gap-3">
            <a href="${item.file}" target="_blank" class="text-sm text-indigo-600 hover:text-indigo-800 font-medium whitespace-nowrap">開啟 ↗</a>
            <button class="heart-btn text-2xl" data-key="${key}" aria-label="喜歡">${liked ? '❤️' : '🤍'}</button>
          </div>
        </div>
      `;
      grid.appendChild(card);
    });

    document.querySelectorAll('.heart-btn').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        const key = btn.dataset.key;
        const nowLiked = btn.textContent.trim() === '🤍';
        btn.textContent = nowLiked ? '❤️' : '🤍';
        try{
          await fetch(`${FIREBASE_BASE}/${key}.json`, {
            method: 'PUT',
            body: JSON.stringify(nowLiked)
          });
        }catch(e){
          console.warn('無法連線到收藏伺服器', e);
        }
      });
    });
  }

  fetch(`${FIREBASE_BASE}.json`)
    .then(r=>r.json())
    .then(data=>{
      render(data || {});
    })
    .catch(()=>{
      render({});
    });
</script>
</body>
</html>

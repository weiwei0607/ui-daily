<!-- style #33 Comparative Dashboard -->
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>方案脈動 PlanPulse｜會員方案比較後台</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  body{font-family:'Noto Sans TC','Instrument Sans',sans-serif; background:#f4f5f7; color:#161a22;}
  .disp{font-family:'Instrument Sans','Noto Sans TC',sans-serif;}
  .mono{font-family:'JetBrains Mono',monospace;}
  .base-col{box-shadow:0 0 0 2px #2563eb inset;}
  .diff-pos{color:#0a9d5c;}
  .diff-neg{color:#dc3b3b;}
  th,td{transition:background .2s ease;}
</style>
</head>
<body>

<div class="max-w-6xl mx-auto px-5 py-8">
  <div class="flex items-center justify-between mb-6">
    <div>
      <h1 class="disp text-xl font-bold">方案脈動 PlanPulse</h1>
      <p class="text-xs text-black/40 mono">會員方案績效比較 · 點任一方案欄設為比較基準</p>
    </div>
    <div class="flex gap-2 bg-white rounded-lg p-1 border border-black/10">
      <button id="btn-month" class="px-3 py-1.5 rounded-md text-sm disp font-semibold bg-[#161a22] text-white">月繳</button>
      <button id="btn-year" class="px-3 py-1.5 rounded-md text-sm disp font-semibold text-black/50">年繳</button>
    </div>
  </div>

  <div class="grid grid-cols-2 sm:grid-cols-4 gap-4 mb-8">
    <div class="bg-white rounded-xl p-4 border border-black/5">
      <p class="text-xs text-black/40">目前比較基準</p>
      <p class="disp font-bold text-lg mt-1" id="kpi-base">單人輕鬆方案</p>
    </div>
    <div class="bg-white rounded-xl p-4 border border-black/5">
      <p class="text-xs text-black/40">總會員數</p>
      <p class="mono font-bold text-lg mt-1">3,842</p>
    </div>
    <div class="bg-white rounded-xl p-4 border border-black/5">
      <p class="text-xs text-black/40">平均續約率</p>
      <p class="mono font-bold text-lg mt-1">78.4%</p>
    </div>
    <div class="bg-white rounded-xl p-4 border border-black/5">
      <p class="text-xs text-black/40">本月新增方案異動</p>
      <p class="mono font-bold text-lg mt-1">+126</p>
    </div>
  </div>

  <div class="bg-white rounded-xl border border-black/5 overflow-x-auto">
    <table class="w-full text-sm">
      <thead>
        <tr class="text-left text-black/40 text-xs">
          <th class="px-5 py-3 font-medium">指標</th>
        </tr>
      </thead>
      <tbody id="plan-table"></tbody>
    </table>
  </div>

  <p class="text-xs text-black/40 mt-4 mono">差異百分比以目前比較基準方案計算，藍框為比較基準欄</p>
</div>

<script>
const plans = [
  {id:'light', name:'單人輕鬆方案', members:1620, priceM:990, priceY:9900, churn:24.1, conv:12.4, arpu:1180},
  {id:'standard', name:'標準全館方案', members:1340, priceM:1490, priceY:14900, churn:17.8, conv:18.6, arpu:1640},
  {id:'premium', name:'尊享教練方案', members:612, priceM:3200, priceY:32000, churn:9.2, conv:26.1, arpu:3680},
  {id:'duo', name:'雙人共享方案', members:270, priceM:2480, priceY:24800, churn:15.6, conv:21.3, arpu:2740},
];

const metrics = [
  {key:'members', label:'會員人數', fmt:v=>v.toLocaleString(), unit:''},
  {key:'price', label:'月均客單價', fmt:v=>`NT$ ${v.toLocaleString()}`, unit:'' },
  {key:'churn', label:'月流失率', fmt:v=>`${v}%`, unit:'%', invert:true},
  {key:'conv', label:'體驗轉正式轉換率', fmt:v=>`${v}%`, unit:'%'},
  {key:'arpu', label:'每人平均貢獻 ARPU', fmt:v=>`NT$ ${v.toLocaleString()}`, unit:''},
];

let baseId = 'light';
let billing = 'month';

function priceOf(p){ return billing === 'month' ? p.priceM : p.priceY; }

function renderTable(){
  const table = document.getElementById('plan-table');
  const base = plans.find(p=>p.id===baseId);
  document.getElementById('kpi-base').textContent = base.name;

  let html = `<tr class="text-black/40 text-xs border-t border-black/5">
      <th class="px-5 py-3 text-left font-medium">方案（點選設為基準）</th>
      ${plans.map(p=>`<th class="px-5 py-3 text-left cursor-pointer disp font-bold text-black ${p.id===baseId?'base-col':''}" data-plan="${p.id}">${p.name}</th>`).join('')}
    </tr>`;

  metrics.forEach(m=>{
    html += `<tr class="border-t border-black/5"><td class="px-5 py-3 text-black/50">${m.label}</td>`;
    plans.forEach(p=>{
      const val = m.key === 'price' ? priceOf(p) : p[m.key];
      const baseVal = m.key === 'price' ? priceOf(base) : base[m.key];
      let diffHtml = '';
      if(p.id !== baseId && baseVal !== 0){
        const diff = ((val - baseVal) / baseVal * 100);
        const good = m.invert ? diff < 0 : diff > 0;
        diffHtml = `<span class="mono text-xs ml-2 ${good?'diff-pos':'diff-neg'}">${diff>0?'+':''}${diff.toFixed(1)}%</span>`;
      }
      html += `<td class="px-5 py-3 mono ${p.id===baseId?'base-col font-bold':''}" data-plan="${p.id}">${m.fmt(val)}${diffHtml}</td>`;
    });
    html += `</tr>`;
  });

  table.innerHTML = html;
}

document.getElementById('plan-table').addEventListener('click', e=>{
  const cell = e.target.closest('[data-plan]');
  if(!cell) return;
  baseId = cell.dataset.plan;
  renderTable();
});

document.getElementById('btn-month').addEventListener('click', ()=>{
  billing = 'month';
  document.getElementById('btn-month').className = 'px-3 py-1.5 rounded-md text-sm disp font-semibold bg-[#161a22] text-white';
  document.getElementById('btn-year').className = 'px-3 py-1.5 rounded-md text-sm disp font-semibold text-black/50';
  renderTable();
});
document.getElementById('btn-year').addEventListener('click', ()=>{
  billing = 'year';
  document.getElementById('btn-year').className = 'px-3 py-1.5 rounded-md text-sm disp font-semibold bg-[#161a22] text-white';
  document.getElementById('btn-month').className = 'px-3 py-1.5 rounded-md text-sm disp font-semibold text-black/50';
  renderTable();
});

renderTable();
</script>

</body>
</html>

<!-- style #35 User Behavior -->
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>行為透鏡 BehaviorLens · 使用者行為分析儀表板</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body{ font-family:'Hanken Grotesk','Noto Sans TC',sans-serif; background:#f4f5f7; color:#111827; }
  .mono{ font-family:'JetBrains Mono',monospace; }
  .card{ background:#fff; border:1px solid #e5e7eb; border-radius:14px; }
  .up{ color:#059669; } .down{ color:#dc2626; }
  .range-btn.active{ background:#111827; color:#fff; }
  .funnel-bar{ transition: width 1s cubic-bezier(.2,.8,.2,1); }
  .path-node{ background:#eef2ff; border:1px solid #c7d2fe; }
</style>
</head>
<body class="min-h-screen">

<div class="max-w-6xl mx-auto px-5 py-8">
  <header class="flex items-center justify-between mb-6 flex-wrap gap-3">
    <div>
      <h1 class="text-2xl font-extrabold">行為透鏡 BehaviorLens</h1>
      <p class="text-gray-500 text-sm mt-1">看懂用戶從點進來到留下來的每一步</p>
    </div>
    <div class="flex gap-2 text-sm font-bold" id="rangeToggle">
      <button class="range-btn px-3 py-1.5 rounded-full bg-gray-200" data-range="7">近 7 日</button>
      <button class="range-btn active px-3 py-1.5 rounded-full bg-gray-200" data-range="30">近 30 日</button>
    </div>
  </header>

  <section class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
    <div class="card p-4">
      <p class="text-xs text-gray-500">活躍用戶</p>
      <p class="text-2xl font-extrabold mono mt-1" id="kpi-dau">48,210</p>
      <p class="text-xs up mt-1">▲ 12.4% 較前期</p>
    </div>
    <div class="card p-4">
      <p class="text-xs text-gray-500">平均停留時間</p>
      <p class="text-2xl font-extrabold mono mt-1" id="kpi-time">6 分 42 秒</p>
      <p class="text-xs up mt-1">▲ 3.1% 較前期</p>
    </div>
    <div class="card p-4">
      <p class="text-xs text-gray-500">7 日留存率</p>
      <p class="text-2xl font-extrabold mono mt-1" id="kpi-retention">34.8%</p>
      <p class="text-xs down mt-1">▼ 1.6% 較前期</p>
    </div>
    <div class="card p-4">
      <p class="text-xs text-gray-500">流失用戶</p>
      <p class="text-2xl font-extrabold mono mt-1" id="kpi-churn">2,980</p>
      <p class="text-xs down mt-1">▼ 5.0% 較前期</p>
    </div>
  </section>

  <section class="grid grid-cols-1 lg:grid-cols-5 gap-5 mb-6">
    <div class="card p-5 lg:col-span-3">
      <p class="font-bold mb-4">轉換漏斗 · 註冊 → 七日留存</p>
      <div class="space-y-3" id="funnel"></div>
    </div>

    <div class="card p-5 lg:col-span-2">
      <p class="font-bold mb-4">留存曲線（本週 vs 上週）</p>
      <svg viewBox="0 0 280 150" class="w-full">
        <line x1="0" y1="130" x2="280" y2="130" stroke="#e5e7eb"/>
        <polyline points="0,20 56,55 112,78 168,92 224,100 280,105" fill="none" stroke="#4f46e5" stroke-width="2.5"/>
        <polyline points="0,20 56,65 112,95 168,112 224,122 280,128" fill="none" stroke="#c7d2fe" stroke-width="2.5" stroke-dasharray="4 3"/>
      </svg>
      <div class="flex gap-4 text-xs mt-2">
        <span class="flex items-center gap-1"><span class="w-3 h-3 rounded-full inline-block" style="background:#4f46e5;"></span>本週</span>
        <span class="flex items-center gap-1"><span class="w-3 h-3 rounded-full inline-block" style="background:#c7d2fe;"></span>上週</span>
      </div>
    </div>
  </section>

  <section class="card p-5">
    <p class="font-bold mb-4">常見使用路徑（點擊節點看轉換率）</p>
    <div class="flex items-center gap-2 overflow-x-auto pb-2" id="pathFlow">
      <span class="path-node px-4 py-2 rounded-lg font-semibold whitespace-nowrap cursor-pointer" data-rate="100%">首頁</span>
      <span class="text-gray-400">→</span>
      <span class="path-node px-4 py-2 rounded-lg font-semibold whitespace-nowrap cursor-pointer" data-rate="68%">商品列表</span>
      <span class="text-gray-400">→</span>
      <span class="path-node px-4 py-2 rounded-lg font-semibold whitespace-nowrap cursor-pointer" data-rate="41%">商品詳情</span>
      <span class="text-gray-400">→</span>
      <span class="path-node px-4 py-2 rounded-lg font-semibold whitespace-nowrap cursor-pointer" data-rate="22%">加入購物車</span>
      <span class="text-gray-400">→</span>
      <span class="path-node px-4 py-2 rounded-lg font-semibold whitespace-nowrap cursor-pointer" data-rate="14%">完成結帳</span>
    </div>
    <p id="pathRate" class="mono text-sm text-indigo-600 font-bold mt-3">點擊上方任一節點查看該步驟轉換率</p>
  </section>
</div>

<script>
  const funnelData = [
    {label:'註冊帳號', value:100, count:'12,480'},
    {label:'完成新手導覽', value:72, count:'8,985'},
    {label:'首次建立專案', value:51, count:'6,365'},
    {label:'首次邀請成員', value:33, count:'4,118'},
    {label:'七日後仍活躍', value:21, count:'2,621'},
  ];
  const funnel = document.getElementById('funnel');
  funnelData.forEach((d,i)=>{
    const row = document.createElement('div');
    row.innerHTML = `
      <div class="flex justify-between text-sm mb-1">
        <span class="font-semibold">${d.label}</span>
        <span class="mono text-gray-500">${d.count} · ${d.value}%</span>
      </div>
      <div class="w-full bg-gray-100 rounded-full h-3">
        <div class="funnel-bar h-3 rounded-full" style="width:0%; background:${i===0?'#4f46e5':'#818cf8'};"></div>
      </div>`;
    funnel.appendChild(row);
  });
  requestAnimationFrame(()=>{
    document.querySelectorAll('.funnel-bar').forEach((bar,i)=>{
      setTimeout(()=>{ bar.style.width = funnelData[i].value + '%'; }, 80*i);
    });
  });

  document.querySelectorAll('#pathFlow .path-node').forEach(node=>{
    node.addEventListener('click', ()=>{
      document.querySelectorAll('#pathFlow .path-node').forEach(n=>n.style.background='');
      node.style.background = '#c7d2fe';
      document.getElementById('pathRate').textContent = `「${node.textContent}」步驟轉換率：${node.dataset.rate}`;
    });
  });

  const kpis7 = {dau:'13,940', time:'5 分 58 秒', retention:'37.2%', churn:'890'};
  const kpis30 = {dau:'48,210', time:'6 分 42 秒', retention:'34.8%', churn:'2,980'};
  document.querySelectorAll('#rangeToggle .range-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      document.querySelectorAll('#rangeToggle .range-btn').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      const data = btn.dataset.range === '7' ? kpis7 : kpis30;
      document.getElementById('kpi-dau').textContent = data.dau;
      document.getElementById('kpi-time').textContent = data.time;
      document.getElementById('kpi-retention').textContent = data.retention;
      document.getElementById('kpi-churn').textContent = data.churn;
    });
  });
</script>

</body>
</html>

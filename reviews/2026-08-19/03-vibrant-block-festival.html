<!-- style #06 Vibrant Block -->
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>浪潮音樂節 · 售票平台</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800;900&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  body{font-family:'DM Sans', sans-serif; background:#0d0d0f; color:#fff;}
  .display{font-family:'Unbounded', sans-serif;}
  .block-cyan{background:#00e5ff;}
  .block-purple{background:#bf00ff;}
  .block-green{background:#39ff14;}
  .block-pink{background:#ff1493;}
  .block-yellow{background:#ffe600;}
  .hard-edge{border:4px solid #0d0d0f;}
  .stripe-title{
    background: repeating-linear-gradient(45deg, #ffe600, #ffe600 12px, #0d0d0f 12px, #0d0d0f 24px);
  }
</style>
</head>
<body class="min-h-screen">

  <header class="flex items-center justify-between px-6 md:px-12 py-6 border-b-4 border-white/10">
    <div class="display text-2xl font-black tracking-tight">浪潮<span class="block-cyan text-[#0d0d0f] px-2 ml-1">音樂節</span></div>
    <nav class="hidden md:flex items-center gap-8 text-sm font-bold uppercase tracking-wide">
      <a href="#" class="hover:text-[#00e5ff]">陣容</a>
      <a href="#" class="hover:text-[#bf00ff]">場地</a>
      <a href="#" class="hover:text-[#39ff14]">票種</a>
    </nav>
    <button class="block-yellow text-[#0d0d0f] font-black px-5 py-2.5 uppercase text-sm hard-edge">立即購票</button>
  </header>

  <main class="px-6 md:px-12">
    <section class="grid md:grid-cols-2 gap-0 mt-8 mb-10">
      <div class="block-purple hard-edge p-8 md:p-12 flex flex-col justify-center">
        <span class="text-xs font-black uppercase tracking-widest mb-4">2026.11.14 – 11.16 · 高雄流行音樂中心</span>
        <h1 class="display text-4xl md:text-6xl font-black leading-[0.95] mb-6">
          三天三夜<br>不停不睡
        </h1>
        <p class="text-white/90 mb-7 leading-relaxed">40 組樂團、2 個舞台、一整片海邊草地。今年浪潮音樂節，帶著帳篷來就對了。</p>
        <div class="flex gap-3">
          <button class="block-yellow text-[#0d0d0f] font-black px-6 py-3 hard-edge">搶三日通行證</button>
          <button class="bg-transparent border-2 border-white font-bold px-6 py-3">看完整陣容</button>
        </div>
      </div>
      <div class="grid grid-cols-2 grid-rows-2 hard-edge">
        <div class="block-cyan hard-edge flex flex-col justify-end p-5">
          <span class="display text-3xl font-black text-[#0d0d0f]">40+</span>
          <span class="text-xs font-bold text-[#0d0d0f] uppercase">參演樂團</span>
        </div>
        <div class="block-pink hard-edge flex flex-col justify-end p-5">
          <span class="display text-3xl font-black text-[#0d0d0f]">3</span>
          <span class="text-xs font-bold text-[#0d0d0f] uppercase">舞台日夜不停</span>
        </div>
        <div class="block-green hard-edge flex flex-col justify-end p-5">
          <span class="display text-3xl font-black text-[#0d0d0f]">12萬</span>
          <span class="text-xs font-bold text-[#0d0d0f] uppercase">去年參與人次</span>
        </div>
        <div class="block-yellow hard-edge flex flex-col justify-end p-5">
          <span class="display text-3xl font-black text-[#0d0d0f]">24H</span>
          <span class="text-xs font-bold text-[#0d0d0f] uppercase">海邊營地開放</span>
        </div>
      </div>
    </section>

    <section class="mb-10">
      <div class="stripe-title h-3 mb-6"></div>
      <h2 class="display text-2xl md:text-3xl font-black mb-6">今年主打陣容</h2>
      <div class="grid md:grid-cols-4 gap-4">
        <div class="block-pink hard-edge p-5">
          <div class="text-xs font-black uppercase mb-2 text-[#0d0d0f]">週五 · 主舞台</div>
          <div class="display text-xl font-black text-[#0d0d0f]">深海魚群</div>
        </div>
        <div class="block-cyan hard-edge p-5">
          <div class="text-xs font-black uppercase mb-2 text-[#0d0d0f]">週六 · 主舞台</div>
          <div class="display text-xl font-black text-[#0d0d0f]">午夜方糖</div>
        </div>
        <div class="block-green hard-edge p-5">
          <div class="text-xs font-black uppercase mb-2 text-[#0d0d0f]">週六 · 電子舞台</div>
          <div class="display text-xl font-black text-[#0d0d0f]">霓虹貓</div>
        </div>
        <div class="block-yellow hard-edge p-5">
          <div class="text-xs font-black uppercase mb-2 text-[#0d0d0f]">週日 · 壓軸</div>
          <div class="display text-xl font-black text-[#0d0d0f]">浪人樂團</div>
        </div>
      </div>
    </section>

    <section class="block-purple hard-edge p-8 md:p-12 mb-12 text-center">
      <h2 class="display text-2xl md:text-4xl font-black mb-4">早鳥票只到本週五</h2>
      <p class="text-white/90 mb-7">三日通行證現省 NT$1,200，含免費營地與接駁車。</p>
      <button class="block-yellow text-[#0d0d0f] font-black px-8 py-4 text-lg hard-edge">馬上搶票</button>
    </section>
  </main>

  <footer class="border-t-4 border-white/10 px-6 md:px-12 py-6 text-center text-xs font-bold uppercase tracking-widest text-white/50">
    浪潮音樂節 WAVE FEST © 2026
  </footer>

</body>
</html>

<!-- style #34 Predictive Dashboard -->
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智補 SmartRestock｜零售庫存預測儀表板</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  body{ font-family:'Noto Sans TC','Work Sans',sans-serif; background:#f8fafc; }
  .font-display{ font-family:'Work Sans','Noto Sans TC',sans-serif; }
  .mono{ font-family:'Space Mono',monospace; }
  .predicted{ border: 2px dashed #a855f7; }
  .actual{ border: 2px solid #3b82f6; }
  .card{ background:#fff; border:1px solid #e2e8f0; }
</style>
</head>
<body class="min-h-screen text-slate-800">
  <div class="flex">
    <aside class="w-56 bg-slate-900 text-slate-300 min-h-screen hidden md:flex flex-col py-6 px-4">
      <p class="font-display font-bold text-white text-lg mb-8">智補 <span class="text-purple-400">SmartRestock</span></p>
      <nav class="space-y-1 text-sm">
        <a class="block px-3 py-2 rounded bg-slate-800 text-white font-display font-medium">總覽</a>
        <a class="block px-3 py-2 rounded hover:bg-slate-800 transition">門市庫存</a>
        <a class="block px-3 py-2 rounded hover:bg-slate-800 transition">補貨建議</a>
        <a class="block px-3 py-2 rounded hover:bg-slate-800 transition">供應商</a>
      </nav>
    </aside>

    <main class="flex-1 p-6 md:p-8">
      <div class="flex items-center justify-between mb-6">
        <div>
          <h1 class="font-display text-2xl font-bold">需求預測總覽</h1>
          <p class="text-slate-500 text-sm mt-1">虛線框為 AI 預測值，實線框為實際數據</p>
        </div>
        <select class="border rounded-lg px-3 py-2 text-sm font-display">
          <option>全部門市</option>
          <option>台北旗艦店</option>
          <option>台中門市</option>
        </select>
      </div>

      <div class="grid md:grid-cols-4 gap-4 mb-6">
        <div class="card actual rounded-xl p-5">
          <p class="text-slate-500 text-xs font-display">本週實際銷量</p>
          <p class="mono text-2xl font-bold text-blue-600 mt-2">12,480</p>
        </div>
        <div class="card predicted rounded-xl p-5">
          <p class="text-slate-500 text-xs font-display">下週預測銷量</p>
          <p class="mono text-2xl font-bold text-purple-600 mt-2">13,920</p>
        </div>
        <div class="card actual rounded-xl p-5">
          <p class="text-slate-500 text-xs font-display">目前庫存總量</p>
          <p class="mono text-2xl font-bold text-blue-600 mt-2">8,214</p>
        </div>
        <div class="card predicted rounded-xl p-5">
          <p class="text-slate-500 text-xs font-display">預估缺貨風險</p>
          <p class="mono text-2xl font-bold text-rose-500 mt-2">3 項 SKU</p>
        </div>
      </div>

      <div class="card rounded-xl p-6 mb-6">
        <div class="flex items-center justify-between mb-4">
          <h2 class="font-display font-bold">銷量趨勢（實際 vs 預測）</h2>
          <div class="flex items-center gap-4 text-xs font-display">
            <span class="flex items-center gap-1"><span class="w-3 h-3 rounded-full bg-blue-500 inline-block"></span>實際</span>
            <span class="flex items-center gap-1"><span class="w-3 h-3 rounded-full border-2 border-dashed border-purple-500 inline-block"></span>預測</span>
          </div>
        </div>
        <svg viewBox="0 0 600 180" class="w-full h-48">
          <polyline points="0,120 80,100 160,90 240,70 320,60 400,50" fill="none" stroke="#3b82f6" stroke-width="3"/>
          <polyline points="400,50 460,42 520,30 600,20" fill="none" stroke="#a855f7" stroke-width="3" stroke-dasharray="6,6"/>
          <circle cx="400" cy="50" r="5" fill="#334155"/>
          <text x="405" y="45" font-size="11" fill="#64748b" font-family="Space Mono">今天</text>
        </svg>
      </div>

      <div class="card rounded-xl p-6">
        <h2 class="font-display font-bold mb-4">補貨建議清單</h2>
        <table class="w-full text-sm">
          <thead>
            <tr class="text-left text-slate-400 font-display border-b">
              <th class="py-2">商品</th>
              <th class="py-2">目前庫存</th>
              <th class="py-2">預測需求</th>
              <th class="py-2">建議動作</th>
            </tr>
          </thead>
          <tbody id="tableBody">
            <tr class="border-b">
              <td class="py-3 font-display">有機燕麥奶 1L</td>
              <td class="py-3 mono">142</td>
              <td class="py-3 mono text-purple-600">410</td>
              <td class="py-3"><button onclick="markOrdered(this)" class="bg-rose-100 text-rose-600 px-3 py-1 rounded-full text-xs font-display font-semibold hover:bg-rose-200 transition">急需補貨</button></td>
            </tr>
            <tr class="border-b">
              <td class="py-3 font-display">無糖氣泡水 500ml</td>
              <td class="py-3 mono">980</td>
              <td class="py-3 mono text-purple-600">1,020</td>
              <td class="py-3"><button onclick="markOrdered(this)" class="bg-amber-100 text-amber-600 px-3 py-1 rounded-full text-xs font-display font-semibold hover:bg-amber-200 transition">建議補貨</button></td>
            </tr>
            <tr>
              <td class="py-3 font-display">冷凍手工水餃</td>
              <td class="py-3 mono">560</td>
              <td class="py-3 mono text-purple-600">540</td>
              <td class="py-3"><span class="bg-emerald-100 text-emerald-600 px-3 py-1 rounded-full text-xs font-display font-semibold">庫存充足</span></td>
            </tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <script>
    function markOrdered(btn){
      btn.textContent = '✓ 已排單補貨';
      btn.className = 'bg-slate-200 text-slate-500 px-3 py-1 rounded-full text-xs font-display font-semibold cursor-default';
      btn.onclick = null;
    }
  </script>
</body>
</html>

<!-- style #57 Gen Z Chaos -->
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>迷因罐 MemeJar｜把今天的笑點都醃起來</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  body{ font-family:'Noto Sans TC','Space Mono',sans-serif; background:#fffbe8; color:#1a1a1a; overflow-x:hidden; }
  .mono{ font-family:'Space Mono',monospace; }
  .chaos-font{ font-family:'Noto Sans TC',sans-serif; font-weight:900; }
  .sticker{ border:3px solid #1a1a1a; box-shadow: 6px 6px 0 #1a1a1a; }
  .tilt-1{ transform: rotate(-3deg); }
  .tilt-2{ transform: rotate(2deg); }
  .tilt-3{ transform: rotate(-1.5deg); }
  .dashed{ border: 3px dashed #1a1a1a; }
  .wiggle:hover{ animation: wiggle .4s ease-in-out; }
  @keyframes wiggle{ 0%,100%{transform:rotate(0);} 25%{transform:rotate(-4deg);} 75%{transform:rotate(4deg);} }
  .marquee2{ display:flex; animation: scrollChaos 15s linear infinite; }
  @keyframes scrollChaos{ 0%{transform:translateX(0);} 100%{transform:translateX(-50%);} }
  .confetti{ position:absolute; font-size:1.4rem; animation: fall 3s linear forwards; }
  @keyframes fall{ 0%{transform:translateY(-20px) rotate(0);opacity:1;} 100%{transform:translateY(300px) rotate(360deg);opacity:0;} }
</style>
</head>
<body class="min-h-screen relative">

  <div class="bg-[#1a1a1a] text-[#ffe66d] overflow-hidden py-2">
    <div class="marquee2 whitespace-nowrap chaos-font text-sm">
      <span class="px-6">⚡今日迷因上架 238 則⚡</span>
      <span class="px-6">🫙罐子已醃 10,482 個笑話🫙</span>
      <span class="px-6">🔥 #辦公室日常 衝上熱門榜 🔥</span>
      <span class="px-6">⚡今日迷因上架 238 則⚡</span>
      <span class="px-6">🫙罐子已醃 10,482 個笑話🫙</span>
      <span class="px-6">🔥 #辦公室日常 衝上熱門榜 🔥</span>
    </div>
  </div>

  <header class="max-w-6xl mx-auto px-6 pt-8 flex items-center justify-between">
    <span class="chaos-font text-2xl tilt-1 inline-block">迷因罐<span class="text-[#ff6b6b]">MemeJar</span></span>
    <button class="sticker tilt-2 bg-[#4ecdc4] px-5 py-2 chaos-font text-sm wiggle">+ 醃一則迷因</button>
  </header>

  <main class="max-w-6xl mx-auto px-6 pt-10 pb-20 relative">
    <section class="text-center relative">
      <h1 class="chaos-font text-4xl md:text-6xl leading-tight">
        把今天的笑點<br><span class="bg-[#ffe66d] px-3 tilt-1 inline-block">通通醃起來</span>
      </h1>
      <p class="mono mt-5 max-w-lg mx-auto">// 沒有演算法，只有亂序出現的快樂。隨便滑，隨便笑。</p>
      <button onclick="shake()" class="sticker tilt-1 bg-[#ff6b6b] text-white chaos-font px-8 py-4 mt-8 wiggle">搖一搖罐子 🫙</button>
    </section>

    <section id="jarArea" class="relative mt-16 grid md:grid-cols-3 gap-7">
      <div class="sticker tilt-2 bg-white p-5" id="meme1">
        <div class="dashed h-36 flex items-center justify-center chaos-font text-3xl bg-[#a388ee]/20">😭📈</div>
        <p class="chaos-font text-sm mt-3">月初發願 vs 月底帳戶</p>
        <div class="flex items-center justify-between mt-3">
          <button onclick="react(this,'😂')" class="mono text-xs sticker px-2 py-1 bg-[#ffe66d]">😂 <span class="cnt">842</span></button>
          <span class="mono text-xs">#社畜共鳴</span>
        </div>
      </div>
      <div class="sticker tilt-1 bg-white p-5" id="meme2">
        <div class="dashed h-36 flex items-center justify-center chaos-font text-3xl bg-[#4ecdc4]/20">🤡💻</div>
        <p class="chaos-font text-sm mt-3">「等一下 push 就好」6 小時後</p>
        <div class="flex items-center justify-between mt-3">
          <button onclick="react(this,'💀')" class="mono text-xs sticker px-2 py-1 bg-[#ffe66d]">💀 <span class="cnt">1203</span></button>
          <span class="mono text-xs">#工程師日常</span>
        </div>
      </div>
      <div class="sticker tilt-3 bg-white p-5" id="meme3">
        <div class="dashed h-36 flex items-center justify-center chaos-font text-3xl bg-[#ff6b6b]/20">🐸☕</div>
        <p class="chaos-font text-sm mt-3">星期一的我 vs 咖啡因還沒生效</p>
        <div class="flex items-center justify-between mt-3">
          <button onclick="react(this,'🔥')" class="mono text-xs sticker px-2 py-1 bg-[#ffe66d]">🔥 <span class="cnt">567</span></button>
          <span class="mono text-xs">#星期一限定</span>
        </div>
      </div>
    </section>

    <section class="mt-16 text-center">
      <button onclick="loadMore()" class="sticker tilt-2 bg-[#a388ee] text-white chaos-font px-8 py-4 wiggle">再醃一波進來！</button>
    </section>
  </main>

  <script>
    const extras = [
      ['😵‍💫🎉','週五下午 vs 老闆突然說要開會','#週五魔咒'],
      ['🧋📉','手搖飲喝了三杯 vs 體重機數字','#人生好難'],
      ['🐢📨','等客戶回訊息的速度','#已讀不回']
    ];
    function react(btn, emoji){
      const span = btn.querySelector('.cnt');
      span.textContent = parseInt(span.textContent)+1;
      btn.classList.add('bg-[#ff6b6b]','text-white');
      spawnConfetti(btn);
    }
    function spawnConfetti(el){
      const rect = el.getBoundingClientRect();
      const c = document.createElement('div');
      c.className = 'confetti';
      c.textContent = '🎊';
      c.style.left = (rect.left + window.scrollX) + 'px';
      c.style.top = (rect.top + window.scrollY - 10) + 'px';
      document.body.appendChild(c);
      setTimeout(()=>c.remove(), 3000);
    }
    function shake(){
      document.getElementById('jarArea').classList.add('wiggle');
      setTimeout(()=>document.getElementById('jarArea').classList.remove('wiggle'), 400);
    }
    let idx = 0;
    function loadMore(){
      if(idx>=extras.length) return;
      const [emoji, text, tag] = extras[idx++];
      const tilt = ['tilt-1','tilt-2','tilt-3'][idx%3];
      const div = document.createElement('div');
      div.className = `sticker ${tilt} bg-white p-5`;
      div.innerHTML = `<div class="dashed h-36 flex items-center justify-center chaos-font text-3xl bg-[#ffe66d]/30">${emoji}</div>
        <p class="chaos-font text-sm mt-3">${text}</p>
        <div class="flex items-center justify-between mt-3">
          <button onclick="react(this,'😂')" class="mono text-xs sticker px-2 py-1 bg-[#ffe66d]">😂 <span class="cnt">0</span></button>
          <span class="mono text-xs">${tag}</span>
        </div>`;
      document.getElementById('jarArea').appendChild(div);
    }
  </script>
</body>
</html>

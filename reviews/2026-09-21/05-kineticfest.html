<!-- style #48 Kinetic Typography -->
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>躍動祭 KineticFest · 街頭舞蹈大賽售票</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  body{
    font-family:'Noto Sans TC',sans-serif;
    background:#0d0d0d;
    color:#f5f5f0;
    overflow-x:hidden;
  }
  .display{
    font-family:'Bebas Neue','Noto Sans TC',sans-serif;
    letter-spacing:0.02em;
  }
  .marquee-track{
    display:flex;
    white-space:nowrap;
    animation: scroll-left 16s linear infinite;
  }
  @keyframes scroll-left{
    from{ transform: translateX(0); }
    to{ transform: translateX(-50%); }
  }
  .huge{
    font-size: clamp(3rem, 12vw, 9rem);
    line-height: 0.92;
  }
  .word-pop{
    display:inline-block;
    opacity:0;
    transform: translateY(40px) scale(0.9);
    animation: pop-in 0.6s cubic-bezier(.2,.9,.3,1) forwards;
  }
  @keyframes pop-in{
    to{ opacity:1; transform: translateY(0) scale(1); }
  }
  .accent{ color:#ffe14d; }
  .pulse-word{
    display:inline-block;
    animation: word-pulse 2.4s ease-in-out infinite;
  }
  @keyframes word-pulse{
    0%,100%{ transform: scale(1); }
    50%{ transform: scale(1.06); }
  }
  .ticket-btn{
    transition: transform .15s ease, letter-spacing .15s ease;
  }
  .ticket-btn:hover{
    transform: skewX(-4deg) scale(1.03);
    letter-spacing:0.08em;
  }
  .type-line{
    border-right: 3px solid #ffe14d;
    white-space: nowrap;
    overflow: hidden;
    width: 0;
    animation: typing 3s steps(20,end) forwards, blink .8s step-end infinite;
  }
  @keyframes typing{ to{ width: 100%; } }
  @keyframes blink{ 50%{ border-color: transparent; } }
  .count-num{ font-variant-numeric: tabular-nums; }
</style>
</head>
<body>

<div class="border-b-2 border-[#ffe14d] py-2 overflow-hidden">
  <div class="marquee-track display text-xl">
    <span class="px-6">🔥 2026 躍動祭 KINETICFEST</span>
    <span class="px-6 accent">早鳥票倒數中</span>
    <span class="px-6">全台最大街舞對抗賽</span>
    <span class="px-6">🔥 2026 躍動祭 KINETICFEST</span>
    <span class="px-6 accent">早鳥票倒數中</span>
    <span class="px-6">全台最大街舞對抗賽</span>
  </div>
</div>

<header class="max-w-6xl mx-auto px-6 py-6 flex items-center justify-between">
  <p class="display text-2xl tracking-wider">KINETIC<span class="accent">FEST</span></p>
  <a href="#tickets" class="ticket-btn border-2 border-[#ffe14d] text-[#ffe14d] px-5 py-2 font-bold display text-lg">搶票入場</a>
</header>

<main class="max-w-6xl mx-auto px-6">

  <section class="py-14 text-center">
    <p class="display huge">
      <span class="word-pop" style="animation-delay:0.05s">身體</span>
      <span class="word-pop accent" style="animation-delay:0.2s">會</span>
      <span class="word-pop" style="animation-delay:0.35s">說話。</span>
    </p>
    <p class="display huge">
      <span class="word-pop" style="animation-delay:0.5s">讓全場</span>
      <span class="word-pop pulse-word accent" style="animation-delay:0.65s">躍動</span>
      <span class="word-pop" style="animation-delay:0.8s">起來。</span>
    </p>
    <p class="mt-8 text-lg opacity-80 type-line inline-block">2026 年 11 月 14–15 日・臺北流行音樂中心</p>
  </section>

  <section class="grid md:grid-cols-3 gap-6 py-10">
    <div class="border border-white/15 rounded-2xl p-6">
      <p class="display text-5xl accent mb-2 count-num" id="teamCount">0</p>
      <p class="text-sm opacity-70">參賽隊伍報名數</p>
    </div>
    <div class="border border-white/15 rounded-2xl p-6">
      <p class="display text-5xl accent mb-2 count-num" id="prizeCount">0</p>
      <p class="text-sm opacity-70">總獎金（新台幣）</p>
    </div>
    <div class="border border-white/15 rounded-2xl p-6">
      <p class="display text-5xl accent mb-2 count-num" id="daysCount">0</p>
      <p class="text-sm opacity-70">距離開賽天數</p>
    </div>
  </section>

  <section id="tickets" class="py-14">
    <p class="display text-4xl text-center mb-10">選一張票，<span class="accent">現在就動起來</span></p>
    <div class="grid md:grid-cols-3 gap-6">
      <button class="ticket-card border-2 border-white/20 rounded-2xl p-7 text-left" data-name="站席通行證" data-price="NT$ 880">
        <p class="display text-3xl mb-2">站席通行證</p>
        <p class="text-sm opacity-70 mb-4">自由站區・兩日皆可入場</p>
        <p class="display text-4xl accent">NT$ 880</p>
      </button>
      <button class="ticket-card border-2 border-[#ffe14d] rounded-2xl p-7 text-left relative" data-name="搖滾特區票" data-price="NT$ 1,680">
        <span class="absolute -top-3 right-6 bg-[#ffe14d] text-black text-xs font-bold px-3 py-1 rounded-full">最熱賣</span>
        <p class="display text-3xl mb-2">搖滾特區票</p>
        <p class="text-sm opacity-70 mb-4">舞台前排・限量 300 席</p>
        <p class="display text-4xl accent">NT$ 1,680</p>
      </button>
      <button class="ticket-card border-2 border-white/20 rounded-2xl p-7 text-left" data-name="選手後臺通行證" data-price="NT$ 2,980">
        <p class="display text-3xl mb-2">選手後臺通行證</p>
        <p class="text-sm opacity-70 mb-4">近距離觀賽＋選手見面會</p>
        <p class="display text-4xl accent">NT$ 2,980</p>
      </button>
    </div>
    <div id="ticketSelected" class="mt-8 text-center display text-2xl opacity-80">尚未選擇票種</div>
  </section>
</main>

<footer class="border-t border-white/10 py-8 text-center text-sm opacity-60">
  KINETICFEST © 2026 · 讓身體說出你的故事
</footer>

<script>
  function countUp(id, target, suffix=''){
    const el = document.getElementById(id);
    let cur = 0;
    const step = Math.max(1, Math.floor(target/60));
    const timer = setInterval(()=>{
      cur += step;
      if(cur >= target){ cur = target; clearInterval(timer); }
      el.textContent = cur.toLocaleString('zh-TW') + suffix;
    }, 30);
  }
  countUp('teamCount', 168, ' 隊');
  countUp('prizeCount', 800000);
  countUp('daysCount', 54, ' 天');

  document.querySelectorAll('.ticket-card').forEach(card=>{
    card.addEventListener('click', ()=>{
      document.getElementById('ticketSelected').textContent =
        `已選擇：${card.dataset.name}（${card.dataset.price}）— 立即前往結帳`;
      document.querySelectorAll('.ticket-card').forEach(c=>c.classList.remove('border-[#ffe14d]'));
      card.classList.add('border-[#ffe14d]');
    });
  });
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>韡寧的 UI 待審 · 2026-11-06</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  body{font-family:'Noto Sans TC',sans-serif; background:#f4f4f2; color:#1a1a1a;}
  .card{background:#fff; border:1px solid #e6e6e2;}
  .frame-wrap{position:relative; overflow:hidden; background:#eceae4;}
  .frame-wrap iframe{
    position:absolute; top:0; left:0;
    width:200%; height:200%;
    transform: scale(.5);
    transform-origin: top left;
    border:0;
  }
  .heart{transition: transform .15s ease;}
  .heart:active{transform: scale(1.3);}
  .heart.liked{filter: none;}
</style>
</head>
<body>

<div class="max-w-5xl mx-auto px-5 py-8">
  <header class="mb-8">
    <h1 class="text-2xl md:text-3xl font-bold mb-1">韡寧的 UI 待審 · 2026-11-06</h1>
    <p class="text-sm text-neutral-500">本輪 6 個方向，點 ❤️ 代表喜歡，會記錄下來當下次挑風格的依據。</p>
  </header>

  <div class="grid grid-cols-1 md:grid-cols-2 gap-6" id="gallery"></div>
</div>

<footer class="text-center text-xs text-neutral-400 pb-10">韡寧的每日 UI/UX 生成助理 · reviews/2026-11-06</footer>

<script>
const DATE = "2026-11-06";
const items = [
  {no:"01", slug:"hyperrealism-jewelry", name:"璨金珠寶 LuxGem", style:"#05 3D / Hyperrealism"},
  {no:"02", slug:"zero-interface-notes", name:"留白 Blank", style:"#18 Zero Interface"},
  {no:"03", slug:"conversion-course", name:"學習加速器 SkillBoost", style:"#21 Conversion-Optimized"},
  {no:"04", slug:"interactive-demo-api", name:"接點實驗室 ConnectLab", style:"#25 Interactive Demo"},
  {no:"05", slug:"drilldown-dashboard", name:"深挖 DrillBI", style:"#32 Drill-Down Dashboard"},
  {no:"06", slug:"dimensional-portfolio", name:"層疊 Layered Studio", style:"#46 Dimensional Layering"},
];

const gallery = document.getElementById('gallery');

function cardHTML(item){
  const file = `${item.no}-${item.slug}.html`;
  const id = `${DATE}_${item.no}`;
  return `
  <div class="card rounded-2xl overflow-hidden" data-id="${id}">
    <div class="frame-wrap" style="aspect-ratio: 16/10;">
      <iframe src="${file}" loading="lazy"></iframe>
    </div>
    <div class="p-4 flex items-center justify-between">
      <div>
        <p class="font-semibold text-sm">${item.no} · ${item.name}</p>
        <p class="text-xs text-neutral-500 mt-0.5">${item.style}</p>
      </div>
      <div class="flex items-center gap-3">
        <a href="${file}" target="_blank" class="text-xs px-3 py-1.5 rounded-full border border-neutral-300 hover:border-neutral-500 whitespace-nowrap">開啟 ↗</a>
        <button class="heart text-xl" data-id="${id}" onclick="toggleLike(this)">🤍</button>
      </div>
    </div>
  </div>`;
}

gallery.innerHTML = items.map(cardHTML).join('');

function toggleLike(btn){
  const id = btn.getAttribute('data-id');
  const liked = btn.textContent.trim() === '❤️';
  const next = !liked;
  btn.textContent = next ? '❤️' : '🤍';
  fetch(`https://b-battle-580b5-default-rtdb.firebaseio.com/uigallery/${id}.json`, {
    method: 'PUT',
    body: JSON.stringify(next)
  }).catch(()=>{});
}

fetch('https://b-battle-580b5-default-rtdb.firebaseio.com/uigallery.json')
  .then(r => r.json())
  .then(data => {
    if(!data) return;
    document.querySelectorAll('.heart').forEach(btn => {
      const id = btn.getAttribute('data-id');
      if(data[id] === true){ btn.textContent = '❤️'; }
    });
  })
  .catch(()=>{});
</script>

</body>
</html>

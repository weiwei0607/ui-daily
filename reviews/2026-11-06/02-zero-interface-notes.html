<!-- style #18 Zero Interface -->
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>留白 Blank · 只留下文字的筆記 App</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600&family=Noto+Sans+TC:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  body{
    font-family:'Noto Sans TC','Sora',sans-serif;
    background:#fafaf8; color:#1a1a18;
  }
  .disp{font-family:'Sora','Noto Sans TC',sans-serif; letter-spacing:-0.01em;}
  .fade-hint{opacity:0; transition:opacity .4s ease;}
  .group:hover .fade-hint{opacity:1;}
  .caret{display:inline-block;width:2px;height:1.1em;background:#1a1a18;vertical-align:-0.15em;animation:blink 1.1s step-end infinite;}
  @keyframes blink{50%{opacity:0}}
  .line{height:1px;background:#e5e3dd;}
  .ghost-btn{color:#bdbab0; transition:color .25s ease;}
  .ghost-btn:hover{color:#1a1a18;}
  ::selection{background:#1a1a18;color:#fafaf8;}
</style>
</head>
<body class="min-h-screen">

<div class="max-w-2xl mx-auto px-8 py-16 min-h-screen flex flex-col">

  <div class="flex items-center justify-between mb-24 group">
    <span class="disp text-sm tracking-widest text-[#bdbab0]">留白</span>
    <div class="flex gap-6 text-sm fade-hint">
      <button class="ghost-btn">全部筆記</button>
      <button class="ghost-btn">已封存</button>
      <button class="ghost-btn">設定</button>
    </div>
  </div>

  <main class="flex-1">
    <p class="text-xs text-[#bdbab0] mb-3">2026 年 11 月 6 日・未命名</p>
    <h1 class="disp text-3xl md:text-4xl font-light leading-relaxed mb-10">
      今天只想記一件事：<br>
      把需要說的話，說得再少一點。
    </h1>
    <p class="text-lg leading-10 text-[#3a3834] max-w-xl">
      留白不是沒有工具，是工具退到你看不見的地方。打開就是一片空白頁，游標在等你，沒有工具列、沒有格式按鈕、沒有提醒紅點。<span class="caret"></span>
    </p>
    <p class="text-lg leading-10 text-[#3a3834] max-w-xl mt-6 opacity-50">
      需要排版的時候，用符號代替按鈕——打「# 」變標題，打「- 」變清單，打兩個「*」變粗體。手不用離開鍵盤，介面也不用跳出來說話。
    </p>
  </main>

  <div class="line my-16"></div>

  <div class="flex items-center justify-between text-xs text-[#bdbab0] group">
    <span>自動儲存於 11:42</span>
    <div class="flex gap-6 fade-hint">
      <button class="ghost-btn">匯出純文字</button>
      <button class="ghost-btn">分享連結</button>
    </div>
  </div>

</div>

<div class="fixed bottom-8 right-8 text-xs text-[#d8d5cc] select-none">⌘ + / 顯示所有指令</div>

</body>
</html>

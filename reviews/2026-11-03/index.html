<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>韡寧的 UI 待審 · 2026-11-03</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  body{ font-family:'Noto Sans TC', sans-serif; background:#f4f3f7; color:#1f2129; }
  .frame-wrap{ position:relative; overflow:hidden; aspect-ratio:16/10; background:#fff; border-radius:12px; }
  .frame-wrap iframe{ position:absolute; top:0; left:0; width:200%; height:200%; transform:scale(.5); transform-origin:top left; border:0; }
  .card{ background:#fff; border-radius:18px; box-shadow:0 1px 2px rgba(20,20,43,.05), 0 8px 24px rgba(20,20,43,.07); }
  .heart{ transition: transform .15s; }
  .heart:active{ transform:scale(1.3); }
  .heart.liked{ color:#ef4444; }
</style>
</head>
<body class="min-h-screen">

  <div class="max-w-6xl mx-auto px-5 py-10">
    <header class="mb-8">
      <p class="text-sm text-[#7a7f93] mb-1">DATE 2026-11-03</p>
      <h1 class="text-3xl font-bold">韡寧的 UI 待審 · 2026-11-03</h1>
      <p class="text-[#6b6f80] mt-2">今天 6 個方向，點開預覽，喜歡的按 ❤️，我會學起來。</p>
    </header>

    <div id="gallery" class="grid grid-cols-1 md:grid-cols-2 gap-6"></div>
  </div>

  <script>
    const DATE = "2026-11-03";
    const items = [
      { nn: "01", slug: "soft-ui-sleep",                 name: "#19 Soft UI Evolution — 好眠日記 睡眠追蹤" },
      { nn: "02", slug: "storytelling-foraging",          name: "#27 Storytelling — 山行採集社" },
      { nn: "03", slug: "financial-dashboard",            name: "#36 Financial Dashboard — 帳目通" },
      { nn: "04", slug: "neubrutalism-marketplace",       name: "#38 Neubrutalism — 挖寶所 二手市集" },
      { nn: "05", slug: "organic-biophilic-plantshop",    name: "#42 Organic Biophilic — 綠意生活 植物選物所" },
      { nn: "06", slug: "retro-futurism-arcade",          name: "#11 Retro-Futurism — 電馳遊樂場" },
    ];

    const gallery = document.getElementById("gallery");

    function cardHtml(it){
      const file = `${it.nn}-${it.slug}.html`;
      const id = `${DATE}_${it.nn}`;
      return `
        <div class="card p-5" data-id="${id}">
          <div class="frame-wrap mb-4">
            <iframe src="${file}" loading="lazy"></iframe>
          </div>
          <div class="flex items-center justify-between gap-3">
            <div>
              <p class="font-semibold">${it.name}</p>
            </div>
            <div class="flex items-center gap-3 shrink-0">
              <a href="${file}" target="_blank" class="text-sm px-3 py-2 rounded-lg bg-[#1f2129] text-white">開啟 ↗</a>
              <button class="heart text-2xl" data-id="${id}" title="喜歡">🤍</button>
            </div>
          </div>
        </div>`;
    }

    gallery.innerHTML = items.map(cardHtml).join("");

    function setLiked(id, liked){
      const btn = document.querySelector(`button.heart[data-id="${id}"]`);
      if(!btn) return;
      btn.textContent = liked ? "❤️" : "🤍";
      btn.classList.toggle("liked", liked);
    }

    // 載入時還原已喜歡狀態
    fetch("https://b-battle-580b5-default-rtdb.firebaseio.com/uigallery.json")
      .then(r => r.json())
      .then(data => {
        if(!data) return;
        items.forEach(it => {
          const id = `${DATE}_${it.nn}`;
          if(data[id] === true) setLiked(id, true);
        });
      })
      .catch(() => {});

    gallery.addEventListener("click", (e) => {
      const btn = e.target.closest("button.heart");
      if(!btn) return;
      const id = btn.dataset.id;
      const liked = !btn.classList.contains("liked");
      setLiked(id, liked);
      fetch(`https://b-battle-580b5-default-rtdb.firebaseio.com/uigallery/${id}.json`, {
        method: "PUT",
        body: JSON.stringify(liked)
      }).catch(() => {});
    });
  </script>

</body>
</html>

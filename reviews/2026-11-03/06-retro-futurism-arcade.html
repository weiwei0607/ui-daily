<!-- style #11 Retro-Futurism -->
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>電馳遊樂場 · 復古未來電競廳</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  body{ font-family:'Noto Sans TC',sans-serif; background:#1a1a2e; color:#e8e8ff; overflow-x:hidden; }
  .display{ font-family:'Orbitron','Noto Sans TC',sans-serif; }
  .neon-cyan{ color:#00ffff; text-shadow:0 0 8px #00ffff, 0 0 20px #00ffff66; }
  .neon-pink{ color:#ff006e; text-shadow:0 0 8px #ff006e, 0 0 20px #ff006e66; }
  .grid-floor{
    position:absolute; inset:0; height:60%; top:40%;
    background-image: linear-gradient(#ff006e22 1px, transparent 1px), linear-gradient(90deg, #ff006e22 1px, transparent 1px);
    background-size: 40px 40px;
    -webkit-mask-image: linear-gradient(to bottom, transparent, black 30%);
    mask-image: linear-gradient(to bottom, transparent, black 30%);
    transform: perspective(300px) rotateX(55deg);
    animation: scroll 2s linear infinite;
  }
  @keyframes scroll{ from{background-position-y:0;} to{background-position-y:40px;} }
  .scanline::after{
    content:''; position:absolute; inset:0; pointer-events:none;
    background: repeating-linear-gradient(to bottom, rgba(255,255,255,0.03) 0px, rgba(255,255,255,0.03) 1px, transparent 2px, transparent 4px);
  }
  .panel{ background:#16162b; border:1px solid #2d2d55; border-radius:4px; position:relative; }
  .glow-border{ box-shadow: 0 0 0 1px #00ffff44, 0 0 20px #00ffff22 inset; }
</style>
</head>
<body class="min-h-screen px-5 py-6 md:px-10 scanline relative">
  <div class="relative max-w-6xl mx-auto">
    <!-- Hero with grid floor -->
    <div class="relative rounded-md overflow-hidden mb-8" style="background:linear-gradient(180deg,#1a1a2e,#0d0d1a); min-height:340px;">
      <div class="grid-floor"></div>
      <div class="relative z-10 flex flex-col items-center text-center pt-14 pb-10 px-6">
        <p class="display text-xs tracking-[0.4em] neon-pink mb-4">SEASON 04 · NOW LOADING</p>
        <h1 class="display text-4xl md:text-6xl font-900 neon-cyan mb-4">電馳遊樂場</h1>
        <p class="text-base md:text-lg font-500 mb-7" style="color:#c9c9ff;">集結全台復古機台與電競擂台，一張票玩到天亮</p>
        <div class="flex gap-4">
          <button class="display px-7 py-3 font-700 text-sm" style="background:#ff006e; color:#1a1a2e; box-shadow:0 0 20px #ff006e88;">立即買票 ▸</button>
          <button class="display px-7 py-3 font-700 text-sm border" style="border-color:#00ffff; color:#00ffff;">查看場次</button>
        </div>
      </div>
    </div>

    <!-- Live status -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-5 mb-8">
      <div class="panel glow-border p-5">
        <p class="text-xs text-[#8888bb] mb-2">PLAYER ONLINE</p>
        <p class="display text-3xl neon-cyan">1,284</p>
      </div>
      <div class="panel glow-border p-5">
        <p class="text-xs text-[#8888bb] mb-2">今夜錦標賽獎金</p>
        <p class="display text-3xl neon-pink">NT$ 50萬</p>
      </div>
      <div class="panel glow-border p-5">
        <p class="text-xs text-[#8888bb] mb-2">倒數開賽</p>
        <p class="display text-3xl" style="color:#ffe66d; text-shadow:0 0 8px #ffe66d88;">02:47:19</p>
      </div>
    </div>

    <!-- Arcade machines -->
    <h2 class="display text-xl neon-cyan mb-5">本週機台陣容</h2>
    <div class="grid grid-cols-1 md:grid-cols-3 gap-5 mb-8">
      <div class="panel p-5">
        <div class="h-32 mb-4 rounded" style="background:repeating-linear-gradient(90deg,#ff006e33,#ff006e33 6px,#1a1a2e 6px,#1a1a2e 12px);"></div>
        <p class="font-700 mb-1" style="color:#e8e8ff;">霓虹賽車 GT-X</p>
        <p class="text-xs text-[#8888bb] mb-3">四人連線對戰，支援方向盤機台</p>
        <p class="display neon-pink text-sm">★ 排隊 12 人</p>
      </div>
      <div class="panel p-5">
        <div class="h-32 mb-4 rounded" style="background:repeating-linear-gradient(90deg,#00ffff33,#00ffff33 6px,#1a1a2e 6px,#1a1a2e 12px);"></div>
        <p class="font-700 mb-1" style="color:#e8e8ff;">像素戰士 格鬥場</p>
        <p class="text-xs text-[#8888bb] mb-3">經典對戰格鬥，週五夜晚雙倍積分</p>
        <p class="display neon-cyan text-sm">★ 空位開放</p>
      </div>
      <div class="panel p-5">
        <div class="h-32 mb-4 rounded" style="background:repeating-linear-gradient(90deg,#ffe66d33,#ffe66d33 6px,#1a1a2e 6px,#1a1a2e 12px);"></div>
        <p class="font-700 mb-1" style="color:#e8e8ff;">節奏突襲 DDR 台</p>
        <p class="text-xs text-[#8888bb] mb-3">全新曲庫上線，連續三首有隱藏獎勵</p>
        <p class="display" style="color:#ffe66d; font-size:0.875rem;">★ 排隊 5 人</p>
      </div>
    </div>

    <!-- Footer CTA -->
    <div class="panel glow-border p-6 md:p-8 flex flex-wrap items-center justify-between gap-5">
      <div>
        <p class="display text-lg neon-cyan mb-1">加入會員卡，點數終身不過期</p>
        <p class="text-sm text-[#8888bb]">首次儲值滿 500 送 200，當晚立即可用</p>
      </div>
      <button class="display px-7 py-3 font-700 text-sm" style="background:#00ffff; color:#1a1a2e; box-shadow:0 0 20px #00ffff88;">辦卡入場</button>
    </div>
  </div>
</body>
</html>

<!-- style #47 Exaggerated Minimalism -->
<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>形｜極簡眼鏡新品</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=Archivo:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  body{font-family:'Archivo','Noto Sans TC',sans-serif;background:#fff;color:#000;}
  .display{font-family:'Big Shoulders Display',sans-serif;}
  .huge{font-size:clamp(4.5rem,14vw,11rem);line-height:0.85;letter-spacing:-0.02em;}
</style>
</head>
<body class="min-h-screen">

<header class="px-8 py-8 flex justify-between items-center">
  <p class="display font-black text-2xl">形</p>
  <a href="#" class="text-sm border-b border-black pb-0.5">選購</a>
</header>

<section class="px-8">
  <h1 class="display huge font-black">形</h1>
  <p class="text-lg md:text-xl max-w-md mt-6 mb-12">一支眼鏡，只做一件事：讓臉消失，讓神情留下。</p>
</section>

<section class="px-8 border-t border-black py-10 grid md:grid-cols-3 gap-y-6 md:gap-y-0">
  <div>
    <p class="display text-6xl font-black">01</p>
    <p class="text-sm mt-2 max-w-[220px]">鈦金屬鉸鍊<br>單支僅 9 克</p>
  </div>
  <div>
    <p class="display text-6xl font-black">02</p>
    <p class="text-sm mt-2 max-w-[220px]">無 Logo 外顯<br>拿掉才知道是誰</p>
  </div>
  <div>
    <p class="display text-6xl font-black">03</p>
    <p class="text-sm mt-2 max-w-[220px]">終身鏡框保固<br>壞了就換新</p>
  </div>
</section>

<section class="border-t border-black">
  <div class="px-8 py-16">
    <p class="display font-black" style="font-size:clamp(3rem,9vw,6rem);line-height:0.9;">
      3 個款式<br>1 種態度
    </p>
  </div>
  <div class="grid md:grid-cols-3 border-t border-black">
    <div class="border-b md:border-b-0 md:border-r border-black p-10">
      <div class="aspect-square bg-black mb-6"></div>
      <p class="display text-3xl font-black">方 01</p>
      <p class="text-sm mt-2 mb-4">寬臉適用，鏡框較方正</p>
      <p class="text-lg font-semibold">NT$ 6,800</p>
    </div>
    <div class="border-b md:border-b-0 md:border-r border-black p-10">
      <div class="aspect-square bg-black mb-6"></div>
      <p class="display text-3xl font-black">圓 02</p>
      <p class="text-sm mt-2 mb-4">柔化五官線條的圓框</p>
      <p class="text-lg font-semibold">NT$ 6,800</p>
    </div>
    <div class="p-10">
      <div class="aspect-square bg-black mb-6"></div>
      <p class="display text-3xl font-black">窄 03</p>
      <p class="text-sm mt-2 mb-4">窄版鏡腿，長臉友善</p>
      <p class="text-lg font-semibold">NT$ 6,800</p>
    </div>
  </div>
</section>

<section class="border-t border-black px-8 py-16">
  <p class="text-sm uppercase tracking-widest text-black/50 mb-4">為什麼只做黑白</p>
  <p class="display font-black" style="font-size:clamp(2.2rem,6vw,4rem);line-height:1.05;max-width:900px;">
    顏色會過時，<br>比例不會。
  </p>
</section>

<footer class="border-t border-black px-8 py-10 flex flex-col md:flex-row justify-between gap-6">
  <p class="display text-4xl font-black">形</p>
  <div class="flex gap-10 text-sm">
    <a href="#" class="border-b border-black pb-0.5">門市資訊</a>
    <a href="#" class="border-b border-black pb-0.5">聯絡我們</a>
  </div>
</footer>

</body>
</html>

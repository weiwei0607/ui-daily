<!-- style #13 Skeuomorphism -->
<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>類比錄音室｜線上混音控台</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@400;600;700&family=Nunito+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  body{font-family:'Nunito Sans',sans-serif;background:#2b2118;color:#f0e6d2;}
  .slab{font-family:'Roboto Slab',serif;}
  .wood{
    background:
      repeating-linear-gradient(90deg, rgba(0,0,0,.06) 0 2px, transparent 2px 6px),
      linear-gradient(180deg,#8a5a34,#6e4527 60%,#5c3820);
    box-shadow: inset 0 2px 4px rgba(255,255,255,.15), inset 0 -6px 10px rgba(0,0,0,.4);
  }
  .metal{
    background: linear-gradient(180deg,#e6e6e6,#b8b8b8 45%,#8f8f8f 46%,#cfcfcf);
    box-shadow: 0 3px 6px rgba(0,0,0,.5), inset 0 1px 1px rgba(255,255,255,.6);
    border: 1px solid #6b6b6b;
  }
  .knob{
    width:64px;height:64px;border-radius:50%;
    background: radial-gradient(circle at 35% 30%, #3a3a3a, #111 70%);
    box-shadow: 0 4px 8px rgba(0,0,0,.6), inset 0 1px 1px rgba(255,255,255,.2);
    position:relative;
  }
  .knob::after{
    content:'';position:absolute;top:8px;left:50%;width:3px;height:20px;
    background:#c9a24b;transform:translateX(-50%);border-radius:2px;
  }
  .fader-track{
    background: linear-gradient(90deg,#1a1a1a,#333);
    box-shadow: inset 0 2px 4px rgba(0,0,0,.7);
    border-radius:6px;
  }
  .fader-cap{
    background: linear-gradient(180deg,#d8b25e,#a67c2e);
    box-shadow: 0 3px 6px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.4);
  }
  .leather{
    background: linear-gradient(180deg,#3b2a1f,#2a1d15);
    box-shadow: inset 0 0 30px rgba(0,0,0,.6);
  }
  .stitch{ border: 2px dashed rgba(240,230,210,.25); }
  .led{ box-shadow: 0 0 8px 2px #ff5b3d, 0 0 2px #ff5b3d; }
</style>
</head>
<body class="min-h-screen">

<header class="wood px-6 py-5 flex justify-between items-center">
  <h1 class="slab text-2xl text-[#f0e6d2] font-bold">類比錄音室</h1>
  <div class="flex items-center gap-3 text-sm">
    <span class="w-2.5 h-2.5 rounded-full led inline-block"></span>
    <span>錄音中 · 42:17</span>
  </div>
</header>

<section class="px-6 py-10 max-w-5xl mx-auto">
  <p class="slab text-3xl mb-2">今日場次：Session 08</p>
  <p class="text-sm text-[#c9b795] mb-8">母帶級混音介面，每個旋鈕都做過音，就等你來轉。</p>

  <div class="leather stitch rounded-2xl p-8">
    <div class="grid grid-cols-2 md:grid-cols-4 gap-8 mb-10">
      <div class="flex flex-col items-center gap-3">
        <div class="knob"></div>
        <p class="text-xs">高頻 TREBLE</p>
      </div>
      <div class="flex flex-col items-center gap-3">
        <div class="knob"></div>
        <p class="text-xs">中頻 MID</p>
      </div>
      <div class="flex flex-col items-center gap-3">
        <div class="knob"></div>
        <p class="text-xs">低頻 BASS</p>
      </div>
      <div class="flex flex-col items-center gap-3">
        <div class="knob"></div>
        <p class="text-xs">混響 REVERB</p>
      </div>
    </div>

    <div class="grid grid-cols-4 md:grid-cols-8 gap-4">
      <div class="flex flex-col items-center gap-2">
        <div class="fader-track w-3 h-40 relative">
          <div class="fader-cap w-8 h-5 rounded absolute" style="left:-10px; top:35%;"></div>
        </div>
        <p class="text-[10px]">TRK 1</p>
      </div>
      <div class="flex flex-col items-center gap-2">
        <div class="fader-track w-3 h-40 relative">
          <div class="fader-cap w-8 h-5 rounded absolute" style="left:-10px; top:20%;"></div>
        </div>
        <p class="text-[10px]">TRK 2</p>
      </div>
      <div class="flex flex-col items-center gap-2">
        <div class="fader-track w-3 h-40 relative">
          <div class="fader-cap w-8 h-5 rounded absolute" style="left:-10px; top:55%;"></div>
        </div>
        <p class="text-[10px]">VOX</p>
      </div>
      <div class="flex flex-col items-center gap-2">
        <div class="fader-track w-3 h-40 relative">
          <div class="fader-cap w-8 h-5 rounded absolute" style="left:-10px; top:15%;"></div>
        </div>
        <p class="text-[10px]">鼓組</p>
      </div>
      <div class="flex flex-col items-center gap-2">
        <div class="fader-track w-3 h-40 relative">
          <div class="fader-cap w-8 h-5 rounded absolute" style="left:-10px; top:40%;"></div>
        </div>
        <p class="text-[10px]">貝斯</p>
      </div>
      <div class="flex flex-col items-center gap-2">
        <div class="fader-track w-3 h-40 relative">
          <div class="fader-cap w-8 h-5 rounded absolute" style="left:-10px; top:60%;"></div>
        </div>
        <p class="text-[10px]">吉他</p>
      </div>
      <div class="flex flex-col items-center gap-2">
        <div class="fader-track w-3 h-40 relative">
          <div class="fader-cap w-8 h-5 rounded absolute" style="left:-10px; top:25%;"></div>
        </div>
        <p class="text-[10px]">合成器</p>
      </div>
      <div class="flex flex-col items-center gap-2">
        <div class="fader-track w-3 h-40 relative">
          <div class="fader-cap w-8 h-5 rounded absolute" style="left:-10px; top:50%;"></div>
        </div>
        <p class="text-[10px]">主控 MAIN</p>
      </div>
    </div>
  </div>

  <div class="grid md:grid-cols-3 gap-6 mt-10">
    <div class="metal rounded-xl p-5">
      <p class="slab text-black font-semibold mb-2">母帶匯出</p>
      <p class="text-sm text-black/70 mb-4">WAV 24bit／48kHz，含備份母帶存放兩年。</p>
      <button class="metal rounded-lg px-4 py-2 text-black font-semibold text-sm active:shadow-inner">立即匯出</button>
    </div>
    <div class="metal rounded-xl p-5">
      <p class="slab text-black font-semibold mb-2">效果器機架</p>
      <p class="text-sm text-black/70 mb-4">壓縮、EQ、Tape Saturation，全部真實旋鈕手感。</p>
      <button class="metal rounded-lg px-4 py-2 text-black font-semibold text-sm active:shadow-inner">開啟機架</button>
    </div>
    <div class="metal rounded-xl p-5">
      <p class="slab text-black font-semibold mb-2">錄音日誌</p>
      <p class="text-sm text-black/70 mb-4">自動記錄每次調整，隨時回到上一版本。</p>
      <button class="metal rounded-lg px-4 py-2 text-black font-semibold text-sm active:shadow-inner">查看日誌</button>
    </div>
  </div>
</section>

<footer class="wood px-6 py-6 text-center text-xs text-[#e2d3ab]">
  類比錄音室 © 2026 · 每個介面元件都手工調過陰影，就是要騙你的手指
</footer>

</body>
</html>

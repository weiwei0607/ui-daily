<!-- style #48 Kinetic Typography -->
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>聲浪祭 SOUNDWAVE — 2026 城市音樂節</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Work+Sans:wght@400;500;700&family=Noto+Sans+TC:wght@700;900&display=swap" rel="stylesheet">
<style>
  body{font-family:'Work Sans','Noto Sans TC',sans-serif; background:#111; color:#fff; overflow-x:hidden;}
  .disp{font-family:'Bebas Neue','Noto Sans TC',sans-serif; letter-spacing:.02em;}
  @keyframes marquee{from{transform:translateX(0)}to{transform:translateX(-50%)}}
  .marquee{display:flex; white-space:nowrap; animation:marquee 18s linear infinite;}
  @keyframes riseIn{from{opacity:0; transform:translateY(40px)}to{opacity:1; transform:translateY(0)}}
  .rise{animation:riseIn .8s cubic-bezier(.16,1,.3,1) both;}
  .rise-1{animation-delay:.05s}.rise-2{animation-delay:.15s}.rise-3{animation-delay:.25s}.rise-4{animation-delay:.35s}
  @keyframes pulse-glow{0%,100%{text-shadow:0 0 20px rgba(255,214,10,.4)}50%{text-shadow:0 0 40px rgba(255,214,10,.8)}}
  .glow{animation:pulse-glow 2.5s ease-in-out infinite;}
  .hover-lift{transition:transform .3s cubic-bezier(.16,1,.3,1);}
  .hover-lift:hover{transform:translateY(-8px) rotate(-1deg);}
</style>
</head>
<body>

<nav class="max-w-6xl mx-auto px-6 py-6 flex items-center justify-between rise rise-1">
  <div class="disp text-2xl">SOUNDWAVE</div>
  <button class="border-2 border-white px-5 py-2 text-sm font-bold hover:bg-white hover:text-[#111] transition">購票</button>
</nav>

<header class="relative py-10 md:py-20">
  <h1 class="disp text-[16vw] md:text-[10rem] leading-[0.85] text-center rise rise-1">
    <span class="block">聲浪祭</span>
    <span class="block text-[#ffd60a] glow">SOUND<span class="text-white">WAVE</span></span>
  </h1>
</header>

<div class="border-y-2 border-white/20 py-4 overflow-hidden rise rise-2">
  <div class="marquee disp text-3xl md:text-4xl gap-8 opacity-90">
    <span class="px-8">11月14–16日</span><span class="px-8">•</span><span class="px-8">台北大港倉</span><span class="px-8">•</span><span class="px-8">32組樂團</span><span class="px-8">•</span>
    <span class="px-8">11月14–16日</span><span class="px-8">•</span><span class="px-8">台北大港倉</span><span class="px-8">•</span><span class="px-8">32組樂團</span><span class="px-8">•</span>
  </div>
</div>

<section class="max-w-5xl mx-auto px-6 py-16 text-center rise rise-3">
  <p class="text-lg md:text-xl max-w-2xl mx-auto leading-relaxed text-white/80">三天三夜，五座舞台。從地下獨立到主流頭牌，聲浪祭把整座城市的節奏，搬到你面前。</p>
  <div class="flex gap-4 justify-center mt-10 flex-wrap">
    <button class="bg-[#ffd60a] text-[#111] disp text-2xl px-10 py-4 hover-lift">立即搶票</button>
    <button class="border-2 border-white disp text-2xl px-10 py-4 hover-lift">查看陣容</button>
  </div>
</section>

<section class="max-w-6xl mx-auto px-6 pb-20 rise rise-4">
  <div class="grid grid-cols-2 md:grid-cols-4 gap-4 text-center">
    <div class="border border-white/20 py-8 hover-lift">
      <div class="disp text-5xl text-[#ffd60a]">32</div>
      <div class="text-xs tracking-widest mt-2 text-white/60">組表演者</div>
    </div>
    <div class="border border-white/20 py-8 hover-lift">
      <div class="disp text-5xl text-[#ffd60a]">5</div>
      <div class="text-xs tracking-widest mt-2 text-white/60">座舞台</div>
    </div>
    <div class="border border-white/20 py-8 hover-lift">
      <div class="disp text-5xl text-[#ffd60a]">3</div>
      <div class="text-xs tracking-widest mt-2 text-white/60">天不打烊</div>
    </div>
    <div class="border border-white/20 py-8 hover-lift">
      <div class="disp text-5xl text-[#ffd60a]">45K</div>
      <div class="text-xs tracking-widest mt-2 text-white/60">預期入場人次</div>
    </div>
  </div>
</section>

<footer class="border-t border-white/20 py-10 text-center text-xs text-white/50 disp text-lg tracking-widest">
  SOUNDWAVE FESTIVAL 2026 · 台北 · 別只是聽，來感受
</footer>

</body>
</html>

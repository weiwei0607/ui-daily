<!doctype html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>韡寧的 UI 待審 · 2026-08-18</title><style>
:root{--bg:#f4f4f5;--card:#fff;--ink:#18181b;--sub:#71717a;--line:#e4e4e7;--accent:#e11d48}
@media(prefers-color-scheme:dark){:root{--bg:#0c0c0f;--card:#18181b;--ink:#fafafa;--sub:#a1a1aa;--line:#27272a}}
*{box-sizing:border-box;margin:0}body{background:var(--bg);color:var(--ink);font-family:-apple-system,"Noto Sans TC",system-ui,sans-serif;line-height:1.5;padding:28px 16px 80px}
.wrap{max-width:960px;margin:0 auto}h1{font-size:1.5rem;letter-spacing:-.02em}.sub{color:var(--sub);font-size:.9rem;margin-top:6px}
.grid{display:grid;grid-template-columns:1fr;gap:20px;margin-top:24px}@media(min-width:720px){.grid{grid-template-columns:1fr 1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.frame{position:relative;height:300px;overflow:hidden;border-bottom:1px solid var(--line);background:#fff}
.frame iframe{position:absolute;top:0;left:0;width:200%;height:200%;transform:scale(.5);transform-origin:top left;border:0;pointer-events:none}
.meta{display:flex;align-items:center;gap:12px;padding:14px 16px}
.meta .t{flex:1;min-width:0}.meta .t b{font-size:1rem;display:block}.meta .t small{color:var(--sub);font-size:.78rem}
.open{font-size:.8rem;color:var(--sub);text-decoration:none;border:1px solid var(--line);padding:6px 11px;border-radius:9px;white-space:nowrap}
.like{border:1.5px solid var(--line);background:none;font-size:1.15rem;width:44px;height:38px;border-radius:10px;cursor:pointer}
.like.on{background:var(--accent);border-color:var(--accent)}
.tip{margin-top:22px;color:var(--sub);font-size:.85rem;text-align:center}
</style></head><body><div class="wrap">
<h1>韡寧的 UI 待審 · 2026-08-18</h1>
<p class="sub">今天 6 個全新風格方向，字體都照風格美學挑選，全繁體中文。喜歡的按 ❤️，我會繼續學。這頁未公開。</p>
<div class="grid" id="grid"></div>
<p class="tip">🌱 共 6 個，避開近期用過的風格。</p></div>
<script>
const DATE="2026-08-18";
const UIS=[
 {n:"01",file:"01-neubrutalism.html",name:"Neubrutalism #38",desc:"粗黑邊硬陰影・展示字 Archivo Black"},
 {n:"02",file:"02-liquid-glass.html",name:"Liquid Glass #14",desc:"流動毛玻璃・圓體 Zen Maru Gothic"},
 {n:"03",file:"03-storytelling.html",name:"Storytelling #27",desc:"敘事報紙體・Newsreader + 襯線"},
 {n:"04",file:"04-cyberpunk.html",name:"Cyberpunk #41",desc:"賽博霓虹・Orbitron 科技字"},
 {n:"05",file:"05-executive-dashboard.html",name:"Executive Summary #30",desc:"高管儀表板・Manrope + 等寬數字"},
 {n:"06",file:"06-kinetic-typography.html",name:"Kinetic Typography #48",desc:"動態展示字・Bebas Neue"},
];
const RTDB="https://b-battle-580b5-default-rtdb.firebaseio.com/uigallery";
let liked={};
fetch(RTDB+".json").then(r=>r.json()).then(d=>{liked=d||{};render()}).catch(render);
function render(){const g=document.getElementById("grid");g.innerHTML="";
 UIS.forEach(u=>{const id=DATE+"_"+u.n,on=liked[id]===true;const c=document.createElement("div");c.className="card";
  c.innerHTML=`<div class="frame"><iframe src="${u.file}" loading="lazy"></iframe></div><div class="meta"><div class="t"><b>${u.name}</b><small>${u.desc}</small></div><a class="open" href="${u.file}" target="_blank" rel="noopener">開啟 ↗</a><button class="like${on?' on':''}" data-id="${id}">${on?'❤️':'🤍'}</button></div>`;
  g.appendChild(c);});
 g.querySelectorAll(".like").forEach(b=>b.onclick=()=>{const id=b.dataset.id,now=!(liked[id]===true);liked[id]=now;b.classList.toggle("on",now);b.textContent=now?'❤️':'🤍';fetch(RTDB+"/"+id+".json",{method:"PUT",body:JSON.stringify(now)});});}
</script></body></html>

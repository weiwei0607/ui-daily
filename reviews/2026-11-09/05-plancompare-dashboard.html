<!-- style #33 Comparative Dashboard -->
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>方案比比 PlanCompare</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  *{ font-family:'Instrument Sans','Noto Sans TC',sans-serif; }
  .mono{ font-family:'JetBrains Mono',monospace; }
  body{ background:#f4f6fb; color:#1e2433; }
  .card{ background:#fff; border:1px solid #e4e8f1; border-radius:16px; }
  .base-col{ box-shadow: 0 0 0 2px #6366f1 inset; }
  .delta-up{ color:#dc2626; }
  .delta-down{ color:#16a34a; }
  .bar-wrap{ background:#eef0f7; border-radius:6px; overflow:hidden; height:8px; }
  .bar-fill{ height:100%; border-radius:6px; transition: width .5s ease; }
</style>
</head>
<body>
  <div class="max-w-5xl mx-auto px-5 py-8">
    <header class="flex items-center justify-between mb-6">
      <div>
        <h1 class="text-xl font-bold">方案比比</h1>
        <p class="text-xs text-slate-500">企業雲端儲存方案比較 · 以「標準方案」為比較基準</p>
      </div>
      <div class="flex gap-2">
        <button id="toggleMonthly" onclick="setBilling('monthly')" class="text-xs font-semibold px-3 py-1.5 rounded-full bg-indigo-600 text-white">按月計費</button>
        <button id="toggleYearly" onclick="setBilling('yearly')" class="text-xs font-semibold px-3 py-1.5 rounded-full bg-white border border-slate-200">按年計費（省 15%）</button>
      </div>
    </header>

    <!-- comparison table -->
    <div class="card p-5 mb-6 overflow-x-auto">
      <table class="w-full text-sm min-w-[640px]">
        <thead>
          <tr class="text-left text-xs text-slate-500 border-b border-slate-100">
            <th class="pb-3 font-medium">項目</th>
            <th class="pb-3 font-medium text-center">
              <button onclick="setBase('basic')" class="plan-head px-3 py-1 rounded-lg" data-plan="basic">入門方案</button>
            </th>
            <th class="pb-3 font-medium text-center">
              <button onclick="setBase('standard')" class="plan-head px-3 py-1 rounded-lg" data-plan="standard">標準方案</button>
            </th>
            <th class="pb-3 font-medium text-center">
              <button onclick="setBase('pro')" class="plan-head px-3 py-1 rounded-lg" data-plan="pro">專業方案</button>
            </th>
          </tr>
        </thead>
        <tbody class="divide-y divide-slate-100">
          <tr>
            <td class="py-3 text-slate-500">每月費用</td>
            <td class="py-3 text-center mono font-bold price-cell" data-plan="basic" data-monthly="990" data-yearly="842">NT$990</td>
            <td class="py-3 text-center mono font-bold price-cell" data-plan="standard" data-monthly="1990" data-yearly="1692">NT$1,990</td>
            <td class="py-3 text-center mono font-bold price-cell" data-plan="pro" data-monthly="3990" data-yearly="3392">NT$3,990</td>
          </tr>
          <tr>
            <td class="py-3 text-slate-500">儲存空間</td>
            <td class="py-3 text-center mono">500 GB</td>
            <td class="py-3 text-center mono">2 TB</td>
            <td class="py-3 text-center mono">10 TB</td>
          </tr>
          <tr>
            <td class="py-3 text-slate-500">同時連線裝置</td>
            <td class="py-3 text-center mono">3 台</td>
            <td class="py-3 text-center mono">10 台</td>
            <td class="py-3 text-center mono">無上限</td>
          </tr>
          <tr>
            <td class="py-3 text-slate-500">版本回溯</td>
            <td class="py-3 text-center">7 天</td>
            <td class="py-3 text-center">30 天</td>
            <td class="py-3 text-center">180 天</td>
          </tr>
          <tr>
            <td class="py-3 text-slate-500">專屬客服</td>
            <td class="py-3 text-center text-slate-300">—</td>
            <td class="py-3 text-center text-green-600">✓ 工作日</td>
            <td class="py-3 text-center text-green-600">✓ 24 小時</td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- diff vs base -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6" id="diffCards">
      <div class="card p-4" data-plan="basic">
        <p class="text-xs text-slate-500 mb-1">入門方案 vs 基準</p>
        <p class="mono text-lg font-bold diff-amount">—</p>
        <div class="bar-wrap mt-2"><div class="bar-fill" style="width:50%; background:#94a3b8;"></div></div>
      </div>
      <div class="card p-4 base-col" data-plan="standard">
        <p class="text-xs text-indigo-600 font-semibold mb-1">目前比較基準</p>
        <p class="mono text-lg font-bold diff-amount">基準方案</p>
        <div class="bar-wrap mt-2"><div class="bar-fill" style="width:0%; background:#6366f1;"></div></div>
      </div>
      <div class="card p-4" data-plan="pro">
        <p class="text-xs text-slate-500 mb-1">專業方案 vs 基準</p>
        <p class="mono text-lg font-bold diff-amount">—</p>
        <div class="bar-wrap mt-2"><div class="bar-fill" style="width:100%; background:#94a3b8;"></div></div>
      </div>
    </div>

    <p class="text-xs text-slate-400 text-center">點選表頭方案名稱可切換比較基準，差異金額會即時重新計算。</p>
  </div>

<script>
const prices = { basic:990, standard:1990, pro:3990 };
const priceDisplay = { basic:"NT$990", standard:"NT$1,990", pro:"NT$3,990" };
let base = 'standard';
let billing = 'monthly';

function setBase(plan){
  base = plan;
  document.querySelectorAll('.plan-head').forEach(b=>{
    b.classList.toggle('bg-indigo-600', b.dataset.plan===plan);
    b.classList.toggle('text-white', b.dataset.plan===plan);
  });
  document.querySelectorAll('[data-plan]#diffCards, #diffCards > div').forEach(()=>{});
  const cards = document.querySelectorAll('#diffCards > div');
  cards.forEach(c=>{
    const p = c.dataset.plan;
    const amountEl = c.querySelector('.diff-amount');
    const bar = c.querySelector('.bar-fill');
    const label = c.querySelector('p');
    if(p === base){
      c.classList.add('base-col');
      label.textContent = '目前比較基準';
      label.className = 'text-xs text-indigo-600 font-semibold mb-1';
      amountEl.textContent = '基準方案';
      bar.style.width = '0%'; bar.style.background = '#6366f1';
    } else {
      c.classList.remove('base-col');
      const planName = p==='basic' ? '入門方案' : p==='standard' ? '標準方案' : '專業方案';
      label.textContent = planName + ' vs 基準';
      label.className = 'text-xs text-slate-500 mb-1';
      const diff = getPrice(p) - getPrice(base);
      const pct = Math.min(100, Math.abs(diff) / getPrice(base) * 60 + 20);
      amountEl.innerHTML = diff > 0
        ? `<span class="delta-up">+NT$${diff.toLocaleString()}</span>`
        : `<span class="delta-down">-NT$${Math.abs(diff).toLocaleString()}</span>`;
      bar.style.width = pct + '%';
      bar.style.background = diff > 0 ? '#dc2626' : '#16a34a';
    }
  });
}
function getPrice(plan){
  return billing === 'monthly' ? prices[plan] : Math.round(prices[plan] * 0.85);
}
function setBilling(mode){
  billing = mode;
  document.getElementById('toggleMonthly').className = mode==='monthly' ? 'text-xs font-semibold px-3 py-1.5 rounded-full bg-indigo-600 text-white' : 'text-xs font-semibold px-3 py-1.5 rounded-full bg-white border border-slate-200';
  document.getElementById('toggleYearly').className = mode==='yearly' ? 'text-xs font-semibold px-3 py-1.5 rounded-full bg-indigo-600 text-white' : 'text-xs font-semibold px-3 py-1.5 rounded-full bg-white border border-slate-200';
  document.querySelectorAll('.price-cell').forEach(cell=>{
    const p = cell.dataset.plan;
    const val = billing==='monthly' ? cell.dataset.monthly : cell.dataset.yearly;
    cell.textContent = 'NT$' + Number(val).toLocaleString();
  });
  setBase(base);
}
setBase('standard');
</script>
</body>
</html>

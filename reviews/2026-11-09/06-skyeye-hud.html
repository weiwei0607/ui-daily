<!-- style #51 HUD / Sci-Fi -->
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>天眼 SkyEye</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{ --cyan:#00f0ff; --bg:#030810; --panel:#071a26; }
  *{ font-family:'Share Tech Mono','Noto Sans TC',monospace; }
  .disp{ font-family:'Orbitron','Noto Sans TC',sans-serif; }
  body{ background: radial-gradient(ellipse at center, #06131f 0%, #020509 80%); color:var(--cyan); min-height:100vh; }
  .hud-panel{
    background: rgba(5,22,33,.75);
    border: 1px solid rgba(0,240,255,.35);
    box-shadow: 0 0 18px rgba(0,240,255,.08), inset 0 0 20px rgba(0,240,255,.04);
    position: relative;
  }
  .corner{ position:absolute; width:14px; height:14px; border-color:var(--cyan); }
  .corner.tl{ top:-1px; left:-1px; border-top:2px solid; border-left:2px solid; }
  .corner.tr{ top:-1px; right:-1px; border-top:2px solid; border-right:2px solid; }
  .corner.bl{ bottom:-1px; left:-1px; border-bottom:2px solid; border-left:2px solid; }
  .corner.br{ bottom:-1px; right:-1px; border-bottom:2px solid; border-right:2px solid; }
  .glow-text{ text-shadow: 0 0 8px rgba(0,240,255,.7); }
  @keyframes scan{ 0%{transform:translateY(-100%)} 100%{transform:translateY(100%)} }
  .scanline{ position:absolute; inset:0; overflow:hidden; pointer-events:none; }
  .scanline::before{ content:''; position:absolute; left:0; right:0; height:40%; background:linear-gradient(to bottom, transparent, rgba(0,240,255,.07), transparent); animation: scan 4s linear infinite; }
  @keyframes pulse-dot{ 0%,100%{opacity:1} 50%{opacity:.3} }
  .status-dot{ width:8px; height:8px; border-radius:50%; animation: pulse-dot 1.6s infinite; }
  .ring{ border:2px solid rgba(0,240,255,.3); border-top-color:var(--cyan); border-radius:50%; animation: spin 3s linear infinite; }
  @keyframes spin{ to{transform:rotate(360deg)} }
  .drone-row{ transition: background .15s ease; cursor:pointer; }
  .drone-row:hover{ background: rgba(0,240,255,.07); }
  .btn-hud{ border:1px solid var(--cyan); transition: all .15s ease; }
  .btn-hud:hover{ background: rgba(0,240,255,.12); }
  .btn-hud:active{ transform: scale(.96); }
</style>
</head>
<body class="p-4 md:p-6">
  <div class="max-w-6xl mx-auto">
    <header class="flex items-center justify-between mb-5">
      <div class="flex items-center gap-3">
        <div class="ring w-8 h-8"></div>
        <div>
          <h1 class="disp text-lg font-bold glow-text tracking-wider">天眼 SKYEYE</h1>
          <p class="text-[10px] opacity-60 tracking-widest">無人機機隊監控台 · 即時航跡</p>
        </div>
      </div>
      <div class="text-right text-xs">
        <p id="clock" class="disp font-bold glow-text"></p>
        <p class="opacity-50 text-[10px]">座標系統 TWD97</p>
      </div>
    </header>

    <!-- top stats -->
    <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-5">
      <div class="hud-panel p-4"><div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div>
        <p class="text-[10px] opacity-60 mb-1">在線機隊</p>
        <p class="disp text-2xl font-bold glow-text" id="statOnline">14</p>
      </div>
      <div class="hud-panel p-4"><div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div>
        <p class="text-[10px] opacity-60 mb-1">巡航中任務</p>
        <p class="disp text-2xl font-bold glow-text" id="statMission">7</p>
      </div>
      <div class="hud-panel p-4"><div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div>
        <p class="text-[10px] opacity-60 mb-1">平均電力</p>
        <p class="disp text-2xl font-bold glow-text" id="statBattery">76%</p>
      </div>
      <div class="hud-panel p-4"><div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div>
        <p class="text-[10px] opacity-60 mb-1">異常警示</p>
        <p class="disp text-2xl font-bold" style="color:#ff4d4d;">1</p>
      </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-5">
      <!-- radar -->
      <div class="hud-panel p-5 scanline md:col-span-1">
        <div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div>
        <p class="text-[10px] opacity-60 mb-3 tracking-widest">區域掃描 · 半徑 5KM</p>
        <div class="relative w-full aspect-square rounded-full border" style="border-color:rgba(0,240,255,.25);">
          <div class="absolute inset-4 rounded-full border" style="border-color:rgba(0,240,255,.2);"></div>
          <div class="absolute inset-8 rounded-full border" style="border-color:rgba(0,240,255,.15);"></div>
          <div class="absolute left-1/2 top-1/2 w-px h-1/2 origin-bottom" style="background:linear-gradient(to top, var(--cyan), transparent); animation: spin 5s linear infinite;"></div>
          <div class="absolute w-2 h-2 rounded-full bg-cyan-300" style="top:30%; left:60%; box-shadow:0 0 8px var(--cyan);"></div>
          <div class="absolute w-2 h-2 rounded-full bg-cyan-300" style="top:65%; left:38%; box-shadow:0 0 8px var(--cyan);"></div>
          <div class="absolute w-2 h-2 rounded-full" style="top:50%; left:72%; background:#ff4d4d; box-shadow:0 0 8px #ff4d4d;"></div>
        </div>
      </div>

      <!-- fleet list -->
      <div class="hud-panel p-5 md:col-span-2">
        <div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div>
        <div class="flex items-center justify-between mb-3">
          <p class="text-[10px] opacity-60 tracking-widest">機隊清單</p>
          <button onclick="refreshFleet()" class="btn-hud disp text-[10px] px-3 py-1">重新整理 ⟳</button>
        </div>
        <table class="w-full text-xs">
          <thead>
            <tr class="text-[10px] opacity-50 border-b border-cyan-900/50">
              <th class="text-left py-2">編號</th>
              <th class="text-left py-2">狀態</th>
              <th class="text-left py-2">任務區</th>
              <th class="text-left py-2">電力</th>
              <th class="text-left py-2">點擊</th>
            </tr>
          </thead>
          <tbody id="fleetBody">
            <tr class="drone-row border-b border-cyan-900/30" onclick="selectDrone(this,'SE-01')">
              <td class="py-2 disp">SE-01</td>
              <td class="py-2"><span class="status-dot inline-block mr-1" style="background:#00ff88;"></span>巡航中</td>
              <td class="py-2">信義區 A 區</td>
              <td class="py-2">88%</td>
              <td class="py-2 opacity-50">查看 →</td>
            </tr>
            <tr class="drone-row border-b border-cyan-900/30" onclick="selectDrone(this,'SE-02')">
              <td class="py-2 disp">SE-02</td>
              <td class="py-2"><span class="status-dot inline-block mr-1" style="background:#00ff88;"></span>巡航中</td>
              <td class="py-2">內湖科技園區</td>
              <td class="py-2">64%</td>
              <td class="py-2 opacity-50">查看 →</td>
            </tr>
            <tr class="drone-row border-b border-cyan-900/30" onclick="selectDrone(this,'SE-05')">
              <td class="py-2 disp">SE-05</td>
              <td class="py-2"><span class="status-dot inline-block mr-1" style="background:#ff4d4d;"></span>訊號異常</td>
              <td class="py-2">南港展覽館</td>
              <td class="py-2">23%</td>
              <td class="py-2 opacity-50">查看 →</td>
            </tr>
            <tr class="drone-row border-b border-cyan-900/30" onclick="selectDrone(this,'SE-07')">
              <td class="py-2 disp">SE-07</td>
              <td class="py-2"><span class="status-dot inline-block mr-1" style="background:#ffcc00;"></span>返航充電</td>
              <td class="py-2">松山機場周邊</td>
              <td class="py-2">12%</td>
              <td class="py-2 opacity-50">查看 →</td>
            </tr>
          </tbody>
        </table>
        <div id="droneDetail" class="mt-4 hud-panel p-4 hidden">
          <div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div>
          <p class="disp text-sm glow-text mb-1" id="detailTitle">—</p>
          <p class="text-[11px] opacity-70" id="detailBody">—</p>
        </div>
      </div>
    </div>
  </div>

<script>
function tick(){
  const now = new Date();
  document.getElementById('clock').textContent = now.toLocaleTimeString('zh-TW', {hour12:false});
}
setInterval(tick, 1000); tick();

function refreshFleet(){
  document.getElementById('statOnline').textContent = 12 + Math.floor(Math.random()*4);
  document.getElementById('statMission').textContent = 5 + Math.floor(Math.random()*4);
  document.getElementById('statBattery').textContent = (68 + Math.floor(Math.random()*20)) + '%';
}
const droneInfo = {
  'SE-01': '目前於信義區 A 區執行例行空拍巡檢，預計 22 分鐘後返航，訊號穩定。',
  'SE-02': '於內湖科技園區進行人流熱點監測任務，電力消耗正常，無異常回報。',
  'SE-05': '偵測到定位訊號不穩定，已自動切換備援天線，建議派遣地面人員確認狀態。',
  'SE-07': '電力低於 15%，已自動觸發返航充電程序，預計 8 分鐘內抵達充電站。'
};
function selectDrone(row, id){
  document.querySelectorAll('.drone-row').forEach(r=>r.style.background='');
  row.style.background = 'rgba(0,240,255,.1)';
  const detail = document.getElementById('droneDetail');
  detail.classList.remove('hidden');
  document.getElementById('detailTitle').textContent = '機號 ' + id + ' · 即時回報';
  document.getElementById('detailBody').textContent = droneInfo[id];
}
</script>
</body>
</html>

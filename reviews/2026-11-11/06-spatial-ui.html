<!-- style #55 Spatial UI -->
<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>宅控空間 · 智慧家庭控制中心</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  body{
    font-family:'Zen Maru Gothic','Quicksand',sans-serif;
    background: radial-gradient(circle at 20% 10%, #cfe0ff 0%, #e9ecff 35%, #f4f1ff 60%, #fef6ec 100%);
    min-height:100vh;
    color:#2b2d42;
    perspective: 1400px;
  }
  .glass{
    background: rgba(255,255,255,0.45);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border: 1px solid rgba(255,255,255,0.6);
    border-radius: 26px;
    box-shadow: 0 20px 40px -10px rgba(80,90,160,0.25);
  }
  .float1{ transform: translateZ(40px) rotateX(1deg); transition: transform .3s ease; }
  .float1:hover{ transform: translateZ(60px) translateY(-4px) rotateX(1deg); }
  .float2{ transform: translateZ(20px); transition: transform .3s ease; }
  .float2:hover{ transform: translateZ(40px) translateY(-3px); }
  .orb-btn{
    background: rgba(255,255,255,0.55);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.7);
    transition: all .2s ease;
  }
  .orb-btn.on{ background: linear-gradient(145deg,#8fb8ff,#a98fff); color:#fff; box-shadow:0 8px 20px rgba(130,120,255,0.4); }
  .knob-track{ background: rgba(255,255,255,0.4); border:1px solid rgba(255,255,255,0.7); border-radius:999px; height:10px; position:relative; }
  .knob-fill{ background: linear-gradient(90deg,#8fb8ff,#a98fff); border-radius:999px; height:100%; }
</style>
</head>
<body class="px-5 md:px-10 py-10">

<div class="max-w-5xl mx-auto">

  <header class="flex items-center justify-between mb-10 glass float1 px-6 py-5">
    <div>
      <p class="text-xs text-gray-500">晚安，予安的家</p>
      <h1 class="text-xl font-bold">宅控空間</h1>
    </div>
    <div class="text-right">
      <p id="clock" class="text-lg font-bold">--:--</p>
      <p class="text-xs text-gray-500">室外 18°C · 微風</p>
    </div>
  </header>

  <div class="grid md:grid-cols-3 gap-5 mb-5">

    <!-- 溫度卡 -->
    <section class="glass float1 p-6 flex flex-col items-center">
      <p class="text-xs text-gray-500 mb-2">客廳溫度</p>
      <div class="relative w-32 h-32 flex items-center justify-center mb-3">
        <svg viewBox="0 0 100 100" class="w-full h-full -rotate-90">
          <circle cx="50" cy="50" r="42" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="8"/>
          <circle id="tempRing" cx="50" cy="50" r="42" fill="none" stroke="#8fb8ff" stroke-width="8" stroke-linecap="round" stroke-dasharray="264" stroke-dashoffset="100"/>
        </svg>
        <span id="tempLabel" class="absolute text-2xl font-bold">24°</span>
      </div>
      <div class="flex gap-4">
        <button onclick="changeTemp(-1)" class="orb-btn w-10 h-10 rounded-full text-lg">－</button>
        <button onclick="changeTemp(1)" class="orb-btn w-10 h-10 rounded-full text-lg">＋</button>
      </div>
    </section>

    <!-- 燈光卡 -->
    <section class="glass float1 p-6">
      <p class="text-xs text-gray-500 mb-4">燈光場景</p>
      <div class="grid grid-cols-2 gap-3 mb-4">
        <button class="scene-btn orb-btn on py-3 rounded-2xl text-sm font-semibold" onclick="setScene(this,'溫暖閱讀')">溫暖閱讀</button>
        <button class="scene-btn orb-btn py-3 rounded-2xl text-sm font-semibold" onclick="setScene(this,'電影時刻')">電影時刻</button>
        <button class="scene-btn orb-btn py-3 rounded-2xl text-sm font-semibold" onclick="setScene(this,'晨光喚醒')">晨光喚醒</button>
        <button class="scene-btn orb-btn py-3 rounded-2xl text-sm font-semibold" onclick="setScene(this,'全部關閉')">全部關閉</button>
      </div>
      <p class="text-xs text-gray-500 mb-2">亮度</p>
      <div class="knob-track" id="brightTrack" onclick="setBright(event)">
        <div class="knob-fill" id="brightFill" style="width:62%;"></div>
      </div>
      <p id="brightLabel" class="text-xs text-gray-500 mt-2 text-right">62%</p>
    </section>

    <!-- 空氣品質卡 -->
    <section class="glass float1 p-6">
      <p class="text-xs text-gray-500 mb-4">空氣品質</p>
      <div class="space-y-3">
        <div class="flex justify-between items-center text-sm"><span>PM2.5</span><span class="font-bold text-emerald-500">良好 8 μg/m³</span></div>
        <div class="flex justify-between items-center text-sm"><span>濕度</span><span class="font-bold">52%</span></div>
        <div class="flex justify-between items-center text-sm"><span>二氧化碳</span><span class="font-bold">612 ppm</span></div>
      </div>
      <button onclick="runPurifier()" id="purifierBtn" class="orb-btn w-full mt-5 py-3 rounded-2xl text-sm font-semibold">啟動空氣清淨</button>
    </section>
  </div>

  <!-- 裝置清單 -->
  <section class="glass float2 p-6">
    <p class="text-xs text-gray-500 mb-4">所有裝置</p>
    <div id="deviceList" class="grid md:grid-cols-4 gap-4 text-sm"></div>
  </section>

</div>

<script>
function updateClock(){
  const now = new Date();
  document.getElementById('clock').textContent = String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
}
updateClock(); setInterval(updateClock, 30000);

let temp = 24;
function paintTemp(){
  document.getElementById('tempLabel').textContent = temp+'°';
  const pct = (temp-16)/(30-16);
  document.getElementById('tempRing').setAttribute('stroke-dashoffset', 264 - pct*264);
}
function changeTemp(d){ temp = Math.min(30, Math.max(16, temp+d)); paintTemp(); }
paintTemp();

function setScene(btn,name){
  document.querySelectorAll('.scene-btn').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
}

function setBright(e){
  const track = document.getElementById('brightTrack');
  const rect = track.getBoundingClientRect();
  const pct = Math.min(100, Math.max(0, ((e.clientX-rect.left)/rect.width)*100));
  document.getElementById('brightFill').style.width = pct+'%';
  document.getElementById('brightLabel').textContent = Math.round(pct)+'%';
}

let purifierOn = false;
function runPurifier(){
  purifierOn = !purifierOn;
  const btn = document.getElementById('purifierBtn');
  btn.textContent = purifierOn ? '清淨機運轉中…' : '啟動空氣清淨';
  btn.classList.toggle('on', purifierOn);
}

const devices = [
  ['客廳主燈', true], ['玄關感應燈', true], ['書房檯燈', false],
  ['冷氣（客廳）', true], ['掃地機器人', false], ['智慧門鎖', true],
  ['電視', false], ['陽台捲簾', true]
];
const wrap = document.getElementById('deviceList');
devices.forEach(([name, on])=>{
  const div = document.createElement('div');
  div.className = 'flex items-center justify-between glass px-4 py-3';
  div.innerHTML = '<span>'+name+'</span>';
  const toggle = document.createElement('button');
  toggle.className = 'orb-btn w-10 h-6 rounded-full relative' + (on?' on':'');
  toggle.innerHTML = '<span class="absolute top-0.5 w-5 h-5 rounded-full bg-white shadow transition-all" style="left:'+(on?'18px':'2px')+';"></span>';
  toggle.onclick = ()=>{
    const isOn = toggle.classList.contains('on');
    toggle.classList.toggle('on');
    toggle.querySelector('span').style.left = isOn ? '2px' : '18px';
  };
  div.appendChild(toggle);
  wrap.appendChild(div);
});
</script>

</body>
</html>

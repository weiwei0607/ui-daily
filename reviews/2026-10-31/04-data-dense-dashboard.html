<!-- style #28 Data-Dense Dashboard -->
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>運箱 CargoBox 營運儀表板</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  *{font-family:'IBM Plex Sans','Noto Sans TC',sans-serif;}
  .mono{font-family:'JetBrains Mono',monospace;}
  body{background:#0e1116; color:#e6e9ee;}
  .card{background:#161a21; border:1px solid #242a33;}
  .up{color:#2ee6a0;} .down{color:#ff5c7a;}
  table th, table td{border-bottom:1px solid #242a33;}
  .scroll-strip::-webkit-scrollbar{height:6px;}
  .scroll-strip::-webkit-scrollbar-thumb{background:#2a313c; border-radius:4px;}
  .pill{font-size:11px; padding:2px 8px; border-radius:999px;}
</style>
</head>
<body class="min-h-screen text-sm">

  <div class="flex">
    <aside class="w-56 shrink-0 border-r border-[#242a33] h-screen sticky top-0 p-5 hidden md:block">
      <div class="font-700 text-lg mb-8">運箱 <span class="text-[#2ee6a0]">CargoBox</span></div>
      <nav class="space-y-1 text-[#9aa4b2]">
        <div class="bg-[#1d2330] text-white px-3 py-2 rounded-lg">總覽</div>
        <div class="px-3 py-2 rounded-lg hover:bg-[#1d2330] cursor-pointer">運輸路線</div>
        <div class="px-3 py-2 rounded-lg hover:bg-[#1d2330] cursor-pointer">倉儲庫存</div>
        <div class="px-3 py-2 rounded-lg hover:bg-[#1d2330] cursor-pointer">司機排班</div>
        <div class="px-3 py-2 rounded-lg hover:bg-[#1d2330] cursor-pointer">異常事件</div>
        <div class="px-3 py-2 rounded-lg hover:bg-[#1d2330] cursor-pointer">報表匯出</div>
      </nav>
    </aside>

    <main class="flex-1 p-6 space-y-6">
      <div class="flex items-center justify-between">
        <h1 class="font-700 text-xl">今日營運總覽</h1>
        <div class="flex items-center gap-3 text-[#9aa4b2] mono text-xs">
          <span id="clock">--:--:--</span>
          <span class="pill bg-[#1d2330] text-[#2ee6a0]">● 系統正常</span>
        </div>
      </div>

      <div class="grid grid-cols-2 md:grid-cols-5 gap-4">
        <div class="card rounded-xl p-4">
          <div class="text-[#9aa4b2] text-xs mb-1">今日出貨件數</div>
          <div class="mono text-2xl font-700" id="kpiShip">18,402</div>
          <div class="up text-xs mt-1">▲ 4.2% 較昨日</div>
        </div>
        <div class="card rounded-xl p-4">
          <div class="text-[#9aa4b2] text-xs mb-1">準時送達率</div>
          <div class="mono text-2xl font-700">96.8%</div>
          <div class="up text-xs mt-1">▲ 0.6%</div>
        </div>
        <div class="card rounded-xl p-4">
          <div class="text-[#9aa4b2] text-xs mb-1">在途車輛</div>
          <div class="mono text-2xl font-700" id="kpiTrucks">342</div>
          <div class="text-[#9aa4b2] text-xs mt-1">即時更新</div>
        </div>
        <div class="card rounded-xl p-4">
          <div class="text-[#9aa4b2] text-xs mb-1">異常件數</div>
          <div class="mono text-2xl font-700 down">27</div>
          <div class="down text-xs mt-1">▼ 2 件,較昨日</div>
        </div>
        <div class="card rounded-xl p-4">
          <div class="text-[#9aa4b2] text-xs mb-1">倉儲使用率</div>
          <div class="mono text-2xl font-700">78%</div>
          <div class="text-[#9aa4b2] text-xs mt-1">尚有餘裕</div>
        </div>
      </div>

      <div class="grid md:grid-cols-3 gap-4">
        <div class="card rounded-xl p-5 md:col-span-2">
          <div class="flex items-center justify-between mb-4">
            <div class="font-600">各轉運中心即時吞吐量</div>
            <div class="text-[#9aa4b2] text-xs mono">單位：件/小時</div>
          </div>
          <div class="flex items-end gap-3 h-36" id="barChart"></div>
          <div class="flex gap-3 mt-2 text-[10px] text-[#9aa4b2] mono" id="barLabels"></div>
        </div>
        <div class="card rounded-xl p-5">
          <div class="font-600 mb-4">路線風險分佈</div>
          <div class="space-y-3">
            <div class="flex justify-between text-xs"><span>北部幹線</span><span class="mono up">低風險</span></div>
            <div class="h-1.5 bg-[#1d2330] rounded-full"><div class="h-1.5 bg-[#2ee6a0] rounded-full" style="width:18%"></div></div>
            <div class="flex justify-between text-xs"><span>中部幹線</span><span class="mono text-[#ffb224]">中風險</span></div>
            <div class="h-1.5 bg-[#1d2330] rounded-full"><div class="h-1.5 bg-[#ffb224] rounded-full" style="width:52%"></div></div>
            <div class="flex justify-between text-xs"><span>南部幹線</span><span class="mono down">高風險</span></div>
            <div class="h-1.5 bg-[#1d2330] rounded-full"><div class="h-1.5 bg-[#ff5c7a] rounded-full" style="width:81%"></div></div>
          </div>
        </div>
      </div>

      <div class="card rounded-xl p-5 overflow-x-auto scroll-strip">
        <div class="flex items-center justify-between mb-4">
          <div class="font-600">最新異常事件</div>
          <input id="filterInput" placeholder="搜尋轉運中心…" class="bg-[#0e1116] border border-[#242a33] rounded-lg px-3 py-1.5 text-xs text-white w-48" />
        </div>
        <table class="w-full text-xs">
          <thead class="text-[#9aa4b2] text-left">
            <tr><th class="py-2 pr-4">時間</th><th class="py-2 pr-4">轉運中心</th><th class="py-2 pr-4">事件</th><th class="py-2 pr-4">狀態</th></tr>
          </thead>
          <tbody id="eventsBody"></tbody>
        </table>
      </div>
    </main>
  </div>

<script>
  const clockEl = document.getElementById('clock');
  function tick(){
    const d = new Date();
    clockEl.textContent = d.toTimeString().slice(0,8);
  }
  tick(); setInterval(tick, 1000);

  setInterval(()=>{
    document.getElementById('kpiShip').textContent = (18000 + Math.floor(Math.random()*900)).toLocaleString();
    document.getElementById('kpiTrucks').textContent = 330 + Math.floor(Math.random()*30);
  }, 2000);

  const centers = ['桃園', '台中', '台南', '新竹', '高雄', '花蓮'];
  const barChart = document.getElementById('barChart');
  const barLabels = document.getElementById('barLabels');
  centers.forEach(c=>{
    const bar = document.createElement('div');
    bar.className = 'flex-1 bg-gradient-to-t from-[#2ee6a0]/20 to-[#2ee6a0] rounded-t-md transition-all duration-700';
    bar.style.height = (20 + Math.random()*80) + '%';
    barChart.appendChild(bar);
    const label = document.createElement('div');
    label.className = 'flex-1 text-center';
    label.textContent = c;
    barLabels.appendChild(label);
  });
  setInterval(()=>{
    barChart.querySelectorAll('div').forEach(b=> b.style.height = (20 + Math.random()*80) + '%');
  }, 2500);

  const events = [
    {t:'14:32', c:'桃園轉運中心', e:'包裹分揀延遲 12 分鐘', s:'處理中', level:'warn'},
    {t:'14:08', c:'台南轉運中心', e:'車輛故障,已派備援車', s:'已排除', level:'ok'},
    {t:'13:51', c:'高雄轉運中心', e:'天候導致路線改道', s:'處理中', level:'warn'},
    {t:'13:20', c:'新竹轉運中心', e:'系統連線短暫中斷', s:'已排除', level:'ok'},
    {t:'12:45', c:'花蓮轉運中心', e:'包裹損壞回報', s:'待審核', level:'danger'},
  ];
  const tbody = document.getElementById('eventsBody');
  function render(list){
    tbody.innerHTML = '';
    if(list.length === 0){
      tbody.innerHTML = '<tr><td colspan="4" class="py-6 text-center text-[#9aa4b2]">找不到符合的轉運中心,請換個關鍵字</td></tr>';
      return;
    }
    list.forEach(ev=>{
      const color = ev.level === 'ok' ? 'up' : ev.level === 'danger' ? 'down' : 'text-[#ffb224]';
      tbody.innerHTML += `<tr><td class="py-2 pr-4 mono text-[#9aa4b2]">${ev.t}</td><td class="py-2 pr-4">${ev.c}</td><td class="py-2 pr-4">${ev.e}</td><td class="py-2 pr-4 ${color}">${ev.s}</td></tr>`;
    });
  }
  render(events);
  document.getElementById('filterInput').addEventListener('input', (e)=>{
    const q = e.target.value.trim();
    render(events.filter(ev=>ev.c.includes(q)));
  });
</script>
</body>
</html>

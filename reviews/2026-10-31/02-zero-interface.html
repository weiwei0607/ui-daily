<!-- style #18 Zero Interface -->
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>留白 Blankspace</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Noto+Serif+TC:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  :root{ --paper:#fafaf7; --ink:#1f1d1a; --faint:#a9a49a; }
  *{font-family:'Noto Serif TC','Newsreader',serif;}
  body{background:var(--paper); color:var(--ink);}
  .serif-en{font-family:'Newsreader','Noto Serif TC',serif;}
  .no-chrome{border:none; background:transparent; outline:none;}
  .cursor-blink::after{
    content:'｜'; animation:blink 1s step-start infinite; color:var(--faint);
  }
  @keyframes blink{50%{opacity:0;}}
  .fade-hint{opacity:0; transition:opacity .6s ease;}
  .group:hover .fade-hint, .group:focus-within .fade-hint{opacity:1;}
  textarea{resize:none;}
  .divider{height:1px; background:linear-gradient(to right, transparent, #0000, transparent);}
  .ghost-btn{opacity:.35; transition:opacity .3s ease;}
  .ghost-btn:hover{opacity:1;}
</style>
</head>
<body class="min-h-screen flex flex-col">

  <header class="flex items-center justify-between px-10 py-6 fade-hint group" tabindex="0">
    <span class="serif-en text-sm text-[var(--faint)] italic">留白 · Blankspace</span>
    <div class="flex items-center gap-6 text-sm text-[var(--faint)]">
      <span id="wordCount">0 字</span>
      <span>自動儲存</span>
    </div>
  </header>

  <main class="flex-1 max-w-2xl w-full mx-auto px-8 py-10 group">
    <input id="titleInput" class="no-chrome w-full serif-en text-4xl md:text-5xl italic mb-8 placeholder:text-[var(--faint)]/60" placeholder="無題" />
    <textarea id="bodyInput" class="no-chrome w-full h-[48vh] text-lg leading-[2] placeholder:text-[var(--faint)]/50" placeholder="開始寫,其他什麼都不用管。

這裡沒有工具列、沒有格式按鈕、沒有通知紅點。只有你,和這張空白的紙。

寫累了,把游標放著就好,它會安靜地在那裡等你。"></textarea>
  </main>

  <div class="fixed bottom-8 inset-x-0 flex justify-center fade-hint group" tabindex="0">
    <div class="flex items-center gap-8 text-[var(--faint)] text-sm">
      <button class="ghost-btn" id="focusModeBtn">專注模式</button>
      <span class="divider w-px h-4 bg-current opacity-20"></span>
      <button class="ghost-btn" id="exportBtn">輸出成純文字</button>
      <span class="divider w-px h-4 bg-current opacity-20"></span>
      <span id="savedHint">已儲存於此刻</span>
    </div>
  </div>

  <div id="focusOverlay" class="hidden fixed inset-0 bg-[var(--paper)] z-50 flex items-center justify-center">
    <div class="max-w-2xl w-full px-8">
      <textarea id="focusBody" class="no-chrome w-full h-[70vh] text-xl leading-[2.1]" placeholder="專注模式。按 Esc 回去。"></textarea>
    </div>
  </div>

<script>
  const bodyInput = document.getElementById('bodyInput');
  const focusBody = document.getElementById('focusBody');
  const wordCount = document.getElementById('wordCount');
  const savedHint = document.getElementById('savedHint');

  function updateCount(text){
    wordCount.textContent = text.length + ' 字';
  }
  bodyInput.addEventListener('input', ()=>{
    updateCount(bodyInput.value);
    savedHint.textContent = '正在儲存…';
    clearTimeout(window._t);
    window._t = setTimeout(()=>{ savedHint.textContent = '已儲存於此刻'; }, 700);
  });

  const focusBtn = document.getElementById('focusModeBtn');
  const overlay = document.getElementById('focusOverlay');
  focusBtn.addEventListener('click', ()=>{
    focusBody.value = bodyInput.value;
    overlay.classList.remove('hidden');
    focusBody.focus();
  });
  focusBody.addEventListener('input', ()=>{
    bodyInput.value = focusBody.value;
    updateCount(bodyInput.value);
  });
  document.addEventListener('keydown', (e)=>{
    if(e.key === 'Escape') overlay.classList.add('hidden');
  });

  document.getElementById('exportBtn').addEventListener('click', ()=>{
    const title = document.getElementById('titleInput').value || '無題';
    const blob = new Blob([title + '\n\n' + bodyInput.value], {type:'text/plain;charset=utf-8'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = title + '.txt';
    a.click();
  });
</script>
</body>
</html>

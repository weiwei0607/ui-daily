<!-- style #25 Interactive Demo -->
<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>串接實驗室｜API Playground</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  body{font-family:'Poppins','Noto Sans TC',sans-serif;background:#f7f8fb;color:#1a1d29;}
  .mono{font-family:'JetBrains Mono',monospace;}
  .card{background:#fff;border:1px solid #e6e8f0;border-radius:16px;box-shadow:0 1px 2px rgba(20,20,43,.04);}
  .tab-btn{transition:all .15s ease;}
  .tab-btn.active{background:#4f46e5;color:#fff;}
  .tab-btn:not(.active){background:#eef0f8;color:#4b5169;}
  .method-get{background:#e0f2ea;color:#0f9d58;}
  .method-post{background:#e8edff;color:#4f46e5;}
  .method-delete{background:#fde8e8;color:#e0483e;}
  .switch{width:42px;height:24px;border-radius:999px;background:#d8dbe8;position:relative;cursor:pointer;transition:.2s;}
  .switch::after{content:'';position:absolute;top:2px;left:2px;width:20px;height:20px;background:#fff;border-radius:999px;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:.2s;}
  .switch.on{background:#4f46e5;}
  .switch.on::after{transform:translateX(18px);}
  .code-box{background:#151726;border-radius:12px;color:#e5e7f0;}
  .status-dot{width:8px;height:8px;border-radius:999px;}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
  .live-dot{animation:blink 1.5s infinite;}
  .fade-in{animation:fadeIn .3s ease;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body class="min-h-screen">

  <header class="border-b border-[#e6e8f0] bg-white/80 backdrop-blur sticky top-0 z-10">
    <div class="max-w-6xl mx-auto px-6 py-4 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <div class="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center text-white font-bold text-sm">串</div>
        <span class="font-bold text-lg">串接實驗室</span>
        <span class="text-xs text-gray-400 mono ml-1">API Playground</span>
      </div>
      <nav class="hidden md:flex gap-8 text-sm text-gray-500">
        <a href="#" class="hover:text-gray-900">文件</a>
        <a href="#" class="hover:text-gray-900">SDK</a>
        <a href="#" class="hover:text-gray-900">定價</a>
      </nav>
      <button class="bg-indigo-600 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-indigo-700 transition">取得 API 金鑰</button>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-6 py-14">

    <section class="text-center mb-14">
      <h1 class="text-3xl md:text-5xl font-extrabold mb-5">不用寫一行程式，<br class="md:hidden">先在這裡玩玩你的 API。</h1>
      <p class="text-gray-500 max-w-xl mx-auto">切換端點、打開開關、按下發送——右邊會立刻回傳真實格式的 JSON，讓你在串接前就摸透行為。</p>
    </section>

    <section class="grid lg:grid-cols-5 gap-6">

      <div class="card p-6 lg:col-span-2">
        <p class="text-xs font-semibold text-gray-400 mb-3 tracking-wide">選擇端點</p>
        <div class="flex flex-col gap-2 mb-6" id="endpointTabs">
          <button data-ep="0" class="tab-btn active text-left px-4 py-3 rounded-lg text-sm flex items-center gap-3">
            <span class="method-get text-xs font-bold px-2 py-0.5 rounded mono">GET</span>
            <span class="mono">/v1/users/:id</span>
          </button>
          <button data-ep="1" class="tab-btn text-left px-4 py-3 rounded-lg text-sm flex items-center gap-3">
            <span class="method-post text-xs font-bold px-2 py-0.5 rounded mono">POST</span>
            <span class="mono">/v1/orders</span>
          </button>
          <button data-ep="2" class="tab-btn text-left px-4 py-3 rounded-lg text-sm flex items-center gap-3">
            <span class="method-delete text-xs font-bold px-2 py-0.5 rounded mono">DELETE</span>
            <span class="mono">/v1/sessions/:id</span>
          </button>
        </div>

        <p class="text-xs font-semibold text-gray-400 mb-3 tracking-wide">請求參數</p>
        <div class="flex items-center justify-between mb-3 px-1">
          <span class="text-sm text-gray-600">包含測試模式標記</span>
          <div id="sw1" class="switch on"></div>
        </div>
        <div class="flex items-center justify-between mb-3 px-1">
          <span class="text-sm text-gray-600">展開巢狀資料</span>
          <div id="sw2" class="switch"></div>
        </div>
        <div class="flex items-center justify-between mb-6 px-1">
          <span class="text-sm text-gray-600">模擬 500ms 延遲</span>
          <div id="sw3" class="switch"></div>
        </div>

        <button id="sendBtn" class="w-full bg-indigo-600 text-white py-3 rounded-lg font-semibold hover:bg-indigo-700 transition">
          發送請求 →
        </button>
      </div>

      <div class="card p-6 lg:col-span-3">
        <div class="flex items-center justify-between mb-4">
          <p class="text-xs font-semibold text-gray-400 tracking-wide">回應結果</p>
          <div class="flex items-center gap-2" id="statusIndicator">
            <span class="status-dot bg-gray-300"></span>
            <span class="text-xs text-gray-400 mono">尚未發送</span>
          </div>
        </div>
        <div class="code-box p-5 mono text-sm leading-relaxed overflow-x-auto" style="min-height:280px;">
          <pre id="responseBox" class="whitespace-pre-wrap"># 按左側「發送請求」查看即時回應</pre>
        </div>
        <div class="flex items-center justify-between mt-4 text-xs text-gray-400">
          <span id="latencyLabel" class="mono">延遲：—</span>
          <button id="copyBtn" class="text-indigo-600 hover:text-indigo-800 font-medium">複製回應 JSON</button>
        </div>
      </div>

    </section>

    <section class="mt-16 text-center">
      <h2 class="text-2xl font-bold mb-3">玩得順手了嗎？</h2>
      <p class="text-gray-500 mb-6">同樣的請求，一鍵產生 cURL / Node.js / Python 程式碼片段。</p>
      <button class="bg-gray-900 text-white px-8 py-3 rounded-lg font-semibold hover:bg-black transition">產生程式碼片段</button>
    </section>

  </main>

  <footer class="border-t border-[#e6e8f0] py-8 text-center text-gray-400 text-sm">
    © 2026 串接實驗室・給工程師的 API 遊樂場
  </footer>

<script>
  const endpoints = [
    { path:'/v1/users/:id', method:'GET',
      body:{ id:"usr_8823", name:"陳曉雯", plan:"pro", created_at:"2026-01-14T09:12:00Z" } },
    { path:'/v1/orders', method:'POST',
      body:{ order_id:"ord_5541", amount:1280, currency:"TWD", status:"processing" } },
    { path:'/v1/sessions/:id', method:'DELETE',
      body:{ session_id:"sess_9931", revoked:true } },
  ];
  let current = 0;
  const tabs = document.querySelectorAll('#endpointTabs .tab-btn');
  tabs.forEach(tab=>{
    tab.addEventListener('click', ()=>{
      tabs.forEach(t=>t.classList.remove('active'));
      tab.classList.add('active');
      current = parseInt(tab.dataset.ep);
    });
  });

  function makeSwitch(id){
    const el = document.getElementById(id);
    el.addEventListener('click', ()=> el.classList.toggle('on'));
    return el;
  }
  const sw1 = makeSwitch('sw1');
  const sw2 = makeSwitch('sw2');
  const sw3 = makeSwitch('sw3');

  const sendBtn = document.getElementById('sendBtn');
  const responseBox = document.getElementById('responseBox');
  const statusIndicator = document.getElementById('statusIndicator');
  const latencyLabel = document.getElementById('latencyLabel');

  sendBtn.addEventListener('click', ()=>{
    statusIndicator.innerHTML = `<span class="status-dot bg-amber-400 live-dot"></span><span class="text-xs text-amber-500 mono">傳送中…</span>`;
    responseBox.textContent = '# 等待伺服器回應…';
    const delay = sw3.classList.contains('on') ? 500 : 120;

    setTimeout(()=>{
      const ep = endpoints[current];
      let payload = { ...ep.body };
      if(sw1.classList.contains('on')) payload.test_mode = true;
      if(sw2.classList.contains('on')) payload.meta = { region:"ap-east-1", trace_id:"trc_"+Math.random().toString(36).slice(2,10) };

      const json = JSON.stringify({ status:200, method:ep.method, path:ep.path, data:payload }, null, 2);
      responseBox.textContent = json;
      responseBox.classList.add('fade-in');
      statusIndicator.innerHTML = `<span class="status-dot bg-emerald-500"></span><span class="text-xs text-emerald-600 mono">200 OK</span>`;
      latencyLabel.textContent = `延遲：${delay} ms`;
    }, delay);
  });

  document.getElementById('copyBtn').addEventListener('click', ()=>{
    navigator.clipboard?.writeText(responseBox.textContent);
    const btn = document.getElementById('copyBtn');
    const old = btn.textContent;
    btn.textContent = '已複製 ✓';
    setTimeout(()=> btn.textContent = old, 1500);
  });
</script>
</body>
</html>

<!-- style #55 Spatial UI -->
<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>境 · 空間感智慧家庭控制中心</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Quicksand:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  body{
    min-height:100vh;
    background:
      radial-gradient(circle at 15% 10%, rgba(255,190,150,.35), transparent 45%),
      radial-gradient(circle at 85% 20%, rgba(150,190,255,.35), transparent 45%),
      radial-gradient(circle at 50% 90%, rgba(190,255,210,.3), transparent 50%),
      linear-gradient(180deg,#f2ede6,#e9e2f2);
    color:#2b2a33;
    font-family:'Quicksand','Noto Sans TC',sans-serif;
    perspective: 1400px;
  }
  .font-display{ font-family:'Nunito','Noto Sans TC',sans-serif; }
  .glass{
    background: rgba(255,255,255,.42);
    border: 1px solid rgba(255,255,255,.65);
    backdrop-filter: blur(22px) saturate(160%);
    box-shadow: 0 20px 50px -15px rgba(60,50,90,.25), inset 0 1px 0 rgba(255,255,255,.8);
  }
  .glass-deep{
    background: rgba(255,255,255,.28);
    border: 1px solid rgba(255,255,255,.55);
    backdrop-filter: blur(18px) saturate(150%);
    box-shadow: 0 14px 34px -12px rgba(60,50,90,.22), inset 0 1px 0 rgba(255,255,255,.7);
  }
  .float-1{ transform: translateZ(30px) rotateX(1deg); }
  .float-2{ transform: translateZ(10px); }
  .orb{
    background: radial-gradient(circle at 35% 30%, rgba(255,255,255,.95), rgba(180,190,255,.5) 60%, transparent 75%);
  }
  .pill-toggle{
    background: rgba(255,255,255,.5);
    border:1px solid rgba(255,255,255,.7);
  }
  .pill-toggle.on{
    background: linear-gradient(135deg, #a78bfa, #93c5fd);
    color:#fff;
  }
</style>
</head>
<body class="min-h-screen">

<div class="max-w-6xl mx-auto px-6 py-10">

  <header class="flex items-center justify-between mb-10 float-1">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-full orb"></div>
      <span class="font-display text-xl font-bold">境</span>
    </div>
    <nav class="hidden md:flex items-center gap-8 text-sm font-semibold text-[#5b5768]">
      <a href="#" class="hover:text-[#2b2a33] transition">空間總覽</a>
      <a href="#" class="hover:text-[#2b2a33] transition">情境模式</a>
      <a href="#" class="hover:text-[#2b2a33] transition">裝置</a>
    </nav>
    <div class="glass rounded-full px-4 py-2 text-sm font-semibold">早安，韡寧</div>
  </header>

  <section class="grid md:grid-cols-3 gap-6 mb-8">
    <div class="md:col-span-2 glass rounded-3xl p-8 float-1">
      <p class="text-sm text-[#6b6778] mb-2 font-semibold">目前情境</p>
      <h1 class="font-display text-3xl md:text-4xl font-bold mb-4">悠閒周末・午後模式</h1>
      <p class="text-[#5b5768] mb-6 leading-relaxed">客廳燈光已調至暖色 40%，窗簾半開，音響播放輕爸士。所有裝置依你的空間動態排列，滑動即可切換房間視角。</p>
      <div class="flex gap-3 flex-wrap">
        <button class="glass-deep rounded-full px-6 py-3 text-sm font-bold">切換為專注模式</button>
        <button class="glass-deep rounded-full px-6 py-3 text-sm font-bold">切換為就寢模式</button>
      </div>
    </div>
    <div class="glass rounded-3xl p-8 flex flex-col items-center justify-center float-2">
      <div class="w-28 h-28 rounded-full orb mb-4 flex items-center justify-center">
        <span class="font-display text-2xl font-bold">23°</span>
      </div>
      <p class="text-sm text-[#6b6778] font-semibold">客廳室溫</p>
      <p class="text-xs text-[#8b8798] mt-1">濕度 55% · 空氣品質良好</p>
    </div>
  </section>

  <section class="grid md:grid-cols-4 gap-5 mb-8">
    <div class="glass-deep rounded-2xl p-5 float-2">
      <p class="text-sm font-semibold mb-3">客廳主燈</p>
      <div class="pill-toggle on rounded-full h-8 w-14 flex items-center px-1"><div class="w-6 h-6 rounded-full bg-white ml-auto shadow"></div></div>
    </div>
    <div class="glass-deep rounded-2xl p-5 float-2">
      <p class="text-sm font-semibold mb-3">窗簾</p>
      <div class="pill-toggle rounded-full h-8 w-14 flex items-center px-1"><div class="w-6 h-6 rounded-full bg-white shadow"></div></div>
    </div>
    <div class="glass-deep rounded-2xl p-5 float-2">
      <p class="text-sm font-semibold mb-3">音響</p>
      <div class="pill-toggle on rounded-full h-8 w-14 flex items-center px-1"><div class="w-6 h-6 rounded-full bg-white ml-auto shadow"></div></div>
    </div>
    <div class="glass-deep rounded-2xl p-5 float-2">
      <p class="text-sm font-semibold mb-3">空氣清淨機</p>
      <div class="pill-toggle on rounded-full h-8 w-14 flex items-center px-1"><div class="w-6 h-6 rounded-full bg-white ml-auto shadow"></div></div>
    </div>
  </section>

  <section class="glass rounded-3xl p-8 float-1">
    <h2 class="font-display text-xl font-bold mb-6">空間視角</h2>
    <div class="grid md:grid-cols-3 gap-5">
      <div class="glass-deep rounded-2xl p-5 text-center">
        <div class="w-14 h-14 mx-auto rounded-2xl orb mb-3"></div>
        <p class="font-semibold text-sm">客廳</p>
        <p class="text-xs text-[#8b8798] mt-1">3 個裝置運作中</p>
      </div>
      <div class="glass-deep rounded-2xl p-5 text-center">
        <div class="w-14 h-14 mx-auto rounded-2xl orb mb-3"></div>
        <p class="font-semibold text-sm">臥室</p>
        <p class="text-xs text-[#8b8798] mt-1">待機中</p>
      </div>
      <div class="glass-deep rounded-2xl p-5 text-center">
        <div class="w-14 h-14 mx-auto rounded-2xl orb mb-3"></div>
        <p class="font-semibold text-sm">書房</p>
        <p class="text-xs text-[#8b8798] mt-1">1 個裝置運作中</p>
      </div>
    </div>
  </section>

  <footer class="mt-10 text-center text-xs text-[#8b8798]">境 © 2026 — 空間會跟著你的心情浮動</footer>
</div>

</body>
</html>
